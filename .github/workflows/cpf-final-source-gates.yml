name: CPF Final Required Gates

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: cpf-final-${{ github.ref }}
  cancel-in-progress: false

jobs:
  architecture-evidence:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply repository ownership relocation
        shell: pwsh
        run: >-
          ./cpf-tools/scripts/apply-20260729-final-overlay.ps1
          -ProjectRoot .
          -ExpectedBaseSha '${{ github.sha }}'
          -AllowDifferentBaseSha
          -SkipStaticVerification
      - name: Semantic and ownership gates
        shell: pwsh
        run: |
          python ./cpf-tools/verification/20260729_04/check_final_source_closure.py .
          python ./cpf-tools/verification/20260729_04/check_generator_idempotency_templates.py .
          python ./cpf-tools/verification/20260729_04/check_generator_java_template_compile.py .
          python ./cpf-tools/verification/20260729_04/check_java_syntax.py .
          node ./cpf-tools/verification/20260729_04/check_frontend_syntax.cjs .
          ./cpf-tools/scripts/check-enterprise-source-closure.ps1
          ./cpf-tools/scripts/check-direct-client-boundary.ps1
          ./cpf-tools/scripts/check-semantic-consumer-graph.ps1
          ./cpf-tools/scripts/check-evidence-contract.ps1
          ./cpf-tools/scripts/check-work-context-sha.ps1 -ExpectedSha '${{ github.sha }}' -AllowOverlayBaseSha

  java-build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Java 25 / Gradle build and test
        shell: pwsh
        run: ./gradlew.bat clean test assemble qualityGate --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-test-reports-${{ github.sha }}
          path: '**/build/reports/tests/**'
          if-no-files-found: warn

  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: ADM/BZA frontend build
        shell: pwsh
        run: ./gradlew.bat :cpf-admin:frontendBuild :cpf-biz-admin:frontendBuild --no-daemon --stacktrace

  database-static:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        vendor:
          - mariadb
          - postgresql
          - oracle
    steps:
      - uses: actions/checkout@v4
      - name: Vendor parity and migration checks
        shell: pwsh
        run: |
          ./cpf-tools/scripts/check-db-vendor-pack-parity.ps1
          ./cpf-tools/scripts/check-migration-checksums.ps1
          ./cpf-tools/scripts/check-sql-standard.ps1
          ./cpf-tools/scripts/check-sql-canonical.ps1

  final-required:
    if: always()
    needs:
      - architecture-evidence
      - java-build-test
      - frontend
      - database-static
    runs-on: windows-latest
    steps:
      - name: Reject missing or failed required jobs
        shell: pwsh
        run: |
          $results = '${{ toJson(needs) }}' | ConvertFrom-Json
          $bad = $results.psobject.Properties | Where-Object { $_.Value.result -ne 'success' }
          if ($bad) {
            $bad | ForEach-Object { Write-Error "$($_.Name)=$($_.Value.result)" }
            exit 1
          }
          Write-Host 'CPF exact-SHA required gates passed.'
