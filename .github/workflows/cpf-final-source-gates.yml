name: CPF Final Required Gates

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: cpf-final-${{ github.ref }}
  cancel-in-progress: false

jobs:
  architecture-evidence:
    runs-on: windows-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Reject dirty checkout
        shell: pwsh
        run: |
          $dirty = @(git status --porcelain=v1 --untracked-files=all)
          if ($dirty) { $dirty; throw 'Checkout is dirty before validation.' }
      - name: Semantic, ownership and traceability gates
        shell: pwsh
        run: |
          python ./cpf-tools/verification/nxt3/run_nxt3_final_all.py --root . --evidence (Join-Path $env:RUNNER_TEMP 'cpf-current-static.json') --log (Join-Path $env:RUNNER_TEMP 'cpf-current-static.log')
          python ./cpf-tools/generator/verification/verify-cpf-generator-lifecycle.py --root .
          python ./cpf-tools/verification/verify_business_framework_crosscut.py --root . --evidence (Join-Path $env:RUNNER_TEMP 'cpf-business-framework-crosscut.json')
          python ./cpf-tools/governance/tools/generate-cpf-project-inventory.py --root . --output-dir (Join-Path $env:RUNNER_TEMP 'cpf-project-inventory')
          python ./cpf-tools/governance/tools/verify-cpf-project-inventory.py --inventory-dir (Join-Path $env:RUNNER_TEMP 'cpf-project-inventory') --policy ./cpf-tools/governance/cpf-product-surface-policy.json --waivers ./cpf-tools/governance/cpf-project-inventory-waivers.csv
          python ./cpf-tools/governance/tools/verify-cpf-requirement-traceability.py --root . --expected-sha '${{ github.sha }}' --require-clean
          python ./cpf-tools/release/tools/verify-cpf-overlay-hygiene.py --root .
          python ./cpf-tools/verification/tools/verify-cpf-protected-doc-boundary.py --root .
          python ./cpf-tools/verification/tools/verify-cpf-legacy-continuity.py --root .
          python ./cpf-tools/verification/tools/verify-cpf-javadoc-coverage.py --root .
          python ./cpf-tools/verification/tools/verify-cpf-adm-capability-registry.py --root .
          python ./cpf-tools/verification/tools/verify-cpf-adm-commercial-page-contract.py --root .
          python ./cpf-tools/security/tools/verify-cpf-controller-permission-contract.py --root . --strict --report (Join-Path $env:RUNNER_TEMP 'controller-permission-contract.csv')
          python ./cpf-tools/verification/tools/verify-cpf-network-policy-consumers.py --root .
          python ./cpf-tools/verification/tools/verify-cpf-operator-trust-boundary.py --root .
          python ./cpf-tools/verification/tools/verify-cpf-edu-executable-coverage.py --root .
          python ./cpf-tools/verification/tools/verify-cpf-edu-profile-isolation.py --root .
          python ./cpf-tools/verification/tools/verify-cpf-edu-impact.py --root .
          python ./cpf-tools/verification/openapi/verify-cpf-openapi-controller-coverage.py --root . --module cpf-admin --openapi cpf-admin/frontend/openapi/cpf-openapi.json
          python ./cpf-tools/verification/openapi/verify-cpf-openapi-controller-coverage.py --root . --module cpf-biz-admin --openapi cpf-biz-admin/openapi/cpf-openapi.json
          python ./cpf-tools/verification/tools/verify-cpf-final-plan.py --root .
          python ./cpf-tools/verification/tools/verify-cpf-final-wrapper-contract.py --root .
          python ./cpf-tools/verification/tools/verify-cpf-approved-baseline-metadata.py --root .
          python ./cpf-tools/db/verification/verify-cpf-db-lifecycle-contract.py --root .
          python ./cpf-tools/supply-chain/tools/verify-cpf-supply-chain.py --root .
          python -m unittest discover -s ./cpf-tools/testing/tools/tests -p 'test_*.py'
          python -m unittest discover -s ./cpf-tools/db/verification/tests -p 'test_*.py'
          python -m unittest discover -s ./cpf-tools/db/tests -p 'test_*.py'
          # Full QA test inventory: includes runtime/security/release/generator/docker/openapi/supply-chain trees.
          # importlib mode prevents duplicate test module basename collisions across independent test trees.
          python -m pytest ./cpf-tools -q --import-mode=importlib -p no:cacheprovider
          python ./cpf-tools/verification/nxt3/cpf_nxt3_generator_gate.py --root .
          python ./cpf-tools/verification/nxt3/cpf_nxt3_query_boundary_gate.py --root .
          python ./cpf-tools/verification/nxt3/verify_nxt3_config_contract.py --root .
          python ./cpf-tools/verification/nxt3/verify_nxt3_repository_garbage.py --root .
          python ./cpf-tools/verification/nxt3/verify_nxt3_hygiene.py --root .
          python ./cpf-tools/verification/verify_current_document_consolidation.py --root .
          ./cpf-tools/verification/tools/check-enterprise-source-closure.ps1
          ./cpf-tools/verification/tools/check-direct-client-boundary.ps1
          ./cpf-tools/verification/tools/check-semantic-consumer-graph.ps1
          ./cpf-tools/verification/tools/check-evidence-contract.ps1
          ./cpf-tools/verification/tools/check-work-context-sha.ps1 -ExpectedSha '${{ github.sha }}'
      - name: Reject self-dirty validation
        shell: pwsh
        run: |
          $dirty = @(git status --porcelain=v1 --untracked-files=all)
          if ($dirty) { $dirty; throw 'Validation changed Source or tracked evidence.' }

  java-build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Java 25 fresh build and test
        shell: pwsh
        run: ./gradlew.bat clean test assemble qualityGate --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-test-reports-${{ github.sha }}
          path: '**/build/reports/tests/**'
          if-no-files-found: warn

  frontend:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        frontend: [cpf-admin/frontend, cpf-biz-frontend]
    defaults:
      run:
        working-directory: ${{ matrix.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: ${{ matrix.frontend }}/package-lock.json
      - name: Clean install
        shell: pwsh
        run: npm ci --ignore-scripts
      - name: OpenAPI, generated client, lint, typecheck, unit and production build
        shell: pwsh
        run: npm run verify
      - name: Reject generated drift and self-dirty build
        shell: pwsh
        working-directory: .
        run: |
          $dirty = @(git status --porcelain=v1 --untracked-files=all)
          if ($dirty) { $dirty; throw 'Frontend validation generated untracked or changed files.' }

  database-static:
    runs-on: windows-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Approved baseline, vendor parity and migration checks once
        shell: pwsh
        run: |
          python ./cpf-tools/verification/tools/verify-cpf-approved-baseline-metadata.py --root .
          python ./cpf-tools/db/verification/verify-cpf-db-lifecycle-contract.py --root .
          ./cpf-tools/db/verification/check-db-vendor-pack-parity.ps1
          ./cpf-tools/db/verification/check-canonical-db-lifecycle-contract.ps1
          ./cpf-tools/db/verification/check-migration-checksums.ps1
          ./cpf-tools/db/verification/check-sql-standard.ps1
          ./cpf-tools/db/verification/check-sql-canonical.ps1
          $dirty = @(git status --porcelain=v1 --untracked-files=all)
          if ($dirty) { $dirty; throw 'DB validation changed Source or checksum files.' }

  supply-chain:
    runs-on: windows-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate and validate current-artifact supply-chain evidence
        shell: pwsh
        run: |
          ./gradlew.bat cyclonedxBom validateReleaseMetadata --no-daemon --stacktrace
          python ./cpf-tools/supply-chain/tools/verify-cpf-supply-chain.py --root .
          $removed = @('cpf-starter-aop-service-access','cpf-starter-validation','cpf-starter-resilience','cpf-starter-featureflag','cpf-starter-security','cpf-starter-cache','cpf-starter-scheduler-quartz')
          $sbom = Get-ChildItem -Recurse -File -Filter 'bom.json' | Select-Object -First 1
          if (-not $sbom) { throw 'CycloneDX bom.json was not generated.' }
          $content = Get-Content -LiteralPath $sbom.FullName -Raw
          $leaked = $removed | Where-Object { $content.Contains($_) }
          if ($leaked) { throw ('Removed CPF artifacts leaked into SBOM: ' + ($leaked -join ', ')) }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpf-sbom-${{ github.sha }}
          path: '**/build/reports/bom.*'
          if-no-files-found: error
      - name: Reject self-dirty supply-chain verification
        shell: pwsh
        run: |
          $dirty = @(git status --porcelain=v1 --untracked-files=all)
          $unexpected = $dirty | Where-Object { $_ -notmatch '^[?MADRCU ]{2} .*[\/]build[\/]' }
          if ($unexpected) { $unexpected; throw 'Supply-chain verification changed tracked Source.' }

  final-required:
    if: always()
    needs: [architecture-evidence, java-build-test, frontend, database-static, supply-chain]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reject missing or failed required jobs
        shell: pwsh
        run: |
          $results = '${{ toJson(needs) }}' | ConvertFrom-Json
          $bad = $results.psobject.Properties | Where-Object { $_.Value.result -ne 'success' }
          if ($bad) {
            $bad | ForEach-Object { Write-Error "$($_.Name)=$($_.Value.result)" }
            exit 1
          }
          Write-Host 'CPF exact-SHA required gates passed.'

      - name: Product governance
        run: python cpf-tools/governance/tools/verify-cpf-product-governance.py --root .
