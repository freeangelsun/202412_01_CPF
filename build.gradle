    commandLine cpfPowerShellExecutable(), '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File',
            'cpf-tools/scripts/check-official-db-vendor-readiness.ps1'
}

tasks.register('checkRuntimeQueryContracts', Exec) {
    group = 'verification'
    description = 'Runtime Query Source-SQL 양방향 ownership과 3 Vendor parameter/result parity를 검증합니다.'
    commandLine cpfPowerShellExecutable(), '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File',
            'cpf-tools/scripts/check-platform-runtime-query-packs.ps1'
}

tasks.register('qualityGate') {
    group = 'verification'
    description = 'CPF verification or deployment task.'
    dependsOn subprojects.collect { "${it.path}:compileJava" }
    dependsOn subprojects.collect { "${it.path}:test" }
    dependsOn ':cpf-admin:frontendVerify', ':cpf-biz-admin:frontendVerify', 'checkModernFrontend'
    dependsOn 'verifyCpfFinalSourceGates', 'verifyVersionConsistency', 'checkUtf8', 'checkMojibake', 'checkLegacyName', 'checkSqlStandard', 'checkSqlCanonical', 'checkJavaFormat', 'checkJava25Standard', 'checkDocumentLinks', 'checkTransactionIdStandard', 'checkSecuritySeedStandard', 'checkSampleStandard', 'checkCpfRequestProtection', 'checkFeatureEvidence', 'checkServiceCallBoundary', 'checkArchitectureOwnership', 'checkBaseHierarchy', 'checkFullLayerTaxonomy', 'exportArchitectureInventory', 'exportRequirementTraceability', 'checkDomainGenerator', 'checkDomainCapabilityMatrix', 'checkAccLifecycle', 'checkDomainRemoval', 'checkRepositoryHygiene', 'checkSpringEventUsage', 'checkProfileLoading', 'checkRuntimeConfigStandard', 'checkLogManagementStandard', 'checkOpenApiSourceCoverage', 'checkSampleCoverage', 'checkEvidencePathExistence', 'checkDeployEnv', 'checkDeployInventory', 'checkPackagedDependencies', 'remoteDeployDryRun', 'checkReportMatrixEvidenceConsistency', 'admUiSmoke', 'admLogPolicyUiStaticSmoke', 'bzaUiSmoke', 'checkContractCompatibility', 'checkR13ProductHardening', 'checkAdminContactModel', 'checkBzaSafeDefaults', 'checkCpfStackSupport', 'checkAdminDataSafety', 'checkOfficialDbVendorReadiness', 'checkRuntimeQueryContracts'
}


tasks.register('aggregateQualityBuild') {
    group = 'verification'
    description = 'Artifact publish 전에 compile/test/frontend/generator/architecture gate와 모든 module assemble을 닫는 집계 Gate입니다.'
    dependsOn 'qualityGate'
    dependsOn subprojects.collect { "${it.path}:assemble" }
    dependsOn gradle.includedBuild('cpf-platform-bom').task(':check'),
            gradle.includedBuild('cpf-gradle-plugin').task(':check')
}

// 최종 배포 문서가 안정된 뒤에만 실행하는 Publication Gate입니다.
// 일반 개발 qualityGate가 조기 DOCX/PDF 산출물에 종속되지 않도록 책임을 분리합니다.
tasks.register('publicationGate') {
    group = 'verification'
    description = 'Validates final publication artifacts after product/source/evidence stabilization.'
    dependsOn 'qualityGate', 'checkDocxStandard', 'validateReleaseMetadata'
}


tasks.register('verifyBatStandaloneArchitecture') {
    group = 'verification'
    description = 'BAT standalone artifact, legacy source removal, EXS/generator boundary를 검증합니다.'
    doLast {
        if (file('cpf-batch/src').exists() && !fileTree('cpf-batch/src').files.isEmpty()) {
            throw new GradleException('Legacy executable cpf-batch/src must be removed.')
        }
        if (file('cpf-external').exists()) throw new GradleException('EXS is generator-only and must not be restored as a fixed module.')
        if (file('cpf-tools/db/source').exists()) throw new GradleException('Standalone cpf-tools/db/source is forbidden.')
        [
          'cpf-batch/contract','cpf-batch/runtime-common','cpf-batch/control-server','cpf-batch/scheduler',
          'cpf-batch/worker','cpf-batch/center-cut-runner','cpf-batch/host-agent','cpf-batch/testkit'
        ].each { path -> if (!file(path).isDirectory()) throw new GradleException("Missing BAT standalone unit: ${path}") }
    }
}

tasks.register('verifyCpfFinalSourceGates') {
    group = 'verification'
    dependsOn 'verifyVersionConsistency', 'verifyBatStandaloneArchitecture',
            'checkLegacyBatchMigration', ':cpf-batch:verifyStandaloneArtifacts'
}


tasks.register('prepareCpfArtifactStaging') {
    group = 'publishing'
    description = 'Removes only CPF root-module artifact groups from the isolated publication staging repository.'
    doLast {
        [
                'com/cpf/core',
                'com/cpf/common',
                'com/cpf/batch',
                '_cpf'
        ].each { relative -> delete file("${rootProject.ext.cpfArtifactStagingRepository}/${relative}") }
    }
}

subprojects { candidate ->
    candidate.plugins.withId('maven-publish') {
        candidate.tasks.matching { task -> task.name.endsWith('ToCpfStagingRepository') }.configureEach {
            dependsOn rootProject.tasks.named('prepareCpfArtifactStaging')
        }
    }
}

tasks.register('publishCpfLocalPlatformArtifacts') {
    group = 'publishing'
    description = 'Low-level local Maven publish. 일반 사용자는 publishCpfVerifiedLocalPlatformArtifacts를 사용합니다.'
    dependsOn ':cpf-core:publishAllPublicationsToCpfLocalRepository',
            ':cpf-common:publishAllPublicationsToCpfLocalRepository',
            ':cpf-batch:publishStandaloneArtifactsToCpfLocal',
            gradle.includedBuild('cpf-platform-bom').task(':publishCpfBomToLocal'),
            gradle.includedBuild('cpf-gradle-plugin').task(':publishCpfPluginToLocal')
    doLast {
        logger.lifecycle("CPF local artifact synchronization complete: ${rootProject.ext.cpfLocalArtifactRepository}")
    }
}

tasks.register('publishCpfStagingPlatformArtifacts') {
    group = 'publishing'
    description = 'Publishes the complete CPF public artifact set only to the isolated build staging repository.'
    dependsOn ':cpf-core:publishAllPublicationsToCpfStagingRepository',
            ':cpf-common:publishAllPublicationsToCpfStagingRepository',
            ':cpf-batch:publishStandaloneArtifactsToCpfStaging',
            gradle.includedBuild('cpf-platform-bom').task(':publishCpfBomToStaging'),
            gradle.includedBuild('cpf-gradle-plugin').task(':publishCpfPluginToStaging')
}

tasks.register('promoteCpfVerifiedLocalArtifacts', Exec) {
    group = 'publishing'
    description = 'Verifies the staged CPF Maven set and transactionally promotes it behind the manifest barrier.'
    dependsOn 'aggregateQualityBuild', 'publishCpfStagingPlatformArtifacts'
    doFirst {
        if (rootProject.ext.cpfArtifactMode != 'LOCAL_DEV') {
            throw new GradleException('Local artifact promotion is allowed only in CPF_ARTIFACT_MODE=LOCAL_DEV.')
        }
        commandLine cpfPowerShellExecutable(), '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File',
                'cpf-tools/scripts/promote-cpf-verified-local-artifacts.ps1',
                '-StagingRepository', rootProject.ext.cpfArtifactStagingRepository,
                '-LocalRepository', rootProject.ext.cpfLocalArtifactRepository
    }
}

tasks.register('publishCpfVerifiedLocalPlatformArtifacts') {
    group = 'publishing'
    description = 'Quality gate + isolated staging + POM/hash/BOM/plugin verification + manifest-barrier local promotion.'
    dependsOn 'promoteCpfVerifiedLocalArtifacts'
}

tasks.register('verifyCpfLocalArtifactPropagation', Exec) {
    group = 'verification'
    description = 'Publishes and verifies the shared local CPF Maven repository used by independent/generated Domains.'
    dependsOn tasks.named('publishCpfVerifiedLocalPlatformArtifacts')
    commandLine cpfPowerShellExecutable(), '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File',
            'cpf-tools/scripts/verify-local-artifact-propagation.ps1',
            '-LocalRepository', rootProject.ext.cpfLocalArtifactRepository,
            '-RequireManifest'
}

tasks.register('buildCpfOfflineArtifactBundle', Exec) {
    group = 'distribution'
    description = 'Builds a versioned offline CPF Maven bundle with manifest/checksums for registry-less server environments.'
    dependsOn tasks.named('publishCpfVerifiedLocalPlatformArtifacts')
    doFirst {
        commandLine cpfPowerShellExecutable(), '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File',
                'cpf-tools/scripts/build-cpf-offline-artifact-bundle.ps1',
                '-LocalRepository', rootProject.ext.cpfLocalArtifactRepository
    }
}

tasks.register('publishCpfPlatformArtifacts') {
    group = 'publishing'
    description = 'Publishes CPF public platform artifacts only to the configured remote internal repository.'
    doFirst {
        if (rootProject.ext.cpfArtifactMode != 'REMOTE') {
            throw new GradleException('publishCpfPlatformArtifacts requires CPF_ARTIFACT_MODE=REMOTE.')
        }
    }
    dependsOn ':cpf-core:publishAllPublicationsToCpfInternalRepository',
            ':cpf-common:publishAllPublicationsToCpfInternalRepository',
            ':cpf-batch:publishStandaloneArtifactsToCpfInternal',
            gradle.includedBuild('cpf-platform-bom').task(':publishCpfBomToInternal'),
            gradle.includedBuild('cpf-gradle-plugin').task(':publishCpfPluginToInternal')
}

// LOCAL_DEV에서 명시적으로 -PcpfAutoLocalArtifactSync=true를 사용한 경우에만 build 성공 후
// 검증된 CPF public JAR/BOM/Convention Plugin을 shared local repository에 전파합니다.
// 기본값은 false이며 CI/REMOTE/OFFLINE에서는 자동 동기화가 절대 실행되지 않습니다.
def cpfAutoLocalArtifactSync = providers.gradleProperty('cpfAutoLocalArtifactSync')
        .map { it.toBoolean() }
        .orElse(false)
def rootBuildTask = tasks.named('build')
tasks.register('syncCpfLocalArtifactsAfterSuccessfulBuild', Exec) {
    group = 'publishing'
    description = 'Opt-in LOCAL_DEV convenience wrapper. Starts verified publication only after root build success.'
    onlyIf {
        def state = rootBuildTask.get().state
        cpfAutoLocalArtifactSync.get() && rootProject.ext.cpfArtifactMode == 'LOCAL_DEV' && state.executed && state.failure == null && !state.skipped
    }
    doFirst {
        def windows = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
        def wrapper = file(windows ? 'gradlew.bat' : 'gradlew').absolutePath
        commandLine wrapper, 'publishCpfVerifiedLocalPlatformArtifacts', '--no-daemon', '--max-workers=1',
                '-PcpfAutoLocalArtifactSync=false', '-PcpfArtifactMode=LOCAL_DEV',
                "-PcpfLocalArtifactRepository=${rootProject.ext.cpfLocalArtifactRepository}"
    }
}
tasks.named('build').configure {
    finalizedBy tasks.named('syncCpfLocalArtifactsAfterSuccessfulBuild')
}

tasks.register('commercialReleaseGate', Exec) {
    group = 'release'
    description = 'Final commercial release requires clean master, resolved licenses, Ed25519 signatures and current CVE report.'
    dependsOn 'validateReleaseMetadata', 'checkCpfStackSupport'
    def releaseDir = layout.buildDirectory.dir("release/${rootProject.ext.cpfPlatformVersion}")
    def publicKey = providers.gradleProperty('releasePublicKey').orElse(providers.environmentVariable('CPF_RELEASE_PUBLIC_KEY'))
    def vulnerabilityReport = providers.gradleProperty('vulnerabilityReport').orElse(providers.environmentVariable('CPF_VULNERABILITY_REPORT'))
    doFirst {
        if (rootProject.ext.cpfStackState != 'SUPPORTED_GA') {
            throw new GradleException("Commercial release is blocked while cpf stackState=${rootProject.ext.cpfStackState}. Complete the supported stack migration first.")
        }
        if (!publicKey.isPresent()) throw new GradleException('releasePublicKey/CPF_RELEASE_PUBLIC_KEY is required.')
        if (!vulnerabilityReport.isPresent()) throw new GradleException('vulnerabilityReport/CPF_VULNERABILITY_REPORT is required.')
        commandLine cpfPowerShellExecutable(), '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File',
                'cpf-tools/release/check-commercial-release.ps1', '-ReleaseDir', releaseDir.get().asFile.absolutePath,
                '-PublicKey', publicKey.get(), '-VulnerabilityReport', vulnerabilityReport.get()
    }
}
