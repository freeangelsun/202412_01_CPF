plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.13' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

def cpfPlatformProperties = new Properties()
file('gradle/cpf-platform.properties').withInputStream { cpfPlatformProperties.load(it) }
ext.cpfPlatformVersion = cpfPlatformProperties.getProperty('platformVersion')
ext.cpfCompatibleRange = cpfPlatformProperties.getProperty('compatibleRange')

if (ext.cpfPlatformVersion == null || ext.cpfPlatformVersion.isBlank()) {
    throw new GradleException('gradle/cpf-platform.properties의 platformVersion은 필수입니다.')
}

allprojects { targetProject ->
    def componentVersion = cpfPlatformProperties.getProperty("component.${targetProject.name}", 'inherit')
    version = componentVersion == 'inherit' ? rootProject.ext.cpfPlatformVersion : componentVersion

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    java {
        // CPF의 소스·컴파일·배포 바이트코드 기준을 Java 25 LTS 하나로 고정합니다.
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
        withSourcesJar()
        withJavadocJar()
    }

    dependencyManagement {
        imports {
            mavenBom 'org.springframework.boot:spring-boot-dependencies:3.4.13'
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok:1.18.46'
        annotationProcessor 'org.projectlombok:lombok:1.18.46'
        testCompileOnly 'org.projectlombok:lombok:1.18.46'
        testAnnotationProcessor 'org.projectlombok:lombok:1.18.46'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'net.bytebuddy:byte-buddy:1.18.7'
        testImplementation 'net.bytebuddy:byte-buddy-agent:1.18.7'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

        // 동일 Application binary에서 cpf.db.vendor와 datasource property만 바꿔
        // 공식 DB Vendor driver를 선택합니다. 업무 Source에는 Vendor 분기를 두지 않습니다.
        runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
        runtimeOnly 'com.mysql:mysql-connector-j'
        runtimeOnly 'org.postgresql:postgresql'
        runtimeOnly 'com.oracle.database.jdbc:ojdbc11'
        runtimeOnly 'com.microsoft.sqlserver:mssql-jdbc'
    }

    tasks.withType(JavaCompile).configureEach {
        // 실행 JDK와 무관하게 Java 25 API 및 class major 69 산출물만 허용합니다.
        options.release = 25
        options.encoding = 'UTF-8'
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        options.charSet = 'UTF-8'
        options.docEncoding = 'UTF-8'
        options.addStringOption('Xdoclint:all,-missing', '-quiet')
    }

    tasks.named('processResources').configure {
        doLast {
            def metadataDir = new File(destinationDir, 'META-INF')
            metadataDir.mkdirs()
            new File(metadataDir, 'cpf-platform.properties').setText(
                            "platformVersion=${rootProject.ext.cpfPlatformVersion}\n" +
                            "componentVersion=${project.version}\n" +
                            "compatibleRange=${rootProject.ext.cpfCompatibleRange}\n" +
                            "component=${project.name}\n",
                    'UTF-8')
        }
    }

    tasks.withType(AbstractArchiveTask).configureEach {
        archiveBaseName = project.name
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }

    tasks.withType(Jar).configureEach {
        manifest {
            attributes(
                    'Implementation-Title': project.name,
                    'Implementation-Version': project.version,
                    'CPF-Platform-Version': rootProject.ext.cpfPlatformVersion,
                    'CPF-Compatible-Range': rootProject.ext.cpfCompatibleRange,
                    'Git-Commit': providers.exec {
                        commandLine 'git', 'rev-parse', 'HEAD'
                        ignoreExitValue = true
                    }.standardOutput.asText.get().trim(),
                    'Build-Number': System.getenv('BUILD_NUMBER') ?: 'local',
                    'Build-Time': System.getenv('SOURCE_DATE_EPOCH') ?: 'reproducible-build',
                    'Artifact-Checksum': 'external-sha256'
            )
        }
    }
}

tasks.register('verifyVersionConsistency') {
    group = 'verification'
    description = '모든 CPF 모듈과 생성기의 제품 버전 정합성을 검사합니다.'
    doLast {
        def expected = rootProject.ext.cpfPlatformVersion.toString()
        if (!(expected ==~ /\d+\.\d+\.\d+(?:-SNAPSHOT|-rc\.\d+)?/)) {
            throw new GradleException("CPF platform version format is invalid: ${expected}")
        }
        ['cpf-core', 'cpf-common'].each { lockedComponent ->
            if (project(":${lockedComponent}").version.toString() != expected) {
                throw new GradleException("${lockedComponent} component must stay platform-locked: ${project(":${lockedComponent}").version}")
            }
        }
        subprojects.each { component ->
            def configured = cpfPlatformProperties.getProperty("component.${component.name}", 'inherit')
            def effective = configured == 'inherit' ? expected : configured
            if (component.version.toString() != effective) {
                throw new GradleException("CPF component version mismatch: ${component.path}=${component.version}, expected=${effective}")
            }
            if (!(effective ==~ /\d+\.\d+\.\d+(?:-SNAPSHOT|-rc\.\d+)?/)) {
                throw new GradleException("CPF component version format is invalid: ${component.path}=${effective}")
            }
        }
        def canonicalGenerator = file('cpf-tools/generator/create-domain.ps1')
        if (!canonicalGenerator.isFile()) {
            throw new GradleException("CPF canonical domain generator is missing: ${canonicalGenerator}")
        }
        def generatorText = canonicalGenerator.getText('UTF-8')
        if ((generatorText =~ /(?m)^\s*version\s*=/).find()) {
            throw new GradleException('생성 Module은 root platformVersion을 상속해야 하며 Generator template에 독립 version을 선언하면 안 됩니다.')
        }
        def compatibilityLauncher = file('cpf-tools/scripts/create-domain.ps1')
        if (compatibilityLauncher.isFile()) {
            def launcherText = compatibilityLauncher.getText('UTF-8')
            if (compatibilityLauncher.length() > 4096 || !(launcherText.contains('generator') && launcherText.contains('create-domain.ps1'))) {
                throw new GradleException('이전 create-domain 경로는 4KB 이하의 정본 Generator compatibility launcher여야 하며 두 번째 구현을 포함하면 안 됩니다.')
            }
        }
        logger.lifecycle("CPF version consistency passed: ${expected}, generator=cpf-tools/generator/create-domain.ps1")
    }
}

void cpfWriteVersionProperty(String key, String value) {
    def manifest = file('gradle/cpf-platform.properties')
    def lines = manifest.readLines('UTF-8')
    def replaced = false
    lines = lines.collect { line ->
        if (line.startsWith("${key}=")) {
            replaced = true
            return "${key}=${value}"
        }
        return line
    }
    if (!replaced) {
        lines << "${key}=${value}"
    }
    manifest.setText(lines.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
}

List<Integer> cpfParseSemanticVersion(String versionText) {
    def matcher = versionText =~ /^(\d+)\.(\d+)\.(\d+)/
    if (!matcher.find()) {
        throw new GradleException("Semantic version cannot be parsed: ${versionText}")
    }
    return [matcher.group(1).toInteger(), matcher.group(2).toInteger(), matcher.group(3).toInteger()]
}

tasks.register('bumpComponentVersion') {
    group = 'release'
    description = '승인된 구성요소의 독립 patch/minor/major 개발 버전을 계산해 정본에 반영합니다.'
    doLast {
        def component = (findProperty('component') ?: '').toString().trim()
        def level = (findProperty('level') ?: '').toString().trim().toLowerCase(Locale.ROOT)
        if (!subprojects*.name.contains(component)) {
            throw new GradleException("Unknown component: ${component}")
        }
        if (component in ['cpf-core', 'cpf-common']) {
            throw new GradleException("cpf-core와 cpf-common은 platform-locked component이므로 독립 version bump를 허용하지 않습니다.")
        }
        if (!(level in ['patch', 'minor', 'major'])) {
            throw new GradleException('level은 patch, minor 또는 major 중 하나여야 합니다.')
        }
        def current = project(":${component}").version.toString()
        def parts = cpfParseSemanticVersion(current)
        if (level == 'major') {
            parts = [parts[0] + 1, 0, 0]
        } else if (level == 'minor') {
            parts = [parts[0], parts[1] + 1, 0]
        } else {
            parts = [parts[0], parts[1], parts[2] + 1]
        }
        def next = "${parts[0]}.${parts[1]}.${parts[2]}-SNAPSHOT"
        cpfWriteVersionProperty("component.${component}", next)
        logger.lifecycle("Component version updated: ${component} ${current} -> ${next}")
    }
}

tasks.register('prepareReleaseCandidate') {
    group = 'release'
    description = '현재 CPF platform 개발 버전을 지정한 RC 버전으로 전환합니다.'
    doLast {
        def rc = (findProperty('rc') ?: '').toString().trim()
        if (!(rc ==~ /[1-9]\d*/)) {
            throw new GradleException('rc는 1 이상의 정수여야 합니다.')
        }
        def base = rootProject.ext.cpfPlatformVersion.toString().replaceFirst(/-(?:SNAPSHOT|rc\.\d+)$/, '')
        cpfParseSemanticVersion(base)
        cpfWriteVersionProperty('platformVersion', "${base}-rc.${rc}")
        logger.lifecycle("Release candidate prepared: ${base}-rc.${rc}")
    }
}

tasks.register('prepareRelease') {
    group = 'release'
    description = '현재 CPF platform SNAPSHOT 또는 RC 버전을 최종 버전으로 전환합니다.'
    doLast {
        def current = rootProject.ext.cpfPlatformVersion.toString()
        if (!(current.endsWith('-SNAPSHOT') || current ==~ /.*-rc\.\d+$/)) {
            throw new GradleException("Only SNAPSHOT or RC can be prepared as final release: ${current}")
        }
        def finalVersion = current.replaceFirst(/-(?:SNAPSHOT|rc\.\d+)$/, '')
        cpfParseSemanticVersion(finalVersion)
        cpfWriteVersionProperty('platformVersion', finalVersion)
        logger.lifecycle("Final release version prepared: ${finalVersion}")
    }
}

tasks.register('aggregateJavadoc') {
    group = 'documentation'
    description = '모든 CPF 모듈의 JavaDoc을 생성합니다.'
    dependsOn subprojects.collect { "${it.path}:javadoc" }
}

tasks.register('generateReleaseMetadata') {
    group = 'distribution'
    description = 'Release Manifest, dependency SBOM, build provenance를 서로 독립된 schema로 생성합니다.'
    dependsOn subprojects.collect { "${it.path}:assemble" }
    doLast {
        def outputDir = file("${buildDir}/release/${rootProject.ext.cpfPlatformVersion}")
        outputDir.mkdirs()

        def sha256Of = { File target ->
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            target.withInputStream { stream ->
                byte[] buffer = new byte[8192]
                int read
                while ((read = stream.read(buffer)) > 0) {
                    digest.update(buffer, 0, read)
                }
            }
            digest.digest().encodeHex().toString()
        }

        def artifacts = subprojects.collectMany { module ->
            def libDir = new File(module.buildDir, 'libs')
            libDir.exists()
                    ? libDir.listFiles().findAll { it.isFile() && it.name ==~ /.*\.(jar|war)$/ }
                            .collect { artifact -> [module: module.name, file: artifact] }
                    : []
        }.sort { left, right -> left.file.name <=> right.file.name }

        def artifactRows = artifacts.collect { row ->
            def sha256 = sha256Of(row.file)
            new File(outputDir, "${row.file.name}.sha256").setText("${sha256}  ${row.file.name}\n", 'UTF-8')
            [
                    module: row.module,
                    name: row.file.name,
                    version: project(":${row.module}").version.toString(),
                    sha256: sha256,
                    size: row.file.length()
            ]
        }

        def gitSha = providers.exec {
            commandLine 'git', 'rev-parse', 'HEAD'
            ignoreExitValue = true
        }.standardOutput.asText.get().trim()
        def gitBranch = providers.exec {
            commandLine 'git', 'rev-parse', '--abbrev-ref', 'HEAD'
            ignoreExitValue = true
        }.standardOutput.asText.get().trim()
        def gitStatus = providers.exec {
            commandLine 'git', 'status', '--porcelain'
            ignoreExitValue = true
        }.standardOutput.asText.get()
        def dirty = !gitStatus.trim().isEmpty()

        def manifest = [
                schema: 'cpf.release-manifest',
                schemaVersion: 2,
                platformVersion: rootProject.ext.cpfPlatformVersion.toString(),
                compatibleRange: rootProject.ext.cpfCompatibleRange.toString(),
                source: [commit: gitSha, branch: gitBranch, dirty: dirty],
                signature: [status: 'NOT_SIGNED_NO_APPROVED_KEY'],
                artifacts: artifactRows
        ]

        def componentByPurl = [:]
        def dependencyEdges = [] as Set
        subprojects.each { module ->
            def runtime = module.configurations.findByName('runtimeClasspath')
            if (runtime == null || !runtime.canBeResolved) return
            def resolved = runtime.resolvedConfiguration
            def artifactHashes = [:]
            resolved.resolvedArtifacts.each { artifact ->
                def coordinates = "${artifact.moduleVersion.id.group}:${artifact.name}:${artifact.moduleVersion.id.version}"
                artifactHashes[coordinates] = artifact.file?.isFile() ? sha256Of(artifact.file) : null
            }
            def visit
            visit = { dep, String parentPurl, int depth ->
                def purl = "pkg:maven/${dep.moduleGroup}/${dep.moduleName}@${dep.moduleVersion}"
                def coordinates = "${dep.moduleGroup}:${dep.moduleName}:${dep.moduleVersion}"
                def existing = componentByPurl[purl]
                if (existing == null || depth < (existing.depth as int)) {
                    def dependencyHash = artifactHashes[coordinates]
                    componentByPurl[purl] = [
                            type: 'library',
                            group: dep.moduleGroup,
                            name: dep.moduleName,
                            version: dep.moduleVersion,
                            purl: purl,
                            scope: 'runtime',
                            dependencyLevel: depth == 1 ? 'direct' : 'transitive',
                            depth: depth,
                            hashes: dependencyHash == null ? [] : [[algorithm: 'SHA-256', value: dependencyHash]],
                            licenses: [[id: 'NOASSERTION']]
                    ]
                }
                if (parentPurl != null) dependencyEdges << "${parentPurl}|${purl}"
                dep.children.each { child -> visit(child, purl, depth + 1) }
            }
            resolved.firstLevelModuleDependencies.each { dep -> visit(dep, "cpf-module:${module.name}", 1) }
        }
        def sbom = [
                schema: 'cpf.sbom',
                schemaVersion: 2,
                bomFormat: 'CPF-SBOM',
                platformVersion: rootProject.ext.cpfPlatformVersion.toString(),
                sourceCommit: gitSha,
                components: componentByPurl.values().sort { it.purl },
                dependencies: dependencyEdges.toList().sort().collect { edge ->
                    def parts = edge.split(/\|/, 2)
                    [from: parts[0], to: parts[1]]
                },
                licenseResolutionPolicy: 'NOASSERTION is fail-closed for commercial release until the release license gate resolves it.'
        ]

        def inputFiles = [
                file('gradle/cpf-platform.properties'),
                file('settings.gradle'),
                file('build.gradle'),
                file('gradle/libs.versions.toml')
        ].findAll { it.isFile() }
        def provenance = [
                schema: 'cpf.provenance',
                schemaVersion: 2,
                platformVersion: rootProject.ext.cpfPlatformVersion.toString(),
                source: [commit: gitSha, branch: gitBranch, dirty: dirty],
                builder: [
                        type: System.getenv('CI') ? 'CI' : 'LOCAL',
                        javaVersion: System.getProperty('java.version'),
                        gradleVersion: gradle.gradleVersion,
                        osName: System.getProperty('os.name')
                ],
                invocation: [
                        task: 'generateReleaseMetadata',
                        declaredCommand: System.getenv('CPF_BUILD_COMMAND') ?: './gradlew generateReleaseMetadata'
                ],
                inputs: inputFiles.collect { input -> [
                        path: rootProject.projectDir.toPath().relativize(input.toPath()).toString().replace('\\', '/'),
                        sha256: sha256Of(input)
                ]},
                outputs: artifactRows.collect { [module: it.module, name: it.name, sha256: it.sha256] }
        ]

        new File(outputDir, 'cpf-release-manifest.json').setText(new groovy.json.JsonBuilder(manifest).toPrettyString() + '\n', 'UTF-8')
        new File(outputDir, 'cpf-sbom.json').setText(new groovy.json.JsonBuilder(sbom).toPrettyString() + '\n', 'UTF-8')
        new File(outputDir, 'cpf-provenance.json').setText(new groovy.json.JsonBuilder(provenance).toPrettyString() + '\n', 'UTF-8')
        new File(outputDir, 'cpf-sbom-lite.json').delete()
        logger.lifecycle("CPF release metadata generated: ${outputDir}")
    }
}

tasks.register('validateReleaseMetadata') {
    group = 'verification'
    description = 'Release Manifest/SBOM/Provenance schema 분리와 실제 artifact hash 정합성을 검증합니다.'
    dependsOn 'generateReleaseMetadata'
    doLast {
        def outputDir = file("${buildDir}/release/${rootProject.ext.cpfPlatformVersion}")
        def slurper = new groovy.json.JsonSlurper()
        def manifestFile = new File(outputDir, 'cpf-release-manifest.json')
        def sbomFile = new File(outputDir, 'cpf-sbom.json')
        def provenanceFile = new File(outputDir, 'cpf-provenance.json')
        [manifestFile, sbomFile, provenanceFile].each {
            if (!it.isFile()) throw new GradleException("Release metadata file is missing: ${it}")
        }
        def manifest = slurper.parse(manifestFile)
        def sbom = slurper.parse(sbomFile)
        def provenance = slurper.parse(provenanceFile)
        def schemaFiles = [
                'cpf.release-manifest': file('cpf-tools/release/schema/cpf-release-manifest.schema.json'),
                'cpf.sbom': file('cpf-tools/release/schema/cpf-sbom.schema.json'),
                'cpf.provenance': file('cpf-tools/release/schema/cpf-provenance.schema.json')
        ]
        schemaFiles.each { schemaId, schemaFile ->
            if (!schemaFile.isFile()) throw new GradleException("Release metadata schema file is missing: ${schemaFile}")
            def schemaContract = slurper.parse(schemaFile)
            if (schemaContract.'$id' != schemaId) throw new GradleException("Release metadata schema id mismatch: ${schemaFile}")
            def payload = schemaId == 'cpf.release-manifest' ? manifest : (schemaId == 'cpf.sbom' ? sbom : provenance)
            schemaContract.required.each { requiredKey ->
                if (!payload.containsKey(requiredKey)) throw new GradleException("${schemaId} required field missing: ${requiredKey}")
            }
        }
        if (manifest.schema != 'cpf.release-manifest' || sbom.schema != 'cpf.sbom' || provenance.schema != 'cpf.provenance') {
            throw new GradleException('Release metadata schema가 서로 독립된 계약이 아닙니다.')
        }
        if (manifestFile.text == sbomFile.text || manifestFile.text == provenanceFile.text || sbomFile.text == provenanceFile.text) {
            throw new GradleException('Release Manifest/SBOM/Provenance가 동일한 payload를 공유하면 안 됩니다.')
        }
        def sha256Of = { File target ->
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            target.withInputStream { stream ->
                byte[] buffer = new byte[8192]
                int read
                while ((read = stream.read(buffer)) > 0) digest.update(buffer, 0, read)
            }
            digest.digest().encodeHex().toString()
        }
        manifest.artifacts.each { artifact ->
            def candidates = subprojects.collect { new File(it.buildDir, "libs/${artifact.name}") }.findAll { it.isFile() }
            if (candidates.size() != 1) throw new GradleException("Manifest artifact를 유일하게 찾을 수 없습니다: ${artifact.name}")
            if (sha256Of(candidates[0]) != artifact.sha256) throw new GradleException("Manifest artifact hash mismatch: ${artifact.name}")
        }
        if (sbom.components == null || sbom.dependencies == null) throw new GradleException('SBOM component/dependency graph가 없습니다.')
        sbom.components.each { component ->
            if (!component.purl || !component.version) throw new GradleException("SBOM component identity가 불완전합니다: ${component}")
            if (component.hashes == null || component.hashes.isEmpty()) throw new GradleException("SBOM dependency artifact hash가 없습니다: ${component.purl}")
            if (component.licenses == null || component.licenses.isEmpty()) throw new GradleException("SBOM license field가 없습니다: ${component.purl}")
        }
        if (provenance.source?.commit != manifest.source?.commit) throw new GradleException('Provenance와 Release Manifest commit이 다릅니다.')
        logger.lifecycle('CPF release metadata validation passed.')
    }
}

tasks.register('runLocalServices') {
    group = 'application'
    description = 'CPF verification or deployment task.'

    dependsOn ':cpf-member:classes', ':cpf-reference:classes', ':cpf-admin:classes', ':cpf-biz-admin:classes',
            ':cpf-batch:classes', ':cpf-account:classes', ':cpf-gateway:classes'

    doLast {
        def services = [
                [name: 'MBR', project: project(':cpf-member'), mainClass: 'com.cpf.member.MbrApplication'],
                 [name: 'REF', project: project(':cpf-reference'), mainClass: 'com.cpf.reference.ReferenceApplication'],
                [name: 'ADM', project: project(':cpf-admin'), mainClass: 'com.cpf.admin.AdmApplication'],
                [name: 'BZA', project: project(':cpf-biz-admin'), mainClass: 'com.cpf.bizadmin.BzaApplication', defaultEnabled: true],
                [name: 'BAT', project: project(':cpf-batch'), mainClass: 'com.cpf.batch.BatApplication', defaultEnabled: false],
                [name: 'ACC', project: project(':cpf-account'), mainClass: 'com.cpf.account.AccApplication', defaultEnabled: false],
                [name: 'GWY', project: project(':cpf-gateway'), mainClass: 'com.cpf.gateway.CpfGatewayApplication', defaultEnabled: false]
        ]
        def requestedServiceText = (project.findProperty('cpfRunServices') ?: System.getenv('CPF_RUN_LOCAL_SERVICES') ?: '').toString()
        if (!requestedServiceText.isBlank()) {
            def requestedServices = requestedServiceText
                    .split(',')
                    .collect { it.trim().toUpperCase(Locale.ROOT) }
                    .findAll { !it.isBlank() } as Set
            services = services.findAll { requestedServices.contains(it.name) }
            if (services.isEmpty()) {
                throw new GradleException("Unsupported cpfRunServices value: ${requestedServiceText}")
            }
        } else {
            services = services.findAll { it.get('defaultEnabled', true) }
        }
        def javaExecutable = new File(
                System.getProperty('java.home'),
                'bin/java' + (System.getProperty('os.name').toLowerCase().contains('windows') ? '.exe' : '')
        )
        def processes = []
        def logThreads = []

        logger.lifecycle("Starting CPF local services: ${services.collect { it.name }.join(', ')}")
        logger.lifecycle('Default ports: MBR(8081), REF(8099), ADM(8090), BZA(8091), BAT(8093), ACC(8082), GWY(8070)')
        logger.lifecycle('cpf-core(CPF)와 cpf-common(CMN)은 라이브러리 모듈이므로 독립 서비스로 기동하지 않습니다.')

        services.each { service ->
            def classpath = service.project.sourceSets.main.runtimeClasspath.asPath
            def argFile = new File(temporaryDir, "${service.name.toLowerCase()}-java-args.txt")
            argFile.parentFile.mkdirs()
            argFile.text = [
                    '-cp',
                    quoteJavaArg(classpath),
                    service.mainClass
            ].join(System.lineSeparator())

            def processBuilder = new ProcessBuilder(javaExecutable.absolutePath, "@${argFile.absolutePath}")
            processBuilder.directory(rootProject.projectDir)
            processBuilder.redirectErrorStream(true)

            def process = processBuilder.start()
            processes << [name: service.name, process: process]

            def logThread = Thread.start("${service.name}-local-log") {
                process.inputStream.withReader('UTF-8') { reader ->
                    String line
                    while ((line = reader.readLine()) != null) {
                        println "[${service.name}] ${line}"
                    }
                }
            }
            logThreads << logThread
        }

        def shutdownHook = new Thread({
            stopLocalServiceProcesses(processes)
        }, 'runLocalServices-shutdown')
        Runtime.runtime.addShutdownHook(shutdownHook)

        try {
            while (processes.every { it.process.isAlive() }) {
                Thread.sleep(1000)
            }

            def stopped = processes.find { !it.process.isAlive() }
            if (stopped != null) {
                throw new GradleException("${stopped.name} stopped. Stopping runLocalServices.")
            }
        } finally {
            try {
                Runtime.runtime.removeShutdownHook(shutdownHook)
            } catch (IllegalStateException ignored) {
                // Shutdown hook cleanup failures are ignored because the process is already ending.
            }
            stopLocalServiceProcesses(processes)
            logThreads.each { it.join(1000) }
        }
    }
}

String quoteJavaArg(String value) {
    return '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

void stopLocalServiceProcesses(List processes) {
    processes.each { entry ->
        def process = entry.process
        if (process.isAlive()) {
            process.destroy()
            if (!process.waitFor(5, java.util.concurrent.TimeUnit.SECONDS)) {
                process.destroyForcibly()
            }
        }
    }
}

