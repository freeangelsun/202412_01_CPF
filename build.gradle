String cpfRequestedModule() {
    return (findProperty('cpfModule') ?: 'MBR').toString().trim().toUpperCase(Locale.ROOT)
}

String cpfModuleProjectName(String moduleCode) {
    def value = ext.cpfServiceModules[moduleCode]
    if (value == null) {
        throw new GradleException("Unsupported CPF deploy module: ${moduleCode}")
    }
    return value
}

Map cpfRequestedBatRuntimeTarget(String moduleCode) {
    if (moduleCode != 'BAT') {
        return null
    }
    def role = (findProperty('cpfBatRuntimeRole') ?: '').toString().trim().toUpperCase(Locale.ROOT)
    if (role.isEmpty()) {
        throw new GradleException(
                'BAT deployment requires -PcpfBatRuntimeRole='
                        + ext.cpfBatRuntimeTargets.keySet().join('|'))
    }
    def target = ext.cpfBatRuntimeTargets[role]
    if (target == null) {
        throw new GradleException(
                "Unsupported BAT runtime role: ${role}. expected="
                        + ext.cpfBatRuntimeTargets.keySet().join('|'))
    }
    return [runtimeRole: role] + target
}

String cpfDeployProjectPath(String moduleCode) {
    def batTarget = cpfRequestedBatRuntimeTarget(moduleCode)
    return batTarget == null ? ":${cpfModuleProjectName(moduleCode)}" : batTarget.projectPath
}

String cpfDeployEvidenceName(String moduleCode) {
    def batTarget = cpfRequestedBatRuntimeTarget(moduleCode)
    return batTarget == null ? cpfModuleProjectName(moduleCode) : batTarget.artifact
}

String cpfRequestedEnv() {
    def env = (findProperty('cpfEnv') ?: 'dev').toString().trim().toLowerCase(Locale.ROOT)
    if (!ext.cpfDeployEnvs.contains(env)) {
        throw new GradleException("Unsupported CPF deploy environment: ${env}")
    }
    return env
}


String cpfPowerShellExecutable() {
    return (findProperty('cpfPowerShellExecutable')
            ?: System.getenv('CPF_POWERSHELL_EXECUTABLE')
            ?: 'pwsh').toString()
}

File cpfResultDir() {
    return file((findProperty('cpfResultDir') ?: 'build/cpf-evidence/current').toString())
}


Map<String, String> cpfReadEnvFile(File envFile) {
    if (!envFile.exists()) {
        throw new GradleException("Deploy env file is missing: ${envFile}")
    }
    def values = [:]
    envFile.readLines('UTF-8').each { line ->
        def trimmed = line.trim()
        if (trimmed.isEmpty() || trimmed.startsWith('#')) {
            return
        }
        def index = trimmed.indexOf('=')
        if (index <= 0) {
            throw new GradleException("Deploy env line is invalid: ${envFile} :: ${line}")
        }
        values[trimmed.substring(0, index)] = trimmed.substring(index + 1)
    }
    return values
}

Map cpfReadInventory(File inventoryFile) {
    if (!inventoryFile.exists()) {
        throw new GradleException("Deploy inventory file is missing: ${inventoryFile}")
    }
    return new groovy.json.JsonSlurper().parse(inventoryFile) as Map
}

void cpfWriteJson(File outputFile, Object value) {
    outputFile.parentFile.mkdirs()
    outputFile.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(value)), 'UTF-8')
}

Map cpfValidateDeployEnv(String moduleCode, String env, File resultDir) {
    def moduleLower = cpfModuleProjectName(moduleCode)
    def batTarget = cpfRequestedBatRuntimeTarget(moduleCode)
    def evidenceName = cpfDeployEvidenceName(moduleCode)
    def envFile = file("deploy/env/${env}-${moduleLower}.env")
    def values = cpfReadEnvFile(envFile)
    def prefix = moduleCode
    def requiredKeys = [
            'SPRING_PROFILES_ACTIVE',
            "${prefix}_MODULE_ID".toString(),
            'CPF_LOG_ROOT',
            'CPF_DB_MODE',
            'CPF_DB_URL',
            'CPF_DB_USERNAME',
            'CPF_DB_PASSWORD',
            'CPF_DB_JNDI_NAME',
            "${prefix}_DATASOURCE_MODE".toString(),
            "${prefix}_DATASOURCE_URL".toString(),
            "${prefix}_DATASOURCE_USERNAME".toString(),
            "${prefix}_DATASOURCE_PASSWORD".toString(),
            "${prefix}_DATASOURCE_JNDI_NAME".toString()
    ]
    if (batTarget == null) {
        requiredKeys.addAll([
                "${prefix}_INSTANCE_ID".toString(),
                "${prefix}_WAS_ID".toString(),
                "${prefix}_SERVER_PORT".toString()
        ])
    } else {
        requiredKeys.addAll([
                "${batTarget.envPrefix}_INSTANCE_ID".toString(),
                "${batTarget.envPrefix}_WAS_ID".toString(),
                "${batTarget.envPrefix}_PORT".toString()
        ])
    }
    def failures = []
    requiredKeys.each { key ->
        if (!values.containsKey(key)) {
            failures << "Required env key is missing: ${key}"
        } else if (values[key] == null || values[key].trim().isEmpty()) {
            failures << "Empty env value is not allowed: ${key}"
        }
    }
    def datasourceModeKey = "${prefix}_DATASOURCE_MODE".toString()
    def datasourcePasswordKey = "${prefix}_DATASOURCE_PASSWORD".toString()
    if (values[datasourceModeKey] && !['url', 'jndi'].contains(values[datasourceModeKey].toLowerCase(Locale.ROOT))) {
        failures << "${prefix}_DATASOURCE_MODE must be url or jndi."
    }
    if (values['CPF_DB_MODE'] && !['url', 'jndi'].contains(values['CPF_DB_MODE'].toLowerCase(Locale.ROOT))) {
        failures << 'CPF_DB_MODE must be url or jndi.'
    }
    if ((values[datasourcePasswordKey] ?: '').toLowerCase(Locale.ROOT).contains('local_pw')) {
        failures << "${prefix}_DATASOURCE_PASSWORD must not contain a local default password marker."
    }
    def logRoot = values['CPF_LOG_ROOT'] ?: ''
    if (logRoot && (!new File(logRoot).isAbsolute() || logRoot.replace('\\', '/').split('/').contains('..'))) {
        failures << 'CPF_LOG_ROOT must be an absolute path without parent traversal.'
    }
    def result = [
            generatedAt: new Date().format("yyyy-MM-dd'T'HH:mm:ss.SSSZ"),
            module     : moduleCode,
            runtimeRole: batTarget?.runtimeRole,
            env        : env,
            status     : failures.isEmpty() ? 'DONE' : 'FAILED',
            envFile    : "deploy/env/${env}-${moduleLower}.env",
            keyCount   : values.size(),
            failures   : failures
    ]
    cpfWriteJson(new File(resultDir, "deploy-env-${evidenceName}-${env}.sanitized.json"), result)
    if (!failures.isEmpty()) {
        throw new GradleException("Deploy env validation failed: ${failures.join(', ')}")
    }
    return result
}

Map cpfValidateDeployInventory(String moduleCode, String env, File resultDir) {
    def moduleLower = cpfModuleProjectName(moduleCode)
    def batTarget = cpfRequestedBatRuntimeTarget(moduleCode)
    def evidenceName = cpfDeployEvidenceName(moduleCode)
    def inventoryFile = file("deploy/inventory/${env}-services.json")
    if (env == 'prod' && !inventoryFile.exists()) {
        throw new GradleException('Production inventory must be explicitly provisioned; template fallback is forbidden.')
    }
    def inventory = cpfReadInventory(inventoryFile)
    def services = inventory.services ?: []
    def service = batTarget == null
            ? services.find { it.module == moduleCode }
            : services.find {
                it.module == moduleCode && it.runtimeRole == batTarget.runtimeRole
            }
    def failures = []
    if (service == null) {
        failures << "Inventory service is missing: ${moduleCode}"
    } else {
        def requiredFields = [
                'module', 'hostAlias', 'sshHostEnvKey', 'sshUserEnvKey', 'deployBase',
                'healthUrl', 'serviceName', 'portEnvKey', 'profile', 'runtimeMode',
                'approvalRequired', 'rollbackEnabled'
        ]
        if (batTarget != null) {
            requiredFields.addAll(['runtimeRole', 'projectPath', 'artifactName'])
        }
        requiredFields.each { key ->
            if (!service.containsKey(key)) {
                failures << "Inventory field is missing: ${key}"
            }
        }
        if (batTarget != null) {
            def batServices = services.findAll { it.module == 'BAT' }
            def actualRoles = batServices.collect { it.runtimeRole }
            def expectedRoles = ext.cpfBatRuntimeTargets.keySet() as Set
            if (batServices.size() != expectedRoles.size()
                    || actualRoles.toSet() != expectedRoles
                    || actualRoles.size() != actualRoles.toSet().size()) {
                failures << "BAT inventory must contain five exact runtime roles. actual=${actualRoles}"
            }
            if (service.projectPath != batTarget.projectPath
                    || service.artifactName != batTarget.artifact
                    || service.serviceName != batTarget.artifact
                    || service.portEnvKey != "${batTarget.envPrefix}_PORT".toString()) {
                failures << "BAT inventory target does not match canonical runtime mapping: ${batTarget.runtimeRole}"
            }
        }
        if (service.runtimeMode && !['embedded-bootjar', 'external-was', 'external-tomcat-war'].contains(service.runtimeMode)) {
            failures << "runtimeMode must be embedded-bootjar, external-was, or external-tomcat-war."
        }
    }
    def result = [
            generatedAt: new Date().format("yyyy-MM-dd'T'HH:mm:ss.SSSZ"),
            module     : moduleCode,
            runtimeRole: batTarget?.runtimeRole,
            env        : env,
            status     : failures.isEmpty() ? 'DONE' : 'FAILED',
            inventory  : inventoryFile.path.replace('\\', '/'),
            target     : service,
            failures   : failures
    ]
    cpfWriteJson(new File(resultDir, "deploy-inventory-${evidenceName}-${env}.sanitized.json"), result)
    if (!failures.isEmpty()) {
        throw new GradleException("Deploy inventory validation failed: ${failures.join(', ')}")
    }
    return result
}

Map cpfCheckPackagedDependencies(String moduleCode, File resultDir) {
    def projectPath = cpfDeployProjectPath(moduleCode)
    def evidenceName = cpfDeployEvidenceName(moduleCode)
    def batTarget = cpfRequestedBatRuntimeTarget(moduleCode)
    def moduleProject = project(projectPath)
    def requiredPrefixes = ['cpf-core-']
    if (!(moduleCode in ['BAT', 'GWY'])) {
        requiredPrefixes << 'cpf-common-'
    }

    def inspectArtifact = { File artifact, String libraryRoot ->
        if (!artifact.exists()) {
            throw new GradleException("CPF packaged artifact output is missing: ${artifact}")
        }
        def entries = []
        new java.util.zip.ZipFile(artifact).withCloseable { zip ->
            entries = zip.entries().collect { it.name }
        }
        def missing = requiredPrefixes.findAll { prefix ->
            !entries.any { entry -> entry.startsWith("${libraryRoot}/${prefix}") && entry.endsWith('.jar') }
        }
        return [
                artifact: artifact.path.replace('\\', '/'),
                libraryRoot: libraryRoot,
                missing: missing
        ]
    }

    def jarFile = moduleProject.tasks.named('bootJar').get().archiveFile.get().asFile
    def jarInspection = inspectArtifact(jarFile, 'BOOT-INF/lib')
    def warTask = moduleProject.tasks.findByName('bootWar')
    def warInspection = null
    if (warTask != null && warTask.enabled) {
        def warFile = warTask.archiveFile.get().asFile
        if (warFile.exists()) {
            warInspection = inspectArtifact(warFile, 'WEB-INF/lib')
        }
    }

    def failures = []
    if (!jarInspection.missing.isEmpty()) {
        failures << "bootJar에 CPF public dependency가 누락되었습니다: ${jarInspection.missing.join(', ')}"
    }
    if (warInspection != null && !warInspection.missing.isEmpty()) {
        failures << "bootWar에 CPF public dependency가 누락되었습니다: ${warInspection.missing.join(', ')}"
    }
    def result = [
            generatedAt: new Date().format("yyyy-MM-dd'T'HH:mm:ss.SSSZ"),
            module     : moduleCode,
            runtimeRole: batTarget?.runtimeRole,
            status     : failures.isEmpty() ? 'DONE' : 'FAILED',
            artifact   : jarInspection.artifact,
            bootJar    : jarInspection,
            bootWar    : warInspection,
            containsCore: jarInspection.missing.find { it == 'cpf-core-' } == null,
            containsCommon: moduleCode in ['BAT', 'GWY'] ||
                    jarInspection.missing.find { it == 'cpf-common-' } == null,
            failures   : failures
    ]
    cpfWriteJson(new File(resultDir, "packaged-dependencies-${evidenceName}.sanitized.json"), result)
    if (!failures.isEmpty()) {
        throw new GradleException("Package dependency validation failed: ${failures.join(', ')}")
    }
    return result
}

String cpfSha256(File file) {
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    file.withInputStream { input ->
        byte[] buffer = new byte[8192]
        int read
        while ((read = input.read(buffer)) > 0) {
            digest.update(buffer, 0, read)
        }
    }
    return digest.digest().collect { String.format('%02x', it) }.join()
}

