    description = 'CPF verification or deployment task.'
    dependsOn subprojects.collect { "${it.path}:compileJava" }
    dependsOn subprojects.collect { "${it.path}:test" }
    dependsOn ':cpf-admin:frontendVerify', ':cpf-biz-admin:frontendVerify', 'checkModernFrontend'
    dependsOn 'verifyVersionConsistency', 'checkUtf8', 'checkMojibake', 'checkLegacyName', 'checkSqlStandard', 'checkSqlCanonical', 'checkJavaFormat', 'checkJava25Standard', 'checkDocumentLinks', 'checkTransactionIdStandard', 'checkSecuritySeedStandard', 'checkSampleStandard', 'checkCpfRequestProtection', 'checkFeatureEvidence', 'checkServiceCallBoundary', 'checkArchitectureOwnership', 'checkBaseHierarchy', 'checkFullLayerTaxonomy', 'exportArchitectureInventory', 'exportRequirementTraceability', 'checkDomainGenerator', 'checkDomainCapabilityMatrix', 'checkAccLifecycle', 'checkDomainRemoval', 'checkRepositoryHygiene', 'checkSpringEventUsage', 'checkProfileLoading', 'checkRuntimeConfigStandard', 'checkLogManagementStandard', 'checkOpenApiSourceCoverage', 'checkSampleCoverage', 'checkEvidencePathExistence', 'checkDeployEnv', 'checkDeployInventory', 'checkPackagedDependencies', 'remoteDeployDryRun', 'checkReportMatrixEvidenceConsistency', 'admUiSmoke', 'admLogPolicyUiStaticSmoke', 'bzaUiSmoke', 'checkContractCompatibility', 'checkR13ProductHardening'
}


// 최종 배포 문서가 안정된 뒤에만 실행하는 Publication Gate입니다.
// 일반 개발 qualityGate가 조기 DOCX/PDF 산출물에 종속되지 않도록 책임을 분리합니다.
tasks.register('publicationGate') {
    group = 'verification'
    description = 'Validates final publication artifacts after product/source/evidence stabilization.'
    dependsOn 'qualityGate', 'checkDocxStandard', 'validateReleaseMetadata'
}
