    dependsOn 'remoteDeployDryRun'
}

tasks.register('remoteDeploy', Exec) {
    group = 'deployment'
    description = 'Executes an approved Deployment Cell plan through the BAT Control Server.'
    def planId = providers.gradleProperty('cpfPlanId').orElse('')
    def approvalId = providers.gradleProperty('cpfApprovalRequestId').orElse('')
    def commandId = providers.gradleProperty('cpfCommandRequestId').orElse('')
    def requestedBy = providers.gradleProperty('cpfRequestedBy').orElse('')
    def approvedBy = providers.gradleProperty('cpfApprovedBy').orElse('')
    def reason = providers.gradleProperty('cpfReason').orElse('')
    doFirst {
        if ([planId.get(), approvalId.get(), commandId.get(), requestedBy.get(), approvedBy.get(), reason.get()].any { it == null || it.isBlank() }) {
            throw new GradleException('remoteDeploy requires cpfPlanId, cpfApprovalRequestId, cpfCommandRequestId, cpfRequestedBy, cpfApprovedBy and cpfReason.')
        }
        if (requestedBy.get() == approvedBy.get()) throw new GradleException('Requester and approver must be different.')
    }
    commandLine cpfPowerShellExecutable(), '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File',
            'cpf-tools/scripts/invoke-bat-deployment.ps1',
            '-PlanId', planId.get(), '-ApprovalRequestId', approvalId.get(), '-CommandRequestId', commandId.get(),
            '-RequestedBy', requestedBy.get(), '-ApprovedBy', approvedBy.get(), '-Reason', reason.get(),
            '-ResultDir', cpfResultDir().path
}

tasks.register('rollbackDeploy', Exec) {
    group = 'deployment'
    description = 'Executes an approved BAT Deployment Cell rollback through the Control Server.'
    def planId = providers.gradleProperty('cpfPlanId').orElse('')
    def approvalId = providers.gradleProperty('cpfApprovalRequestId').orElse('')
    def commandId = providers.gradleProperty('cpfCommandRequestId').orElse('')
    def requestedBy = providers.gradleProperty('cpfRequestedBy').orElse('')
    def approvedBy = providers.gradleProperty('cpfApprovedBy').orElse('')
