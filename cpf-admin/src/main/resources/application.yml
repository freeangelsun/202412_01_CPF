# ADM 서비스 설정입니다.

spring:
  config:
    import:
      - optional:classpath:application-cpf.yml
      - optional:classpath:application-cpf-${spring.profiles.active:}.yml
      - optional:classpath:application-cmn.yml
      - optional:classpath:application-cmn-${spring.profiles.active:}.yml
      - optional:classpath:application-adm.yml
      - optional:classpath:application-adm-${spring.profiles.active:}.yml
  application:
    name: adm
  profiles:
    include: cpf, cmn
  datasource:
    adm:
      mode: ${ADM_DATASOURCE_MODE:url}
      driver-class-name: ${ADM_DB_DRIVER:org.mariadb.jdbc.Driver}
      url: ${ADM_DB_URL:jdbc:mariadb://localhost:3306/cpfDB}
      username: ${ADM_DB_USERNAME:cpf_adm_app}
      password: ${ADM_DB_PASSWORD:__REPLACE_BY_ENV__}
      jndi-name: ${ADM_DATASOURCE_JNDI_NAME:java:comp/env/jdbc/cpfAdminDataSource}
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

server:
  port: ${ADM_SERVER_PORT:8090}

logging:
  level:
    root: INFO
    com.cpf.core: INFO
    com.cpf.common: INFO
    com.cpf.admin: DEBUG

cpf:
  framework:
    module-id: ADM
    was-id: ${WAS_ID:admAP01}
  admin:
    gateway-control:
      enabled: ${CPF_ADMIN_GATEWAY_CONTROL_ENABLED:false}
      base-url: ${CPF_ADMIN_GATEWAY_CONTROL_BASE_URL:}
      shared-secret: ${CPF_GATEWAY_CONTROL_SHARED_SECRET:}
      key-id: ${CPF_GATEWAY_CONTROL_KEY_ID:current}
      audience: ${CPF_GATEWAY_CONTROL_AUDIENCE:CPF-GATEWAY-CONTROL}
      caller-service: ${CPF_ADMIN_GATEWAY_CONTROL_CALLER_SERVICE:ADM}
      connect-timeout-millis: ${CPF_ADMIN_GATEWAY_CONTROL_CONNECT_TIMEOUT_MILLIS:3000}
      response-timeout-millis: ${CPF_ADMIN_GATEWAY_CONTROL_RESPONSE_TIMEOUT_MILLIS:10000}
      overall-timeout-millis: ${CPF_ADMIN_GATEWAY_CONTROL_OVERALL_TIMEOUT_MILLIS:15000}
  adm:
    persistence:
      mode: ${CPF_ADM_PERSISTENCE_MODE:DATABASE}
    bootstrap:
      enabled: ${CPF_ADM_BOOTSTRAP_ENABLED:false}
      allow-prod: ${CPF_ADM_BOOTSTRAP_ALLOW_PROD:false}
      operator-id: ${CPF_ADM_BOOTSTRAP_OPERATOR_ID:admin}
      operator-name: ${CPF_ADM_BOOTSTRAP_OPERATOR_NAME:CPF 관리자}
      password: ${CPF_ADM_BOOTSTRAP_PASSWORD:}
    security:
      enabled: ${CPF_ADM_SECURITY_ENABLED:true}
      session-ttl-seconds: ${CPF_ADM_SESSION_TTL_SECONDS:3600}
      ip-allowlist: ${CPF_ADM_IP_ALLOWLIST:}
      mfa-enabled: ${CPF_ADM_MFA_ENABLED:false}
      session-cleanup-cron: ${CPF_ADM_SESSION_CLEANUP_CRON:0 */10 * * * *}
    password-policy:
      expire-days: ${CPF_ADM_PASSWORD_EXPIRE_DAYS:90}
      min-length: ${CPF_ADM_PASSWORD_MIN_LENGTH:10}
      required-category-count: ${CPF_ADM_PASSWORD_REQUIRED_CATEGORY_COUNT:3}
      max-fail-count: ${CPF_ADM_PASSWORD_MAX_FAIL_COUNT:5}
      history-count: ${CPF_ADM_PASSWORD_HISTORY_COUNT:3}
