server:
  port: ${MBW_WEB_PORT:8092}
  shutdown: graceful
spring:
  application:
    name: cpf-backoffice-web
  main:
    banner-mode: "off"
backoffice:
  web:
    mode: ${MBW_WEB_MODE:GATEWAY}
    gateway-base-uri: ${MBW_GATEWAY_BASE_URI:http://127.0.0.1:8080}
    direct-base-uri: ${MBW_DIRECT_BASE_URI:http://127.0.0.1:8082}
    caller-system-code: ${MBW_WEB_SYSTEM_CODE:MBW}
    target-system-code: ${MBW_TARGET_SYSTEM_CODE:MBW}
    caller-channel: ${MBW_WEB_CHANNEL:MBW}
    connect-timeout: ${MBW_CONNECT_TIMEOUT:3s}
    request-timeout: ${MBW_REQUEST_TIMEOUT:10s}
    access-cookie-name: ${MBW_ACCESS_COOKIE_NAME:CPF_MBW_ACCESS}
    refresh-cookie-name: ${MBW_REFRESH_COOKIE_NAME:CPF_MBW_REFRESH}
    secure-cookies: ${MBW_WEB_SECURE_COOKIES:true}
    cookie-same-site: ${MBW_WEB_COOKIE_SAME_SITE:Strict}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

cpf:
  logging:
    # 일반 Runtime 로그는 Application/Instance별 경로로 분리하며 Transaction Evidence와 혼용하지 않습니다.
    enabled: true
    root: ${CPF_LOG_ROOT:logs}
    instance-id: ${CPF_RUNTIME_INSTANCE_ID:${HOSTNAME:local}}
    maintenance-interval: ${CPF_LOG_MAINTENANCE_INTERVAL:1h}
    files:
      runtime:
        # 전체 Runtime 흐름을 기록하는 기본 파일입니다. Console 출력도 함께 유지됩니다.
        enabled: true
        file-name: runtime.log
        rolling: DAILY
        compress-after-days: 5
        delete-after-days: 365
      error:
        # ERROR 이상을 별도 파일에도 기록하여 운영 장애 탐색 경로를 명확히 합니다.
        enabled: true
        file-name: error.log
        level: ERROR
        rolling: DAILY
        compress-after-days: 5
        delete-after-days: 365
