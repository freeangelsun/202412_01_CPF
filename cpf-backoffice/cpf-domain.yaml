# MBW Backoffice는 CPF가 관리하는 Prebuilt Business Domain입니다. 이 파일은 identity/bootstrap 정본이며 Source 재생성 입력이 아닙니다.
domain:
  name: backoffice
  systemCode: MBW
  packageName: com.cpf.backoffice
database:
  role: CUSTOMER_BUSINESS_DB
  tablePrefix: MBW
preset: custom
modules:
  online: true
  batch: false
features:
  persistence: mybatis
  httpClient: false
  resilience: false
  cache: none
  messaging: none
  objectStorage: none
  securityProfile: resource-server
domainDependencies:
externalClients:
runtime:
  localOnlinePort: 18100
generation:
  mode: prebuilt
  sampleTransaction: false
