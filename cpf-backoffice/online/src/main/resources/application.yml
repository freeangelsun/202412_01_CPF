spring:
  application:
    name: cpf-backoffice
  datasource:
    # MBW Backoffice-owned DB. Secret/Endpoint는 환경 Binding으로만 주입합니다.
    url: ${MBW_DATASOURCE_URL}
    username: ${MBW_DATASOURCE_USERNAME}
    password: ${MBW_DATASOURCE_PASSWORD}
    driver-class-name: ${MBW_DATASOURCE_DRIVER}

cpf:
  # cpf-starter-common 의 code/message 정본은 CPF Platform 스키마다.
  # 업무 Domain Runtime 도 CPF_PLATFORM_DB role 을 요구하므로 자기 설정으로 해석할 수 있어야 한다.
  # 선언이 없으면 단독 기동이 "CPF DataSource is required for role: CPF_PLATFORM_DB" 로 실패한다.
  # 업무 DB(CUSTOMER_BUSINESS_DB)와는 다른 논리 role 이며 접속 정보도 별개다.
  data:
    persistence:
      jdbc:
        role-datasources:
          cpf-platform-db:
            enabled: true
            url: ${CPF_PLATFORM_DB_URL:}
            username: ${CPF_PLATFORM_DB_USERNAME:cpf_app}
            password: ${CPF_PLATFORM_DB_PASSWORD:}
            driver-class-name: ${CPF_PLATFORM_DB_DRIVER:}
            pool-name: ${CPF_PLATFORM_DB_POOL_NAME:cpf-platform}
  # Environment는 SystemCode가 아닌 deployment context다. Initial Bootstrap audit은 이
  # canonical configuration을 기록하며, local consumer의 기본값은 local이다.
  environment:
    code: ${CPF_ENVIRONMENT_CODE:local}
  logging:
    # 일반 Runtime 로그는 Application/Instance별 경로로 분리하며 Transaction Evidence와 혼용하지 않습니다.
    enabled: true
    root: ${CPF_LOG_ROOT:logs}
    instance-id: ${CPF_RUNTIME_INSTANCE_ID:${HOSTNAME:local}}
    maintenance-interval: ${CPF_LOG_MAINTENANCE_INTERVAL:1h}
    files:
      runtime:
        # 전체 Runtime 흐름을 기록하는 기본 파일입니다. Console 출력도 함께 유지됩니다.
        enabled: true
        file-name: runtime.log
        rolling: DAILY
        compress-after-days: 5
        delete-after-days: 365
      error:
        # ERROR 이상을 별도 파일에도 기록하여 운영 장애 탐색 경로를 명확히 합니다.
        enabled: true
        file-name: error.log
        level: ERROR
        rolling: DAILY
        compress-after-days: 5
        delete-after-days: 365
  # Backoffice 는 Generated Business Domain 과 같은 Runtime 계약을 따른다고 선언한다. 그런데 Domain
  # persistence 선언이 없으면 표준 Domain DataSource(cpfDomainDataSource)가 만들어지지 않아
  # CUSTOMER_BUSINESS_DB role 해석이 실패하고 단독 기동이 불가능하다. 통합 Runtime 이 별도 role
  # DataSource 를 켜 주던 경로에 가려져 지금까지 드러나지 않았다.
  domain:
    persistence:
      enabled: true
      required: true
      # MBW 는 NamedParameterJdbcTemplate 로 자기 DB 를 쓰고 MyBatis mapper 를 갖지 않는다.
      # provider 를 mybatis 로 두면 mybatis.mapper-locations 를 요구해 기동이 실패한다.
      provider: jdbc
      data-source-prefix: spring.datasource
  generated-domain:
    # Backoffice는 Generator가 매번 생성하지 않는 Optional Prebuilt Business Domain이지만
    # Runtime 계약은 Generated Business Domain과 동일합니다.
    name: backoffice
    # 거래 식별용 System Code입니다. DB 물리 Prefix는 Generator/Canonical DB 계약으로 고정됩니다.
    system-code: MBW
    # Architecture Role 정본: cpf-tools/governance/cpf-product-surface-policy.json (Harness 30.16)
    architecture-role: BUSINESS_DOMAIN
    database-role: CUSTOMER_BUSINESS_DB
    table-prefix: MBW
  runtime:
    # Runtime Role 은 Platform Registry 의 정본 제약(OPS_RUNTIME_INSTANCE_STATE.ck_ops_runtime_instance_role)
    # 값만 쓴다. 업무 Domain Online Runtime 은 APPLICATION 이다. 자유 문자열을 쓰면 Runtime 등록이
    # check constraint 위반으로 실패해 기동 자체가 막힌다.
    role: APPLICATION
  operation-policy:
    seed:
      allowed-callers: ${CPF_OPERATION_POLICY_SEED_ALLOWED_CALLERS:}
      source: YML
      revision: ${CPF_OPERATION_POLICY_SEED_REVISION:BACKOFFICE-1}
  backoffice:
    security:
      jwt-secret: ${CPF_MBW_JWT_SECRET:}
      access-token-ttl-seconds: ${CPF_MBW_ACCESS_TOKEN_TTL_SECONDS:600}
      refresh-token-ttl-seconds: ${CPF_MBW_REFRESH_TOKEN_TTL_SECONDS:7200}
    bootstrap:
      approval-token-file: ${CPF_MBW_BOOTSTRAP_APPROVAL_TOKEN_FILE:}
      password-file: ${CPF_MBW_BOOTSTRAP_PASSWORD_FILE:}
      approval-scope: ${CPF_MBW_BOOTSTRAP_APPROVAL_SCOPE:}
      operation-id: ${CPF_MBW_BOOTSTRAP_OPERATION_ID:}
      claim-lease-seconds: ${CPF_MBW_BOOTSTRAP_CLAIM_LEASE_SECONDS:300}
      login-id: ${CPF_MBW_BOOTSTRAP_LOGIN_ID:}
      operator-name: ${CPF_MBW_BOOTSTRAP_OPERATOR_NAME:}
      role-code: ${CPF_MBW_BOOTSTRAP_ROLE_CODE:MBW_MANAGER}
    initial-operator:
      # 최초 운영자도 모든 profile에서 같은 ENV 계약을 사용한다. secret 값은 YAML에 두지 않는다.
      login-id: ${CPF_MBW_INITIAL_OPERATOR_LOGIN_ID:}
      operator-name: ${CPF_MBW_INITIAL_OPERATOR_NAME:}
      role-code: ${CPF_MBW_INITIAL_OPERATOR_ROLE_CODE:}
      password-expiry-days: ${CPF_MBW_INITIAL_OPERATOR_PASSWORD_EXPIRY_DAYS:90}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
