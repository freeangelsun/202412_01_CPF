spring:
  application:
    name: cpf-backoffice
  datasource:
    # MBW Backoffice-owned DB. Secret/Endpoint는 환경 Binding으로만 주입합니다.
    url: ${MBW_DATASOURCE_URL}
    username: ${MBW_DATASOURCE_USERNAME}
    password: ${MBW_DATASOURCE_PASSWORD}
    driver-class-name: ${MBW_DATASOURCE_DRIVER}

cpf:
  logging:
    # 일반 Runtime 로그는 Application/Instance별 경로로 분리하며 Transaction Evidence와 혼용하지 않습니다.
    enabled: true
    root: ${CPF_LOG_ROOT:logs}
    instance-id: ${CPF_RUNTIME_INSTANCE_ID:${HOSTNAME:local}}
    maintenance-interval: ${CPF_LOG_MAINTENANCE_INTERVAL:1h}
    files:
      runtime:
        # 전체 Runtime 흐름을 기록하는 기본 파일입니다. Console 출력도 함께 유지됩니다.
        enabled: true
        file-name: runtime.log
        rolling: DAILY
        compress-after-days: 5
        delete-after-days: 365
      error:
        # ERROR 이상을 별도 파일에도 기록하여 운영 장애 탐색 경로를 명확히 합니다.
        enabled: true
        file-name: error.log
        level: ERROR
        rolling: DAILY
        compress-after-days: 5
        delete-after-days: 365
  generated-domain:
    # Backoffice는 Generator가 매번 생성하지 않는 Optional Prebuilt Business Domain이지만
    # Runtime 계약은 Generated Business Domain과 동일합니다.
    name: backoffice
    # 거래 식별용 System Code입니다. DB 물리 Prefix는 Generator/Canonical DB 계약으로 고정됩니다.
    system-code: ${CPF_SYSTEM_CODE:MBW}
    database-role: CUSTOMER_BUSINESS_DB
    table-prefix: MBW
  runtime:
    role: backoffice-online
  operation-policy:
    seed:
      allowed-callers: ${CPF_OPERATION_POLICY_SEED_ALLOWED_CALLERS:}
      source: YML
      revision: ${CPF_OPERATION_POLICY_SEED_REVISION:BACKOFFICE-1}
  backoffice:
    security:
      jwt-secret: ${CPF_MBW_JWT_SECRET:}
      access-token-ttl-seconds: ${CPF_MBW_ACCESS_TOKEN_TTL_SECONDS:600}
      refresh-token-ttl-seconds: ${CPF_MBW_REFRESH_TOKEN_TTL_SECONDS:7200}
    bootstrap:
      approval-token-file: ${CPF_MBW_BOOTSTRAP_APPROVAL_TOKEN_FILE:}
      password-file: ${CPF_MBW_BOOTSTRAP_PASSWORD_FILE:}
      approval-scope: ${CPF_MBW_BOOTSTRAP_APPROVAL_SCOPE:}
      operation-id: ${CPF_MBW_BOOTSTRAP_OPERATION_ID:}
      claim-lease-seconds: ${CPF_MBW_BOOTSTRAP_CLAIM_LEASE_SECONDS:300}
      login-id: ${CPF_MBW_BOOTSTRAP_LOGIN_ID:}
      operator-name: ${CPF_MBW_BOOTSTRAP_OPERATOR_NAME:}
      role-code: ${CPF_MBW_BOOTSTRAP_ROLE_CODE:MBW_MANAGER}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
