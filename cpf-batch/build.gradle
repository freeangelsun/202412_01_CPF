plugins { id 'base' }
group='com.cpf.batch'
tasks.register('verifyStandaloneArtifacts') {
 group='verification'
 dependsOn ':cpf-batch:contract:build', ':cpf-batch:runtime-common:build',
 ':cpf-batch:control-server:bootJar', ':cpf-batch:scheduler:bootJar', ':cpf-batch:worker:bootJar',
 ':cpf-batch:center-cut-runner:bootJar', ':cpf-batch:host-agent:bootJar', ':cpf-batch:testkit:build'
}


tasks.register('publishStandaloneArtifacts') {
    group = 'publishing'
    description = 'Publishes BAT libraries and executable artifacts to the configured CPF repository.'
    dependsOn(
      ':cpf-batch:contract:publish', ':cpf-batch:runtime-common:publish', ':cpf-batch:testkit:publish',
      ':cpf-batch:control-server:publish', ':cpf-batch:scheduler:publish', ':cpf-batch:worker:publish',
      ':cpf-batch:center-cut-runner:publish', ':cpf-batch:host-agent:publish'
    )
}
