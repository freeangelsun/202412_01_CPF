plugins { id 'base' }
group='com.cpf.batch'
tasks.register('verifyStandaloneArtifacts') {
 group='verification'
 dependsOn ':cpf-batch:contract:build', ':cpf-batch:runtime-common:build',
 ':cpf-batch:control-server:bootJar', ':cpf-batch:scheduler:bootJar', ':cpf-batch:worker:bootJar',
 ':cpf-batch:center-cut-runner:bootJar', ':cpf-batch:host-agent:bootJar', ':cpf-batch:testkit:build'
}


tasks.register('publishStandaloneArtifacts') {
    group = 'publishing'
    description = 'Blocked ambiguous legacy publish entry. Use the explicit cpfLocal/cpfStaging/cpfInternal task.'
    doLast {
        throw new GradleException(
                'Ambiguous BAT publish is blocked. Use publishStandaloneArtifactsToCpfLocal, ' +
                'publishStandaloneArtifactsToCpfStaging, or publishStandaloneArtifactsToCpfInternal.'
        )
    }
}


tasks.register('publishStandaloneArtifactsToCpfLocal') {
    group = 'publishing'
    description = 'Publishes BAT public libraries and executable artifacts only to the shared CPF local repository.'
    dependsOn(
      ':cpf-batch:contract:publishAllPublicationsToCpfLocalRepository',
      ':cpf-batch:runtime-common:publishAllPublicationsToCpfLocalRepository',
      ':cpf-batch:testkit:publishAllPublicationsToCpfLocalRepository',
      ':cpf-batch:control-server:publishAllPublicationsToCpfLocalRepository',
      ':cpf-batch:scheduler:publishAllPublicationsToCpfLocalRepository',
      ':cpf-batch:worker:publishAllPublicationsToCpfLocalRepository',
      ':cpf-batch:center-cut-runner:publishAllPublicationsToCpfLocalRepository',
      ':cpf-batch:host-agent:publishAllPublicationsToCpfLocalRepository'
    )
}


tasks.register('publishStandaloneArtifactsToCpfStaging') {
    group = 'publishing'
    description = 'Publishes BAT public libraries and executable artifacts only to the isolated CPF staging repository.'
    dependsOn(
      ':cpf-batch:contract:publishAllPublicationsToCpfStagingRepository',
      ':cpf-batch:runtime-common:publishAllPublicationsToCpfStagingRepository',
      ':cpf-batch:testkit:publishAllPublicationsToCpfStagingRepository',
      ':cpf-batch:control-server:publishAllPublicationsToCpfStagingRepository',
      ':cpf-batch:scheduler:publishAllPublicationsToCpfStagingRepository',
      ':cpf-batch:worker:publishAllPublicationsToCpfStagingRepository',
      ':cpf-batch:center-cut-runner:publishAllPublicationsToCpfStagingRepository',
      ':cpf-batch:host-agent:publishAllPublicationsToCpfStagingRepository'
    )
}

tasks.register('publishStandaloneArtifactsToCpfInternal') {
    group = 'publishing'
    description = 'Publishes BAT public libraries and executable artifacts only to the configured remote CPF repository.'
    dependsOn(
      ':cpf-batch:contract:publishAllPublicationsToCpfInternalRepository',
      ':cpf-batch:runtime-common:publishAllPublicationsToCpfInternalRepository',
      ':cpf-batch:testkit:publishAllPublicationsToCpfInternalRepository',
      ':cpf-batch:control-server:publishAllPublicationsToCpfInternalRepository',
      ':cpf-batch:scheduler:publishAllPublicationsToCpfInternalRepository',
      ':cpf-batch:worker:publishAllPublicationsToCpfInternalRepository',
      ':cpf-batch:center-cut-runner:publishAllPublicationsToCpfInternalRepository',
      ':cpf-batch:host-agent:publishAllPublicationsToCpfInternalRepository'
    )
}

// QA38 official starter consumers for Batch-owned runtimes.
subprojects {
    dependencies {
        implementation project(':cpf-starter-profile-event-kafka')
        implementation project(':cpf-starter-profile-scheduled-service')
    }
}
