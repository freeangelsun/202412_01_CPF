spring:
  config:
    import:
      - optional:classpath:application-cpf.yml
      - optional:classpath:application-cpf-${spring.profiles.active:local}.yml
      - optional:classpath:application-bat-runtime.yml
      - optional:classpath:application-cmn.yml
      - optional:classpath:application-cmn-${spring.profiles.active:local}.yml
  application:
    name: cpf-batch-center-cut
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
server:
  port: ${CPF_PORT:8183}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
cpf:
  # Center-Cut Runner의 거래/Runtime System Code입니다. 기본값 CEC이며 Header/Trace/Registry에서 사용합니다.
  system-code: ${CPF_SYSTEM_CODE:CEC}
  web:
    context:
      management-root-paths:
        - /internal/v1/center-cut
  framework:
    # Center-Cut Runner의 독립 Runtime Module Identity입니다. 일반 Batch(BAT)와 구분합니다.
    module-id: ${CPF_MODULE_ID:CEC}
    was-id: ${CPF_WAS_ID:}
  runtime:
    # Control Plane Registry에 등록되는 실행 역할입니다. 기능명 CENTER_CUT과 구분합니다.
    role: CENTER_CUT_RUNNER
  batch:
    control:
      base-url: ${CPF_BATCH_CONTROL_BASE_URL:http://127.0.0.1:8180}
    runtime:
      heartbeat-ms: ${CPF_RUNTIME_HEARTBEAT_MS:5000}
  center-cut:
    max-concurrency: ${CPF_CENTER_CUT_MAX_CONCURRENCY:1}
    lease-seconds: ${CPF_CENTER_CUT_LEASE_SECONDS:30}
    heartbeat-ms: ${CPF_CENTER_CUT_HEARTBEAT_MS:5000}
