plugins { id 'org.springframework.boot'; id 'maven-publish' }
group='com.cpf.batch'
dependencies {
    implementation project(':cpf-batch:contract')
    implementation project(':cpf-batch:runtime-common')
    implementation project(':cpf-batch:execution-runtime')
    implementation project(':cpf-core')
    implementation project(':cpf-common')
    implementation project(':cpf-starter-security')
    implementation project(':cpf-starter-observability')
    implementation project(':cpf-starter-messaging-kafka')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-batch-jdbc'
    implementation 'org.springframework.batch:spring-batch-integration'
    implementation 'org.springframework.integration:spring-integration-kafka'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    testImplementation project(':cpf-batch:testkit')
    testImplementation 'org.springframework.batch:spring-batch-test'
}
tasks.named('bootJar') { archiveFileName = "cpf-batch-control-server-${project.version}.jar" }
tasks.named('test') { useJUnitPlatform() }
publishing { publications { executable(MavenPublication) { groupId='com.cpf.batch'; artifactId='cpf-batch-control-server'; version=project.version.toString(); artifact tasks.named('bootJar') } } }
