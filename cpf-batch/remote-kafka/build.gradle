plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.cpf.batch'

dependencies {
    api project(':runtime:batch:runtime')
    implementation project(':runtime:batch:runtime-support')
    implementation project(':framework:base-runtime')
    implementation project(':framework:core')
    implementation project(':framework:data:persistence')
    implementation project(':starters:messaging:kafka')
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation 'org.springframework.integration:spring-integration-kafka'
    implementation 'org.springframework.batch:spring-batch-integration'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation project(':internal:testing:testkit')
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mockito:mockito-core'
}

tasks.named('test') { useJUnitPlatform() }
tasks.named('jar') { archiveFileName = "cpf-batch-remote-kafka-${project.version}.jar" }

publishing {
    publications {
        library(MavenPublication) {
            from components.java
            groupId = 'com.cpf.batch'
            artifactId = 'cpf-batch-remote-kafka'
            version = project.version.toString()
        }
    }
}
