plugins { id 'java-library'; id 'maven-publish' }
group='com.cpf.batch'
dependencies {
    api project(':framework:data')
    api project(':framework:operations')
 api project(':runtime:batch:api')
 implementation project(':framework:core')
 implementation project(':framework:web')
 implementation project(':internal:platform-operations:runtime-control')
 implementation project(':starters:common')
 implementation 'org.springframework.boot:spring-boot-starter-jdbc'
 implementation 'org.springframework.boot:spring-boot-restclient'
 implementation 'org.springframework:spring-web'
 implementation 'com.fasterxml.jackson.core:jackson-databind'
 implementation 'org.slf4j:slf4j-api'
 testImplementation 'org.springframework:spring-test'
}
tasks.named('test') { useJUnitPlatform() }
publishing { publications { mavenJava(MavenPublication) { from components.java; artifactId='cpf-batch-runtime-support' } } }
