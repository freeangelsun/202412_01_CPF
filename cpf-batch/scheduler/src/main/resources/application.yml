spring:
  config:
    import:
      - optional:classpath:application-cpf.yml
      - optional:classpath:application-cpf-${spring.profiles.active:local}.yml
      - optional:classpath:application-bat-runtime.yml
      - optional:classpath:application-cmn.yml
      - optional:classpath:application-cmn-${spring.profiles.active:local}.yml
  application:
    name: cpf-batch-scheduler
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
server:
  port: ${CPF_PORT:8181}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
cpf:
  # Runtime 거래 식별용 System Code입니다. CPF Platform DB의 Schema/Table Prefix는 이 값과 무관하게 Canonical 고정입니다.
  system-code: ${CPF_SYSTEM_CODE:BAT}
  framework:
    module-id: BAT
    was-id: ${CPF_WAS_ID:}
  runtime:
    role: SCHEDULER
  batch:
    control:
      base-url: ${CPF_BATCH_CONTROL_BASE_URL:http://127.0.0.1:8180}
    runtime:
      heartbeat-ms: ${CPF_RUNTIME_HEARTBEAT_MS:5000}
