plugins { id 'java-library'; id 'maven-publish' }
group='com.cpf.batch'
dependencies {
    api project(':cpf-batch:contract')
    implementation project(':cpf-batch:runtime-common')
    testImplementation project(':cpf-batch:execution-runtime')
    testImplementation 'org.springframework.batch:spring-batch-test'
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testImplementation 'org.apache.kafka:kafka-clients'
    testImplementation 'org.postgresql:postgresql'
    testImplementation 'org.mariadb.jdbc:mariadb-java-client'
    testImplementation 'com.oracle.database.jdbc:ojdbc11'
}
tasks.named('test') { useJUnitPlatform() }
tasks.register('qa32IntegrationTest', Test) {
    group='verification'; description='QA32 real Oracle/PostgreSQL/MariaDB/Kafka environment contract tests.'
    useJUnitPlatform { includeTags 'qa32-runtime' }
    shouldRunAfter test
    systemProperties System.properties
    environment System.getenv()
}
publishing { publications { mavenJava(MavenPublication) { from components.java; artifactId='cpf-batch-testkit' } } }
