plugins { id 'java'; id 'org.springframework.boot'; id 'maven-publish' }
group='com.cpf.batch'
dependencies {
    implementation project(':framework:operations')
    implementation project(':framework:integration')
    implementation project(':framework:messaging')
    implementation project(':framework:data')
    implementation project(':framework:file')
 implementation project(':runtime:batch:api')
 implementation project(':runtime:batch:runtime-support')
 implementation project(':runtime:batch:runtime')
 implementation project(':framework:core')
 implementation project(':starters:common')
 implementation project(':internal:messaging:reliability:jdbc')
 implementation project(':internal:notification:dispatch')
 implementation project(':internal:security:secret')
 implementation project(':internal:integration:resilience')
 implementation 'org.springframework.boot:spring-boot-starter-webmvc'
 implementation 'org.springframework.boot:spring-boot-starter-actuator'
 implementation 'org.springframework:spring-context'
 implementation 'org.springframework.boot:spring-boot-starter-jdbc'
 implementation 'org.springframework.boot:spring-boot-starter-batch-jdbc'
 implementation 'org.springframework.batch:spring-batch-integration'
 testImplementation project(':runtime:batch:testkit')
 testImplementation 'org.springframework.batch:spring-batch-test'
}
tasks.named('bootJar'){archiveFileName="cpf-batch-worker-${project.version}.jar"}
tasks.named('test'){useJUnitPlatform()}
publishing { publications { executable(MavenPublication){groupId='com.cpf.batch';artifactId='cpf-batch-worker';version=project.version.toString();artifact tasks.named('bootJar')} } }
