spring:
  config:
    import:
      - optional:classpath:application-cpf.yml
      - optional:classpath:application-cpf-${spring.profiles.active:local}.yml
      - optional:classpath:application-bat-runtime.yml
      - optional:classpath:application-cmn.yml
      - optional:classpath:application-cmn-${spring.profiles.active:local}.yml
  application:
    name: cpf-batch-worker
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
server:
  port: ${CPF_PORT:8182}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
cpf:
  framework:
    module-id: BAT
    was-id: ${CPF_WAS_ID:cpf-batch-worker-local-01}
  batch:
    control:
      base-url: ${CPF_BATCH_CONTROL_BASE_URL:http://127.0.0.1:8180}
    runtime:
      role: WORKER
      instance-id: ${CPF_INSTANCE_ID:cpf-batch-worker-local-01}
      heartbeat-ms: ${CPF_RUNTIME_HEARTBEAT_MS:5000}
    # 승인 Script/Path Alias는 고객 설치 환경에서 명시적으로 설정합니다. 빈 Catalog는 fail-closed입니다.
    worker:
      max-concurrency: ${CPF_BAT_WORKER_MAX_CONCURRENCY:1}
      operations:
        scripts: {}
        path-aliases: {}
