plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'java'
    id 'war'
}

group = 'com.cpf.bizadmin'
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(rootProject.ext.cpfJavaVersion)
    }
}

dependencies {
    // Core/Foundation/Security 기본 Runtime은 Public Profile -> cpf-starter 경로로만 수신합니다.
    implementation project(':starters:profiles:bff')
    implementation project(':starters:security:session:jdbc')
    implementation project(':starters:data:mybatis')
    implementation project(':internal:file:attachment')
    implementation project(':starters:common')
    // BZA servlet filter/controller가 직접 사용하는 Spring Web은 외부 Tomcat과 별개로
    // 애플리케이션 WAR 및 test runtime에 반드시 포함되어야 합니다.
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.oracle.database.jdbc:ojdbc11'
    providedRuntime('org.springframework.boot:spring-boot-starter-tomcat') {
        // Servlet container만 provided 처리하고 애플리케이션 소유 Spring Web은 제외하지 않습니다.
        exclude group: 'org.springframework', module: 'spring-web'
    }

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

// BZA Frontend is an external optional application (`cpf-biz-frontend`).
// The Business Administration Domain no longer embeds or builds browser assets.
def bzaPermissionManifest = rootProject.layout.projectDirectory.file('cpf-tools/db/metadata/bza-permission-manifest.json')

tasks.named('processResources') {
    from(bzaPermissionManifest) { into 'cpf/bza' }
}
