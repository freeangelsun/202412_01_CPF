# BZA 공통 실행 설정입니다.

cpf:
  framework:
    module-id: ${BZA_MODULE_ID:BZA}
    was-id: ${BZA_WAS_ID:${WAS_ID:bzaAP01}}
  service-call:
    registry-mode: ${BZA_SERVICE_REGISTRY_MODE:${CPF_SERVICE_REGISTRY_MODE:LOCAL}}
  bza:
    bootstrap:
      # Bootstrap is opt-in by presence of a one-time approval token file. Plaintext enable/password properties are forbidden.
      approval-token-file: ${CPF_BZA_BOOTSTRAP_APPROVAL_TOKEN_FILE:}
      password-file: ${CPF_BZA_BOOTSTRAP_PASSWORD_FILE:}
      approval-scope: ${CPF_BZA_BOOTSTRAP_APPROVAL_SCOPE:}
      operation-id: ${CPF_BZA_BOOTSTRAP_OPERATION_ID:}
      claim-lease-seconds: ${CPF_BZA_BOOTSTRAP_CLAIM_LEASE_SECONDS:300}
      login-id: ${CPF_BZA_BOOTSTRAP_LOGIN_ID:}
      operator-name: ${CPF_BZA_BOOTSTRAP_OPERATOR_NAME:}
      role-code: ${CPF_BZA_BOOTSTRAP_ROLE_CODE:BZA_MANAGER}

logging:
  config: classpath:log/cpf-logback-spring.xml
