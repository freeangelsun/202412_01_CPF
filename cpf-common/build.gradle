plugins {
	id 'maven-publish'
	id 'java-library' // CMN 모듈은 공통 라이브러리로 배포한다.
	id 'io.spring.dependency-management' // Spring Boot BOM 기반으로 의존성 버전을 맞춘다.
}

group = 'com.cpf.common'
java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(rootProject.ext.cpfJavaVersion) // 루트 CPF Java 목표와 같은 버전으로 컴파일합니다.
	}
}


dependencyManagement {
	imports {
		mavenBom "org.springframework.boot:spring-boot-dependencies:${rootProject.ext.cpfSpringBootVersion}"
	}
}

dependencies {
    api project(':cpf-core')

    // 공통 메시지 payload 계약의 JSON 직렬화만 유지합니다.
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // DTO 검증 계약만 유지하며 Provider Runtime은 cpf-starter-validation이 소유합니다.
    api 'jakarta.validation:jakarta.validation-api:3.0.2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.hibernate.validator:hibernate-validator:8.0.0.Final'
}

tasks.named('test') {
	useJUnitPlatform() // JUnit 5 기반 테스트를 실행한다.
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = project.group.toString()
            artifactId = 'cpf-common'
            version = project.version.toString()
        }
    }
    repositories {
        maven {
            name = 'cpfInternal'
            def repo = System.getenv('CPF_ARTIFACT_REPOSITORY_URL')
            url = uri(repo ?: layout.buildDirectory.dir('repository'))
            if (repo) {
                credentials {
                    username = System.getenv('CPF_ARTIFACT_REPOSITORY_USER')
                    password = System.getenv('CPF_ARTIFACT_REPOSITORY_PASSWORD')
                }
            }
        }
    }
}
