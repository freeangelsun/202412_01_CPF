plugins {
	id 'maven-publish'
	id 'java-library' // CMN 모듈은 공통 라이브러리로 배포한다.
	id 'io.spring.dependency-management' // Spring Boot BOM 기반으로 의존성 버전을 맞춘다.
}

group = 'com.cpf.common'
java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(rootProject.ext.cpfJavaVersion) // 루트 CPF Java 목표와 같은 버전으로 컴파일합니다.
	}
}


dependencyManagement {
	imports {
		mavenBom "org.springframework.boot:spring-boot-dependencies:${rootProject.ext.cpfSpringBootVersion}"
	}
}

dependencies {
	// CPF 프레임워크 공통 기능을 CMN에서 재사용한다.
	api project(':cpf-core')

	// MyBatis 기반의 SQL 매퍼를 사용한다.
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.0'

	// JPA/Hibernate가 필요한 프로젝트는 아래 의존성을 활성화한다.
	// api 'org.springframework.boot:spring-boot-starter-data-jpa'

	// Cache Provider 구현은 compile boundary이며 실제 Runtime 활성화는 cpf-starter-cache가 소유한다.
	compileOnly 'org.springframework.boot:spring-boot-starter-cache'
	compileOnly 'com.github.ben-manes.caffeine:caffeine:3.1.8'
	// 분산 Cache/Lock/Invalidation Provider는 Spring Data Redis와 Lettuce를 사용한다.
	compileOnly 'org.springframework.boot:spring-boot-starter-data-redis'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-redis'
	testRuntimeOnly 'org.mariadb.jdbc:mariadb-java-client'

	// 대용량 XLSX는 SAX Reader와 SXSSF Writer를 사용하며 5.4.0 미만 취약 버전을 금지한다.
	implementation 'org.apache.poi:poi-ooxml:5.5.1'

	// 공통 메시지 payload를 JSON으로 직렬화한다.
	implementation 'com.fasterxml.jackson.core:jackson-databind'

	// DTO 검증 표준을 제공한다.
	api 'jakarta.validation:jakarta.validation-api:3.0.2'
	implementation 'org.hibernate.validator:hibernate-validator:8.0.0.Final'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
	useJUnitPlatform() // JUnit 5 기반 테스트를 실행한다.
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = project.group.toString()
            artifactId = 'cpf-common'
            version = project.version.toString()
        }
    }
    repositories {
        maven {
            name = 'cpfInternal'
            def repo = System.getenv('CPF_ARTIFACT_REPOSITORY_URL')
            url = uri(repo ?: layout.buildDirectory.dir('repository'))
            if (repo) {
                credentials {
                    username = System.getenv('CPF_ARTIFACT_REPOSITORY_USER')
                    password = System.getenv('CPF_ARTIFACT_REPOSITORY_PASSWORD')
                }
            }
        }
    }
}
