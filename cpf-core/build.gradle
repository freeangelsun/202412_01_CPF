plugins {
	id 'maven-publish'
	id 'java-library'
	id 'io.spring.dependency-management'
}

group = 'com.cpf.core'
java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(rootProject.ext.cpfJavaVersion)
	}
}


dependencyManagement {
	imports {
		mavenBom "org.springframework.boot:spring-boot-dependencies:${rootProject.ext.cpfSpringBootVersion}"
	}
}

dependencies {
	// why_core_required: public CPF contract DTOs use Jakarta validation annotations only; implementation remains outside Core.
	compileOnly 'jakarta.validation:jakarta.validation-api'


	testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
	testImplementation 'org.assertj:assertj-core:3.26.3'
	testImplementation 'org.mockito:mockito-core:5.14.2'
	testImplementation 'org.springframework:spring-test'
	// Candidate Vendor URL/driver contract test only. This does not mark PostgreSQL Runtime as verified.
	testRuntimeOnly 'org.postgresql:postgresql'
}

tasks.named('test') {
	useJUnitPlatform()
	// Unit tests use the same central Vendor Pack contract as product runtime.
	// This does not enable module-local SQL fallback; it only makes the test bootstrap explicit.
	systemProperty 'cpf.db.vendor', 'mariadb'
	systemProperty 'cpf.db.resource-root', rootProject.file('cpf-tools/db/vendor/mariadb').absolutePath
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = project.group.toString()
            artifactId = 'cpf-core'
            version = project.version.toString()
        }
    }
    repositories {
        maven {
            name = 'cpfInternal'
            def repo = System.getenv('CPF_ARTIFACT_REPOSITORY_URL')
            url = uri(repo ?: layout.buildDirectory.dir('repository'))
            if (repo) {
                credentials {
                    username = System.getenv('CPF_ARTIFACT_REPOSITORY_USER')
                    password = System.getenv('CPF_ARTIFACT_REPOSITORY_PASSWORD')
                }
            }
        }
    }
}
