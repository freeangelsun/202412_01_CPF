plugins {
	id 'maven-publish'
	id 'java-library'
	id 'io.spring.dependency-management'
}

group = 'com.cpf.core'
java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(rootProject.ext.cpfJavaVersion)
	}
}


dependencyManagement {
	imports {
		mavenBom "org.springframework.boot:spring-boot-dependencies:${rootProject.ext.cpfSpringBootVersion}"
	}
}

dependencies {
	// 프레임워크 DB 로그 적재와 MyBatis 매퍼 구성을 제공합니다.
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.0'

	// 거래 로깅, 서비스 접근 정책, 컨트롤러 메타데이터 검증에 사용합니다.
	implementation 'org.springframework.boot:spring-boot-starter-aspectj'
	implementation 'org.aspectj:aspectjrt:1.9.20'
	implementation 'org.aspectj:aspectjweaver:1.9.20'

	// 주제영역 간 HTTP 호출과 거래 헤더 전파에 사용합니다.
	compileOnly 'org.springframework.boot:spring-boot-starter-webflux'
	compileOnly 'org.springframework.boot:spring-boot-restclient'

	// Kafka·AMQP Runtime은 cpf-starter-messaging-* Adapter가 소유합니다. Core POM에는 전이시키지 않습니다.

	// CPF 표준 배치 API 컴파일에만 사용합니다. 실제 Batch 런타임은 ADM/REF/BAT 같은 배치 사용 모듈이 명시합니다.
	compileOnly 'org.springframework.batch:spring-batch-core'

	// 프레임워크 필터, 인터셉터, 검증 기능에 필요한 표준 의존성입니다.
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	compileOnly 'jakarta.servlet:jakarta.servlet-api:6.1.0'
	compileOnly 'org.springframework:spring-web'
	compileOnly 'org.springframework:spring-webmvc'

	// OTel API는 compile boundary로만 사용하며 SDK/Exporter Runtime은 observability Starter가 소유합니다.
	compileOnly platform('io.opentelemetry:opentelemetry-bom:1.64.0')
	compileOnly 'io.opentelemetry:opentelemetry-api'
	compileOnly 'io.opentelemetry:opentelemetry-sdk'
	compileOnly 'io.opentelemetry:opentelemetry-exporter-otlp'
	implementation 'org.apache.commons:commons-compress:1.28.0'

	// OpenAPI 3 문서, Swagger UI, Scalar API Reference를 제공합니다.
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-scalar:3.0.3'

	testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
	testImplementation 'org.assertj:assertj-core:3.26.3'
	testImplementation 'org.mockito:mockito-core:5.14.2'
	testImplementation 'org.springframework:spring-test'
	testImplementation 'jakarta.servlet:jakarta.servlet-api:6.1.0'
	testImplementation 'org.springframework.batch:spring-batch-core'
	// Candidate Vendor URL/driver contract test only. This does not mark PostgreSQL Runtime as verified.
	testRuntimeOnly 'org.postgresql:postgresql'
}

tasks.named('test') {
	useJUnitPlatform()
	// Unit tests use the same central Vendor Pack contract as product runtime.
	// This does not enable module-local SQL fallback; it only makes the test bootstrap explicit.
	systemProperty 'cpf.db.vendor', 'mariadb'
	systemProperty 'cpf.db.resource-root', rootProject.file('cpf-tools/db/vendor/mariadb').absolutePath
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = project.group.toString()
            artifactId = 'cpf-core'
            version = project.version.toString()
        }
    }
    repositories {
        maven {
            name = 'cpfInternal'
            def repo = System.getenv('CPF_ARTIFACT_REPOSITORY_URL')
            url = uri(repo ?: layout.buildDirectory.dir('repository'))
            if (repo) {
                credentials {
                    username = System.getenv('CPF_ARTIFACT_REPOSITORY_USER')
                    password = System.getenv('CPF_ARTIFACT_REPOSITORY_PASSWORD')
                }
            }
        }
    }
}
