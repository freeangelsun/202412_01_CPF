<rect x="0" y="0" width="1440" height="800" rx="0" fill="#F5F8FC" stroke="none" stroke-width="0"/><text x="70" y="62" class="title" text-anchor="start">Batch Runtime Architecture</text><text x="70" y="94" class="subtitle" text-anchor="start">Control Plane과 Execution Plane을 분리하고 Multi-instance 실행 소유권을 추적합니다.</text><path d="M70 118 L1370 118" fill="none" stroke="#C9D7EA" stroke-width="1"/><rect x="80" y="155" width="300" height="110" rx="16" fill="#FFFFFF" stroke="#14B8A6" stroke-width="1.6"/><circle cx="104" cy="182" r="9" fill="#14B8A6" opacity=".18"/><circle cx="104" cy="182" r="4.5" fill="#14B8A6"/><text x="122" y="186" class="module" text-anchor="start">Business Domain</text><text x="98" y="213" class="small" text-anchor="start">JobPack · Job / Task Contract</text><rect x="292" y="165" width="72" height="32" rx="16" fill="#fff" stroke="#14B8A6" stroke-width="1"/><text x="328.0" y="186" class="small" text-anchor="middle" style="fill:#14B8A6">OWNER</text><rect x="1060" y="155" width="300" height="110" rx="16" fill="#FFFFFF" stroke="#F43F5E" stroke-width="1.6"/><circle cx="1084" cy="182" r="9" fill="#F43F5E" opacity=".18"/><circle cx="1084" cy="182" r="4.5" fill="#F43F5E"/><text x="1102" y="186" class="module" text-anchor="start">cpf-admin</text><text x="1078" y="213" class="small" text-anchor="start">Query · Command · Approval · Audit</text><rect x="1272" y="165" width="72" height="32" rx="16" fill="#fff" stroke="#F43F5E" stroke-width="1"/><text x="1308.0" y="186" class="small" text-anchor="middle" style="fill:#F43F5E">ADM</text><rect x="80" y="310" width="1280" height="155" rx="24" fill="#FFFFFF" stroke="#88B69A" stroke-width="1.5" filter="url(#shadow)"/><text x="110" y="348" class="section" text-anchor="start" style="fill:#15803D">CONTROL PLANE</text><rect x="110" y="370" width="280" height="68" rx="14" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.2"/><text x="126" y="397" class="label" text-anchor="start">Control Server</text><text x="126" y="422" class="tiny" text-anchor="start">Runtime Command / Query</text><rect x="410" y="370" width="280" height="68" rx="14" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.2"/><text x="426" y="397" class="label" text-anchor="start">Scheduler</text><text x="426" y="422" class="tiny" text-anchor="start">Trigger · Calendar · Lease</text><rect x="710" y="370" width="280" height="68" rx="14" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.2"/><text x="726" y="397" class="label" text-anchor="start">Registry</text><text x="726" y="422" class="tiny" text-anchor="start">JobPack · Instance · State</text><rect x="1010" y="370" width="280" height="68" rx="14" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.2"/><text x="1026" y="397" class="label" text-anchor="start">Reconciliation</text><text x="1026" y="422" class="tiny" text-anchor="start">Unknown / Lost Execution</text><rect x="80" y="505" width="1280" height="180" rx="24" fill="#FFFFFF" stroke="#9CB8E4" stroke-width="1.5" filter="url(#shadow)"/><text x="110" y="543" class="section" text-anchor="start" style="fill:#2563EB">EXECUTION PLANE</text><rect x="110" y="565" width="380" height="82" rx="14" fill="#F8FAFC" stroke="#2563EB" stroke-width="1.2"/><text x="126" y="597" class="label" text-anchor="start" style="fill:#2563EB">Worker</text><text x="126" y="624" class="small" text-anchor="start">Spring Batch · Chunk / Tasklet</text><rect x="510" y="565" width="380" height="82" rx="14" fill="#F8FAFC" stroke="#F59E0B" stroke-width="1.2"/><text x="526" y="597" class="label" text-anchor="start" style="fill:#F59E0B">Center-Cut Runner</text><text x="526" y="624" class="small" text-anchor="start">Partition · Claim · Fencing</text><rect x="910" y="565" width="380" height="82" rx="14" fill="#F8FAFC" stroke="#0EA5E9" stroke-width="1.2"/><text x="926" y="597" class="label" text-anchor="start" style="fill:#0EA5E9">Host Agent</text><text x="926" y="624" class="small" text-anchor="start">Remote Process · Artifact</text><text x="110" y="680" class="section" text-anchor="start" style="fill:#7C3AED">Verification Support</text><text x="300" y="680" class="small" text-anchor="start">cpf-batch:testkit · Public Contract · Scenario Fixture</text><path d="M230 265 C230 290 230 300 230 310" fill="none" stroke="#14B8A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1210 265 C1210 290 1210 300 1210 310" fill="none" stroke="#F43F5E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#arrow)"/><path d="M720 465 L720 505" fill="none" stroke="#22C55E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="80" y="740" class="section" text-anchor="start" style="fill:#2563EB">Execution safety</text><rect x="230" y="721" width="175" height="32" rx="16" fill="#FFFFFF" stroke="#C9D7EA" stroke-width="1"/><text x="317.5" y="742" class="small" text-anchor="middle" style="fill:#10243E">Checkpoint</text><rect x="420" y="721" width="175" height="32" rx="16" fill="#FFFFFF" stroke="#C9D7EA" stroke-width="1"/><text x="507.5" y="742" class="small" text-anchor="middle" style="fill:#10243E">Lease / Claim</text><rect x="610" y="721" width="175" height="32" rx="16" fill="#FFFFFF" stroke="#C9D7EA" stroke-width="1"/><text x="697.5" y="742" class="small" text-anchor="middle" style="fill:#10243E">Fencing Token</text><rect x="800" y="721" width="175" height="32" rx="16" fill="#FFFFFF" stroke="#C9D7EA" stroke-width="1"/><text x="887.5" y="742" class="small" text-anchor="middle" style="fill:#10243E">Restartability</text><rect x="990" y="721" width="175" height="32" rx="16" fill="#FFFFFF" stroke="#C9D7EA" stroke-width="1"/><text x="1077.5" y="742" class="small" text-anchor="middle" style="fill:#10243E">Idempotency</text><rect x="1180" y="721" width="180" height="32" rx="16" fill="#FFFFFF" stroke="#C9D7EA" stroke-width="1"/><text x="1270.0" y="742" class="small" text-anchor="middle" style="fill:#10243E">Audit Trail</t