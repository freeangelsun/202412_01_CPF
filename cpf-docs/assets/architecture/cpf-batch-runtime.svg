<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title>BAT Runtime 구조 그림</title>
<desc>Batch Control Server, Scheduler, Worker Pool, Center-Cut Runner Pool, Host Agent, 상태 저장소와 ADM 관제를 포함한 BAT의 목표 구조를 보여주고 현재 기준선을 함께 설명합니다.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
  </marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.12"/>
  </filter>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="20" y="20" width="1160" height="760" rx="22" ry="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="600" y="60" text-anchor="middle" font-family="NanumSquare, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="32" font-weight="700" fill="#0f172a">BAT Runtime 구조</text>
<text x="600" y="92" text-anchor="middle" font-family="NanumSquare, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="18" font-weight="600" fill="#475569">목표 구조</text>
<rect x="460" y="140" width="280" height="86" rx="18" ry="18" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="600" y="180" text-anchor="middle" font-family="NanumSquare, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="24" font-weight="600" fill="#0f172a">Batch Control Server</text>
<text x="600" y="206" text-anchor="middle" font-family="NanumSquare, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="15" font-weight="400" fill="#0f172a">등록 · 조회 · 실행 제어</text>
<rect x="120" y="290" width="220" height="88" rx="18" ry="18" fill="#fef3c7" stroke="#334155" stroke-width="2"/>
<text x="230" y="330" text-anchor="middle" font-family="NanumSquare, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="24" font-weight="600" fill="#0f172a">Scheduler</text>
<text x="230" y="356" text-anchor="middle" font-family="NanumSquare, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="15" font-weight="400" fill="#0f172a">Active / Standby</text>
<rect x="390" y="290" width="220" height="88" rx="18" ry="18" fill="#dcfce7" stroke="#334155" stroke-width="2"/>
<text x="500" y="330" text-anchor="middle" font-family="NanumSquare, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="24" font-weight="600" fill="#0f172a">Worker Pool</text>
<text x="500" y="356" text-anchor="middle" font-family="NanumSquare, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="15" font-weight="400" fill="#0f172a">복수 Job 실행</text>
<rect x="660" y="290" width="220" height="88" rx="18" ry="18" fill="#ecfccb" stroke="#334155" stroke-width="2"/>
<text x="770" y="330" text-anchor="middle" font-family="NanumSquare, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="19" font-weight="600" fill="#0f172a">Center-Cut Runner Pool</text>
<text x="770" y="356" text-anchor="middle" font-family="NanumSquare, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="15" font-weight="400" fill="#0f172a">Lease · Partition · Retry</text>
<rect x="930" y="290" width="140" height="88" rx="18" ry="18" fill="#fef3c7" stroke="#334155" stroke-width="2"/>
<text x="1000" y="326" text-anchor="middle" font-family="NanumSquare, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="22" font-weight="600" fill="#0f172a">Host Agent</text>
<text x="1000" y="352" text-anchor="middle" font-family="NanumSquare, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="15" font-weight="400" fill="#0f172a">선택</text>
<rect x="170" y="470" width="190" height="88" rx="18" ry="18" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="265" y="508" text-anchor="middle" font-family="NanumSquare, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="20" font-weight="600" fill="#0f172a">Job Queue / Outbox</text>
<text x="265" y="534" text-anchor="middle" font-family="NanumSquare, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="14" font-weight="400" fill="#0f172a">실행 대기와 상태</text>
<rect x="410" y="470" width="190" height="88" rx="18" ry="18" fill="#fae8ff" stroke="#334155" stroke-width="2"/>
<text x="505" y="508" text-anchor="middle" font-family="NanumSquare, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="20" font-weight="600" fill="#0f172a">Checkpoint / Result</text>
<text x="505" y="534" text-anchor="middle" font-family="NanumSquare, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="14" font-weight="400" fill="#0f172a">중간 상태와 결과</text>
<rect x="650" y="470" width="190" height="88" rx="18" ry="18" fill="#fee2e2" stroke="#334155" stroke-width="2"/>
<text x="745" y="508" text-anchor="middle" font-family="NanumSquare, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="22" font-weight="600" fill="#0f172a">DLQ / Retry</text>
<text x="745" y="534" text-anchor="middle" font-family="NanumSquare, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="14" font-weight="400" fill="#0f172a">실패 재처리</text>
<rect x="890" y="470" width="190" height="88" rx="18" ry="18" fill="#e0f2fe" stroke="#334155" stroke-width="2"/>
<text x="985" y="508" text-anchor="middle" font-family="NanumSquare, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="22" font-weight="600" fill="#0f172a">ADM / Audit</text>
<text x="985" y="534" text-anchor="middle" font-family="NanumSquare, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="14" font-weight="400" fill="#0f172a">조회와 운영 명령</text>
<line x1="600" y1="226" x2="230" y2="290" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="600" y1="226" x2="500" y2="290" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="600" y1="226" x2="770" y2="290" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="600" y1="226" x2="1000" y2="290" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="230" y1="378" x2="265" y2="470" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="500" y1="378" x2="505" y2="470" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="770" y1="378" x2="745" y2="470" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="1000" y1="378" x2="985" y2="470" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="500,378 500,430 745,430 745,470" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="770,378 770,430 505,430 505,470" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="120" y="610" width="960" height="100" rx="20" ry="20" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
<text x="600" y="648" text-anchor="middle" font-family="NanumSquare, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#9a3412">현재 기준선</text>
<text x="600" y="680" text-anchor="middle" font-family="NanumSquare, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="16" font-weight="500" fill="#0f172a">현재 Repository는 단일 cpf-batch 애플리케이션 기준으로 구성되어 있으며, 역할별 독립 Artifact는 목표 구조에서 분리합니다.</text>
</svg>