<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
<title>CPF 기능 범위 지도</title>
<desc>온라인 실행, 비동기와 메시징, 배치와 대량 처리, 운영과 감사, 보안과 권한, DB와 배포, 확장과 검증 영역을 한 화면에 보여줍니다.</desc>
<defs>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter>
</defs>
