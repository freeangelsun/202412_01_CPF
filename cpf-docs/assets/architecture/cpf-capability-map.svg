<text x="700" y="125" text-anchor="middle" font-family="NanumSquare, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="18" fill="#475569">개발 · 실행 · 운영 · 복구 · 확장을 연결하는 주요 영역</text>

