<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780" role="img" aria-labelledby="title desc">
<title>업무 Domain 확장 구조 그림</title><desc>DomainName과 SystemCode 입력에서 충돌 검증, 표준 생성, Public API SPI 기반 개발 연결, 검증, 배포와 운영 구조 편입으로 이어지는 흐름입니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/><rect x="20" y="20" width="1460" height="740" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="750" y="68" text-anchor="middle" font-family="NanumSquare, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="34" font-weight="700" fill="#0f172a">업무 Domain 확장 구조</text><rect x="55" y="200" width="180" height="210" rx="18" fill="#dbeafe" stroke="#334155" stroke-width="2"/><text x="145.0" y="250" text-anchor="middle" font-family="NanumSquare, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#0f172a">도메인 입력</text><text x="145.0" y="295" text-anchor="middle" font-family="NanumSquare, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="14" font-weight="400" fill="#0f172a">DomainName</text><text x="145.0" y="325" text-anchor="middle" font-family="NanumSquare, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="14" font-weight="400" fill="#0f172a">SystemCode</text><line x1="235" y1="305" x2="295" y2="305" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><rect x="295" y="200" width="180" height="210" rx="18" fill="#e0f2fe" stroke="#334155" stroke-width="2"/><text x="385.0" y="250" text-anchor="middle" font-family="NanumSquare, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#0f172a">사전 검증</text><text x="385.0" y="295" text-anchor="middle" font-family="NanumSquare, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="14" font-weight="400" fill="#0f172a">Module · Package</text><text x="385.0" y="325" text-anchor="middle" font-family="NanumSquare, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="14" font-weight="400" fill="#0f172a">Config · Port</text><text x="385.0" y="355" text-anchor="middle" font-family="NanumSquare, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="14" font-weight="400" fill="#0f172a">DB · Route 충돌</text><line x1="475" y1="305" x2="535" y2="305" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><rect x="535" y="200" width="180" height="210" rx="18" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><text x="625.0" y="250" text-anchor="middle" font-family="NanumSquare, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#0f172a">표준 생성</text><text x="625.0" y="295" text-anchor="middle" font-family="NanumSquare, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="14" font-weight="400" fill="#0f172a">Module · API</text><text x="625.0" y="325" text-anchor="middle" font-family="NanumSquare, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="14" font-weight="400" fill="#0f172a">DB · Test 골격</text><line x1="715" y1="305" x2="775" y2="305" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><rect x="775" y="200" width="180" height="210" rx="18" fill="#ede9fe" stroke="#334155" stroke-width="2"/><text x="865.0" y="250" text-anchor="middle" font-family="NanumSquare, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#0f172a">개발 연결</text><text x="865.0" y="295" text-anchor="middle" font-family="NanumSquare, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="14" font-weight="400" fill="#0f172a">Public API · SPI</text><text x="865.0" y="325" text-anchor="middle" font-family="NanumSquare, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="14" font-weight="400" fill="#0f172a">업무 구현 연결</text><line x1="955" y1="305" x2="1015" y2="305" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><rect x="1015" y="200" width="180" height="210" rx="18" fill="#dcfce7" stroke="#334155" stroke-width="2"/><text x="1105.0" y="250" text-anchor="middle" font-family="NanumSquare, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#0f172a">검증</text><text x="1105.0" y="295" text-anchor="middle" font-family="NanumSquare, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="14" font-weight="400" fill="#0f172a">Build · Runtime</text><text x="1105.0" y="325" text-anchor="middle" font-family="NanumSquare, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="14" font-weight="400" fill="#0f172a">DB Artifact 확인</text><line x1="1195" y1="305" x2="1255" y2="305" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><rect x="1255" y="200" width="180" height="210" rx="18" fill="#fde68a" stroke="#334155" stroke-width="2"/><text x="1345.0" y="250" text-anchor="middle" font-family="NanumSquare, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#0f172a">편입</text><text x="1345.0" y="295" text-anchor="middle" font-family="NanumSquare, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="14" font-weight="400" fill="#0f172a">배포 구조</text><text x="1345.0" y="325" text-anchor="middle" font-family="NanumSquare, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="14" font-weight="400" fill="#0f172a">운영 구조 편입</text><rect x="145" y="500" width="1190" height="150" rx="22" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="740" y="545" text-anchor="middle" font-family="NanumSquare, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="25" font-weight="700" fill="#9a3412">생성 원칙</text><text x="740" y="585" text-anchor="middle" font-family="NanumSquare, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="15" font-weight="500" fill="#0f172a">Generated Domain은 com.cpf.core.api.*와 com.cpf.core.spi.*를 개발자 계약으로 사용합니다.</text><text x="740" y="615" text-anchor="middle" font-family="NanumSquare, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="15" font-weight="500" fill="#0f172a">com.cpf.core.common.*은 Runtime 내부 구현이며 Generated Domain의 직접 import 대상으로 사용하지 않습니다.</text></svg>