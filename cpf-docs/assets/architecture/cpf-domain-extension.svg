<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="680" viewBox="0 0 1440 680" role="img" aria-labelledby="title desc">
<title id="title">CPF Domain Extension</title><desc id="desc">Generator 기반 신규 업무 Domain 생성과 검증 흐름</desc>
<defs>
  <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06142D"/><stop offset="0.55" stop-color="#0B2A55"/><stop offset="1" stop-color="#123D72"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38BDF8"/><stop offset="0.5" stop-color="#2563EB"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
  <linearGradient id="soft" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EFF6FF"/><stop offset="1" stop-color="#F5F3FF"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F2746" flood-opacity="0.12"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker>
  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563EB"/></marker>
</defs>
<style>
 text{font-family:'NanumSquare','Noto Sans CJK KR','Noto Sans KR','Malgun Gothic','Segoe UI',Arial,sans-serif; fill:#10243E;}
 .title{font-size:40px;font-weight:800;letter-spacing:-1px}
 .heroTitle{font-size:38px;font-weight:800;letter-spacing:-1px}
 .subtitle{font-size:20px;font-weight:500;fill:#5B6B82}
 .section{font-size:18px;font-weight:800;letter-spacing:.4px}
 .label{font-size:17px;font-weight:700}
 .module{font-size:15px;font-weight:800}
 .small{font-size:14px;font-weight:500;fill:#5B6B82}
 .tiny{font-size:12px;font-weight:500;fill:#5B6B82}
 .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace;font-size:13px}
 .box{fill:#fff;stroke:#C9D7EA;stroke-width:1.5}
 .dash{stroke-dasharray:8 7}
</style>
<rect x="0" y="0" width="1440" height="680" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="70" y="62" class="title" text-anchor="start">Generator-driven Domain Extension</text><text x="70" y="94" class="subtitle" text-anchor="start">하나의 Golden Template로 Domain, DB, Test와 Delivery Artifact를 함께 확장합니다.</text><path d="M70 118 L1370 118" fill="none" stroke="#C9D7EA" stroke-width="1"/><circle cx="100" cy="220" r="54" fill="#2563EB" opacity=".12" stroke="#2563EB" stroke-width="2"/><circle cx="100" cy="220" r="22" fill="#2563EB"/><text x="100" y="305" class="label" text-anchor="middle">Domain Definition</text><text x="100" y="331" class="small" text-anchor="middle">DomainName · SystemCode</text><path d="M156 220 L314 220" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/><circle cx="370" cy="220" r="54" fill="#06B6D4" opacity=".12" stroke="#06B6D4" stroke-width="2"/><circle cx="370" cy="220" r="22" fill="#06B6D4"/><text x="370" y="305" class="label" text-anchor="middle">Preflight Validation</text><text x="370" y="331" class="small" text-anchor="middle">Module · Package · Route · DB</text><path d="M426 220 L594 220" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/><circle cx="650" cy="220" r="54" fill="#7C3AED" opacity=".12" stroke="#7C3AED" stroke-width="2"/><circle cx="650" cy="220" r="22" fill="#7C3AED"/><text x="650" y="305" class="label" text-anchor="middle">Golden Template</text><text x="650" y="331" class="small" text-anchor="middle">API · Application · Domain · Adapter</text><path d="M706 220 L874 220" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/><circle cx="930" cy="220" r="54" fill="#14B8A6" opacity=".12" stroke="#14B8A6" stroke-width="2"/><circle cx="930" cy="220" r="22" fill="#14B8A6"/><text x="930" y="305" class="label" text-anchor="middle">Generated Repository</text><text x="930" y="331" class="small" text-anchor="middle">Config · SQL · Test · Guide</text><path d="M986 220 L1154 220" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/><circle cx="1210" cy="220" r="54" fill="#F59E0B" opacity=".12" stroke="#F59E0B" stroke-width="2"/><circle cx="1210" cy="220" r="22" fill="#F59E0B"/><text x="1210" y="305" class="label" text-anchor="middle">Parity Gates</text><text x="1210" y="331" class="small" text-anchor="middle">Build · Vendor · Runtime · Evidence</text><rect x="110" y="385" width="1220" height="190" rx="24" fill="url(#soft)" stroke="#A5B4FC" stroke-width="1.5" filter="url(#shadow)"/><text x="145" y="425" class="section" text-anchor="start" style="fill:#8B5CF6">GENERATED DOMAIN OUTPUT</text><rect x="145" y="455" width="220" height="86" rx="16" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/><text x="161" y="485" class="label" text-anchor="start" style="fill:#2563EB">Source</text><text x="161" y="515" class="tiny" text-anchor="start">API · App · Domain · Adapter</text><rect x="380" y="455" width="220" height="86" rx="16" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.2"/><text x="396" y="485" class="label" text-anchor="start" style="fill:#F59E0B">Database</text><text x="396" y="515" class="tiny" text-anchor="start">Oracle · PostgreSQL · MariaDB</text><rect x="615" y="455" width="220" height="86" rx="16" fill="#FFFFFF" stroke="#22C55E" stroke-width="1.2"/><text x="631" y="485" class="label" text-anchor="start" style="fill:#22C55E">Runtime</text><text x="631" y="515" class="tiny" text-anchor="start">BootJar · WAR · Local / Remote</text><rect x="850" y="455" width="220" height="86" rx="16" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.2"/><text x="866" y="485" class="label" text-anchor="start" style="fill:#7C3AED">Quality</text><text x="866" y="515" class="tiny" text-anchor="start">Unit · Integration · OpenAPI</text><rect x="1085" y="455" width="220" height="86" rx="16" fill="#FFFFFF" stroke="#14B8A6" stroke-width="1.2"/><text x="1101" y="485" class="label" text-anchor="start" style="fill:#14B8A6">Delivery</text><text x="1101" y="515" class="tiny" text-anchor="start">Migration · Upgrade · Rollback</text><text x="145" y="610" class="subtitle" text-anchor="start">Generator 관리 영역과 사용자 수정 영역을 분리하며, 재생성 시 사용자 코드를 임의로 덮어쓰지 않습니다.</text></svg>