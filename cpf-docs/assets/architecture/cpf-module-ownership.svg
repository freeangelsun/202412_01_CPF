<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840" role="img" aria-labelledby="title desc">
<title>Module 책임과 의존성 그림</title><desc>업무 Domain에서 cpf-common과 cpf-core로 이어지는 의존 방향과 cpf-gateway, cpf-batch, cpf-admin, cpf-biz-admin의 사용 경계를 보여주며 금지 관계를 함께 표시합니다.</desc>
