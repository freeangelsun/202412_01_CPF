<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
<title id="title">CPF Module Ownership</title><desc id="desc">CPF 모듈 책임과 경계를 보여주는 구조도</desc>
<defs>
  <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06142D"/><stop offset="0.55" stop-color="#0B2A55"/><stop offset="1" stop-color="#123D72"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38BDF8"/><stop offset="0.5" stop-color="#2563EB"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
  <linearGradient id="soft" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EFF6FF"/><stop offset="1" stop-color="#F5F3FF"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F2746" flood-opacity="0.12"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker>
  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563EB"/></marker>
</defs>
<style>
 text{font-family:'NanumSquare','Noto Sans CJK KR','Noto Sans KR','Malgun Gothic','Segoe UI',Arial,sans-serif; fill:#10243E;}
 .title{font-size:40px;font-weight:800;letter-spacing:-1px}
 .heroTitle{font-size:38px;font-weight:800;letter-spacing:-1px}
 .subtitle{font-size:20px;font-weight:500;fill:#5B6B82}
 .section{font-size:18px;font-weight:800;letter-spacing:.4px}
 .label{font-size:17px;font-weight:700}
 .module{font-size:15px;font-weight:800}
 .small{font-size:14px;font-weight:500;fill:#5B6B82}
 .tiny{font-size:12px;font-weight:500;fill:#5B6B82}
 .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace;font-size:13px}
 .box{fill:#fff;stroke:#C9D7EA;stroke-width:1.5}
 .dash{stroke-dasharray:8 7}
</style>
<rect x="0" y="0" width="1440" height="760" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="70" y="62" class="title" text-anchor="start">Module Ownership</text><text x="70" y="94" class="subtitle" text-anchor="start">Owner, Public Contract, Runtime Adapter와 Tooling의 책임을 분리합니다.</text><path d="M70 118 L1370 118" fill="none" stroke="#C9D7EA" stroke-width="1"/><rect x="70" y="160" width="300" height="500" rx="22" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.5"/><text x="94" y="196" class="section" text-anchor="start" style="fill:#8B5CF6">FRAMEWORK FOUNDATION</text><rect x="390" y="160" width="500" height="500" rx="22" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/><text x="414" y="196" class="section" text-anchor="start" style="fill:#2563EB">APPLICATION / DOMAIN</text><rect x="910" y="160" width="220" height="500" rx="22" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.5"/><text x="934" y="196" class="section" text-anchor="start" style="fill:#22C55E">OPTIONAL RUNTIME</text><rect x="1150" y="160" width="220" height="500" rx="22" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/><text x="1174" y="196" class="section" text-anchor="start" style="fill:#F59E0B">TOOLING &amp; DELIVERY</text><rect x="95" y="220" width="250" height="115" rx="16" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.6"/><circle cx="119" cy="247" r="9" fill="#8B5CF6" opacity=".18"/><circle cx="119" cy="247" r="4.5" fill="#8B5CF6"/><text x="137" y="251" class="module" text-anchor="start">cpf-core</text><text x="113" y="278" class="small" text-anchor="start">Public API · SPI · Runtime Base</text><rect x="257" y="230" width="72" height="32" rx="16" fill="#fff" stroke="#8B5CF6" stroke-width="1"/><text x="293.0" y="251" class="small" text-anchor="middle" style="fill:#8B5CF6">CORE</text><rect x="95" y="360" width="250" height="115" rx="16" fill="#FFFFFF" stroke="#06B6D4" stroke-width="1.6"/><circle cx="119" cy="387" r="9" fill="#06B6D4" opacity=".18"/><circle cx="119" cy="387" r="4.5" fill="#06B6D4"/><text x="137" y="391" class="module" text-anchor="start">cpf-common</text><text x="113" y="418" class="small" text-anchor="start">Reusable Business Common</text><rect x="257" y="370" width="72" height="32" rx="16" fill="#fff" stroke="#06B6D4" stroke-width="1"/><text x="293.0" y="391" class="small" text-anchor="middle" style="fill:#06B6D4">REUSE</text><text x="95" y="520" class="small" text-anchor="start"><tspan x="95" dy="0">기술 기반은 core가 소유합니다.</tspan><tspan x="95" dy="24">common은 필요한 Application이</tspan><tspan x="95" dy="24">명시적으로 선택해 사용합니다.</tspan></text><rect x="415" y="220" width="210" height="120" rx="16" fill="#FFFFFF" stroke="#F43F5E" stroke-width="1.6"/><circle cx="439" cy="247" r="9" fill="#F43F5E" opacity=".18"/><circle cx="439" cy="247" r="4.5" fill="#F43F5E"/><text x="457" y="251" class="module" text-anchor="start">cpf-admin</text><text x="433" y="278" class="small" text-anchor="start">Operations Domain</text><rect x="537" y="230" width="72" height="32" rx="16" fill="#fff" stroke="#F43F5E" stroke-width="1"/><text x="573.0" y="251" class="small" text-anchor="middle" style="fill:#F43F5E">ADM</text><rect x="645" y="220" width="220" height="120" rx="16" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.6"/><circle cx="669" cy="247" r="9" fill="#7C3AED" opacity=".18"/><circle cx="669" cy="247" r="4.5" fill="#7C3AED"/><text x="687" y="251" class="module" text-anchor="start">cpf-biz-admin</text><text x="663" y="278" class="small" text-anchor="start">Business Admin Domain</text><rect x="777" y="230" width="72" height="32" rx="16" fill="#fff" stroke="#7C3AED" stroke-width="1"/><text x="813.0" y="251" class="small" text-anchor="middle" style="fill:#7C3AED">BZA</text><rect x="415" y="365" width="450" height="145" rx="16" fill="#FFFFFF" stroke="#14B8A6" stroke-width="1.6"/><circle cx="439" cy="392" r="9" fill="#14B8A6" opacity=".18"/><circle cx="439" cy="392" r="4.5" fill="#14B8A6"/><text x="457" y="396" class="module" text-anchor="start">Generated Domains</text><text x="433" y="423" class="small" text-anchor="start">Reference · Customer Domains</text><rect x="777" y="375" width="72" height="32" rx="16" fill="#fff" stroke="#14B8A6" stroke-width="1"/><text x="813.0" y="396" class="small" text-anchor="middle" style="fill:#14B8A6">GEN</text><text x="435" y="535" class="small" text-anchor="start"><tspan x="435" dy="0">• 각 Domain은 API / Application / Domain / Adapter / DB Owner를 가집니다.</tspan><tspan x="435" dy="25">• ADM과 BZA도 CPF를 사용하는 독립 Application으로 같은 Plane에 위치합니다.</tspan><tspan x="435" dy="25">• 다른 Owner의 Internal Package와 DB를 직접 우회하지 않습니다.</tspan></text><rect x="935" y="220" width="170" height="110" rx="16" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.6"/><circle cx="959" cy="247" r="9" fill="#0EA5E9" opacity=".18"/><circle cx="959" cy="247" r="4.5" fill="#0EA5E9"/><text x="977" y="251" class="module" text-anchor="start">cpf-gateway</text><text x="953" y="278" class="small" text-anchor="start">Optional Edge</text><text x="1091" y="318" class="tiny" text-anchor="end" style="fill:#0EA5E9">EDGE</text><rect x="935" y="355" width="170" height="165" rx="16" fill="#FFFFFF" stroke="#22C55E" stroke-width="1.6"/><circle cx="959" cy="382" r="9" fill="#22C55E" opacity=".18"/><circle cx="959" cy="382" r="4.5" fill="#22C55E"/><text x="977" y="386" class="module" text-anchor="start">cpf-batch</text><text x="953" y="413" class="small" text-anchor="start">Control · Scheduler</text><text x="1091" y="508" class="tiny" text-anchor="end" style="fill:#22C55E">BAT</text><text x="955" y="447" class="small" text-anchor="start"><tspan x="955" dy="0">Worker</tspan><tspan x="955" dy="22">Center-Cut</tspan><tspan x="955" dy="22">Host Agent</tspan></text><text x="935" y="555" class="small" text-anchor="start"><tspan x="935" dy="0">업무 요구에 따라</tspan><tspan x="935" dy="24">독립적으로 조합합니다.</tspan></text><rect x="1175" y="220" width="170" height="110" rx="16" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.6"/><circle cx="1199" cy="247" r="9" fill="#F59E0B" opacity=".18"/><circle cx="1199" cy="247" r="4.5" fill="#F59E0B"/><text x="1217" y="251" class="module" text-anchor="start">Generator</text><text x="1193" y="278" class="small" text-anchor="start">Golden Template</text><rect x="1175" y="355" width="170" height="110" rx="16" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.6"/><circle cx="1199" cy="382" r="9" fill="#F59E0B" opacity=".18"/><circle cx="1199" cy="382" r="4.5" fill="#F59E0B"/><text x="1217" y="386" class="module" text-anchor="start">DB Tooling</text><text x="1193" y="413" class="small" text-anchor="start">Vendor Packs</text><rect x="1175" y="490" width="170" height="110" rx="16" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.6"/><circle cx="1199" cy="517" r="9" fill="#F59E0B" opacity=".18"/><circle cx="1199" cy="517" r="4.5" fill="#F59E0B"/><text x="1217" y="521" class="module" text-anchor="start">Quality Gates</text><text x="1193" y="548" class="small" text-anchor="start">Evidence</text><text x="70" y="712" class="subtitle" text-anchor="start">Boundary rule: Public Contract로 연결하고, Internal 구현과 Owner DB의 직접 참조를 금지합니다.</text></svg>