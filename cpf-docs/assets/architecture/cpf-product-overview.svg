</style>
<rect x="0" y="0" width="1440" height="790" rx="0" fill="#F5F8FC" stroke="none" stroke-width="0"/><text x="70" y="62" class="title" text-anchor="start">Product Architecture</text><text x="70" y="94" class="subtitle" text-anchor="start">Application·Domain, Framework Foundation, Optional Runtime을 명확히 분리합니다.</text><path d="M70 118 L1370 118" fill="none" stroke="#C9D7EA" stroke-width="1"/><rect x="70" y="145" width="1300" height="70" rx="20" fill="#FFFFFF" stroke="#C9D7EA" stroke-width="1.4"/><text x="100" y="176" class="section" text-anchor="start" style="fill:#2563EB">CLIENT / CHANNEL</text><text x="100" y="201" class="small" text-anchor="start">Web · Mobile · Internal Client · Channel · Partner</text><rect x="1070" y="164" width="265" height="32" rx="16" fill="#F8FAFC" stroke="#C9D7EA" stroke-width="1"/><text x="1202.5" y="185" class="small" text-anchor="middle" style="fill:#10243E">Direct 또는 Optional Gateway</text><rect x="70" y="250" width="210" height="235" rx="22" fill="#ECFEFF" stroke="#0EA5E9" stroke-width="1.6" stroke-dasharray="8 7"/><text x="100" y="286" class="section" text-anchor="start" style="fill:#0EA5E9">OPTIONAL EDGE</text><text x="100" y="326" class="label" text-anchor="start">cpf-gateway</text><text x="100" y="358" class="small" text-anchor="start"><tspan x="100" dy="0">Routing / Header</tspan><tspan x="100" dy="25">Authentication Bridge</tspan><tspan x="100" dy="25">Rate / Failure Isolation</tspan></text><rect x="100" y="432" width="148" height="32" rx="16" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1"/><text x="174.0" y="453" class="small" text-anchor="middle" style="fill:#0EA5E9">선택 적용</text><rect x="310" y="250" width="820" height="235" rx="22" fill="#FFFFFF" stroke="#9BB9E3" stroke-width="1.6" filter="url(#shadow)"/><text x="340" y="286" class="section" text-anchor="start" style="fill:#2563EB">APPLICATION / DOMAIN PLANE</text><rect x="340" y="316" width="220" height="125" rx="16" fill="#FFF1F2" stroke="#F43F5E" stroke-width="1.6"/><circle cx="364" cy="343" r="9" fill="#F43F5E" opacity=".18"/><circle cx="364" cy="343" r="4.5" fill="#F43F5E"/><text x="382" y="347" class="module" text-anchor="start">cpf-admin</text><text x="358" y="374" class="small" text-anchor="start">Operations · Control · Audit</text><rect x="472" y="326" width="72" height="32" rx="16" fill="#fff" stroke="#F43F5E" stroke-width="1"/><text x="508.0" y="347" class="small" text-anchor="middle" style="fill:#F43F5E">ADM</text><rect x="575" y="316" width="220" height="125" rx="16" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/><circle cx="599" cy="343" r="9" fill="#7C3AED" opacity=".18"/><circle cx="599" cy="343" r="4.5" fill="#7C3AED"/><text x="617" y="347" class="module" text-anchor="start">cpf-biz-admin</text><text x="593" y="374" class="small" text-anchor="start">Business Administration</text><rect x="707" y="326" width="72" height="32" rx="16" fill="#fff" stroke="#7C3AED" stroke-width="1"/><text x="743.0" y="347" class="small" text-anchor="middle" style="fill:#7C3AED">BZA</text><rect x="810" y="316" width="290" height="125" rx="16" fill="#F0FDF4" stroke="#14B8A6" stroke-width="1.6"/><circle cx="834" cy="343" r="9" fill="#14B8A6" opacity=".18"/><circle cx="834" cy="343" r="4.5" fill="#14B8A6"/><text x="852" y="347" class="module" text-anchor="start">Generated Domains</text><text x="828" y="374" class="small" text-anchor="start">Reference · Customer Domains</text><rect x="1012" y="326" width="72" height="32" rx="16" fill="#fff" stroke="#14B8A6" stroke-width="1"/><text x="1048.0" y="347" class="small" text-anchor="middle" style="fill:#14B8A6">DOMAIN</text><text x="340" y="466" class="small" text-anchor="start">각 Application은 독립 Owner이며 CPF Foundation을 사용합니다.</text><rect x="1160" y="250" width="210" height="235" rx="22" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.6"/><text x="1190" y="286" class="section" text-anchor="start" style="fill:#B45309">EXTERNAL</text><text x="1190" y="326" class="label" text-anchor="start">External Systems</text><text x="1190" y="358" class="small" text-anchor="start"><tspan x="1190" dy="0">기관 / 서비스</tspan><tspan x="1190" dy="25">메시징 / 파일</tspan><tspan x="1190" dy="25">전문 / 외부 API</tspan></text><text x="1190" y="454" class="small" text-anchor="start" style="fill:#B45309">연계 Owner Domain</text><rect x="310" y="525" width="820" height="178" rx="22" fill="url(#soft)" stroke="#A4B3E7" stroke-width="1.6"/><text x="340" y="558" class="section" text-anchor="start" style="fill:#8B5CF6">FRAMEWORK FOUNDATION</text><rect x="340" y="582" width="350" height="90" rx="16" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.6"/><circle cx="364" cy="609" r="9" fill="#8B5CF6" opacity=".18"/><circle cx="364" cy="609" r="4.5" fill="#8B5CF6"/><text x="382" y="613" class="module" text-anchor="start">cpf-core</text><text x="358" y="640" class="small" text-anchor="start">Technical Foundation · Public API / SPI</text><rect x="602" y="592" width="72" height="32" rx="16" fill="#fff" stroke="#8B5CF6" stroke-width="1"/><text x="638.0" y="613" class="small" text-anchor="middle" style="fill:#8B5CF6">FOUNDATION</text><rect x="710" y="582" width="390" height="90" rx="16" fill="#ECFEFF" stroke="#06B6D4" stroke-width="1.6"/><circle cx="734" cy="609" r="9" fill="#06B6D4" opacity=".18"/><circle cx="734" cy="609" r="4.5" fill="#06B6D4"/><text x="752" y="613" class="module" text-anchor="start">cpf-common</text><text x="728" y="640" class="small" text-anchor="start">Reusable Business Common · Adopt where needed</text><rect x="1012" y="592" width="72" height="32" rx="16" fill="#fff" stroke="#06B6D4" stroke-width="1"/><text x="1048.0" y="613" class="small" text-anchor="middle" style="fill:#06B6D4">REUSE</text><rect x="1160" y="525" width="210" height="178" rx="22" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.6" stroke-dasharray="8 7"/><text x="1190" y="558" class="section" text-anchor="start" style="fill:#15803D">OPTIONAL RUNTIME</text><text x="1190" y="596" class="label" text-anchor="start">cpf-batch</text><text x="1190" y="626" class="small" text-anchor="start"><tspan x="1190" dy="0">Control · Scheduler</tspan><tspan x="1190" dy="23">Worker · Center-Cut</tspan><tspan x="1190" dy="23">Host Agent</tspan></text><path d="M175 215 L175 250" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#arrowBlue)"/><path d="M720 215 L720 250" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowBlue)"/><path d="M280 370 L310 370" fill="none" stroke="#0EA5E9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#arrow)"/><path d="M1130 370 L1160 370" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#arrow)"/><path d="M720 485 L720 525" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowBlue)"/><path d="M1040 485 C1085 520 1115 585 1160 610" fill="none" stroke="#22C55E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#arrow)"/><rect x="70" y="730" width="200" height="32" rx="16" fill="#FFFFFF" stroke="#C9D7EA" stroke-width="1"/><text x="170.0" y="751" class="small" text-anchor="middle" style="fill:#10243E">실선 · 기본 관계</text><rect x="285" y="730" width="220" height="32" rx="16" fill="#FFFFFF" stroke="#C9D7EA" stroke-width="1"/><text x="395.0" y="751" class="small" text-anchor="middle" style="fill:#10243E">점선 · 선택적 조합</text><text x="540" y="751" class="small" text-anchor="start">※ cpf-common은 재사용 Module이며 중앙 경유 계층이 아닙니다.</text></svg>