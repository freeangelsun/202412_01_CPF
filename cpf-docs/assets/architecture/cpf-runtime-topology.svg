<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="790" viewBox="0 0 1440 790" role="img" aria-labelledby="title desc">
<title id="title">CPF Runtime Topology</title><desc id="desc">CPF가 지원하는 직접 진입, 선택 Gateway, Local 및 Remote 호출 구조</desc>
<defs>
  <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06142D"/><stop offset="0.55" stop-color="#0B2A55"/><stop offset="1" stop-color="#123D72"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38BDF8"/><stop offset="0.5" stop-color="#2563EB"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
  <linearGradient id="soft" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EFF6FF"/><stop offset="1" stop-color="#F5F3FF"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F2746" flood-opacity="0.12"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker>
  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563EB"/></marker>
</defs>
<style>
 text{font-family:'NanumSquare','Noto Sans CJK KR','Noto Sans KR','Malgun Gothic','Segoe UI',Arial,sans-serif; fill:#10243E;}
 .title{font-size:40px;font-weight:800;letter-spacing:-1px}
 .heroTitle{font-size:38px;font-weight:800;letter-spacing:-1px}
 .subtitle{font-size:20px;font-weight:500;fill:#5B6B82}
 .section{font-size:18px;font-weight:800;letter-spacing:.4px}
 .label{font-size:17px;font-weight:700}
 .module{font-size:15px;font-weight:800}
 .small{font-size:14px;font-weight:500;fill:#5B6B82}
 .tiny{font-size:12px;font-weight:500;fill:#5B6B82}
 .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace;font-size:13px}
 .box{fill:#fff;stroke:#C9D7EA;stroke-width:1.5}
 .dash{stroke-dasharray:8 7}
</style>
<rect x="0" y="0" width="1440" height="790" rx="0" fill="#F5F8FC" stroke="none" stroke-width="0"/><text x="70" y="62" class="title" text-anchor="start">Runtime &amp; Deployment Topology</text><text x="70" y="94" class="subtitle" text-anchor="start">Gateway 강제 없이 Direct, Local, Remote와 Batch 구성을 선택합니다.</text><path d="M70 118 L1370 118" fill="none" stroke="#C9D7EA" stroke-width="1"/><rect x="70" y="155" width="300" height="240" rx="22" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.5" filter="url(#shadow)"/><text x="94" y="189" class="section" text-anchor="start" style="fill:#0EA5E9">01  DIRECT ENTRY</text><rect x="94.0" y="231" width="117.0" height="60" rx="14" fill="#ECFEFF" stroke="#0EA5E9" stroke-width="1.2"/><text x="152.5" y="267" class="tiny" text-anchor="middle">Client</text><rect x="229.0" y="231" width="117.0" height="60" rx="14" fill="#ECFEFF" stroke="#0EA5E9" stroke-width="1.2"/><text x="287.5" y="267" class="tiny" text-anchor="middle">Domain</text><path d="M203.0 261 L237.0 261" fill="none" stroke="#0EA5E9" stroke-width="1.8" marker-end="url(#arrow)"/><text x="94" y="327" class="tiny" text-anchor="start"><tspan x="94" dy="0">Domain이 Endpoint와 Channel 등록을 소유합니다.</tspan><tspan x="94" dy="23">Gateway 없이 직접 진입할 수 있습니다.</tspan></text><rect x="390" y="155" width="300" height="240" rx="22" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" filter="url(#shadow)"/><text x="414" y="189" class="section" text-anchor="start" style="fill:#2563EB">02  OPTIONAL GATEWAY</text><rect x="414.0" y="231" width="72.0" height="60" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/><text x="450.0" y="267" class="tiny" text-anchor="middle">Client</text><rect x="504.0" y="231" width="72.0" height="60" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/><text x="540.0" y="267" class="tiny" text-anchor="middle">Gateway</text><rect x="594.0" y="231" width="72.0" height="60" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/><text x="630.0" y="267" class="tiny" text-anchor="middle">Domain</text><path d="M478.0 261 L512.0 261" fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arrowBlue)"/><path d="M568.0 261 L602.0 261" fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arrowBlue)"/><text x="414" y="327" class="tiny" text-anchor="start"><tspan x="414" dy="0">공통 진입 제어가 필요한 경우에만 선택합니다.</tspan><tspan x="414" dy="23">내부 Domain 호출은 Gateway로 재경유하지 않습니다.</tspan></text><rect x="710" y="155" width="300" height="240" rx="22" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.5" filter="url(#shadow)"/><text x="734" y="189" class="section" text-anchor="start" style="fill:#8B5CF6">03  SAME JVM</text><rect x="734.0" y="231" width="72.0" height="60" rx="14" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.2"/><text x="770.0" y="267" class="tiny" text-anchor="middle">Domain A</text><rect x="824.0" y="231" width="72.0" height="60" rx="14" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.2"/><text x="860.0" y="267" class="tiny" text-anchor="middle">Local</text><rect x="914.0" y="231" width="72.0" height="60" rx="14" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.2"/><text x="950.0" y="267" class="tiny" text-anchor="middle">Domain B</text><path d="M798.0 261 L832.0 261" fill="none" stroke="#8B5CF6" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M888.0 261 L922.0 261" fill="none" stroke="#8B5CF6" stroke-width="1.8" marker-end="url(#arrow)"/><text x="734" y="327" class="tiny" text-anchor="start"><tspan x="734" dy="0">동일 JVM에서는 Local Invocation을 사용합니다.</tspan><tspan x="734" dy="23">Public Contract는 Remote와 동일하게 유지합니다.</tspan></text><rect x="1030" y="155" width="340" height="240" rx="22" fill="#FFFFFF" stroke="#14B8A6" stroke-width="1.5" filter="url(#shadow)"/><text x="1054" y="189" class="section" text-anchor="start" style="fill:#14B8A6">04  SEPARATE RUNTIME</text><rect x="1054.0" y="231" width="85.33333333333333" height="60" rx="14" fill="#F0FDF4" stroke="#14B8A6" stroke-width="1.2"/><text x="1096.6666666666667" y="267" class="tiny" text-anchor="middle">Domain A</text><rect x="1157.3333333333333" y="231" width="85.33333333333333" height="60" rx="14" fill="#F0FDF4" stroke="#14B8A6" stroke-width="1.2"/><text x="1200.0" y="267" class="tiny" text-anchor="middle">Remote</text><rect x="1260.6666666666667" y="231" width="85.33333333333333" height="60" rx="14" fill="#F0FDF4" stroke="#14B8A6" stroke-width="1.2"/><text x="1303.3333333333335" y="267" class="tiny" text-anchor="middle">Domain B</text><path d="M1131.3333333333335 261 L1165.3333333333333 261" fill="none" stroke="#14B8A6" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M1234.6666666666667 261 L1268.6666666666667 261" fill="none" stroke="#14B8A6" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1054" y="327" class="tiny" text-anchor="start"><tspan x="1054" dy="0">분리 Runtime에서는 Remote Invocation을 사용합니다.</tspan><tspan x="1054" dy="23">Timeout·Retry·Circuit·Tracing을 연결합니다.</tspan></text><rect x="70" y="435" width="1300" height="245" rx="24" fill="#FFFFFF" stroke="#B9DCC6" stroke-width="1.5" filter="url(#shadow)"/><text x="100" y="475" class="section" text-anchor="start" style="fill:#15803D">OPTIONAL BATCH RUNTIME</text><text x="100" y="505" class="small" text-anchor="start">업무 Domain이 제공한 Batch Contract를 독립 Runtime이 실행합니다.</text><rect x="80" y="540" width="180" height="78" rx="16" fill="#F8FAFC" stroke="#14B8A6" stroke-width="1.3"/><text x="170" y="570" class="label" text-anchor="middle">Business Domain</text><text x="170" y="596" class="tiny" text-anchor="middle">Job / Task Contract</text><rect x="300" y="540" width="180" height="78" rx="16" fill="#F8FAFC" stroke="#22C55E" stroke-width="1.3"/><text x="390" y="570" class="label" text-anchor="middle">Control Server</text><text x="390" y="596" class="tiny" text-anchor="middle">Command / Query</text><rect x="520" y="540" width="180" height="78" rx="16" fill="#F8FAFC" stroke="#22C55E" stroke-width="1.3"/><text x="610" y="570" class="label" text-anchor="middle">Scheduler</text><text x="610" y="596" class="tiny" text-anchor="middle">Trigger / Lease</text><rect x="740" y="540" width="180" height="78" rx="16" fill="#F8FAFC" stroke="#22C55E" stroke-width="1.3"/><text x="830" y="570" class="label" text-anchor="middle">Worker</text><text x="830" y="596" class="tiny" text-anchor="middle">Chunk / Tasklet</text><rect x="960" y="540" width="180" height="78" rx="16" fill="#F8FAFC" stroke="#F59E0B" stroke-width="1.3"/><text x="1050" y="570" class="label" text-anchor="middle">Center-Cut</text><text x="1050" y="596" class="tiny" text-anchor="middle">Partition / Claim</text><rect x="1180" y="540" width="180" height="78" rx="16" fill="#F8FAFC" stroke="#0EA5E9" stroke-width="1.3"/><text x="1270" y="570" class="label" text-anchor="middle">Host Agent</text><text x="1270" y="596" class="tiny" text-anchor="middle">Remote Process</text><path d="M260 579 L300 579" fill="none" stroke="#64748B" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M480 579 L520 579" fill="none" stroke="#64748B" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M700 579 L740 579" fill="none" stroke="#64748B" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M920 579 L960 579" fill="none" stroke="#64748B" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M1140 579 L1180 579" fill="none" stroke="#64748B" stroke-width="1.7" marker-end="url(#arrow)"/><text x="100" y="650" class="small" text-anchor="start">ADM은 Public Operations Contract로 상태를 조회·제어하며 BAT Owner DB를 직접 수정하지 않습니다.</text><rect x="70" y="716" width="260" height="32" rx="16" fill="#FFFFFF" stroke="#C9D7EA" stroke-width="1"/><text x="200.0" y="737" class="small" text-anchor="middle" style="fill:#10243E">Modular Monolith</text><rect x="345" y="716" width="220" height="32" rx="16" fill="#FFFFFF" stroke="#C9D7EA" stroke-width="1"/><text x="455.0" y="737" class="small" text-anchor="middle" style="fill:#10243E">Microservices</text><rect x="580" y="716" width="220" height="32" rx="16" fill="#FFFFFF" stroke="#C9D7EA" stroke-width="1"/><text x="690.0" y="737" class="small" text-anchor="middle" style="fill:#10243E">External WAS</text><rect x="815" y="716" width="220" height="32" rx="16" fill="#FFFFFF" stroke="#C9D7EA" stroke-width="1"/><text x="925.0" y="737" class="small" text-anchor="middle" style="fill:#10243E">Embedded BootJar</text><rect x="1050" y="716" width="320" height="32" rx="16" fill="#FFFFFF" stroke="#C9D7EA" stroke-width="1"/><text x="1210.0" y="737" class="small" text-anchor="middle" style="fill:#10243E">Hybrid Deployment Cell</text></svg>