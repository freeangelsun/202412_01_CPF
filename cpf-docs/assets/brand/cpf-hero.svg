="fill:#EAF3FF">Idempotency &amp; Recovery</text><rect x="75" y="456" width="205" height="32" rx="16" fill="#0D3567" stroke="#3D72B5" stroke-width="1"/><text x="177.5" y="477" class="small" text-anchor="middle" style="fill:#EAF3FF">Batch &amp; Center-Cut</text><rect x="290" y="456" width="205" height="32" rx="16" fill="#0D3567" stroke="#3D72B5" stroke-width="1"/><text x="392.5" y="477" class="small" text-anchor="middle" style="fill:#EAF3FF">Observability &amp; Audit</text><rect x="505" y="456" width="205" height="32" rx="16" fill="#0D3567" stroke="#3D72B5" stroke-width="1"/><text x="607.5" y="477" class="small" text-anchor="middle" style="fill:#EAF3FF">Migration &amp; Rollback</text><text x="75" y="530" class="section" text-anchor="start" style="fill:#7DD3FC">CURRENT STACK</text><rect x="75" y="548" width="120" height="32" rx="16" fill="#0C2D57" stroke="#2C5F9E" stroke-width="1"/><text x="135.0" y="569" class="small" text-anchor="middle" style="fill:#DCEBFF">Java 25</text><rect x="205" y="548" width="142" height="32" rx="16" fill="#0C2D57" stroke="#2C5F9E" stroke-width="1"/><text x="276.0" y="569" class="small" text-anchor="middle" style="fill:#DCEBFF">Gradle 9.1.0</text><rect x="357" y="548" width="185" height="32" rx="16" fill="#0C2D57" stroke="#2C5F9E" stroke-width="1"/><text x="449.5" y="569" class="small" text-anchor="middle" style="fill:#DCEBFF">Spring Boot 4.1.0</text><rect x="552" y="548" width="158" height="32" rx="16" fill="#0C2D57" stroke="#2C5F9E" stroke-width="1"/><text x="631.0" y="569" class="small" text-anchor="middle" style="fill:#DCEBFF">Servlet 6.1</text><rect x="785" y="54" width="585" height="512" rx="28" fill="#FFFFFF" stroke="#D6E2F2" stroke-width="1.5" filter="url(#shadow)"/><text x="825" y="95" class="section" text-anchor="start" style="fill:#2563EB">COMPOSABLE PLATFORM MODEL</text><text x="825" y="124" class="small" text-anchor="start">필수 기반 위에 Application과 선택 Runtime을 조합합니다.</text><rect x="825" y="156" width="505" height="156" rx="20" fill