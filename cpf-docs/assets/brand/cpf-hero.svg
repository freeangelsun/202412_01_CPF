<g transform="translate(48 48)">
  <polygon points="42,0 82,23 82,69 42,92 2,69 2,23" fill="url(#logo)"/>
  <polygon points="42,20 65,33 65,59 42,72 19,59 19,33" fill="#061B3A" opacity=".78"/>
  <circle cx="42" cy="46" r="8" fill="#38BDF8"/>
  <text x="105" y="47" class="brand" style="fill:#FFFFFF">CPF</text>
  <text x="108" y="78" class="brandSub" style="fill:#CFE3FF">Core Platform Framework</text>
</g>

<text x="48" y="196" class="heroCopy" style="fill:#FFFFFF">
  <tspan x="48" dy="0">업무 애플리케이션의 개발부터</tspan><tspan x="48" dy="43">실행·운영·확장·검증까지</tspan><tspan x="48" dy="43">하나의 구조로 연결합니다.</tspan>
</text>
<text x="48" y="342" class="heroBody" style="fill:#C8DDF8">
  <tspan x="48" dy="0">Topology-independent Contract와 명확한 Module Ownership을 기반으로</tspan>
  <tspan x="48" dy="25">Application, Runtime, Integration과 Delivery Lifecycle을 조합합니다.</tspan>
</text>

