    .brandSub{font-size:23px;font-weight:650}.heroCopy{font-size:31px;font-weight:760;letter-spacing:-1px}
    .heroBody{font-size:16px;font-weight:500}.section{font-size:18px;font-weight:800;letter-spacing:.2px}
