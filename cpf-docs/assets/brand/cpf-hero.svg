<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title>Core Platform Framework 소개 그림</title><desc>외부 채널에서 Gateway와 업무 Domain을 지나 cpf-common과 cpf-core 실행 기반, Batch, 외부 연계, 운영, 복구와 재처리로 이어지는 구조입니다.</desc>
