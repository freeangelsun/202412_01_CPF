<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Core Platform Framework Overview</title>
<desc id="desc">CPF의 제품 가치, Application Domain Plane, Framework Foundation, Optional Gateway와 Batch Runtime, Generator, Deployment Topology와 주요 기술 능력을 한 장에 설명하는 브로셔형 개요</desc>
<defs>
  <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#041329"/><stop offset=".58" stop-color="#082453"/><stop offset="1" stop-color="#0A3672"/>
  </linearGradient>
  <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#2563EB"/><stop offset="1" stop-color="#7C3AED"/>
  </linearGradient>
  <linearGradient id="softBlue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#EFF6FF"/><stop offset="1" stop-color="#F5F3FF"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F2D57" flood-opacity=".10"/>
  </filter>
