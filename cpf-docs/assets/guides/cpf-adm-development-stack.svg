</style><rect width="1400" height="820" class="bg"/><text x="60" y="70" class="h1">ADM 개발 표준 Stack</text><text x="60" y="112" class="body">화면·API·권한·운영 명령을 기능 단위로 연결하고 OSS를 실제 Primary Path로 사용합니다.</text><rect x="60" y="170" width="1280" height="90" rx="22" fill="#0e2946" opacity="0.96"/><text x="90" y="208" class="h2 white">화면</text><text x="90" y="240" class="small" text-anchor="start"><tspan x="90" dy="0">Element Plus · TanStack Table · 접근성·반응형·마스킹</tspan></text><rect x="60" y="278" width="1280" height="90" rx="22" fill="#143c60" opacity="0.96"/><text x="90" y="316" class="h2 white">Frontend 구조</text><text x="90" y="348" class="small" text-anchor="start"><tspan x="90" dy="0">Vue Router · Pinia(UI state) · TanStack Vue Query(server state) · Zod</tspan></text><rect x="60" y="386" width="1280" height="90" rx="22" fill="#1d5a7b" opacity="0.96"/><text x="90" y="424" class="h2 white">계약</text><text x="90" y="456" class="small" text-anchor="start"><tspan x="90" dy="0">OpenAPI · Orval 생성 Client · 표준 오류·CSRF·Header</tspan></text><rect x="60" y="494" width="1280" height="90" rx="22" fill="#25859a" opacity="0.96"/><text x="90" y="532" class="h2 white">Backend</text><text x="90" y="564" class="small" text-anchor="start"><tspan x="90" dy="0">Controller · Query/Command Service · Owner Port·Adapter</tspan></text><rect x="60" y="602" width="1280" height="90" rx="22" fill="#2cae9c" opacity="0.96"/><text x="90" y="640" class="h2 white">통제</text><text x="90" y="672" class="small" text-anchor="start"><tspan x="90" dy="0">Spring Security·Session JDBC · 권한·사유·승인·감사·UNKNOWN_RESULT</tspan></text><text x="60" y="785" class="small">일부 화면만 전환하거나 raw fetch·수동 Route·Legacy Table을 Primary로 남기면 완료가 아닙니다.</text></svg>