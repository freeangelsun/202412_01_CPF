    <tspan x="1060" dy="38">Desired / Actual</tspan>
    <tspan x="1060" dy="38">Operation · Approval</tspan>
    <tspan x="1060" dy="38">Audit · Log · Trace</tspan>
  </text>
  <rect x="150" y="715" width="1300" height="50" rx="10" fill="#17324D" stroke="#17324D" stroke-width="0"/>
  <text x="800" y="749" font-family="Arial, Noto Sans KR, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">조치 전 목록과 상세의 ID·Version·Owner 일치 확인</text>
