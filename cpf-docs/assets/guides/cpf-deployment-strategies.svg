<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">배포 방식과 판정 지점</title>
  <desc id="desc">CPF 공식 매뉴얼 설명 그림</desc>
  <rect width="100%" height="100%" fill="#F7F9FC"/>
  <text x="70" y="72" font-family="Arial, Noto Sans KR, sans-serif" font-size="42" font-weight="700" fill="#17324D" text-anchor="start">배포 방식과 판정 지점</text>
  <text x="70" y="112" font-family="Arial, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#64748B" text-anchor="start">Rolling·Blue-Green·Canary는 Instance별 Desired/Actual과 Business Probe로 판정</text>
  <line x1="70" y1="140" x2="1530" y2="140" stroke="#E8EEF6" stroke-width="3"/>
  <rect x="90" y="210" width="445" height="440" rx="24" fill="#FFFFFF" stroke="#2F6FED" stroke-width="4"/>
  <text x="312" y="270" font-family="Arial, Noto Sans KR, sans-serif" font-size="30" font-weight="700" fill="#2F6FED" text-anchor="middle">Rolling</text>
  <text x="140" y="340" font-family="Arial, Noto Sans KR, sans-serif" font-size="24" font-weight="500" fill="#0F172A" text-anchor="start">
    <tspan x="140" dy="0">한 Instance씩 교체</tspan>
    <tspan x="140" dy="52">Mixed Version 호환</tspan>
    <tspan x="140" dy="52">Drain·Readiness</tspan>
  </text>
  <rect x="595" y="210" width="445" height="440" rx="24" fill="#FFFFFF" stroke="#1F9D6A" stroke-width="4"/>
  <text x="817" y="270" font-family="Arial, Noto Sans KR, sans-serif" font-size="30" font-weight="700" fill="#1F9D6A" text-anchor="middle">Blue-Green</text>
  <text x="645" y="340" font-family="Arial, Noto Sans KR, sans-serif" font-size="24" font-weight="500" fill="#0F172A" text-anchor="start">
    <tspan x="645" dy="0">두 환경 병행</tspan>
    <tspan x="645" dy="52">Traffic Switch</tspan>
    <tspan x="645" dy="52">구 환경 유지</tspan>
  </text>
  <rect x="1100" y="210" width="445" height="440" rx="24" fill="#FFFFFF" stroke="#E9822C" stroke-width="4"/>
  <text x="1322" y="270" font-family="Arial, Noto Sans KR, sans-serif" font-size="30" font-weight="700" fill="#E9822C" text-anchor="middle">Canary</text>
  <text x="1150" y="340" font-family="Arial, Noto Sans KR, sans-serif" font-size="24" font-weight="500" fill="#0F172A" text-anchor="start">
    <tspan x="1150" dy="0">일부 Traffic</tspan>
    <tspan x="1150" dy="52">Metric·Error 비교</tspan>
    <tspan x="1150" dy="52">점진 확대</tspan>
  </text>
  <rect x="170" y="710" width="1260" height="100" rx="18" fill="#17324D" stroke="#17324D" stroke-width="0"/>
  <text x="800" y="768" font-family="Arial, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">공통 종료 조건: Version·Checksum·Health·Business Probe·Audit·Rollback Target 일치</text>
</svg>
