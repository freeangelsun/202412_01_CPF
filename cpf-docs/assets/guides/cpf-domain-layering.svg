  <text x="800" y="835" font-family="Arial, Noto Sans KR, sans-serif" font-size="23" font-weight="700" fill="#D64545" text-anchor="middle">의존 방향은 위에서 아래로만. Domain은 Framework·DB·HTTP 구현 Type을 직접 참조하지 않는다.</text>
