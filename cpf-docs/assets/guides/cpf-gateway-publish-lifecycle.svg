<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Gateway Route 게시 Lifecycle</title>
  <desc id="desc">CPF 공식 매뉴얼 설명 그림</desc>
  <rect width="100%" height="100%" fill="#F7F9FC"/>
  <text x="70" y="72" font-family="Arial, Noto Sans KR, sans-serif" font-size="42" font-weight="700" fill="#17324D" text-anchor="start">Gateway Route 게시 Lifecycle</text>
  <text x="70" y="112" font-family="Arial, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#64748B" text-anchor="start">Validate부터 Instance별 ACK/NACK·LKG Rollback까지</text>
  <line x1="70" y1="140" x2="1530" y2="140" stroke="#E8EEF6" stroke-width="3"/>
  <rect x="55" y="290" width="160" height="150" rx="18" fill="#FFFFFF" stroke="#2F6FED" stroke-width="3"/>
  <text x="135" y="365" font-family="Arial, Noto Sans KR, sans-serif" font-size="21" font-weight="700" fill="#2F6FED" text-anchor="middle">Draft</text>
  <line x1="215" y1="365" x2="245" y2="365" stroke="#64748B" stroke-width="3"/>
  <polygon points="245,365 227,355 227,375" fill="#64748B"/>
  <rect x="245" y="290" width="160" height="150" rx="18" fill="#FFFFFF" stroke="#16A6B6" stroke-width="3"/>
  <text x="325" y="365" font-family="Arial, Noto Sans KR, sans-serif" font-size="21" font-weight="700" fill="#16A6B6" text-anchor="middle">Validate</text>
  <line x1="405" y1="365" x2="435" y2="365" stroke="#64748B" stroke-width="3"/>
  <polygon points="435,365 417,355 417,375" fill="#64748B"/>
  <rect x="435" y="290" width="160" height="150" rx="18" fill="#FFFFFF" stroke="#1F9D6A" stroke-width="3"/>
  <text x="515" y="365" font-family="Arial, Noto Sans KR, sans-serif" font-size="21" font-weight="700" fill="#1F9D6A" text-anchor="middle">Connection Test</text>
  <line x1="595" y1="365" x2="625" y2="365" stroke="#64748B" stroke-width="3"/>
  <polygon points="625,365 607,355 607,375" fill="#64748B"/>
  <rect x="625" y="290" width="160" height="150" rx="18" fill="#FFFFFF" stroke="#7A5AF8" stroke-width="3"/>
  <text x="705" y="365" font-family="Arial, Noto Sans KR, sans-serif" font-size="21" font-weight="700" fill="#7A5AF8" text-anchor="middle">Approval</text>
  <line x1="785" y1="365" x2="815" y2="365" stroke="#64748B" stroke-width="3"/>
  <polygon points="815,365 797,355 797,375" fill="#64748B"/>
  <rect x="815" y="290" width="160" height="150" rx="18" fill="#FFFFFF" stroke="#E9822C" stroke-width="3"/>
  <text x="895" y="365" font-family="Arial, Noto Sans KR, sans-serif" font-size="21" font-weight="700" fill="#E9822C" text-anchor="middle">Publish</text>
  <line x1="975" y1="365" x2="1005" y2="365" stroke="#64748B" stroke-width="3"/>
  <polygon points="1005,365 987,355 987,375" fill="#64748B"/>
  <rect x="1005" y="290" width="160" height="150" rx="18" fill="#FFFFFF" stroke="#D64545" stroke-width="3"/>
  <text x="1085" y="365" font-family="Arial, Noto Sans KR, sans-serif" font-size="21" font-weight="700" fill="#D64545" text-anchor="middle">ACK/NACK</text>
  <line x1="1165" y1="365" x2="1195" y2="365" stroke="#64748B" stroke-width="3"/>
  <polygon points="1195,365 1177,355 1177,375" fill="#64748B"/>
  <rect x="1195" y="290" width="160" height="150" rx="18" fill="#FFFFFF" stroke="#2F6FED" stroke-width="3"/>
  <text x="1275" y="365" font-family="Arial, Noto Sans KR, sans-serif" font-size="21" font-weight="700" fill="#2F6FED" text-anchor="middle">Reconcile</text>
  <line x1="1355" y1="365" x2="1385" y2="365" stroke="#64748B" stroke-width="3"/>
  <polygon points="1385,365 1367,355 1367,375" fill="#64748B"/>
  <rect x="1385" y="290" width="160" height="150" rx="18" fill="#FFFFFF" stroke="#1F9D6A" stroke-width="3"/>
  <text x="1465" y="365" font-family="Arial, Noto Sans KR, sans-serif" font-size="21" font-weight="700" fill="#1F9D6A" text-anchor="middle">LKG Rollback</text>
  <rect x="220" y="565" width="1160" height="170" rx="22" fill="#FFFFFF" stroke="#D64545" stroke-width="3"/>
  <text x="260" y="620" font-family="Arial, Noto Sans KR, sans-serif" font-size="23" font-weight="500" fill="#0F172A" text-anchor="start">
    <tspan x="260" dy="0">일부 ACK는 전체 성공이 아니다. Desired/Actual Version·Checksum·Traffic 제외 여부를 Instance별 확인</tspan>
    <tspan x="260" dy="42">응답 유실은 Publish Operation을 조회하고 같은 Snapshot을 Blind Publish하지 않는다.</tspan>
  </text>
</svg>
