<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Gateway Trust Boundary와 SSRF 방어</title>
  <desc id="desc">CPF 공식 매뉴얼 설명 그림</desc>
  <rect width="100%" height="100%" fill="#F7F9FC"/>
  <text x="70" y="72" font-family="Arial, Noto Sans KR, sans-serif" font-size="42" font-weight="700" fill="#17324D" text-anchor="start">Gateway Trust Boundary와 SSRF 방어</text>
  <text x="70" y="112" font-family="Arial, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#64748B" text-anchor="start">Client 입력과 내부 신뢰 문맥·Target Network를 분리</text>
  <line x1="70" y1="140" x2="1530" y2="140" stroke="#E8EEF6" stroke-width="3"/>
  <rect x="70" y="220" width="330" height="460" rx="22" fill="#FFFFFF" stroke="#2F6FED" stroke-width="4"/>
  <text x="100" y="275" font-family="Arial, Noto Sans KR, sans-serif" font-size="28" font-weight="700" fill="#2F6FED" text-anchor="start">Inbound</text>
  <text x="100" y="345" font-family="Arial, Noto Sans KR, sans-serif" font-size="23" font-weight="500" fill="#0F172A" text-anchor="start">
    <tspan x="100" dy="0">Host·Method·Path</tspan>
    <tspan x="100" dy="48">Header Count/Bytes</tspan>
    <tspan x="100" dy="48">Body Size·Content Type</tspan>
  </text>
  <line x1="400" y1="450" x2="450" y2="450" stroke="#64748B" stroke-width="3"/>
  <polygon points="450,450 432,440 432,460" fill="#64748B"/>
  <rect x="450" y="220" width="330" height="460" rx="22" fill="#FFFFFF" stroke="#7A5AF8" stroke-width="4"/>
  <text x="480" y="275" font-family="Arial, Noto Sans KR, sans-serif" font-size="28" font-weight="700" fill="#7A5AF8" text-anchor="start">Trust</text>
  <text x="480" y="345" font-family="Arial, Noto Sans KR, sans-serif" font-size="23" font-weight="500" fill="#0F172A" text-anchor="start">
    <tspan x="480" dy="0">Service Identity</tspan>
    <tspan x="480" dy="48">Audience·HMAC</tspan>
    <tspan x="480" dy="48">Nonce·Timestamp·Body Hash</tspan>
  </text>
  <line x1="780" y1="450" x2="830" y2="450" stroke="#64748B" stroke-width="3"/>
  <polygon points="830,450 812,440 812,460" fill="#64748B"/>
  <rect x="830" y="220" width="330" height="460" rx="22" fill="#FFFFFF" stroke="#1F9D6A" stroke-width="4"/>
  <text x="860" y="275" font-family="Arial, Noto Sans KR, sans-serif" font-size="28" font-weight="700" fill="#1F9D6A" text-anchor="start">Target</text>
  <text x="860" y="345" font-family="Arial, Noto Sans KR, sans-serif" font-size="23" font-weight="500" fill="#0F172A" text-anchor="start">
    <tspan x="860" dy="0">Allowlist Host/Port</tspan>
    <tspan x="860" dy="48">DNS Pin·CIDR</tspan>
    <tspan x="860" dy="48">TLS·Certificate</tspan>
  </text>
  <line x1="1160" y1="450" x2="1210" y2="450" stroke="#64748B" stroke-width="3"/>
  <polygon points="1210,450 1192,440 1192,460" fill="#64748B"/>
  <rect x="1210" y="220" width="330" height="460" rx="22" fill="#FFFFFF" stroke="#E9822C" stroke-width="4"/>
  <text x="1240" y="275" font-family="Arial, Noto Sans KR, sans-serif" font-size="28" font-weight="700" fill="#E9822C" text-anchor="start">Execution</text>
  <text x="1240" y="345" font-family="Arial, Noto Sans KR, sans-serif" font-size="23" font-weight="500" fill="#0F172A" text-anchor="start">
    <tspan x="1240" dy="0">Timeout Budget</tspan>
    <tspan x="1240" dy="48">Retry 조건</tspan>
    <tspan x="1240" dy="48">Circuit·Bulkhead</tspan>
  </text>
  <text x="800" y="805" font-family="Arial, Noto Sans KR, sans-serif" font-size="23" font-weight="700" fill="#D64545" text-anchor="middle">금지: Client가 보낸 내부 Principal·Environment·Target 주소·Retry 가능 여부를 그대로 신뢰</text>
</svg>
