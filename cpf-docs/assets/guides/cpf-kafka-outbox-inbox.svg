  <text x="495" y="340" font-family="Arial, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#E9822C" text-anchor="middle">Outbox 저장</text>
  <rect x="680" y="280" width="230" height="180" rx="20" fill="#FFFFFF" stroke="#7A5AF8" stroke-width="3"/>
