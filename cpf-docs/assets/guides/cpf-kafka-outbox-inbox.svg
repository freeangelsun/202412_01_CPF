  <text x="1095" y="340" font-family="Arial, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#16A6B6" text-anchor="middle">Kafka</text>
  <rect x="1280" y="280" width="230" height="180" rx="20" fill="#FFFFFF" stroke="#1F9D6A" stroke-width="3"/>
  <text x="1395" y="340" font-family="Arial, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#1F9D6A" text-anchor="middle">Inbox·Consumer</text>
