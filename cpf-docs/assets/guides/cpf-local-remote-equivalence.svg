<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Local Remote 동등성</title>
  <desc id="desc">CPF 공식 매뉴얼 설명 그림</desc>
  <rect width="100%" height="100%" fill="#F7F9FC"/>
  <text x="70" y="72" font-family="Arial, Noto Sans KR, sans-serif" font-size="42" font-weight="700" fill="#17324D" text-anchor="start">Local·Remote 동등성</text>
  <text x="70" y="112" font-family="Arial, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#64748B" text-anchor="start">배포 Topology가 달라도 업무 계약과 오류 의미는 동일</text>
  <line x1="70" y1="140" x2="1530" y2="140" stroke="#E8EEF6" stroke-width="3"/>
  <rect x="100" y="210" width="560" height="500" rx="24" fill="#FFFFFF" stroke="#2F6FED" stroke-width="4"/>
  <text x="380" y="270" font-family="Arial, Noto Sans KR, sans-serif" font-size="30" font-weight="700" fill="#2F6FED" text-anchor="middle">Same JVM Local</text>
  <text x="160" y="340" font-family="Arial, Noto Sans KR, sans-serif" font-size="25" font-weight="500" fill="#0F172A" text-anchor="start">
    <tspan x="160" dy="0">Application Service</tspan>
    <tspan x="160" dy="55">→ Local Owner Port</tspan>
    <tspan x="160" dy="55">→ Owner Transaction</tspan>
    <tspan x="160" dy="55">→ 동일 DTO·Permission·Audit</tspan>
  </text>
  <rect x="940" y="210" width="560" height="500" rx="24" fill="#FFFFFF" stroke="#7A5AF8" stroke-width="4"/>
  <text x="1220" y="270" font-family="Arial, Noto Sans KR, sans-serif" font-size="30" font-weight="700" fill="#7A5AF8" text-anchor="middle">분리 WAS Remote</text>
  <text x="1000" y="340" font-family="Arial, Noto Sans KR, sans-serif" font-size="25" font-weight="500" fill="#0F172A" text-anchor="start">
    <tspan x="1000" dy="0">Application Service</tspan>
    <tspan x="1000" dy="55">→ Remote Owner Adapter</tspan>
    <tspan x="1000" dy="55">→ Service Identity·Timeout</tspan>
    <tspan x="1000" dy="55">→ 동일 DTO·Permission·Audit</tspan>
  </text>
  <line x1="660" y1="450" x2="940" y2="450" stroke="#E9822C" stroke-width="5"/>
  <polygon points="940,450 922,440 922,460" fill="#E9822C"/>
  <text x="800" y="420" font-family="Arial, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#E9822C" text-anchor="middle">계약 동등성</text>
  <text x="800" y="490" font-family="Arial, Noto Sans KR, sans-serif" font-size="21" font-weight="500" fill="#17324D" text-anchor="middle">Request·Response·Error·Idempotency·Reconcile</text>
</svg>
