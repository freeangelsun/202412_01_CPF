<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
<style>
  .bg{fill:#f5f8fc}.panel{fill:#fff;stroke:#c7d7e8;stroke-width:2}.dark{fill:#0f2238}.accent{fill:#0e2946;stroke:#36d3d0;stroke-width:2}
  .h1{font:700 42px Arial,'Noto Sans KR',sans-serif;fill:#10243d}.h2{font:700 27px Arial,'Noto Sans KR',sans-serif;fill:#10243d}
  .body{font:400 21px Arial,'Noto Sans KR',sans-serif;fill:#405b78}.small{font:400 17px Arial,'Noto Sans KR',sans-serif;fill:#607892}
  .white{fill:#fff}.label{font:700 17px Arial,'Noto Sans KR',sans-serif;fill:#36d3d0;letter-spacing:1px}.num{font:700 18px Arial,'Noto Sans KR',sans-serif;fill:#fff}
  .line{stroke:#7891aa;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.dash{stroke:#7891aa;stroke-width:2;fill:none;stroke-dasharray:8 8}
</style><rect width="1400" height="820" class="bg"/><text x="60" y="70" class="h1">CPF 제품 계약과 책임 경계</text><text x="60" y="112" class="body">제품은 실행 엔진과 Control Plane, 운영 도구와 검증 체계를 하나의 구조로 연결합니다.</text><rect x="60" y="170" width="1280" height="90" rx="22" fill="#0e2946" opacity="0.96"/><text x="90" y="208" class="h2 white">사용자·채널</text><text x="90" y="240" class="small" text-anchor="start"><tspan x="90" dy="0">Web·Mobile·기관·내부 호출 · 직접 진입 또는 선택형 Gateway</tspan></text><rect x="60" y="278" width="1280" height="90" rx="22" fill="#143c60" opacity="0.96"/><text x="90" y="316" class="h2 white">제품 애플리케이션</text><text x="90" y="348" class="small" text-anchor="start"><tspan x="90" dy="0">생성 업무영역 · cpf-admin · 선택형 cpf-biz-admin</tspan></text><rect x="60" y="386" width="1280" height="90" rx="22" fill="#1d5a7b" opacity="0.96"/><text x="90" y="424" class="h2 white">실행 제품</text><text x="90" y="456" class="small" text-anchor="start"><tspan x="90" dy="0">온라인 Runtime · Spring Batch 기반 cpf-batch · 선택형 cpf-gateway</tspan></text><rect x="60" y="494" width="1280" height="90" rx="22" fill="#25859a" opacity="0.96"/><text x="90" y="532" class="h2 white">공통 기반</text><text x="90" y="564" class="small" text-anchor="start"><tspan x="90" dy="0">cpf-core 공개 API·SPI · cpf-common 선택 공통</tspan><tspan x="90" dy="25">Kafka·Resilience4j·Caffeine·Observation Adapter</tspan></text><rect x="60" y="602" width="1280" height="90" rx="22" fill="#2cae9c" opacity="0.96"/><text x="90" y="640" class="h2 white">공급·운영</text><text x="90" y="672" class="small" text-anchor="start"><tspan x="90" dy="0">Generator · DB Vendor Pack·Flyway · 설치·배포·Evidence·Supply Chain</tspan></text><text x="60" y="785" class="small">같은 책임을 두 엔진이 동시에 소유하지 않으며, 실제 Consumer와 상태 정본을 기준으로 완료를 판정합니다.</text></svg>