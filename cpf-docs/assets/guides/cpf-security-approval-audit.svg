    <tspan x="675" dy="31">영향</tspan>
    <tspan x="675" dy="31">원복</tspan>
  </text>
  <line x1="780" y1="355" x2="820" y2="355" stroke="#64748B" stroke-width="3"/>
  <polygon points="820,355 802,345 802,365" fill="#64748B"/>
  <rect x="820" y="260" width="210" height="190" rx="18" fill="#FFFFFF" stroke="#7A5AF8" stroke-width="3"/>
  <text x="925" y="315" font-family="Arial, Noto Sans KR, sans-serif" font-size="22" font-weight="700" fill="#7A5AF8" text-anchor="middle">Approval</text>
  <text x="925" y="360" font-family="Arial, Noto Sans KR, sans-serif" font-size="19" font-weight="500" fill="#0F172A" text-anchor="middle">
