<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Permission Reason Approval Audit</title>
  <desc id="desc">CPF 공식 매뉴얼 설명 그림</desc>
  <rect width="100%" height="100%" fill="#F7F9FC"/>
  <text x="70" y="72" font-family="Arial, Noto Sans KR, sans-serif" font-size="42" font-weight="700" fill="#17324D" text-anchor="start">Permission·Reason·Approval·Audit</text>
  <text x="70" y="112" font-family="Arial, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#64748B" text-anchor="start">위험 조치는 UI Button부터 Owner 결과까지 하나의 감사 Chain으로 연결</text>
  <line x1="70" y1="140" x2="1530" y2="140" stroke="#E8EEF6" stroke-width="3"/>
  <rect x="70" y="260" width="210" height="190" rx="18" fill="#FFFFFF" stroke="#2F6FED" stroke-width="3"/>
  <text x="175" y="315" font-family="Arial, Noto Sans KR, sans-serif" font-size="22" font-weight="700" fill="#2F6FED" text-anchor="middle">Menu·Route</text>
  <text x="175" y="360" font-family="Arial, Noto Sans KR, sans-serif" font-size="19" font-weight="500" fill="#0F172A" text-anchor="middle">
    <tspan x="175" dy="0">접근 Permission</tspan>
  </text>
  <line x1="280" y1="355" x2="320" y2="355" stroke="#64748B" stroke-width="3"/>
  <polygon points="320,355 302,345 302,365" fill="#64748B"/>
  <rect x="320" y="260" width="210" height="190" rx="18" fill="#FFFFFF" stroke="#16A6B6" stroke-width="3"/>
  <text x="425" y="315" font-family="Arial, Noto Sans KR, sans-serif" font-size="22" font-weight="700" fill="#16A6B6" text-anchor="middle">Query·Action</text>
  <text x="425" y="360" font-family="Arial, Noto Sans KR, sans-serif" font-size="19" font-weight="500" fill="#0F172A" text-anchor="middle">
    <tspan x="425" dy="0">Data Scope</tspan>
    <tspan x="425" dy="31">Masking</tspan>
  </text>
  <line x1="530" y1="355" x2="570" y2="355" stroke="#64748B" stroke-width="3"/>
