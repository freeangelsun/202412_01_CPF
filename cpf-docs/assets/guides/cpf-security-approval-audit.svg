    <tspan x="1425" dy="31">Result</tspan>
  </text>
  <rect x="220" y="585" width="1160" height="140" rx="20" fill="#17324D" stroke="#17324D" stroke-width="0"/>
  <text x="800" y="640" font-family="Arial, Noto Sans KR, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle">Frontend 조건은 UX이며 Backend·Owner Permission 판정이 정본</text>
  <text x="800" y="682" font-family="Arial, Noto Sans KR, sans-serif" font-size="21" font-weight="500" fill="#FFFFFF" text-anchor="middle">Raw 조회·Export·Break-glass는 별도 권한과 구체적 Reason을 요구</text>
