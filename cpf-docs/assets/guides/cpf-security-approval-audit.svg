  </text>
  <line x1="1280" y1="355" x2="1320" y2="355" stroke="#64748B" stroke-width="3"/>
  <polygon points="1320,355 1302,345 1302,365" fill="#64748B"/>
  <rect x="1320" y="260" width="210" height="190" rx="18" fill="#FFFFFF" stroke="#D64545" stroke-width="3"/>
  <text x="1425" y="315" font-family="Arial, Noto Sans KR, sans-serif" font-size="22" font-weight="700" fill="#D64545" text-anchor="middle">Audit</text>
  <text x="1425" y="360" font-family="Arial, Noto Sans KR, sans-serif" font-size="19" font-weight="500" fill="#0F172A" text-anchor="middle">
