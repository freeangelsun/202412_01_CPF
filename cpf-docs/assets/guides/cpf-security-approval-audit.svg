    <tspan x="925" dy="31">유효기간</tspan>
  </text>
  <line x1="1030" y1="355" x2="1070" y2="355" stroke="#64748B" stroke-width="3"/>
  <polygon points="1070,355 1052,345 1052,365" fill="#64748B"/>
  <rect x="1070" y="260" width="210" height="190" rx="18" fill="#FFFFFF" stroke="#1F9D6A" stroke-width="3"/>
  <text x="1175" y="315" font-family="Arial, Noto Sans KR, sans-serif" font-size="22" font-weight="700" fill="#1F9D6A" text-anchor="middle">Owner Command</text>
  <text x="1175" y="360" font-family="Arial, Noto Sans KR, sans-serif" font-size="19" font-weight="500" fill="#0F172A" text-anchor="middle">
