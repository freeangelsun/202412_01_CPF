  <rect x="570" y="260" width="210" height="190" rx="18" fill="#FFFFFF" stroke="#E9822C" stroke-width="3"/>
  <text x="675" y="315" font-family="Arial, Noto Sans KR, sans-serif" font-size="22" font-weight="700" fill="#E9822C" text-anchor="middle">Reason</text>
  <text x="675" y="360" font-family="Arial, Noto Sans KR, sans-serif" font-size="19" font-weight="500" fill="#0F172A" text-anchor="middle">
