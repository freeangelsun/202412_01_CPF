<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="830" viewBox="0 0 1440 830" role="img" aria-labelledby="title desc">
<title id="title">ADM 권한별 사용 범위</title><desc id="desc">같은 화면도 권한과 책임에 따라 가능한 작업이 달라집니다.</desc>
<rect width="1440" height="830" rx="28" fill="#f8fafc"/>
<text x="72" y="72" font-family="Arial, Noto Sans KR, sans-serif" font-size="36" font-weight="700" fill="#0f172a">ADM 권한별 사용 범위</text>
<text x="72" y="116" font-family="Arial, Noto Sans KR, sans-serif" font-size="22" fill="#475569">같은 화면도 권한과 책임에 따라 가능한 작업이 달라집니다.</text><rect x="72" y="170" width="1296" height="88" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><circle cx="120" cy="214" r="25" fill="#0f766e"/><text x="120" y="222" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#ffffff">1</text><text x="168" y="204" font-family="Arial, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#0f172a">조회자</text><text x="168" y="236" font-family="Arial, Noto Sans KR, sans-serif" font-size="19" fill="#475569">상태·로그·이력·감사 결과를 조회합니다.</text><rect x="72" y="290" width="1296" height="88" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><circle cx="120" cy="334" r="25" fill="#0f766e"/><text x="120" y="342" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#ffffff">2</text><text x="168" y="324" font-family="Arial, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#0f172a">운영자</text><text x="168" y="356" font-family="Arial, Noto Sans KR, sans-serif" font-size="19" fill="#475569">허용된 실행·중지·재처리·설정 변경을 수행합니다.</text><rect x="72" y="410" width="1296" height="88" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><circle cx="120" cy="454" r="25" fill="#0f766e"/><text x="120" y="462" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#ffffff">3</text><text x="168" y="444" font-family="Arial, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#0f172a">승인자</text><text x="168" y="476" font-family="Arial, Noto Sans KR, sans-serif" font-size="19" fill="#475569">위험 조치의 대상·영향·복구 계획을 검토하고 결정합니다.</text><rect x="72" y="530" width="1296" height="88" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><circle cx="120" cy="574" r="25" fill="#0f766e"/><text x="120" y="582" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#ffffff">4</text><text x="168" y="564" font-family="Arial, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#0f172a">보안담당자</text><text x="168" y="596" font-family="Arial, Noto Sans KR, sans-serif" font-size="19" fill="#475569">권한·MFA·Secret·비상 권한과 보안 감사를 관리합니다.</text><rect x="72" y="650" width="1296" height="88" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><circle cx="120" cy="694" r="25" fill="#0f766e"/><text x="120" y="702" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#ffffff">5</text><text x="168" y="684" font-family="Arial, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#0f172a">운영관리자</text><text x="168" y="716" font-family="Arial, Noto Sans KR, sans-serif" font-size="19" fill="#475569">교대 인계, 장애 지휘, 대사와 정상화 종료를 책임집니다.</text><text x="72" y="796" font-family="Arial, Noto Sans KR, sans-serif" font-size="18" fill="#334155">권한이 없으면 버튼이 보이지 않거나 실행이 거부되며 우회해서는 안 됩니다.</text></svg>
