<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="950" viewBox="0 0 1440 950" role="img" aria-labelledby="title desc">
<title id="title">고객 배치 개발과 운영 순서</title><desc id="desc">대상 업무량과 재시작 요구에 맞춰 배치 유형을 선택합니다.</desc>
<rect width="1440" height="950" rx="28" fill="#f8fafc"/>
<text x="72" y="72" font-family="Arial, Noto Sans KR, sans-serif" font-size="36" font-weight="700" fill="#0f172a">고객 배치 개발과 운영 순서</text>
<text x="72" y="116" font-family="Arial, Noto Sans KR, sans-serif" font-size="22" fill="#475569">대상 업무량과 재시작 요구에 맞춰 배치 유형을 선택합니다.</text><rect x="72" y="170" width="1296" height="88" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><circle cx="120" cy="214" r="25" fill="#0f766e"/><text x="120" y="222" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#ffffff">1</text><text x="168" y="204" font-family="Arial, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#0f172a">처리 단위 결정</text><text x="168" y="236" font-family="Arial, Noto Sans KR, sans-serif" font-size="19" fill="#475569">한 번 실행, 건별 반복, 분할 실행, Center-Cut 중 선택합니다.</text><rect x="72" y="290" width="1296" height="88" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><circle cx="120" cy="334" r="25" fill="#0f766e"/><text x="120" y="342" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#ffffff">2</text><text x="168" y="324" font-family="Arial, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Job·Step 설계</text><text x="168" y="356" font-family="Arial, Noto Sans KR, sans-serif" font-size="19" fill="#475569">입력, 처리, 출력, Commit 간격과 재시작 기준을 정합니다.</text><rect x="72" y="410" width="1296" height="88" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><circle cx="120" cy="454" r="25" fill="#0f766e"/><text x="120" y="462" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#ffffff">3</text><text x="168" y="444" font-family="Arial, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#0f172a">실행 등록</text><text x="168" y="476" font-family="Arial, Noto Sans KR, sans-serif" font-size="19" fill="#475569">Parameter·Version·Schedule·Worker·Artifact를 등록합니다.</text><rect x="72" y="530" width="1296" height="88" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><circle cx="120" cy="574" r="25" fill="#0f766e"/><text x="120" y="582" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#ffffff">4</text><text x="168" y="564" font-family="Arial, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#0f172a">사전 확인</text><text x="168" y="596" font-family="Arial, Noto Sans KR, sans-serif" font-size="19" fill="#475569">Dry Run과 예상 건수·합계를 확인하고 필요한 승인을 받습니다.</text><rect x="72" y="650" width="1296" height="88" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><circle cx="120" cy="694" r="25" fill="#0f766e"/><text x="120" y="702" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#ffffff">5</text><text x="168" y="684" font-family="Arial, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#0f172a">실행·제어</text><text x="168" y="716" font-family="Arial, Noto Sans KR, sans-serif" font-size="19" fill="#475569">진행률을 확인하고 중지·재시작·재처리를 수행합니다.</text><rect x="72" y="770" width="1296" height="88" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><circle cx="120" cy="814" r="25" fill="#0f766e"/><text x="120" y="822" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#ffffff">6</text><text x="168" y="804" font-family="Arial, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#0f172a">대사·종료</text><text x="168" y="836" font-family="Arial, Noto Sans KR, sans-serif" font-size="19" fill="#475569">처리 건수·금액·오류·감사를 대사해 업무 종료를 확정합니다.</text><text x="72" y="916" font-family="Arial, Noto Sans KR, sans-serif" font-size="18" fill="#334155">배치 개발자와 운영자는 같은 Job 식별자와 결과 기준을 사용합니다.</text></svg>
