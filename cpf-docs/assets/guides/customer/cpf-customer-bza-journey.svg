<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="950" viewBox="0 0 1440 950" role="img" aria-labelledby="title desc">
<title id="title">BZA로 고객 업무 관리 기능 구성</title><desc id="desc">조직·사용자·권한·결재를 고객 업무 서비스에 연결합니다.</desc>
<rect width="1440" height="950" rx="28" fill="#f8fafc"/>
<text x="72" y="72" font-family="Arial, Noto Sans KR, sans-serif" font-size="36" font-weight="700" fill="#0f172a">BZA로 고객 업무 관리 기능 구성</text>
<text x="72" y="116" font-family="Arial, Noto Sans KR, sans-serif" font-size="22" fill="#475569">조직·사용자·권한·결재를 고객 업무 서비스에 연결합니다.</text><rect x="72" y="170" width="1296" height="88" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><circle cx="120" cy="214" r="25" fill="#0f766e"/><text x="120" y="222" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#ffffff">1</text><text x="168" y="204" font-family="Arial, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#0f172a">조직 기준 준비</text><text x="168" y="236" font-family="Arial, Noto Sans KR, sans-serif" font-size="19" fill="#475569">조직·직원·직급·직책·발령의 기준일과 원천을 정합니다.</text><rect x="72" y="290" width="1296" height="88" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><circle cx="120" cy="334" r="25" fill="#0f766e"/><text x="120" y="342" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#ffffff">2</text><text x="168" y="324" font-family="Arial, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#0f172a">사용자·역할 구성</text><text x="168" y="356" font-family="Arial, Noto Sans KR, sans-serif" font-size="19" fill="#475569">사용자와 역할을 만들고 유효기간·데이터 범위를 부여합니다.</text><rect x="72" y="410" width="1296" height="88" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><circle cx="120" cy="454" r="25" fill="#0f766e"/><text x="120" y="462" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#ffffff">3</text><text x="168" y="444" font-family="Arial, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#0f172a">업무 권한 연결</text><text x="168" y="476" font-family="Arial, Noto Sans KR, sans-serif" font-size="19" fill="#475569">메뉴·버튼·API·데이터 범위를 고객 업무 기능과 연결합니다.</text><rect x="72" y="530" width="1296" height="88" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><circle cx="120" cy="574" r="25" fill="#0f766e"/><text x="120" y="582" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#ffffff">4</text><text x="168" y="564" font-family="Arial, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#0f172a">결재 정책 구성</text><text x="168" y="596" font-family="Arial, Noto Sans KR, sans-serif" font-size="19" fill="#475569">상신 조건, 결재선, 위임·대결, 유효기간을 구성합니다.</text><rect x="72" y="650" width="1296" height="88" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><circle cx="120" cy="694" r="25" fill="#0f766e"/><text x="120" y="702" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#ffffff">5</text><text x="168" y="684" font-family="Arial, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#0f172a">업무 연동</text><text x="168" y="716" font-family="Arial, Noto Sans KR, sans-serif" font-size="19" fill="#475569">고객 업무의 신청·승인·첨부·알림·감사 흐름을 연결합니다.</text><rect x="72" y="770" width="1296" height="88" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><circle cx="120" cy="814" r="25" fill="#0f766e"/><text x="120" y="822" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#ffffff">6</text><text x="168" y="804" font-family="Arial, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#0f172a">운영·감사</text><text x="168" y="836" font-family="Arial, Noto Sans KR, sans-serif" font-size="19" fill="#475569">Session·권한 분석·Download·감사 이력을 확인합니다.</text><text x="72" y="916" font-family="Arial, Noto Sans KR, sans-serif" font-size="18" fill="#334155">기존 BZA 기능을 우선 사용하고 고객 업무 규칙만 연동합니다.</text></svg>
