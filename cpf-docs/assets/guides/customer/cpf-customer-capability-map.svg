<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="830" viewBox="0 0 1440 830" role="img" aria-labelledby="title desc">
<title id="title">CPF로 만들 수 있는 업무 기능</title><desc id="desc">내부 모듈이 아니라 고객이 완성할 수 있는 결과로 기능을 선택합니다.</desc>
<rect width="1440" height="830" rx="28" fill="#f8fafc"/>
<text x="72" y="72" font-family="Arial, Noto Sans KR, sans-serif" font-size="36" font-weight="700" fill="#0f172a">CPF로 만들 수 있는 업무 기능</text>
<text x="72" y="116" font-family="Arial, Noto Sans KR, sans-serif" font-size="22" fill="#475569">내부 모듈이 아니라 고객이 완성할 수 있는 결과로 기능을 선택합니다.</text><rect x="72" y="170" width="1296" height="88" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><circle cx="120" cy="214" r="25" fill="#0f766e"/><text x="120" y="222" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#ffffff">1</text><text x="168" y="204" font-family="Arial, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#0f172a">업무 기능 선택</text><text x="168" y="236" font-family="Arial, Noto Sans KR, sans-serif" font-size="19" fill="#475569">조회·등록·변경·승인·배치·연계 중 필요한 결과를 고릅니다.</text><rect x="72" y="290" width="1296" height="88" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><circle cx="120" cy="334" r="25" fill="#0f766e"/><text x="120" y="342" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#ffffff">2</text><text x="168" y="324" font-family="Arial, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#0f172a">개발 방식 선택</text><text x="168" y="356" font-family="Arial, Noto Sans KR, sans-serif" font-size="19" fill="#475569">동기 API, Kafka 이벤트, 파일, 배치, Gateway 중 업무 특성에 맞는 방식을 선택합니다.</text><rect x="72" y="410" width="1296" height="88" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><circle cx="120" cy="454" r="25" fill="#0f766e"/><text x="120" y="462" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#ffffff">3</text><text x="168" y="444" font-family="Arial, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#0f172a">운영 연결</text><text x="168" y="476" font-family="Arial, Noto Sans KR, sans-serif" font-size="19" fill="#475569">ADM 조회·조치·감사와 로그·지표·알림을 함께 연결합니다.</text><rect x="72" y="530" width="1296" height="88" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><circle cx="120" cy="574" r="25" fill="#0f766e"/><text x="120" y="582" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#ffffff">4</text><text x="168" y="564" font-family="Arial, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#0f172a">교육 예제 실행</text><text x="168" y="596" font-family="Arial, Noto Sans KR, sans-serif" font-size="19" fill="#475569">cpf-reference와 매뉴얼 EDU를 실행한 뒤 고객 업무명과 규칙으로 바꿉니다.</text><rect x="72" y="650" width="1296" height="88" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><circle cx="120" cy="694" r="25" fill="#0f766e"/><text x="120" y="702" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#ffffff">5</text><text x="168" y="684" font-family="Arial, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#0f172a">배포·복구 인계</text><text x="168" y="716" font-family="Arial, Noto Sans KR, sans-serif" font-size="19" fill="#475569">설정·DB·권한·Runbook과 정상 결과를 운영팀에 전달합니다.</text><text x="72" y="796" font-family="Arial, Noto Sans KR, sans-serif" font-size="18" fill="#334155">상세 절차는 역할별 매뉴얼에서 기능 단위로 이어집니다.</text></svg>
