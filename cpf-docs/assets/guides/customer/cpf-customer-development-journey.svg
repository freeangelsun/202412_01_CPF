<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="950" viewBox="0 0 1440 950" role="img" aria-labelledby="title desc">
<title id="title">고객 업무 기능 개발 순서</title><desc id="desc">요구사항을 CPF 기능으로 바꾸고 운영 가능한 업무 서비스로 완성합니다.</desc>
<rect width="1440" height="950" rx="28" fill="#f8fafc"/>
<text x="72" y="72" font-family="Arial, Noto Sans KR, sans-serif" font-size="36" font-weight="700" fill="#0f172a">고객 업무 기능 개발 순서</text>
<text x="72" y="116" font-family="Arial, Noto Sans KR, sans-serif" font-size="22" fill="#475569">요구사항을 CPF 기능으로 바꾸고 운영 가능한 업무 서비스로 완성합니다.</text><rect x="72" y="170" width="1296" height="88" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><circle cx="120" cy="214" r="25" fill="#0f766e"/><text x="120" y="222" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#ffffff">1</text><text x="168" y="204" font-family="Arial, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#0f172a">업무 결과 정의</text><text x="168" y="236" font-family="Arial, Noto Sans KR, sans-serif" font-size="19" fill="#475569">사용자가 얻을 결과, 상태 변화, 실패 시 행동을 먼저 정합니다.</text><rect x="72" y="290" width="1296" height="88" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><circle cx="120" cy="334" r="25" fill="#0f766e"/><text x="120" y="342" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#ffffff">2</text><text x="168" y="324" font-family="Arial, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#0f172a">업무 영역 생성</text><text x="168" y="356" font-family="Arial, Noto Sans KR, sans-serif" font-size="19" fill="#475569">Generator로 모듈·Package·DB·기본 설정을 준비합니다.</text><rect x="72" y="410" width="1296" height="88" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><circle cx="120" cy="454" r="25" fill="#0f766e"/><text x="120" y="462" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#ffffff">3</text><text x="168" y="444" font-family="Arial, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#0f172a">기능 유형 구현</text><text x="168" y="476" font-family="Arial, Noto Sans KR, sans-serif" font-size="19" fill="#475569">조회, 상태 변경, 메시지, 파일, 외부 연계 중 해당 장을 따라 구현합니다.</text><rect x="72" y="530" width="1296" height="88" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><circle cx="120" cy="574" r="25" fill="#0f766e"/><text x="120" y="582" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#ffffff">4</text><text x="168" y="564" font-family="Arial, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#0f172a">신뢰성 연결</text><text x="168" y="596" font-family="Arial, Noto Sans KR, sans-serif" font-size="19" fill="#475569">권한·멱등성·동시성·감사·응답 유실 대사를 연결합니다.</text><rect x="72" y="650" width="1296" height="88" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><circle cx="120" cy="694" r="25" fill="#0f766e"/><text x="120" y="702" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#ffffff">5</text><text x="168" y="684" font-family="Arial, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#0f172a">시험과 ADM 확인</text><text x="168" y="716" font-family="Arial, Noto Sans KR, sans-serif" font-size="19" fill="#475569">정상·오류·중복·Timeout을 시험하고 ADM에서 결과를 확인합니다.</text><rect x="72" y="770" width="1296" height="88" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><circle cx="120" cy="814" r="25" fill="#0f766e"/><text x="120" y="822" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#ffffff">6</text><text x="168" y="804" font-family="Arial, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#0f172a">운영 인계</text><text x="168" y="836" font-family="Arial, Noto Sans KR, sans-serif" font-size="19" fill="#475569">배포 파일, 설정, DB 변경, 관측, 복구 절차를 전달합니다.</text><text x="72" y="916" font-family="Arial, Noto Sans KR, sans-serif" font-size="18" fill="#334155">개발자 매뉴얼의 기능 장은 이 순서를 반복해서 사용합니다.</text></svg>
