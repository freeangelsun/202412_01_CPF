<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760"><rect width="1500" height="760" fill="white"/><style>text{font-family:'NanumSquare','Noto Sans CJK KR','Malgun Gothic',sans-serif;}</style><text x="42" y="62" font-size="34" fill="#18233D" font-weight="800">배치 Job 개발 표준 흐름</text><text x="42" y="98" font-size="19" fill="#667085">처리 성격에 맞게 Tasklet/Chunk를 선택하고 Transaction·Checkpoint·Restart 가능성을 함께 설계합니다.</text><line x1="42" y1="120" x2="1458" y2="120" stroke="#D7DFED" stroke-width="2"/><rect x="40" y="230" width="245" height="250" rx="18" fill="#FCFDFF" stroke="#4F6EF7" stroke-width="2"/><text x="162" y="275" font-size="20" fill="#4F6EF7" font-weight="800" text-anchor="middle">1. Job 유형 선택</text><text x="162" y="325" font-size="17" fill="#18233D" font-weight="650" text-anchor="middle">Tasklet</text><text x="162" y="359" font-size="17" fill="#18233D" font-weight="650" text-anchor="middle">Chunk</text><text x="162" y="393" font-size="17" fill="#18233D" font-weight="650" text-anchor="middle">Partition</text><line x1="288" y1="355" x2="325" y2="355" stroke="#4F6EF7" stroke-width="3"/><polygon points="325,355 313.4,362.8 313.4,347.2" fill="#4F6EF7"/><rect x="330" y="230" width="245" height="250" rx="18" fill="#FCFDFF" stroke="#58B7C9" stroke-width="2"/><text x="452" y="275" font-size="20" fill="#58B7C9" font-weight="800" text-anchor="middle">2. Step 구현</text><text x="452" y="325" font-size="17" fill="#18233D" font-weight="650" text-anchor="middle">Tasklet 또는</text><text x="452" y="359" font-size="17" fill="#18233D" font-weight="650" text-anchor="middle">Reader/Processor/Writer</text><line x1="578" y1="355" x2="615" y2="355" stroke="#58B7C9" stroke-width="3"/><polygon points="615,355 603.4,362.8 603.4,347.2" fill="#58B7C9"/><rect x="620" y="230" width="245" height="250" rx="18" fill="#FCFDFF" stroke="#5EAD73" stroke-width="2"/><text x="742" y="275" font-size="20" fill="#5EAD73" font-weight="800" text-anchor="middle">3. 실행 단위</text><text x="742" y="325" font-size="17" fill="#18233D" font-weight="650" text-anchor="middle">Parameter</text><text x="742" y="359" font-size="17" fill="#18233D" font-weight="650" text-anchor="middle">Chunk/Commit</text><line x1="868" y1="355" x2="905" y2="355" stroke="#5EAD73" stroke-width="3"/><polygon points="905,355 893.4,362.8 893.4,347.2" fill="#5EAD73"/><rect x="910" y="230" width="245" height="250" rx="18" fill="#FCFDFF" stroke="#7357E8" stroke-width="2"/><text x="1032" y="275" font-size="20" fill="#7357E8" font-weight="800" text-anchor="middle">4. 실패 전략</text><text x="1032" y="325" font-size="17" fill="#18233D" font-weight="650" text-anchor="middle">Retry/Skip</text><text x="1032" y="359" font-size="17" fill="#18233D" font-weight="650" text-anchor="middle">Checkpoint/Restart</text><line x1="1158" y1="355" x2="1195" y2="355" stroke="#7357E8" stroke-width="3"/><polygon points="1195,355 1183.4,362.8 1183.4,347.2" fill="#7357E8"/><rect x="1200" y="230" width="245" height="250" rx="18" fill="#FCFDFF" stroke="#E99A42" stroke-width="2"/><text x="1322" y="275" font-size="20" fill="#E99A42" font-weight="800" text-anchor="middle">5. 확장·운영</text><text x="1322" y="325" font-size="17" fill="#18233D" font-weight="650" text-anchor="middle">Worker/Partition</text><text x="1322" y="359" font-size="17" fill="#18233D" font-weight="650" text-anchor="middle">Scheduler/Center-Cut</text><rect x="150" y="560" width="1200" height="100" rx="16" fill="#F4F7FB" stroke="#D7DFED" stroke-width="2"/><text x="750" y="600" font-size="19" fill="#18233D" font-weight="750" text-anchor="middle">업무량 증가 시 Worker/Agent를 추가하고, 운영 제어와 실제 Job 처리를 분리합니다.</text><text x="750" y="634" font-size="16" fill="#667085" font-weight="600" text-anchor="middle">Restart와 Reprocess는 같은 동작이 아니므로 Job의 Side Effect와 Checkpoint를 기준으로 선택합니다.</text></svg>