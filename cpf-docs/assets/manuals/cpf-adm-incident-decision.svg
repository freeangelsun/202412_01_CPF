<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">ADM 장애 판정 Tree</title><desc id="desc">화면 Toast보다 Owner 원장과 Operation Evidence를 우선합니다.</desc>
<defs><filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.14"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#425B76"/></marker></defs>
<rect width="100%" height="100%" rx="24" fill="#F8FAFC"/>
<text x="52" y="55" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="30" font-weight="700" fill="#102A43">ADM 장애 판정 Tree</text>
<text x="52" y="88" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="16" fill="#486581">화면 Toast보다 Owner 원장과 Operation Evidence를 우선합니다.</text><rect x="55" y="125" width="220" height="120" rx="16" fill="#E8F1F8" stroke="#9FB3C8" stroke-width="1.5" filter="url(#shadow)"/><text x="73" y="159" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="700" fill="#102A43">이상 발견</text><text x="73" y="187" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">상태·Version</text><text x="73" y="210" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">Operation·기준시각</text><rect x="340" y="80" width="220" height="120" rx="16" fill="#E8F6F3" stroke="#9FB3C8" stroke-width="1.5" filter="url(#shadow)"/><text x="358" y="114" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="700" fill="#102A43">실행 전 실패</text><text x="358" y="142" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">FAILED</text><text x="358" y="165" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">원인 제거 후 새 요청</text><rect x="340" y="260" width="220" height="120" rx="16" fill="#FFF4E6" stroke="#9FB3C8" stroke-width="1.5" filter="url(#shadow)"/><text x="358" y="294" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="700" fill="#102A43">실행 후 불명</text><text x="358" y="322" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">UNKNOWN_RESULT</text><text x="358" y="345" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">Blind Retry 금지</text><rect x="625" y="80" width="220" height="120" rx="16" fill="#EDF2FF" stroke="#9FB3C8" stroke-width="1.5" filter="url(#shadow)"/><text x="643" y="114" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="700" fill="#102A43">여러 Target 혼합</text><text x="643" y="142" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">PARTIAL</text><text x="643" y="165" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">성공 Target 보존</text><rect x="625" y="260" width="220" height="120" rx="16" fill="#F5ECFA" stroke="#9FB3C8" stroke-width="1.5" filter="url(#shadow)"/><text x="643" y="294" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="700" fill="#102A43">적용 거부</text><text x="643" y="322" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">NACK·DRIFT</text><text x="643" y="345" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">실패 Target 확인</text><rect x="910" y="170" width="220" height="120" rx="16" fill="#FFF8CC" stroke="#9FB3C8" stroke-width="1.5" filter="url(#shadow)"/><text x="928" y="204" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="700" fill="#102A43">종결</text><text x="928" y="232" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">Retry·Reconcile</text><text x="928" y="255" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">Compensate·Rollback</text><line x1="275" y1="185.0" x2="340" y2="140.0" stroke="#425B76" stroke-width="2.5" marker-end="url(#arrow)"/><text x="307.5" y="155.5" text-anchor="middle" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="13" fill="#486581">부작용 전</text><line x1="275" y1="185.0" x2="340" y2="320.0" stroke="#425B76" stroke-width="2.5" marker-end="url(#arrow)"/><text x="307.5" y="245.5" text-anchor="middle" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="13" fill="#486581">부작용 후</text><line x1="560" y1="140.0" x2="625" y2="140.0" stroke="#425B76" stroke-width="2.5" marker-end="url(#arrow)"/><text x="592.5" y="133.0" text-anchor="middle" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="13" fill="#486581">혼합</text><line x1="560" y1="320.0" x2="625" y2="320.0" stroke="#425B76" stroke-width="2.5" marker-end="url(#arrow)"/><text x="592.5" y="313.0" text-anchor="middle" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="13" fill="#486581">적용계</text><line x1="845" y1="140.0" x2="910" y2="230.0" stroke="#425B76" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="845" y1="320.0" x2="910" y2="230.0" stroke="#425B76" stroke-width="2.5" marker-end="url(#arrow)"/></svg>
