<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">ADM Runtime 변경 화면</title><desc id="desc">Preview·Target Snapshot·Approval·Target별 적용·Rollback을 한 Operation으로 추적한다.</desc>
