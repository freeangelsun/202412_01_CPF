<line x1="555" y1="255" x2="590" y2="255" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="825" y1="255" x2="860" y2="255" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
