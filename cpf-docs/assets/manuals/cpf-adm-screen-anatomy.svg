<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="540" viewBox="0 0 1080 540" role="img" aria-labelledby="title desc">
  <title id="title">ADM 화면 구성</title>
  <desc id="desc">검색·목록·상세·조치·Audit의 표준 배치</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3b5268"/>
    </marker>
    <style>
      .title{font:700 28px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#102a43}
      .subtitle{font:400 15px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#486581}
      .boxTitle{font:700 16px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#102a43}
      .boxText{font:400 13px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#334e68}
      .line{stroke:#3b5268;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#829ab1;stroke-width:2;fill:none;stroke-dasharray:7 5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="100%" height="100%" rx="24" fill="#f7fafc"/>
  <text x="44" y="48" class="title">ADM 화면 구성</text>
  <text x="44" y="76" class="subtitle">검색·목록·상세·조치·Audit의 표준 배치</text>
  <g filter="url(#shadow)"><rect x="50" y="110" width="250" height="80" rx="14" fill="#e8f1f8" stroke="#8bb8d8" stroke-width="1.5"/><text x="66" y="138" class="boxTitle">검색 영역</text><text x="66" y="162" class="boxText">기간·상태·식별자</text></g><g filter="url(#shadow)"><rect x="50" y="220" width="520" height="150" rx="14" fill="#e8f1f8" stroke="#8bb8d8" stroke-width="1.5"/><text x="66" y="248" class="boxTitle">목록 Table</text><text x="66" y="272" class="boxText">상태·Version·Owner·Updated</text><text x="66" y="292" class="boxText">행 선택 → 상세</text></g><g filter="url(#shadow)"><rect x="620" y="110" width="400" height="260" rx="14" fill="#e8f1f8" stroke="#8bb8d8" stroke-width="1.5"/><text x="636" y="138" class="boxTitle">상세·Timeline</text><text x="636" y="162" class="boxText">요청·Attempt·Error</text><text x="636" y="182" class="boxText">Target·ACK/NACK</text><text x="636" y="202" class="boxText">Audit Link</text></g><g filter="url(#shadow)"><rect x="260" y="410" width="540" height="80" rx="14" fill="#fff4e6" stroke="#e7a75f" stroke-width="1.5"/><text x="276" y="438" class="boxTitle">조치 Form</text><text x="276" y="462" class="boxText">Reason·Expected Version·Approval·Operation ID</text></g><path d="M300,150 L620,150" class="line"/><path d="M570,295 L620,295" class="line"/><path d="M820,370 L530,410" class="dash"/>
</svg>