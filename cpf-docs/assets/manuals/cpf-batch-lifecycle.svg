<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="450" viewBox="0 0 1040 450" role="img" aria-labelledby="title desc">
  <title id="title">Batch 실행·중지·재시작·재처리</title>
  <desc id="desc">Spring Batch Metadata와 업무 원장을 함께 대사</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3b5268"/>
    </marker>
    <style>
      .title{font:700 28px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#102a43}
      .subtitle{font:400 15px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#486581}
      .boxTitle{font:700 16px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#102a43}
      .boxText{font:400 13px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#334e68}
      .line{stroke:#3b5268;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#829ab1;stroke-width:2;fill:none;stroke-dasharray:7 5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="100%" height="100%" rx="24" fill="#f7fafc"/>
  <text x="44" y="48" class="title">Batch 실행·중지·재시작·재처리</text>
  <text x="44" y="76" class="subtitle">Spring Batch Metadata와 업무 원장을 함께 대사</text>
  <g filter="url(#shadow)"><rect x="70" y="130" width="145" height="80" rx="14" fill="#edf2ff" stroke="#788dd3" stroke-width="1.5"/><text x="86" y="158" class="boxTitle">PREVIEW</text></g><g filter="url(#shadow)"><rect x="255" y="130" width="145" height="80" rx="14" fill="#edf2ff" stroke="#788dd3" stroke-width="1.5"/><text x="271" y="158" class="boxTitle">APPROVED</text></g><g filter="url(#shadow)"><rect x="440" y="130" width="145" height="80" rx="14" fill="#edf2ff" stroke="#788dd3" stroke-width="1.5"/><text x="456" y="158" class="boxTitle">RUNNING</text></g><g filter="url(#shadow)"><rect x="625" y="130" width="145" height="80" rx="14" fill="#edf2ff" stroke="#788dd3" stroke-width="1.5"/><text x="641" y="158" class="boxTitle">STOPPED</text></g><g filter="url(#shadow)"><rect x="810" y="130" width="145" height="80" rx="14" fill="#edf2ff" stroke="#788dd3" stroke-width="1.5"/><text x="826" y="158" class="boxTitle">COMPLETED</text></g><path d="M215,170 L255,170" class="line"/><path d="M400,170 L440,170" class="line"/><path d="M585,170 L625,170" class="line"/><path d="M770,170 L810,170" class="line"/><g filter="url(#shadow)"><rect x="315" y="300" width="180" height="90" rx="14" fill="#fdecec" stroke="#d97b7b" stroke-width="1.5"/><text x="331" y="328" class="boxTitle">FAILED</text><text x="331" y="352" class="boxText">Restart</text></g><g filter="url(#shadow)"><rect x="565" y="300" width="180" height="90" rx="14" fill="#fff4e6" stroke="#e7a75f" stroke-width="1.5"/><text x="581" y="328" class="boxTitle">UNKNOWN</text><text x="581" y="352" class="boxText">Reconcile</text></g><g filter="url(#shadow)"><rect x="815" y="300" width="180" height="90" rx="14" fill="#e8f6f3" stroke="#57a995" stroke-width="1.5"/><text x="831" y="328" class="boxTitle">REPROCESS</text><text x="831" y="352" class="boxText">새 Manifest</text></g><path d="M510,210 L405,300" class="dash"/><path d="M690,210 L655,300" class="dash"/><path d="M900,210 L905,300" class="dash"/>
</svg>