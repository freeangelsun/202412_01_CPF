<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470" role="img" aria-labelledby="title desc">
  <title id="title">BZA 권한·결재 모델</title>
  <desc id="desc">사용자 실효 권한과 결재 참여자 Snapshot을 유효기간으로 계산</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3b5268"/>
    </marker>
    <style>
      .title{font:700 28px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#102a43}
      .subtitle{font:400 15px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#486581}
      .boxTitle{font:700 16px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#102a43}
      .boxText{font:400 13px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#334e68}
      .line{stroke:#3b5268;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#829ab1;stroke-width:2;fill:none;stroke-dasharray:7 5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="100%" height="100%" rx="24" fill="#f7fafc"/>
  <text x="44" y="48" class="title">BZA 권한·결재 모델</text>
  <text x="44" y="76" class="subtitle">사용자 실효 권한과 결재 참여자 Snapshot을 유효기간으로 계산</text>
  <g filter="url(#shadow)"><rect x="50" y="130" width="180" height="100" rx="14" fill="#fff4e6" stroke="#e7a75f" stroke-width="1.5"/><text x="66" y="158" class="boxTitle">User</text><text x="66" y="182" class="boxText">직원·Service Account</text></g><g filter="url(#shadow)"><rect x="300" y="130" width="180" height="100" rx="14" fill="#e8f6f3" stroke="#57a995" stroke-width="1.5"/><text x="316" y="158" class="boxTitle">User Role</text><text x="316" y="182" class="boxText">유효기간</text></g><g filter="url(#shadow)"><rect x="550" y="130" width="180" height="100" rx="14" fill="#e8f1f8" stroke="#8bb8d8" stroke-width="1.5"/><text x="566" y="158" class="boxTitle">Role</text><text x="566" y="182" class="boxText">Permission 묶음</text></g><g filter="url(#shadow)"><rect x="800" y="110" width="220" height="140" rx="14" fill="#edf2ff" stroke="#788dd3" stroke-width="1.5"/><text x="816" y="138" class="boxTitle">Permission</text><text x="816" y="162" class="boxText">Menu·Action·API</text><text x="816" y="182" class="boxText">Data Scope·Masking</text></g><path d="M230,180 L300,180" class="line"/><path d="M480,180 L550,180" class="line"/><path d="M730,180 L800,180" class="line"/><g filter="url(#shadow)"><rect x="390" y="330" width="250" height="90" rx="14" fill="#fff4e6" stroke="#e7a75f" stroke-width="1.5"/><text x="406" y="358" class="boxTitle">Approval Snapshot</text><text x="406" y="382" class="boxText">정책·참여자·위임 Version</text></g><path d="M910,250 L515,330" class="dash"/>
</svg>