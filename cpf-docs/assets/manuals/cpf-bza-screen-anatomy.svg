<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="455" viewBox="0 0 1060 455" role="img" aria-labelledby="title desc">
  <title id="title">BZA 화면 구성</title>
  <desc id="desc">기준일·유효기간·실효 결과·영향을 함께 확인</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3b5268"/>
    </marker>
    <style>
      .title{font:700 28px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#102a43}
      .subtitle{font:400 15px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#486581}
      .boxTitle{font:700 16px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#102a43}
      .boxText{font:400 13px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#334e68}
      .line{stroke:#3b5268;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#829ab1;stroke-width:2;fill:none;stroke-dasharray:7 5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="100%" height="100%" rx="24" fill="#f7fafc"/>
  <text x="44" y="48" class="title">BZA 화면 구성</text>
  <text x="44" y="76" class="subtitle">기준일·유효기간·실효 결과·영향을 함께 확인</text>
  <g filter="url(#shadow)"><rect x="55" y="115" width="260" height="90" rx="14" fill="#e8f1f8" stroke="#8bb8d8" stroke-width="1.5"/><text x="71" y="143" class="boxTitle">기준정보</text><text x="71" y="167" class="boxText">조직·직원·Role</text></g><g filter="url(#shadow)"><rect x="380" y="115" width="260" height="90" rx="14" fill="#e8f1f8" stroke="#8bb8d8" stroke-width="1.5"/><text x="396" y="143" class="boxTitle">유효기간</text><text x="396" y="167" class="boxText">From·To·Version</text></g><g filter="url(#shadow)"><rect x="705" y="115" width="300" height="90" rx="14" fill="#e8f1f8" stroke="#8bb8d8" stroke-width="1.5"/><text x="721" y="143" class="boxTitle">실효 결과</text><text x="721" y="167" class="boxText">Permission·Participant</text></g><path d="M315,160 L380,160" class="line"/><path d="M640,160 L705,160" class="line"/><g filter="url(#shadow)"><rect x="180" y="300" width="300" height="100" rx="14" fill="#e8f1f8" stroke="#8bb8d8" stroke-width="1.5"/><text x="196" y="328" class="boxTitle">변경 Form</text><text x="196" y="352" class="boxText">Reason·Expected Version</text></g><g filter="url(#shadow)"><rect x="600" y="300" width="300" height="100" rx="14" fill="#e8f1f8" stroke="#8bb8d8" stroke-width="1.5"/><text x="616" y="328" class="boxTitle">영향·Audit</text><text x="616" y="352" class="boxText">Role·결재·Session</text></g><path d="M835,205 L750,300" class="dash"/><path d="M480,350 L600,350" class="line"/>
</svg>