<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">CPF Durable Cache Invalidation</title><desc id="desc">DB ledger is authoritative; fast signal only reduces propagation latency.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.18"/></filter></defs>
<rect width="1400" height="820" fill="#f8fafc"/>
<text x="70" y="65" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">CPF Durable Cache Invalidation</text>
<text x="70" y="102" font-family="Arial,sans-serif" font-size="18" fill="#475569">DB ledger is authoritative; fast signal only reduces propagation latency.</text>
<line x1="315" y1="258" x2="360" y2="258" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<text x="337" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#475569">append</text>
<line x1="610" y1="258" x2="655" y2="258" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<text x="632" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#475569">apply</text>
<line x1="905" y1="258" x2="950" y2="258" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<text x="927" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#475569">checkpoint</text>
<line x1="1078" y1="345" x2="1078" y2="490" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1078" y="409" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#475569">verify</text>
<line x1="487" y1="345" x2="487" y2="490" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<text x="487" y="409" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#475569">signal</text>
<line x1="610" y1="575" x2="655" y2="575" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<text x="632" y="567" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#475569">recover</text>
<line x1="905" y1="575" x2="950" y2="575" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<text x="927" y="567" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#475569">converge</text>
<rect x="70" y="170" width="245" height="175" rx="15" fill="#fff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
<text x="90" y="206" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">1. Request</text>
<text x="90" y="240" font-family="Arial,sans-serif" font-size="15" fill="#334155">eventKey·tenant·namespace·key</text>
<text x="90" y="266" font-family="Arial,sans-serif" font-size="15" fill="#334155">version·reason·requestedBy</text>
<rect x="365" y="170" width="245" height="175" rx="15" fill="#fff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
<text x="385" y="206" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">2. Durable append</text>
<text x="385" y="240" font-family="Arial,sans-serif" font-size="15" fill="#334155">DB invalidation ledger</text>
<text x="385" y="266" font-family="Arial,sans-serif" font-size="15" fill="#334155">event_id 단조 증가</text>
<rect x="660" y="170" width="245" height="175" rx="15" fill="#fff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
<text x="680" y="206" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">3. Local apply</text>
<text x="680" y="240" font-family="Arial,sans-serif" font-size="15" fill="#334155">Key 또는 Namespace Evict</text>
<text x="680" y="266" font-family="Arial,sans-serif" font-size="15" fill="#334155">Provider 오류는 실패</text>
<rect x="955" y="170" width="245" height="175" rx="15" fill="#fff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
<text x="975" y="206" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">4. Checkpoint</text>
<text x="975" y="240" font-family="Arial,sans-serif" font-size="15" fill="#334155">consumer_id·last_event_id</text>
<text x="975" y="266" font-family="Arial,sans-serif" font-size="15" fill="#334155">apply 성공 후 전진</text>
<rect x="365" y="500" width="245" height="155" rx="15" fill="#fff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
<text x="385" y="536" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">Fast signal</text>
<text x="385" y="570" font-family="Arial,sans-serif" font-size="15" fill="#334155">Valkey Channel publish</text>
<text x="385" y="596" font-family="Arial,sans-serif" font-size="15" fill="#334155">best effort</text>
<rect x="660" y="500" width="245" height="155" rx="15" fill="#fff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
<text x="680" y="536" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">Reconcile</text>
<text x="680" y="570" font-family="Arial,sans-serif" font-size="15" fill="#334155">checkpoint 이후 load</text>
<text x="680" y="596" font-family="Arial,sans-serif" font-size="15" fill="#334155">batch/max-batches</text>
<rect x="955" y="500" width="245" height="155" rx="15" fill="#fff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
<text x="975" y="536" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">정상 판정</text>
<text x="975" y="570" font-family="Arial,sans-serif" font-size="15" fill="#334155">Event 존재·Cache 반영</text>
<text x="975" y="596" font-family="Arial,sans-serif" font-size="15" fill="#334155">Checkpoint·Lag 0</text>
</svg>
