<text x="52" y="88" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="16" fill="#486581">논리 계약은 같게 유지하고 Vendor 문법·검증·Rollback을 분리합니다.</text><rect x="50" y="125" width="205" height="130" rx="16" fill="#E8F1F8" stroke="#9FB3C8" stroke-width="1.5" filter="url(#shadow)"/><text x="68" y="159" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="700" fill="#102A43">Canonical Model</text><text x="68" y="187" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">Table·Index·Constraint</text><text x="68" y="210" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">Query ID·상태</text><rect x="315" y="80" width="205" height="120" rx="16" fill="#E8F6F3" stroke="#9FB3C8" stroke-width="1.5" filter="url(#shadow)"/><text x="333" y="114" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="700" fill="#102A43">MariaDB</text><text x="333" y="142" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">Install·Migration</text><text x="333" y="165" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">Verify·Rollback</text><rect x="315" y="260" width="205" height="120" rx="16" fill="#FFF4E6" stroke="#9FB3C8" stroke-width="1.5" filter="url(#shadow)"/><text x="333" y="294" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="700" fill="#102A43">PostgreSQL</text><text x="333" y="322" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">Install·Migration</text><text x="333" y="345" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">Verify·Rollback</text><rect x="580" y="80" width="205" height="120" rx="16" fill="#EDF2FF" stroke="#9FB3C8" stroke-width="1.5" filter="url(#shadow)"/><text x="598" y="114" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="700" fill="#102A43">Oracle</text><text x="598" y="142" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">Install·Migration</text><text x="598" y="165" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">Verify·Rollback</text><rect x="580" y="260" width="205" height="120" rx="16" fill="#F5ECFA" stroke="#9FB3C8" stroke-width="1.5" filter="url(#shadow)"/><text x="598" y="294" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="700" fill="#102A43">Drift 검사</text><text x="598" y="322" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">Checksum·Object</text><text x="598" y="345" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">Query consumer</text><rect x="850" y="170" width="250" height="130" rx="16" fill="#FFF8CC" stroke="#9FB3C8" stroke-width="1.5" filter="url(#shadow)"/><text x="868" y="204" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="700" fill="#102A43">Upgrade·Recovery</text><text x="868" y="232" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">Backup·Forward recovery</text><text x="868" y="255" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">Rollback·Restore drill</text><line x1="255" y1="190.0" x2="315" y2="140.0" stroke="#425B76" stroke-width="2.5" marker-end="url(#arrow)"/><text x="285.0" y="158.0" text-anchor="middle" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="13" fill="#486581">생성</text><line x1="255" y1="190.0" x2="315" y2="320.0" stroke="#425B76" stroke-width="2.5" marker-end="url(#arrow)"/><text x="285.0" y="248.0" text-anchor="middle" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="13" fill="#48