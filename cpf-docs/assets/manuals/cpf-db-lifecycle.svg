<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="445" viewBox="0 0 1160 445" role="img" aria-labelledby="title desc">
  <title id="title">Database Lifecycle</title>
  <desc id="desc">MariaDB·PostgreSQL·Oracle을 같은 변경 Chain으로 관리</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3b5268"/>
    </marker>
    <style>
      .title{font:700 28px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#102a43}
      .subtitle{font:400 15px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#486581}
      .boxTitle{font:700 16px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#102a43}
      .boxText{font:400 13px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#334e68}
      .line{stroke:#3b5268;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#829ab1;stroke-width:2;fill:none;stroke-dasharray:7 5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="100%" height="100%" rx="24" fill="#f7fafc"/>
  <text x="44" y="48" class="title">Database Lifecycle</text>
  <text x="44" y="76" class="subtitle">MariaDB·PostgreSQL·Oracle을 같은 변경 Chain으로 관리</text>
  <g filter="url(#shadow)"><rect x="35" y="130" width="130" height="82" rx="14" fill="#e8f1f8" stroke="#8bb8d8" stroke-width="1.5"/><text x="51" y="158" class="boxTitle">Canonical</text></g><g filter="url(#shadow)"><rect x="190" y="130" width="130" height="82" rx="14" fill="#e8f1f8" stroke="#8bb8d8" stroke-width="1.5"/><text x="206" y="158" class="boxTitle">Template</text></g><g filter="url(#shadow)"><rect x="345" y="130" width="130" height="82" rx="14" fill="#e8f1f8" stroke="#8bb8d8" stroke-width="1.5"/><text x="361" y="158" class="boxTitle">3 Vendor SQL</text></g><g filter="url(#shadow)"><rect x="520" y="130" width="130" height="82" rx="14" fill="#e8f1f8" stroke="#8bb8d8" stroke-width="1.5"/><text x="536" y="158" class="boxTitle">Install</text></g><g filter="url(#shadow)"><rect x="675" y="130" width="130" height="82" rx="14" fill="#e8f1f8" stroke="#8bb8d8" stroke-width="1.5"/><text x="691" y="158" class="boxTitle">Upgrade</text></g><g filter="url(#shadow)"><rect x="830" y="130" width="130" height="82" rx="14" fill="#e8f1f8" stroke="#8bb8d8" stroke-width="1.5"/><text x="846" y="158" class="boxTitle">Verify·Drift</text></g><g filter="url(#shadow)"><rect x="985" y="130" width="130" height="82" rx="14" fill="#e8f1f8" stroke="#8bb8d8" stroke-width="1.5"/><text x="1001" y="158" class="boxTitle">Recovery</text></g><path d="M165,171 L190,171" class="line"/><path d="M320,171 L345,171" class="line"/><path d="M475,171 L520,171" class="line"/><path d="M650,171 L675,171" class="line"/><path d="M805,171 L830,171" class="line"/><path d="M960,171 L985,171" class="line"/><g filter="url(#shadow)"><rect x="300" y="300" width="220" height="90" rx="14" fill="#e8f6f3" stroke="#57a995" stroke-width="1.5"/><text x="316" y="328" class="boxTitle">Fresh Install</text><text x="316" y="352" class="boxText">Empty Schema·Seed</text></g><g filter="url(#shadow)"><rect x="650" y="300" width="220" height="90" rx="14" fill="#fff4e6" stroke="#e7a75f" stroke-width="1.5"/><text x="666" y="328" class="boxTitle">Mixed Version</text><text x="666" y="352" class="boxText">App·DB 호환</text></g><path d="M585,212 L410,300" class="dash"/><path d="M740,212 L760,300" class="dash"/>
</svg>