<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="455" viewBox="0 0 1090 455" role="img" aria-labelledby="title desc">
  <title id="title">Gateway Route 게시</title>
  <desc id="desc">Target·보안·Checksum을 검증하고 Instance별 적용 결과를 수집</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3b5268"/>
    </marker>
    <style>
      .title{font:700 28px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#102a43}
      .subtitle{font:400 15px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#486581}
      .boxTitle{font:700 16px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#102a43}
      .boxText{font:400 13px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#334e68}
      .line{stroke:#3b5268;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#829ab1;stroke-width:2;fill:none;stroke-dasharray:7 5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="100%" height="100%" rx="24" fill="#f7fafc"/>
  <text x="44" y="48" class="title">Gateway Route 게시</text>
  <text x="44" y="76" class="subtitle">Target·보안·Checksum을 검증하고 Instance별 적용 결과를 수집</text>
  <g filter="url(#shadow)"><rect x="45" y="130" width="135" height="82" rx="14" fill="#e8f1f8" stroke="#8bb8d8" stroke-width="1.5"/><text x="61" y="158" class="boxTitle">Draft</text></g><g filter="url(#shadow)"><rect x="210" y="130" width="135" height="82" rx="14" fill="#e8f1f8" stroke="#8bb8d8" stroke-width="1.5"/><text x="226" y="158" class="boxTitle">Validate</text></g><g filter="url(#shadow)"><rect x="375" y="130" width="135" height="82" rx="14" fill="#e8f1f8" stroke="#8bb8d8" stroke-width="1.5"/><text x="391" y="158" class="boxTitle">Connection Test</text></g><g filter="url(#shadow)"><rect x="570" y="130" width="135" height="82" rx="14" fill="#e8f1f8" stroke="#8bb8d8" stroke-width="1.5"/><text x="586" y="158" class="boxTitle">Approve</text></g><g filter="url(#shadow)"><rect x="735" y="130" width="135" height="82" rx="14" fill="#e8f1f8" stroke="#8bb8d8" stroke-width="1.5"/><text x="751" y="158" class="boxTitle">Publish</text></g><g filter="url(#shadow)"><rect x="900" y="130" width="135" height="82" rx="14" fill="#e8f1f8" stroke="#8bb8d8" stroke-width="1.5"/><text x="916" y="158" class="boxTitle">ACK/NACK</text></g><path d="M180,171 L210,171" class="line"/><path d="M345,171 L375,171" class="line"/><path d="M510,171 L570,171" class="line"/><path d="M705,171 L735,171" class="line"/><path d="M870,171 L900,171" class="line"/><g filter="url(#shadow)"><rect x="320" y="310" width="200" height="90" rx="14" fill="#fdecec" stroke="#d97b7b" stroke-width="1.5"/><text x="336" y="338" class="boxTitle">NACK 격리</text><text x="336" y="362" class="boxText">Traffic 제외</text></g><g filter="url(#shadow)"><rect x="650" y="310" width="200" height="90" rx="14" fill="#e8f6f3" stroke="#57a995" stroke-width="1.5"/><text x="666" y="338" class="boxTitle">LKG</text><text x="666" y="362" class="boxText">이전 Route Version</text></g><path d="M968,212 L420,310" class="dash"/><path d="M968,212 L750,310" class="dash"/>
</svg>