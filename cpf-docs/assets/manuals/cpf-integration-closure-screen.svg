<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">통합 운영 정정 승인 화면</title><desc id="desc">격리 데이터 정정은 승인 Snapshot을 고정하고 승인 ID로 실행합니다.</desc>
<defs><filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.14"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#425B76"/></marker></defs>
<rect width="100%" height="100%" rx="24" fill="#F8FAFC"/>
<text x="52" y="55" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="30" font-weight="700" fill="#102A43">통합 운영 정정 승인 화면</text>
<text x="52" y="88" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="16" fill="#486581">격리 데이터 정정은 승인 Snapshot을 고정하고 승인 ID로 실행합니다.</text><rect x="55" y="120" width="245" height="150" rx="16" fill="#E8F1F8" stroke="#9FB3C8" stroke-width="1.5" filter="url(#shadow)"/><text x="73" y="154" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="700" fill="#102A43">격리 대상 입력</text><text x="73" y="182" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">Quarantine ID</text><text x="73" y="205" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">Expected Version</text><text x="73" y="228" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">Reason·Corrected JSON</text><rect x="365" y="120" width="245" height="150" rx="16" fill="#E8F6F3" stroke="#9FB3C8" stroke-width="1.5" filter="url(#shadow)"/><text x="383" y="154" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="700" fill="#102A43">승인 요청</text><text x="383" y="182" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">Idempotency Key</text><text x="383" y="205" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">Server Snapshot</text><text x="383" y="228" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">Approval Request ID</text><rect x="675" y="120" width="245" height="150" rx="16" fill="#FFF4E6" stroke="#9FB3C8" stroke-width="1.5" filter="url(#shadow)"/><text x="693" y="154" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="700" fill="#102A43">승인 검증·실행</text><text x="693" y="182" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">Approval ID + Reason</text><text x="693" y="205" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">Payload 재전송 없음</text><text x="693" y="228" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">Version 재검증</text><rect x="365" y="365" width="245" height="130" rx="16" fill="#EDF2FF" stroke="#9FB3C8" stroke-width="1.5" filter="url(#shadow)"/><text x="383" y="399" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="700" fill="#102A43">오류 판정</text><text x="383" y="427" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">Expired·Rejected</text><text x="383" y="450" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">Version conflict</text><text x="383" y="473" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">UNKNOWN_RESULT</text><rect x="675" y="365" width="245" height="130" rx="16" fill="#F5ECFA" stroke="#9FB3C8" stroke-width="1.5" filter="url(#shadow)"/><text x="693" y="399" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="700" fill="#102A43">종결 Evidence</text><text x="693" y="427" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">CORRECTED·REPLAYED</text><text x="693" y="450" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">Audit·Operation</text><text x="693" y="473" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">Owner 원장 대사</text><line x1="300" y1="195.0" x2="365" y2="195.0" stroke="#425B76" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="610" y1="195.0" x2="675" y2="195.0" stroke="#425B76" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="610" y1="195.0" x2="365" y2="430.0" stroke="#425B76" stroke-width="2.5" marker-end="url(#arrow)"/><text x="487.5" y="305.5" text-anchor="middle" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="13" fill="#486581">실패</text><line x1="920" y1="195.0" x2="675" y2="430.0" stroke="#425B76" stroke-width="2.5" marker-end="url(#arrow)"/><text x="797.5" y="305.5" text-anchor="middle" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="13" fill="#486581">성공</text><line x1="610" y1="430.0" x2="675" y2="430.0" stroke="#425B76" stroke-width="2.5" marker-end="url(#arrow)"/><text x="642.5" y="423.0" text-anchor="middle" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="13" fill="#486581">대사</text></svg>
