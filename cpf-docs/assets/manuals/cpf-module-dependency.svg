<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="455" viewBox="0 0 1100 455" role="img" aria-labelledby="title desc">
  <title id="title">Module Ownership와 의존 방향</title>
  <desc id="desc">업무 Domain은 cpf-common과 cpf-core의 공개 계약에만 의존</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3b5268"/>
    </marker>
    <style>
      .title{font:700 28px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#102a43}
      .subtitle{font:400 15px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#486581}
      .boxTitle{font:700 16px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#102a43}
      .boxText{font:400 13px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#334e68}
      .line{stroke:#3b5268;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#829ab1;stroke-width:2;fill:none;stroke-dasharray:7 5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="100%" height="100%" rx="24" fill="#f7fafc"/>
  <text x="44" y="48" class="title">Module Ownership와 의존 방향</text>
  <text x="44" y="76" class="subtitle">업무 Domain은 cpf-common과 cpf-core의 공개 계약에만 의존</text>
  <g filter="url(#shadow)"><rect x="60" y="120" width="250" height="105" rx="14" fill="#fff4e6" stroke="#e7a75f" stroke-width="1.5"/><text x="76" y="148" class="boxTitle">고객 업무 Domain</text><text x="76" y="172" class="boxText">cpf-member·생성 Domain</text></g><g filter="url(#shadow)"><rect x="360" y="120" width="250" height="105" rx="14" fill="#e8f6f3" stroke="#57a995" stroke-width="1.5"/><text x="376" y="148" class="boxTitle">cpf-common</text><text x="376" y="172" class="boxText">고객 공통 정책</text></g><g filter="url(#shadow)"><rect x="650" y="120" width="250" height="105" rx="14" fill="#e8f1f8" stroke="#8bb8d8" stroke-width="1.5"/><text x="666" y="148" class="boxTitle">cpf-core</text><text x="666" y="172" class="boxText">기술 중립 API·SPI</text></g><path d="M310,172 L360,172" class="line"/><path d="M610,172 L650,172" class="line"/><g filter="url(#shadow)"><rect x="60" y="300" width="190" height="100" rx="14" fill="#edf2ff" stroke="#788dd3" stroke-width="1.5"/><text x="76" y="328" class="boxTitle">cpf-starters</text><text x="76" y="352" class="boxText">Profile·Provider Runtime</text></g><g filter="url(#shadow)"><rect x="350" y="300" width="190" height="100" rx="14" fill="#edf2ff" stroke="#788dd3" stroke-width="1.5"/><text x="366" y="328" class="boxTitle">cpf-batch</text><text x="366" y="352" class="boxText">Job·Scheduler·Worker</text></g><g filter="url(#shadow)"><rect x="640" y="300" width="190" height="100" rx="14" fill="#edf2ff" stroke="#788dd3" stroke-width="1.5"/><text x="656" y="328" class="boxTitle">cpf-admin</text><text x="656" y="352" class="boxText">운영 Control Plane</text></g><g filter="url(#shadow)"><rect x="850" y="300" width="190" height="100" rx="14" fill="#edf2ff" stroke="#788dd3" stroke-width="1.5"/><text x="866" y="328" class="boxTitle">BZA·Gateway</text><text x="866" y="352" class="boxText">업무관리·외부진입</text></g><path d="M155,300 L730,225" class="dash"/><path d="M445,300 L730,225" class="dash"/><path d="M735,300 L730,225" class="dash"/><path d="M945,300 L730,225" class="dash"/>
</svg>