<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="455" viewBox="0 0 1120 455" role="img" aria-labelledby="title desc">
  <title id="title">온라인 상태 변경</title>
  <desc id="desc">Expected Version, Idempotency, Audit를 하나의 Transaction으로 처리</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3b5268"/>
    </marker>
    <style>
      .title{font:700 28px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#102a43}
      .subtitle{font:400 15px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#486581}
      .boxTitle{font:700 16px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#102a43}
      .boxText{font:400 13px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#334e68}
      .line{stroke:#3b5268;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#829ab1;stroke-width:2;fill:none;stroke-dasharray:7 5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="100%" height="100%" rx="24" fill="#f7fafc"/>
  <text x="44" y="48" class="title">온라인 상태 변경</text>
  <text x="44" y="76" class="subtitle">Expected Version, Idempotency, Audit를 하나의 Transaction으로 처리</text>
  <g filter="url(#shadow)"><rect x="50" y="130" width="165" height="100" rx="14" fill="#e8f1f8" stroke="#8bb8d8" stroke-width="1.5"/><text x="66" y="158" class="boxTitle">Client</text><text x="66" y="182" class="boxText">Key·Version</text></g><g filter="url(#shadow)"><rect x="260" y="130" width="165" height="100" rx="14" fill="#e8f1f8" stroke="#8bb8d8" stroke-width="1.5"/><text x="276" y="158" class="boxTitle">API</text><text x="276" y="182" class="boxText">인증·Validation</text></g><g filter="url(#shadow)"><rect x="470" y="130" width="165" height="100" rx="14" fill="#e8f1f8" stroke="#8bb8d8" stroke-width="1.5"/><text x="486" y="158" class="boxTitle">Application</text><text x="486" y="182" class="boxText">Transaction·Permission</text></g><g filter="url(#shadow)"><rect x="700" y="130" width="165" height="100" rx="14" fill="#e8f1f8" stroke="#8bb8d8" stroke-width="1.5"/><text x="716" y="158" class="boxTitle">DB</text><text x="716" y="182" class="boxText">State·Ledger·Outbox</text></g><g filter="url(#shadow)"><rect x="900" y="130" width="165" height="100" rx="14" fill="#e8f1f8" stroke="#8bb8d8" stroke-width="1.5"/><text x="916" y="158" class="boxTitle">ADM</text><text x="916" y="182" class="boxText">Log·Audit·대사</text></g><path d="M215,180 L260,180" class="line"/><path d="M425,180 L470,180" class="line"/><path d="M635,180 L700,180" class="line"/><path d="M865,180 L900,180" class="line"/><g filter="url(#shadow)"><rect x="370" y="300" width="310" height="105" rx="14" fill="#fff4e6" stroke="#e7a75f" stroke-width="1.5"/><text x="386" y="328" class="boxTitle">응답 유실</text><text x="386" y="352" class="boxText">같은 Key/Operation으로 조회</text><text x="386" y="372" class="boxText">새 부작용 실행 금지</text></g><path d="M552,230 L525,300" class="dash"/>
</svg>