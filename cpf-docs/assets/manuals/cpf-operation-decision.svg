<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="486" viewBox="0 0 1500 486" role="img">
<title>운영 Operation 판단</title><desc>같은 버튼 반복보다 상태 조회와 대사가 우선</desc>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="50" y="58" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#0f172a">운영 Operation 판단</text>
<text x="50" y="92" font-family="Arial,sans-serif" font-size="17" fill="#475569">같은 버튼 반복보다 상태 조회와 대사가 우선</text>
<rect x="50" y="135" width="323" height="171" rx="16" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<text x="72" y="173" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0f172a">요청 전</text>
<text x="72" y="210" font-family="Arial,sans-serif" font-size="16" fill="#334155">• 권한·Data Scope</text>
<text x="72" y="242" font-family="Arial,sans-serif" font-size="16" fill="#334155">• 현재 상태·Version</text>
<text x="72" y="274" font-family="Arial,sans-serif" font-size="16" fill="#334155">• Preview·Approval</text>
<line x1="377" y1="220" x2="400" y2="220" stroke="#334155" stroke-width="3"/>
<polygon points="400,213 400,227 408,220" fill="#334155"/>
<rect x="408" y="135" width="323" height="171" rx="16" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<text x="430" y="173" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0f172a">실행</text>
<text x="430" y="210" font-family="Arial,sans-serif" font-size="16" fill="#334155">• Operation ID</text>
<text x="430" y="242" font-family="Arial,sans-serif" font-size="16" fill="#334155">• Idempotency Key</text>
<text x="430" y="274" font-family="Arial,sans-serif" font-size="16" fill="#334155">• Target Snapshot</text>
<line x1="735" y1="220" x2="758" y2="220" stroke="#334155" stroke-width="3"/>
<polygon points="758,213 758,227 766,220" fill="#334155"/>
<rect x="766" y="135" width="323" height="171" rx="16" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<text x="788" y="173" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0f172a">응답</text>
<text x="788" y="210" font-family="Arial,sans-serif" font-size="16" fill="#334155">• SUCCESS/FAILED</text>
<text x="788" y="242" font-family="Arial,sans-serif" font-size="16" fill="#334155">• UNKNOWN/PARTIAL</text>
<text x="788" y="274" font-family="Arial,sans-serif" font-size="16" fill="#334155">• ACK/NACK</text>
<line x1="1093" y1="220" x2="1116" y2="220" stroke="#334155" stroke-width="3"/>
<polygon points="1116,213 1116,227 1124,220" fill="#334155"/>
<rect x="1124" y="135" width="323" height="171" rx="16" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<text x="1146" y="173" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0f172a">종료</text>
<text x="1146" y="210" font-family="Arial,sans-serif" font-size="16" fill="#334155">• Owner 원장 대사</text>
<text x="1146" y="242" font-family="Arial,sans-serif" font-size="16" fill="#334155">• Audit 확인</text>
<text x="1146" y="274" font-family="Arial,sans-serif" font-size="16" fill="#334155">• Rollback 또는 인계</text>
</svg>
