  </defs>
  <rect width="100%" height="100%" rx="24" fill="#f7fafc"/>
  <text x="44" y="48" class="title">운영자 최초 대응</text>
  <text x="44" y="76" class="subtitle">화면 Message가 아니라 상태·영향·근거·정상화로 종료</text>
  <g filter="url(#shadow)"><rect x="40" y="120" width="175" height="92" rx="14" fill="#e8f1f8" stroke="#8bb8d8" stroke-width="1.5"/><text x="56" y="148" class="boxTitle">1. 식별자</text><text x="56" y="172" class="boxText">확인·기록</text></g><g filter="url(#shadow)"><rect x="250" y="120" width="175" height="92" rx="14" fill="#e8f1f8" stroke="#8bb8d8" stroke-width="1.5"/><text x="266" y="148" class="boxTitle">2. 상태</text><text x="266" y="172" class="boxText">확인·기록</text></g><g filter="url(#shadow)"><rect x="460" y="120" width="175" height="92" rx="14" fill="#e8f1f8" stroke="#8bb8d8" stroke-width="1.5"/><text x="476" y="148" class="boxTitle">3. 영향</text><text x="476" y="172" class="boxText">확인·기록</text></g><g filter="url(#shadow)"><rect x="670" y="120" width="175" height="92" rx="14" fill="#e8f1f8" stroke="#8bb8d8" stroke-width="1.5"/><text x="686" y="148" class="boxTitle">4. 근거</text><text x="686" y="172" class="boxText">확인·기록</text></g><g filter="url(#shadow)"><rect x="880" y="120" width="175" height="92" rx="14" fill="#e8f1f8" stroke="#8bb8d8" stroke-width="1.5"/><text x="896" y="148" class="boxTitle">5. 조치</text><text x="896" y="172" class="boxText">확인·기록</text></g><path d="M215,166 L250,166" class="line"/><path d="M425,166 L460,166" class="line"/><path d="M635,166 L670,166" class="line"/><path d="M845,166 L880,166" class="line"/><g filter="url(#shadow)"><rect x="360" y="310" width="360" height="95" rx="14" fill="#e8f6f3" stroke="#57a995" stroke-width="1.5"/><text x="376" y="338" class="boxTitle">종료 조건</text><text x="376" y="362" class="boxText">UNKNOWN·PARTIAL·Drift 0</text><text x="376" y="382" class="boxText">Owner 상태·Audit 일치</text></g><path d="M967,212 L540,310" class="dash"/>
