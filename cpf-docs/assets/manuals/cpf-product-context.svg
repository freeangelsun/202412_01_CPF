<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="470" viewBox="0 0 1060 470" role="img" aria-labelledby="title desc">
  <title id="title">CPF 제품 Context</title>
  <desc id="desc">업무 구현, 실행 기술, 운영 제품을 단일 계약으로 연결</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3b5268"/>
    </marker>
    <style>
      .title{font:700 28px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#102a43}
      .subtitle{font:400 15px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#486581}
      .boxTitle{font:700 16px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#102a43}
      .boxText{font:400 13px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#334e68}
      .line{stroke:#3b5268;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#829ab1;stroke-width:2;fill:none;stroke-dasharray:7 5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="100%" height="100%" rx="24" fill="#f7fafc"/>
  <text x="44" y="48" class="title">CPF 제품 Context</text>
  <text x="44" y="76" class="subtitle">업무 구현, 실행 기술, 운영 제품을 단일 계약으로 연결</text>
  <g filter="url(#shadow)"><rect x="60" y="120" width="250" height="120" rx="14" fill="#fff4e6" stroke="#e7a75f" stroke-width="1.5"/><text x="76" y="148" class="boxTitle">고객 업무</text><text x="76" y="172" class="boxText">상태·권한·대사 기준</text><text x="76" y="192" class="boxText">업무 API·Batch·파일</text></g><g filter="url(#shadow)"><rect x="380" y="105" width="300" height="150" rx="14" fill="#e8f6f3" stroke="#57a995" stroke-width="1.5"/><text x="396" y="133" class="boxTitle">Core Platform Framework</text><text x="396" y="157" class="boxText">Public API·SPI</text><text x="396" y="177" class="boxText">Profile·Capability</text><text x="396" y="197" class="boxText">Idempotency·UNKNOWN·Audit</text></g><g filter="url(#shadow)"><rect x="750" y="120" width="250" height="120" rx="14" fill="#edf2ff" stroke="#788dd3" stroke-width="1.5"/><text x="766" y="148" class="boxTitle">운영 제품</text><text x="766" y="172" class="boxText">ADM·BZA·Gateway</text><text x="766" y="192" class="boxText">배포·관측·복구</text></g><path d="M310,180 L380,180" class="line"/><path d="M680,180 L750,180" class="line"/><g filter="url(#shadow)"><rect x="210" y="310" width="250" height="105" rx="14" fill="#f0f4f8" stroke="#9fb3c8" stroke-width="1.5"/><text x="226" y="338" class="boxTitle">실행 기술</text><text x="226" y="362" class="boxText">DB·Broker·HTTP/TCP</text><text x="226" y="382" class="boxText">File·Security</text></g><g filter="url(#shadow)"><rect x="600" y="310" width="250" height="105" rx="14" fill="#f0f4f8" stroke="#9fb3c8" stroke-width="1.5"/><text x="616" y="338" class="boxTitle">운영 기반</text><text x="616" y="362" class="boxText">Artifact·Config·Health</text><text x="616" y="382" class="boxText">Backup·DR</text></g><path d="M505,255 L335,310" class="line"/><path d="M555,255 L725,310" class="line"/>
