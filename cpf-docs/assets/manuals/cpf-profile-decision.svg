<text x="52" y="55" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="30" font-weight="700" fill="#102A43">Profile·Capability 선택</text>
<text x="52" y="88" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="16" fill="#486581">업무 결과와 Trust Boundary를 먼저 정한 뒤 필요한 실행 기술만 선택합니다.</text><rect x="55" y="140" width="220" height="120" rx="16" fill="#E8F1F8" stroke="#9FB3C8" stroke-width="1.5" filter="url(#shadow)"/><text x="73" y="174" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="700" fill="#102A43">업무 Domain만?</text><text x="73" y="202" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">UI·외부 API 없음</text><text x="73" y="225" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">minimal-domain</text><rect x="340" y="90" width="220" height="120" rx="16" fill="#E8F6F3" stroke="#9FB3C8" stroke-width="1.5" filter="url(#shadow)"/><text x="358" y="124" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="700" fill="#102A43">HTTP API?</text><text x="358" y="152" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">web-api</text><text x="358" y="175" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">OpenAPI·Validation</text><rect x="340" y="280" width="220" height="120" rx="16" fill="#FFF4E6" stroke="#9FB3C8" stroke-width="1.5" filter="url(#shadow)"/><text x="358" y="314" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="700" fill="#102A43">사용자 권한?</text><text x="358" y="342" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">secure-api</text><text x="358" y="365" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">Auth·Permission·Audit</text><rect x="625" y="90" width="220" height="120" rx="16" fill="#EDF2FF" stroke="#9FB3C8" stroke-width="1.5" filter="url(#shadow)"/><text x="643" y="124" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="700" fill="#102A43">Browser 화면?</text><text x="643" y="152" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">browser-bff</text><text x="643" y="175" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">Session·CSRF</text><rect x="625" y="280" width="220" height="120" rx="16" fill="#F5ECFA" stroke="#9FB3C8" stroke-width="1.5" filter="url(#shadow)"/><text x="643" y="314" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="700" fill="#102A43">비동기 Event?</text><text x="643" y="342" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">event-service</text><text x="643" y="365" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">Outbox·Inbox·Broker</text><rect x="910" y="185" width="220" height="120" rx="16" fill="#FFF8CC" stroke="#9FB3C8" stroke-width="1.5" filter="url(#shadow)"/><text x="928" y="219" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="700" fill="#102A43">정기·대량 처리?</text><text x="928" y="247" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">batch-service</text><text x="928" y="270" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">Job·Scheduler·Worker</text><line x1="275" y1="200.0" x2="340" y2="150.0" stroke="#425B76" stroke-width="2.5" marker-end="url(#arrow)"/><text x="307.5" y="168.0" text-anchor="middle" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="13" fill="#486581">아니오</text><line x1="560" y1="150.0" x2="340" y2="340.0" stroke="#425B76" stroke-width="2.5" marker-end="url(#arrow)"/><text x="450.0" y="238.0" text-anchor="middle" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="13" fill="#486581">권한 필요</text><line x1="560" 