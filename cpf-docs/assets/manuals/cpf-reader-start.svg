<text x="52" y="55" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="30" font-weight="700" fill="#102A43">CPF 문서 시작 경로</text>
<text x="52" y="88" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="16" fill="#486581">역할을 고르면 필요한 매뉴얼과 첫 과제가 결정됩니다.</text><rect x="60" y="150" width="220" height="120" rx="16" fill="#E8F1F8" stroke="#9FB3C8" stroke-width="1.5" filter="url(#shadow)"/><text x="78" y="184" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="700" fill="#102A43">처음 방문</text><text x="78" y="212" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">CPF가 무엇인지</text><text x="78" y="235" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">적용 범위 확인</text><rect x="355" y="110" width="235" height="120" rx="16" fill="#E8F6F3" stroke="#9FB3C8" stroke-width="1.5" filter="url(#shadow)"/><text x="373" y="144" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="700" fill="#102A43">개발</text><text x="373" y="172" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">01 온라인·연계</text><text x="373" y="195" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">02 배치</text><text x="373" y="218" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">03 ADM 연동</text><rect x="355" y="300" width="235" height="120" rx="16" fill="#FFF4E6" stroke="#9FB3C8" stroke-width="1.5" filter="url(#shadow)"/><text x="373" y="334" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="700" fill="#102A43">운영</text><text x="373" y="362" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">04 ADM 운영</text><text x="373" y="385" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="14" fill="#334E68">05 플랫폼 운영</text><rect x="665" y="110" width="220" height="120" rx="16" fill="#EDF2FF" stroke="#9FB3C8" stroke-width="1.5" filter="url(#shadow)"