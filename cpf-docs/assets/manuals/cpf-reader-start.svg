ine x1="590" y1="170.0" x2="665" y2="170.0" stroke="#425B76" stroke-width="2.5" marker-end="url(#arrow)"/><text x="627.5" y="163.0" text-anchor="middle" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="13" fill="#486581">업무관리</text><line x1="590" y1="360.0" x2="665" y2="360.0" stroke="#425B76" stroke-width="2.5" marker-end="url(#arrow)"/><text x="627.5" y="353.0" text-anchor="middle" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="13" fill="#486581">외부연계</text><line x1="885" y1="170.0" x2="960" y2="265.0" stroke="#425B76" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="885" y1="360.0" x2="960" y2="265.0" stroke="#425B76" stroke-width="2.5" marker-end="url(#arrow)"/></svg>
