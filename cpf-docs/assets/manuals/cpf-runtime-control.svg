<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="455" viewBox="0 0 1110 455" role="img" aria-labelledby="title desc">
  <title id="title">Runtime 변경 통제</title>
  <desc id="desc">Preview·승인·Target별 결과·관측 상태·Rollback</desc>
