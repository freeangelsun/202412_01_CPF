<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="470" viewBox="0 0 1160 470" role="img" aria-labelledby="title desc">
  <title id="title">UNKNOWN_RESULT 판정 흐름</title>
  <desc id="desc">응답 유실을 성공·실패로 추정하지 않고 근거로 확정</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3b5268"/>
    </marker>
    <style>
      .title{font:700 28px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#102a43}
