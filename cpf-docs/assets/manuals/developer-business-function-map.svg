<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760"><rect width="1500" height="760" fill="white"/><style>text{font-family:'NanumSquare','Noto Sans CJK KR','Malgun Gothic',sans-serif;}</style><text x="42" y="62" font-size="34" fill="#18233D" font-weight="800">업무 개발 핵심 CPF 기능 지도</text><text x="42" y="98" font-size="19" fill="#667085">기본 셋업 이후 업무 코드를 작성할 때 가장 먼저 찾는 Annotation·API·메소드를 기능군별로 묶었습니다.</text><line x1="42" y1="120" x2="1458" y2="120" stroke="#D7DFED" stroke-width="2"/><rect x="55" y="180" width="430" height="225" rx="18" fill="#FCFDFF" stroke="#4F6EF7" stroke-width="2"/><text x="77" y="223" font-size="22" fill="#4F6EF7" font-weight="800" text-anchor="start">업무 계층</text><text x="79" y="262" font-size="15" fill="#18233D" font-weight="650" text-anchor="start">• @CpfController  ·  @CpfService</text><text x="79" y="293" font-size="15" fill="#18233D" font-weight="650" text-anchor="start">• @CpfRepository / @CpfDao</text><text x="79" y="324" font-size="15" fill="#18233D" font-weight="650" text-anchor="start">• @CpfTx</text><rect x="535" y="180" width="430" height="225" rx="18" fill="#FCFDFF" stroke="#7357E8" stroke-width="2"/><text x="557" y="223" font-size="22" fill="#7357E8" font-weight="800" text-anchor="start">업무 호출</text><text x="559" y="262" font-size="15" fill="#18233D" font-weight="650" text-anchor="start">• service.method()</text><text x="559" y="293" font-size="15" fill="#18233D" font-weight="650" text-anchor="start">• domainClient.execute()</text><text x="559" y="324" font-size="15" fill="#18233D" font-weight="650" text-anchor="start">• Typed External Client</text><text x="559" y="355" font-size="15" fill="#18233D" font-weight="650" text-anchor="start">• serviceCaller.invoke() - 고급</text><rect x="1015" y="180" width="430" height="225" rx="18" fill="#FCFDFF" stroke="#5EAD73" stroke-width="2"/><text x="1037" y="223" font-size="22" fill="#5EAD73" font-weight="800" text-anchor="start">공통 실행</text><text x="1039" y="262" font-size="15" fill="#18233D" font-weight="650" text-anchor="start">• CpfContexts.transactionId()</text><text x="1039" y="293" font-size="15" fill="#18233D" font-weight="650" text-anchor="start">• requireText() / requireValue()</text><text x="1039" y="324" font-size="15" fill="#18233D" font-weight="650" text-anchor="start">• @CpfLogging · @CpfPerformance</text><text x="1039" y="355" font-size="15" fill="#18233D" font-weight="650" text-anchor="start">• @CpfIdempotent</text><rect x="55" y="450" width="430" height="225" rx="18" fill="#FCFDFF" stroke="#58B7C9" stroke-width="2"/><text x="77" y="493" font-size="22" fill="#58B7C9" font-weight="800" text-anchor="start">공통 기준정보</text><text x="79" y="532" font-size="15" fill="#18233D" font-weight="650" text-anchor="start">• codeService.required()</text><text x="79" y="563" font-size="15" fill="#18233D" font-weight="650" text-anchor="start">• messageService.resolve()</text><text x="79" y="594" font-size="15" fill="#18233D" font-weight="650" text-anchor="start">• parameters.requiredValue()</text><text x="79" y="625" font-size="15" fill="#18233D" font-weight="650" text-anchor="start">• calendar.nextBusinessDay()</text><rect x="535" y="450" width="430" height="225" rx="18" fill="#FCFDFF" stroke="#E99A42" stroke-width="2"/><text x="557" y="493" font-size="22" fill="#E99A42" font-weight="800" text-anchor="start">데이터 · 비동기</text><text x="559" y="532" font-size="15" fill="#18233D" font-weight="650" text-anchor="start">• cacheAside.getOrLoad()</text><text x="559" y="563" font-size="15" fill="#18233D" font-weight="650" text-anchor="start">• cache.get/put/evict()</text><text x="559" y="594" font-size="15" fill="#18233D" font-weight="650" text-anchor="start">• messagePublisher.publish()</text><text x="559" y="625" font-size="15" fill="#18233D" font-weight="650" text-anchor="start">• @CpfMessageListener</text><rect x="1015" y="450" width="430" height="225" rx="18" fill="#FCFDFF" stroke="#258B88" stroke-width="2"/><text x="1037" y="493" font-size="22" fill="#258B88" font-weight="800" text-anchor="start">보안 · 감사</text><text x="1039" y="532" font-size="15" fill="#18233D" font-weight="650" text-anchor="start">• @CpfPermission</text><text x="1039" y="563" font-size="15" fill="#18233D" font-weight="650" text-anchor="start">• @CpfApprovalRequired</text><text x="1039" y="594" font-size="15" fill="#18233D" font-weight="650" text-anchor="start">• @CpfAudit</text><text x="1039" y="625" font-size="15" fill="#18233D" font-weight="650" text-anchor="start">• executionFacts()</text><rect x="165" y="705" width="1170" height="42" rx="14" fill="#F2F5FB" stroke="#D7DFED" stroke-width="2"/><text x="750" y="733" font-size="15" fill="#18233D" font-weight="700" text-anchor="middle">Starter는 기능별 장에서 함께 표시하고, 내부 구현보다 Public API / 업무 표준 패턴을 우선합니다.</text></svg>