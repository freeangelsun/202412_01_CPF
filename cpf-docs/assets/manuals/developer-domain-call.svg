<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760"><rect width="1500" height="760" fill="white"/><style>text{font-family:'NanumSquare','Noto Sans CJK KR','Malgun Gothic',sans-serif;}</style><text x="42" y="62" font-size="34" fill="#18233D" font-weight="800">내부 Domain 호출 개발 표준</text><text x="42" y="98" font-size="19" fill="#667085">업무 Service는 Generated Typed Client를 주입받아 execute()를 호출하고 CpfResult 상태를 처리합니다.</text><line x1="42" y1="120" x2="1458" y2="120" stroke="#D7DFED" stroke-width="2"/><rect x="80" y="230" width="260" height="180" rx="18" fill="#FBFFFC" stroke="#5EAD73" stroke-width="2"/><text x="210" y="270" font-size="23" fill="#5EAD73" font-weight="800" text-anchor="middle">Domain A Service</text><text x="210" y="310" font-size="17" fill="#18233D" font-weight="650" text-anchor="middle">@CpfService</text><text x="210" y="344" font-size="16" fill="#667085" font-weight="550" text-anchor="middle">업무 로직</text><line x1="340" y1="320" x2="500" y2="320" stroke="#7357E8" stroke-width="4"/><polygon points="500,320 488.4,327.8 488.4,312.2" fill="#7357E8"/><rect x="510" y="210" width="360" height="220" rx="18" fill="#FAF8FF" stroke="#7357E8" stroke-width="2"/><text x="690" y="252" font-size="23" fill="#7357E8" font-weight="800" text-anchor="middle">Generated Typed Client</text><text x="690" y="292" font-size="17" fill="#18233D" font-weight="650" text-anchor="middle">CpfDomainClient.execute(request)</text><text x="690" y="330" font-size="16" fill="#667085" font-weight="550" text-anchor="middle">Local / Remote Binding은 CPF가 선택</text><text x="690" y="365" font-size="17" fill="#7357E8" font-weight="700" text-anchor="middle">반환: CpfResult&lt;T&gt;</text><line x1="870" y1="320" x2="1040" y2="320" stroke="#7357E8" stroke-width="4"/><polygon points="1040,320 1028.4,327.8 1028.4,312.2" fill="#7357E8"/><rect x="1050" y="230" width="290" height="180" rx="18" fill="#FBFCFF" stroke="#4F6EF7" stroke-width="2"/><text x="1195" y="270" font-size="23" fill="#4F6EF7" font-weight="800" text-anchor="middle">Domain B</text><text x="1195" y="310" font-size="17" fill="#18233D" font-weight="650" text-anchor="middle">Service</text><text x="1195" y="344" font-size="16" fill="#667085" font-weight="550" text-anchor="middle">업무 처리</text><rect x="190" y="500" width="1120" height="135" rx="16" fill="#F7F9FD" stroke="#D7DFED" stroke-width="2"/><text x="220" y="540" font-size="20" fill="#18233D" font-weight="800" text-anchor="start">CpfResult 처리</text><text x="220" y="577" font-size="16" fill="#18233D" font-weight="650" text-anchor="start">SUCCESS → data 사용   |   BUSINESS_FAILURE → 업무 오류 처리   |   TECHNICAL_FAILURE → 기술 오류 처리   |   UNKNOWN → 조회·대사 후 재처리 판단</text><text x="220" y="610" font-size="16" fill="#667085" font-weight="600" text-anchor="start">업무 코드에서 Gateway 경유 여부나 Local/Remote 분기를 직접 만들지 않습니다.</text></svg>