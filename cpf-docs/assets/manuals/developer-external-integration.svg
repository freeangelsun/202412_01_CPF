<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760"><rect width="1500" height="760" fill="white"/><style>text{font-family:'NanumSquare','Noto Sans CJK KR','Malgun Gothic',sans-serif;}</style><text x="42" y="62" font-size="34" fill="#18233D" font-weight="800">외부 연계 개발 표준</text><text x="42" y="98" font-size="19" fill="#667085">일반 업무는 CPF 연계 Annotation이 붙은 Typed Client를 우선하고, 고급 Adapter에서만 ServiceCall API를 직접 사용합니다.</text><line x1="42" y1="120" x2="1458" y2="120" stroke="#D7DFED" stroke-width="2"/><rect x="65" y="220" width="245" height="180" rx="18" fill="#FBFFFC" stroke="#5EAD73" stroke-width="2"/><text x="187" y="262" font-size="22" fill="#5EAD73" font-weight="800" text-anchor="middle">업무 Service</text><text x="187" y="302" font-size="16" fill="#18233D" font-weight="650" text-anchor="middle">요청 생성 · 결과 판단</text><text x="187" y="335" font-size="15" fill="#667085" font-weight="550" text-anchor="middle">Local TX 경계</text><line x1="310" y1="310" x2="455" y2="310" stroke="#E99A42" stroke-width="4"/><polygon points="455,310 443.4,317.8 443.4,302.2" fill="#E99A42"/><rect x="465" y="185" width="475" height="250" rx="18" fill="#FFF9F2" stroke="#E99A42" stroke-width="2"/><text x="702" y="228" font-size="23" fill="#E99A42" font-weight="800" text-anchor="middle">외부 Typed Client</text><text x="702" y="268" font-size="15" fill="#18233D" font-weight="700" text-anchor="middle">@CpfClient(system, operation, sideEffecting)</text><text x="702" y="302" font-size="16" fill="#18233D" font-weight="650" text-anchor="middle">@CpfTimeLimiter(name)</text><text x="702" y="334" font-size="14" fill="#18233D" font-weight="650" text-anchor="middle">@CpfRetry(name, fallbackMethod)</text><text x="702" y="374" font-size="17" fill="#E99A42" font-weight="800" text-anchor="middle">typedExternalClient.method(request)</text><text x="702" y="405" font-size="14" fill="#667085" font-weight="600" text-anchor="middle">HTTP / TCP / SOAP Adapter는 선택된 Runtime이 연결</text><line x1="940" y1="310" x2="1090" y2="310" stroke="#E99A42" stroke-width="4"/><polygon points="1090,310 1078.4,317.8 1078.4,302.2" fill="#E99A42"/><rect x="1100" y="220" width="320" height="180" rx="18" fill="#F8FCFB" stroke="#258B88" stroke-width="2"/><text x="1260" y="262" font-size="22" fill="#258B88" font-weight="800" text-anchor="middle">외부 시스템</text><text x="1260" y="302" font-size="16" fill="#18233D" font-weight="650" text-anchor="middle">Partner · Legacy · SaaS</text><text x="1260" y="335" font-size="15" fill="#667085" font-weight="550" text-anchor="middle">CPF Domain 계약 밖</text><rect x="255" y="485" width="990" height="105" rx="18" fill="#FAF8FF" stroke="#7357E8" stroke-width="2"/><text x="285" y="522" font-size="18" fill="#7357E8" font-weight="800" text-anchor="start">고급 ServiceCall API</text><text x="285" y="554" font-size="15" fill="#18233D" font-weight="650" text-anchor="start">CpfServiceCaller.invoke(CpfServiceRequest, transport)  -  Registry/Target/Transport를 직접 조합해야 하는 Adapter·고급 호출에서 사용</text><rect x="135" y="625" width="1230" height="80" rx="16" fill="#FFF8F8" stroke="#C85A5A" stroke-width="2"/><text x="750" y="656" font-size="18" fill="#C85A5A" font-weight="800" text-anchor="middle">결과 판단</text><text x="750" y="684" font-size="16" fill="#18233D" font-weight="650" text-anchor="middle">Timeout/응답 유실은 UNKNOWN일 수 있습니다. Local DB rollback과 외부 시스템 처리 rollback을 같은 것으로 보지 않습니다.</text></svg>