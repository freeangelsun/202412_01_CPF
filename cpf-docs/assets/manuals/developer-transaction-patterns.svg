<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760"><rect width="1500" height="760" fill="white"/><style>text{font-family:'NanumSquare','Noto Sans CJK KR','Malgun Gothic',sans-serif;}</style><text x="42" y="62" font-size="34" fill="#18233D" font-weight="800">Transaction 표준 패턴</text><text x="42" y="98" font-size="19" fill="#667085">Service method의 @CpfTx가 Local DB Transaction 경계를 만들고, Remote/외부 호출은 같은 원자성으로 가정하지 않습니다.</text><line x1="42" y1="120" x2="1458" y2="120" stroke="#D7DFED" stroke-width="2"/><rect x="45" y="190" width="330" height="380" rx="18" fill="#FCFDFF" stroke="#4F6EF7" stroke-width="2"/><text x="65" y="230" font-size="22" fill="#4F6EF7" font-weight="800" text-anchor="start">A. 일반 업무</text><rect x="69" y="260" width="282" height="58" rx="12" fill="#FFFFFF" stroke="#D7DFED" stroke-width="2"/><text x="210" y="297" font-size="18" fill="#18233D" font-weight="700" text-anchor="middle">@CpfTx 기본</text><rect x="75" y="355" width="70" height="52" rx="10" fill="#FFFFFF" stroke="#4F6EF7" stroke-width="2"/><text x="110.0" y="388" font-size="13" fill="#18233D" font-weight="650" text-anchor="middle">Controller</text><line x1="147" y1="381" x2="160" y2="381" stroke="#4F6EF7" stroke-width="2"/><polygon points="160,381 148.4,388.8 148.4,373.2" fill="#4F6EF7"/><rect x="163" y="355" width="70" height="52" rx="10" fill="#FFFFFF" stroke="#4F6EF7" stroke-width="2"/><text x="198.0" y="388" font-size="13" fill="#18233D" font-weight="650" text-anchor="middle">Service</text><line x1="235" y1="381" x2="248" y2="381" stroke="#4F6EF7" stroke-width="2"/><polygon points="248,381 236.4,388.8 236.4,373.2" fill="#4F6EF7"/><rect x="251" y="355" width="90" height="52" rx="10" fill="#FFFFFF" stroke="#4F6EF7" stroke-width="2"/><text x="296.0" y="388" font-size="13" fill="#18233D" font-weight="650" text-anchor="middle">Repository</text><line x1="343" y1="381" x2="356" y2="381" stroke="#4F6EF7" stroke-width="2"/><polygon points="356,381 344.4,388.8 344.4,373.2" fill="#4F6EF7"/><rect x="359" y="355" width="70" height="52" rx="10" fill="#FFFFFF" stroke="#4F6EF7" stroke-width="2"/><text x="394.0" y="388" font-size="13" fill="#18233D" font-weight="650" text-anchor="middle">DB</text><text x="210" y="500" font-size="16" fill="#18233D" font-weight="650" text-anchor="middle">REQUIRED가 기본</text><rect x="405" y="190" width="330" height="380" rx="18" fill="#FCFDFF" stroke="#58B7C9" stroke-width="2"/><text x="425" y="230" font-size="22" fill="#58B7C9" font-weight="800" text-anchor="start">B. 조회 전용</text><rect x="429" y="260" width="282" height="58" rx="12" fill="#FFFFFF" stroke="#D7DFED" stroke-width="2"/><text x="570" y="297" font-size="18" fill="#18233D" font-weight="700" text-anchor="middle">readOnly = true</text><rect x="435" y="355" width="70" height="52" rx="10" fill="#FFFFFF" stroke="#58B7C9" stroke-width="2"/><text x="470.0" y="388" font-size="13" fill="#18233D" font-weight="650" text-anchor="middle">Controller</text><line x1="507" y1="381" x2="520" y2="381" stroke="#58B7C9" stroke-width="2"/><polygon points="520,381 508.4,388.8 508.4,373.2" fill="#58B7C9"/><rect x="523" y="355" width="70" height="52" rx="10" fill="#FFFFFF" stroke="#58B7C9" stroke-width="2"/><text x="558.0" y="388" font-size="13" fill="#18233D" font-weight="650" text-anchor="middle">Service</text><line x1="595" y1="381" x2="608" y2="381" stroke="#58B7C9" stroke-width="2"/><polygon points="608,381 596.4,388.8 596.4,373.2" fill="#58B7C9"/><rect x="611" y="355" width="90" height="52" rx="10" fill="#FFFFFF" stroke="#58B7C9" stroke-width="2"/><text x="656.0" y="388" font-size="13" fill="#18233D" font-weight="650" text-anchor="middle">Repository</text><line x1="703" y1="381" x2="716" y2="381" stroke="#58B7C9" stroke-width="2"/><polygon points="716,381 704.4,388.8 704.4,373.2" fill="#58B7C9"/><rect x="719" y="355" width="70" height="52" rx="10" fill="#FFFFFF" stroke="#58B7C9" stroke-width="2"/><text x="754.0" y="388" font-size="13" fill="#18233D" font-weight="650" text-anchor="middle">DB</text><text x="570" y="500" font-size="16" fill="#18233D" font-weight="650" text-anchor="middle">쓰기 업무와 분리</text><rect x="765" y="190" width="330" height="380" rx="18" fill="#FCFDFF" stroke="#7357E8" stroke-width="2"/><text x="785" y="230" font-size="22" fill="#7357E8" font-weight="800" text-anchor="start">C. 별도 Commit</text><rect x="789" y="260" width="282" height="58" rx="12" fill="#FFFFFF" stroke="#D7DFED" stroke-width="2"/><text x="930" y="297" font-size="18" fill="#18233D" font-weight="700" text-anchor="middle">REQUIRES_NEW</text><rect x="795" y="355" width="70" height="52" rx="10" fill="#FFFFFF" stroke="#7357E8" stroke-width="2"/><text x="830.0" y="388" font-size="13" fill="#18233D" font-weight="650" text-anchor="middle">Main Service</text><line x1="867" y1="381" x2="880" y2="381" stroke="#7357E8" stroke-width="2"/><polygon points="880,381 868.4,388.8 868.4,373.2" fill="#7357E8"/><rect x="883" y="355" width="90" height="52" rx="10" fill="#FFFFFF" stroke="#7357E8" stroke-width="2"/><text x="928.0" y="388" font-size="13" fill="#18233D" font-weight="650" text-anchor="middle">Audit Service</text><line x1="975" y1="381" x2="988" y2="381" stroke="#7357E8" stroke-width="2"/><polygon points="988,381 976.4,388.8 976.4,373.2" fill="#7357E8"/><rect x="991" y="355" width="70" height="52" rx="10" fill="#FFFFFF" stroke="#7357E8" stroke-width="2"/><text x="1026.0" y="388" font-size="13" fill="#18233D" font-weight="650" text-anchor="middle">DB</text><text x="930" y="500" font-size="16" fill="#18233D" font-weight="650" text-anchor="middle">독립 Commit이 필요할 때만</text><rect x="1125" y="190" width="330" height="380" rx="18" fill="#FCFDFF" stroke="#E99A42" stroke-width="2"/><text x="1145" y="230" font-size="22" fill="#E99A42" font-weight="800" text-anchor="start">D. 외부 연계 포함</text><rect x="1149" y="260" width="282" height="58" rx="12" fill="#FFFFFF" stroke="#D7DFED" stroke-width="2"/><text x="1290" y="297" font-size="18" fill="#18233D" font-weight="700" text-anchor="middle">Local TX + Remote Boundary</text><rect x="1155" y="355" width="70" height="52" rx="10" fill="#FFFFFF" stroke="#E99A42" stroke-width="2"/><text x="1190.0" y="388" font-size="13" fill="#18233D" font-weight="650" text-anchor="middle">Service</text><line x1="1227" y1="381" x2="1240" y2="381" stroke="#E99A42" stroke-width="2"/><polygon points="1240,381 1228.4,388.8 1228.4,373.2" fill="#E99A42"/><rect x="1243" y="355" width="70" height="52" rx="10" fill="#FFFFFF" stroke="#E99A42" stroke-width="2"/><text x="1278.0" y="388" font-size="13" fill="#18233D" font-weight="650" text-anchor="middle">DB + 외부 시스템</text><text x="1290" y="500" font-size="16" fill="#18233D" font-weight="650" text-anchor="middle">TX와 외부 결과를 분리 판단</text><rect x="120" y="620" width="1260" height="80" rx="16" fill="#FFF8F8" stroke="#C85A5A" stroke-width="2"/><text x="750" y="652" font-size="18" fill="#C85A5A" font-weight="800" text-anchor="middle">중요</text><text x="750" y="680" font-size="17" fill="#18233D" font-weight="650" text-anchor="middle">self-invocation은 Proxy 경계를 확인하고, Remote timeout과 DB Transaction timeout을 같은 값으로 착각하지 않습니다.</text></svg>