</style>
<rect width="1600" height="1020" fill="url(#bg)"/><text x="70" y="66" class="title" text-anchor="start">CPF 전체 구조</text><text x="70" y="101" class="subtitle" text-anchor="start">채널에서 업무영역, 공통 기반, 실행 환경, 외부 연계와 운영 도구까지 한 장으로 연결합니다.</text><path d="M70 126 H1530" stroke="#C9D7EA"/><rect x="70" y="154" width="1460" height="86" rx="22" fill="#FFFFFF" stroke="#C5D5EA" stroke-width="1.5"/><rect x="96" y="178" width="128" height="34" rx="17.0" fill="#2F6FEB" stroke="none"/><text x="160.0" y="201.0" class="pill" text-anchor="middle" style="fill:#fff">채널 · 사용자</text><text x="250" y="194" class="body" text-anchor="start">Web · Mobile · 사내 채널 · 제휴 채널 · 내부 Client</text><rect x="1270" y="178" width="220" height="34" rx="17.0" fill="#EAF1FF" stroke="#AEC7F4"/><text x="1380.0" y="201.0" class="pill" text-anchor="middle" style="fill:#2F6FEB">직접 진입 또는 Gateway</text><rect x="70" y="286" width="265" height="300" rx="24" fill="#ECF9FF" stroke="#22A3D8" stroke-width="1.7" stroke-dasharray="10 8"/><rect x="96" y="310" width="102" height="32" rx="16.0" fill="#1FA5D9" stroke="none"/><text x="147.0" y="332.0" class="pill" text-anchor="middle" style="fill:#fff">선택 진입</text><text x="96" y="367" class="module" text-anchor="start">cpf-gateway</text><text x="96" y="406" class="small" text-anchor="start"><tspan x="96" dy="0">공통 인증과 Header</tspan><tspan x="96" dy="28">경로·대상 선택</tspan><tspan x="96" dy="28">속도 제한과 장애 격리</tspan><tspan x="96" dy="28">연결시험·적용 확인</tspan></text><rect x="96" y="525" width="170" height="32" rx="16.0" fill="#FFFFFF" stroke="#8DD4ED"/><text x="181.0" y="547.0" class="pill" text-anchor="middle" style="fill:#0E7490">필요한 환경에서 선택</text><rect x="370" y="286" width="890" height="300" rx="24" fill="#FFFFFF" stroke="#93B2E4" stroke-width="1.7" filter="url(#shadow)"/><text x="400" y="324" class="section" text-anchor="start" style="fill:#2F6FEB">업무 · 운영 애플리케이션</text><rect x="400" y="352" width="240" height="174" rx="18" fill="#FFF1F3" stroke="#F05A75" stroke-width="1.5"/><rect x="418" y="370" width="74" height="28" rx="14.0" fill="#F05A75" stroke="none"/><text x="455.0" y="390.0" class="pill" text-anchor="middle" style="fill:#fff">ADM</text><text x="418" y="423" class="label" text-anchor="start">cpf-admin</text><text x="418" y="456" class="small" text-anchor="start"><tspan x="418" dy="0">플랫폼 운영·관제</tspan><tspan x="418" dy="25">승인·감사·제어</tspan></text><rect x="670" y="352" width="240" height="174" rx="18" fill="#F4F0FF" stroke="#8B64F6" stroke-width="1.5"/><rect x="688" y="370" width="74" height="28" rx="14.0" fill="#8B64F6" stroke="none"/><text x="725.0" y="390.0" class="pill" text-anchor="middle" style="fill:#fff">BZA</text><text x="688" y="423" class="label" text-anchor="start">cpf-biz-admin</text><text x="688" y="456" class="small" text-anchor="start"><tspan x="688" dy="0">조직·사용자·권한</tspan><tspan x="688" dy="25">결재·알림·첨부</tspan></text><rect x="940" y="352" width="240" height="174" rx="18" fill="#ECFBF5" stroke="#2EBE8C" stroke-width="1.5"/><rect x="958" y="370" width="74" height="28" rx="14.0" fill="#2EBE8C" stroke="none"/><text x="995.0" y="390.0" class="pill" text-anchor="middle" style="fill:#fff">DOMAIN</text><text x="958" y="423" class="label" text-anchor="start">생성 업무영역</text><text x="958" y="456" class="small" text-anchor="start"><tspan x="958" dy="0">업무 API·원장·연계</tspan><tspan x="958" dy="25">독립 소유권과 계약</tspan></text><text x="400" y="560" class="small" text-anchor="start">각 애플리케이션은 자신의 API·데이터·상태 전이와 운영 계약을 소유합니다.</text><rect x="1295" y="286" width="235" height="300" rx="24" fill="#FFF8E9" stroke="#F0B34E" stroke-width="1.7" stroke-dasharray="10 8"/><rect x="1320" y="310" width="104" height="32" rx="16.0" fill="#E7A32B" stroke="none"/><text x="1372.0" y="332.0" class="pill" text-anchor="middle" style="fill:#fff">외부 연계</text><text x="1320" y="367" class="module" text-anchor="start">외부 시스템</text><text x="1320" y="406" class="small" text-anchor="start"><tspan x="1320" dy="0">기관 API</tspan><tspan x="1320" dy="30">메시징·이벤트</tspan><tspan x="1320" dy="30">파일·첨부·전문</tspan><tspan x="1320" dy="30">외부 서비스</tspan></text><text x="1320" y="540" class="tiny" text-anchor="start">연계 소유 업무영역이</text><text x="1320" y="560" class="tiny" text-anchor="start">계약과 복구를 책임집니다.</text><path d="M210 240 L210 286" fill="none" stroke="#2F6FEB" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#arrowBlue)"/><text x="210" y="270" class="tiny" text-anchor="middle" style="fill:#2F6FEB">선택</text><path d="M800 240 L800 286" fill="none" stroke="#2F6FEB" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrowBlue)"/><text x="800" y="270" class="tiny" text-anchor="middle" style="fill:#2F6FEB">직접 진입</text><path d="M335 435 L370 435" fill="none" stroke="#2F6FEB" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#arrowBlue)"/><path d="M1260 435 L1295 435" fill="none" stroke="#D9951A" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#arrowBlue)"/><rect x="370" y="628" width="890" height="190" rx="24" fill="url(#foundation)" stroke="#9EB8E7" stroke-width="1.7"/><text x="400" y="666" class="section" text-anchor="start" style="fill:#6F5AE8">공통 기반</text><rect x="400" y="695" width="390" height="92" rx="17" fill="#FFFFFF" stroke="#8B73F6" stroke-width="1.5"/><text x="425" y="733" class="module" text-anchor="start">cpf-core</text><text x="425" y="764" class="small" text-anchor="start">공개 API·SPI · 실행 문맥 · 오류 · 추적 · 기술 계약</text><rect x="820" y="695" width="410" height="92" rx="17" fill="#FFFFFF" stroke="#20B8C7" stroke-width="1.5"/><text x="845" y="733" class="module" text-anchor="start">cpf-common</text><text x="845" y="764" class="small" text-anchor="start">고객 업무 공통 정책 · 선택형 공통 기능</text><path d="M815 586 L815 628" fill="none" stroke="#2F6FEB" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrowBlue)"/><rect x="1295" y="628" width="235" height="190" rx="24" fill="#EFFBF4" stroke="#37B872" stroke-width="1.7" stroke-dasharray="10 8"/><rect x="1320" y="653" width="110" height="32" rx="16.0" fill="#2EAF6D" stroke="none"/><text x="1375.0" y="675.0" class="pill" text-anchor="middle" style="fill:#fff">선택 실행</text><text x="1320" y="708" class="module" text-anchor="start">cpf-batch</text><text x="1320" y="741" class="small" text-anchor="start"><tspan x="1320" dy="0">Control · Scheduler</tspan><tspan x="1320" dy="25">Worker · Center-Cut</tspan><tspan x="1320" dy="25">Host Agent</tspan></text><path d="M1135 586 L1390 628" fill="none" stroke="#37A76D" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#arrowBlue)"/><text x="1265" y="610" class="tiny" text-anchor="middle" style="fill:#37A76D">업무 Job 계약</text><rect x="70" y="862" width="1460" height="105" rx="24" fill="url(#tooling)" stroke="#0B1F36" stroke-width="0"/><text x="98" y="902" class="section" text-anchor="start" style="fill:#FFFFFF">도구 · 공급 · 검증</text><text x="98" y="938" class="body" text-anchor="start" style="fill:#DDEBFA">생성기  ·  DB 생명주기  ·  품질 Gate  ·  산출물 공급  ·  설치·업그레이드·복구  ·  Test·Evidence</text><path d="M502 818 V862" stroke="#7A8AA0" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/><path d="M900 818 V862" stroke="#7A8AA0" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/><path d="M1412 818 V862" stroke="#7A8AA0" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/><text x="70" y="998" class="tiny" text-anchor="start">실선: 기본 관계   ·   점선: 선택 적용 또는 배포 구성에 따른 관계</text></svg>
