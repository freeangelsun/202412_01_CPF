<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1740" viewBox="0 0 900 1740" role="img" aria-labelledby="title desc">
<title id="title">CPF 전체 구조</title><desc id="desc">채널, Gateway, 업무 및 운영 애플리케이션, 공통 기반, Batch 실행 환경, 외부 시스템과 도구의 관계</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7FAFF"/><stop offset="1" stop-color="#EEF4FC"/></linearGradient>
  <linearGradient id="foundation" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EDF4FF"/><stop offset="1" stop-color="#F4F0FF"/></linearGradient>
  <linearGradient id="tooling" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#122B49"/><stop offset="1" stop-color="#0B1F36"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#163A63" flood-opacity="0.12"/></filter>
  <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#2F6FEB"/></marker>
  <marker id="arrowGray" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#7A8AA0"/></marker>
</defs>
<style>
 text{font-family:'NanumSquare','NanumGothic','Noto Sans CJK KR','Segoe UI',Arial,sans-serif;fill:#142B47}
 .title{font-size:42px;font-weight:800;letter-spacing:-1.2px}
 .subtitle{font-size:20px;font-weight:500;fill:#5A6E87}
 .section{font-size:18px;font-weight:800;letter-spacing:.2px}
 .module{font-size:25px;font-weight:800;letter-spacing:-.4px}
 .label{font-size:17px;font-weight:750}
 .body{font-size:16px;font-weight:600}
 .small{font-size:14px;font-weight:500;fill:#5A6E87}
 .tiny{font-size:12px;font-weight:700;fill:#657991}
 .pill{font-size:13px;font-weight:800}
</style>
<rect width="900" height="1740" fill="url(#bg)"/><text x="48" y="66" class="title" text-anchor="start">CPF 전체 구조</text><text x="48" y="103" class="subtitle" text-anchor="start"><tspan x="48" dy="0">채널에서 업무영역, 공통 기반, 실행 환경,</tspan><tspan x="48" dy="30">외부 연계와 운영 도구까지 연결합니다.</tspan></text><path d="M48 166 H852" stroke="#C9D7EA"/><rect x="48" y="194" width="804" height="112" rx="24" fill="#FFFFFF" stroke="#C5D5EA" stroke-width="1.5"/><rect x="74" y="220" width="144" height="34" rx="17.0" fill="#2F6FEB" stroke="none"/><text x="146.0" y="243.0" class="pill" text-anchor="middle" style="fill:#fff">채널 · 사용자</text><text x="74" y="278" class="body" text-anchor="start">Web · Mobile · 사내·제휴 채널 · 내부 Client</text><rect x="48" y="350" width="804" height="170" rx="24" fill="#ECF9FF" stroke="#22A3D8" stroke-width="1.7" stroke-dasharray="10 8"/><rect x="74" y="376" width="112" height="32" rx="16.0" fill="#1FA5D9" stroke="none"/><text x="130.0" y="398.0" class="pill" text-anchor="middle" style="fill:#fff">선택 진입</text><text x="74" y="432" class="module" text-anchor="start">cpf-gateway</text><text x="74" y="468" class="small" text-anchor="start"><tspan x="74" dy="0">공통 인증·Header · 경로·대상 선택</tspan><tspan x="74" dy="27">속도 제한 · 장애 격리 · 연결시험 · 적용 확인</tspan></text><path d="M450 306 L450 350" fill="none" stroke="#2F6FEB" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#arrowBlue)"/><text x="510" y="334" class="tiny" text-anchor="middle" style="fill:#2F6FEB">선택 경유</text><path d="M820 306 V562" fill="none" stroke="#2F6FEB" stroke-width="2.4" marker-end="url(#arrowBlue)"/><text x="800" y="432" class="tiny" text-anchor="end" style="fill:#2F6FEB">직접 진입</text><rect x="48" y="562" width="804" height="430" rx="24" fill="#FFFFFF" stroke="#93B2E4" stroke-width="1.7" filter="url(#shadow)"/><text x="74" y="604" class="section" text-anchor="start" style="fill:#2F6FEB">업무 · 운영 애플리케이션</text><rect x="74" y="636" width="752" height="84" rx="17" fill="#FFF1F3" stroke="#F05A75" stroke-width="1.4"/><rect x="92" y="654" width="90" height="28" rx="14.0" fill="#F05A75" stroke="none"/><text x="137.0" y="674.0" class="pill" text-anchor="middle" style="fill:#fff">ADM</text><text x="219" y="674" class="label" text-anchor="start">cpf-admin</text><text x="219" y="701" class="small" text-anchor="start">플랫폼 운영 · 관제 · 승인 · 감사</text><rect x="74" y="742" width="752" height="84" rx="17" fill="#F4F0FF" stroke="#8B64F6" stroke-width="1.4"/><rect x="92" y="760" width="90" height="28" rx="14.0" fill="#8B64F6" stroke="none"/><text x="137.0" y="780.0" class="pill" text-anchor="middle" style="fill:#fff">BZA</text><text x="219" y="780" class="label" text-anchor="start">cpf-biz-admin</text><text x="219" y="807" class="small" text-anchor="start">조직 · 사용자 · 권한 · 결재 · 알림</text><rect x="74" y="848" width="752" height="84" rx="17" fill="#ECFBF5" stroke="#2EBE8C" stroke-width="1.4"/><rect x="92" y="866" width="112" height="28" rx="14.0" fill="#2EBE8C" stroke="none"/><text x="148.0" y="886.0" class="pill" text-anchor="middle" style="fill:#fff">DOMAIN</text><text x="219" y="886" class="label" text-anchor="start">생성 업무영역</text><text x="219" y="913" class="small" text-anchor="start">업무 API · 원장 · 연계 · 독립 소유권</text><text x="74" y="968" class="tiny" text-anchor="start">각 애플리케이션은 API·데이터·상태 전이와 운영 계약을 소유합니다.</text><path d="M450 520 L450 562" fill="none" stroke="#2F6FEB" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#arrowBlue)"/><rect x="48" y="1036" width="804" height="162" rx="24" fill="#FFF8E9" stroke="#F0B34E" stroke-width="1.7" stroke-dasharray="10 8"/><rect x="74" y="1062" width="112" height="32" rx="16.0" fill="#E7A32B" stroke="none"/><text x="130.0" y="1084.0" class="pill" text-anchor="middle" style="fill:#fff">외부 연계</text><text x="74" y="1118" class="module" text-anchor="start">외부 시스템</text><text x="74" y="1154" class="small" text-anchor="start">기관 API · 메시징 · 파일·첨부·전문 · 외부 서비스</text><path d="M450 992 L450 1036" fill="none" stroke="#D9951A" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#arrowBlue)"/><rect x="48" y="1242" width="804" height="224" rx="24" fill="url(#foundation)" stroke="#9EB8E7" stroke-width="1.7"/><text x="74" y="1284" class="section" text-anchor="start" style="fill:#6F5AE8">공통 기반</text><rect x="74" y="1312" width="752" height="60" rx="15" fill="#FFFFFF" stroke="#8B73F6" stroke-width="1.4"/><text x="96" y="1351" class="label" text-anchor="start">cpf-core</text><text x="278" y="1351" class="small" text-anchor="start">공개 API·SPI · 실행 문맥 · 오류 · 추적</text><rect x="74" y="1386" width="752" height="60" rx="15" fill="#FFFFFF" stroke="#20B8C7" stroke-width="1.4"/><text x="96" y="1425" class="label" text-anchor="start">cpf-common</text><text x="278" y="1425" class="small" text-anchor="start">고객 업무 공통 정책 · 선택형 공통 기능</text><path d="M450 1198 L450 1242" fill="none" stroke="#2F6FEB" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrowBlue)"/><rect x="48" y="1510" width="382" height="142" rx="22" fill="#EFFBF4" stroke="#37B872" stroke-width="1.6" stroke-dasharray="10 8"/><rect x="72" y="1534" width="104" height="30" rx="15.0" fill="#2EAF6D" stroke="none"/><text x="124.0" y="1555.0" class="pill" text-anchor="middle" style="fill:#fff">선택 실행</text><text x="72" y="1585" class="label" text-anchor="start">cpf-batch</text><text x="72" y="1613" class="small" text-anchor="start"><tspan x="72" dy="0">Scheduler · Worker</tspan><tspan x="72" dy="23">Center-Cut · Host Agent</tspan></text><rect x="454" y="1510" width="398" height="142" rx="22" fill="url(#tooling)" stroke="#0B1F36" stroke-width="0"/><text x="478" y="1550" class="label" text-anchor="start" style="fill:#FFFFFF">도구 · 공급 · 검증</text><text x="478" y="1584" class="small" text-anchor="start" style="fill:#DDEBFA"><tspan x="478" dy="0">생성기 · DB 생명주기 · 품질 Gate</tspan><tspan x="478" dy="25">산출물 공급 · 설치·복구 · Evidence</tspan></text><path d="M300 1466 V1510" stroke="#37A76D" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/><path d="M650 1466 V1510" stroke="#7A8AA0" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/><text x="48" y="1700" class="tiny" text-anchor="start">실선: 기본 관계   ·   점선: 선택 적용 또는 배포 구성에 따른 관계</text></svg>
