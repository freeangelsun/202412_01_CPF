 'Segoe UI', sans-serif" font-size="17" font-weight="750" fill="#0B1F4D" text-anchor="start">중단 지점 이어서 실행</text><text x="118" y="465" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#475569" text-anchor="start">긴 Batch가 중간에 멈춰도 진행 정보를 활용해 이어서 실행</text><rect x="740" y="400" width="610" height="88" rx="16" fill="#FFFFFF" stroke="#D9E2F2"/><circle cx="768" cy="430" r="9" fill="#2563EB"/><text x="788" y="435" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="17" font-weight="750" fill="#0B1F4D" text-anchor="start">실패 대상만 선택 처리</text><text x="768" y="465" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#475569" text-anchor="start">전체를 다시 돌리지 않고 필요한 대상만 다시 처리</text><rect x="90" y="510" width="610" height="88" rx="16" fill="#FFFFFF" stroke="#D9E2F2"/><circle cx="118" cy="540" r="9" fill="#2563EB"/><text x="138" y="545" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="17" font-weight="750" fill="#0B1F4D" text-anchor="start">다중 Worker 확장</text><text x="118" y="575" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#475569" text-anchor="start">대량 업무를 여러 Worker로 나누어 처리</text><rect x="740" y="510" width="610" height="88" rx="16" fill="#FFFFFF" stroke="#D9E2F2"/><circle cx="768" cy="540" r="9" fill="#2563EB"/><text x="788" y="545" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="17" font-weight="750" fill="#0B1F4D" text-anchor="start">ADM에서 상태 확인</text><text x="768" y="575" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#475569" text-anchor="start">실행 상태·작업 결과·Center-Cut 진행을 운영 화면에서 확인</text></svg>