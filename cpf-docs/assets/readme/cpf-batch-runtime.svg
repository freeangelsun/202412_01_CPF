<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941">
<rect width="1672" height="941" fill="#fff"/>
<style>text{font-family:"Noto Sans CJK KR",sans-serif; fill:#17233D}.h1{font-size:46px;font-weight:800}.sub{font-size:24px;fill:#68738A}.h2{font-size:28px;font-weight:800}.h3{font-size:24px;font-weight:700}.body{font-size:21px}.small{font-size:18px;fill:#68738A}.label{font-size:20px;font-weight:700}</style>
<text x="48" y="72" class="h1">Batch Runtime - 업무 증가에 따라 확장</text>
<text x="48" y="112" class="sub">실행 제어와 실제 Job 실행을 분리하고, 업무량이 늘면 Worker / Agent를 추가해 확장합니다.</text>
<line x1="48" y1="135" x2="1624" y2="135" stroke="#D8E0EF" stroke-width="2"/>
<rect x="76" y="250" width="260" height="100" rx="22" fill="#fff" stroke="#5574FF" stroke-width="3"/><text x="206" y="300" class="h2" text-anchor="middle" fill="#5574FF">Scheduler</text><text x="206" y="334" class="small" text-anchor="middle">실행 시점</text><line x1="336" y1="300" x2="472" y2="300" stroke="#5574FF" stroke-width="4"/><polygon points="472,300 458.0,293.0 458.0,307.0" fill="#5574FF"/><rect x="472" y="220" width="330" height="160" rx="22" fill="#fff" stroke="#17233D" stroke-width="3"/><text x="637" y="278" class="h2" text-anchor="middle">Control Plane</text><text x="637" y="317" class="small" text-anchor="middle">실행 요청 · 상태 · 제어</text><line x1="637" y1="380" x2="637" y2="485" stroke="#7657E8" stroke-width="4"/><polygon points="637,485 644.0,471.0 630.0,471.0" fill="#7657E8"/><rect x="492" y="485" width="290" height="110" rx="22" fill="#F8F5FF" stroke="#7657E8" stroke-width="2"/><text x="637" y="532" class="h2" text-anchor="middle" fill="#7657E8">Center-Cut</text><text x="637" y="568" class="small" text-anchor="middle">대상 · 분할 · Preview · 대사</text><line x1="802" y1="280" x2="920" y2="280" stroke="#60AE78" stroke-width="4"/><polygon points="920,280 906.0,273.0 906.0,287.0" fill="#60AE78"/><rect x="920" y="210" width="240" height="125" rx="22" fill="#F8FFF9" stroke="#60AE78" stroke-width="3"/><text x="1040" y="260" class="h2" text-anchor="middle" fill="#60AE78">Worker 1</text><text x="1040" y="298" class="small" text-anchor="middle">Job / Step 실행</text><line x1="1040" y1="335" x2="1040" y2="455" stroke="#ED9B45" stroke-width="4"/><polygon points="1040,455 1047.0,441.0 1033.0,441.0" fill="#ED9B45"/><rect x="955" y="455" width="170" height="88" rx="18" fill="#FFF9F1" stroke="#ED9B45" stroke-width="2"/><text x="1040" y="492" class="h3" text-anchor="middle" fill="#ED9B45">Agent</text><text x="1040" y="522" class="small" text-anchor="middle">Runtime 제어</text><line x1="802" y1="280" x2="1220" y2="280" stroke="#60AE78" stroke-width="4"/><polygon points="1220,280 1206.0,273.0 1206.0,287.0" fill="#60AE78"/><rect x="1220" y="210" width="240" height="125" rx="22" fill="#F8FFF9" stroke="#60AE78" stroke-width="3"/><text x="1340" y="260" class="h2" text-anchor="middle" fill="#60AE78">Worker 2</text><text x="1340" y="298" class="small" text-anchor="middle">Job / Step 실행</text><line x1="1340" y1="335" x2="1340" y2="455" stroke="#ED9B45" stroke-width="4"/><polygon points="1340,455 1347.0,441.0 1333.0,441.0" fill="#ED9B45"/><rect x="1255" y="455" width="170" height="88" rx="18" fill="#FFF9F1" stroke="#ED9B45" stroke-width="2"/><text x="1340" y="492" class="h3" text-anchor="middle" fill="#ED9B45">Agent</text><text x="1340" y="522" class="small" text-anchor="middle">Runtime 제어</text><rect x="1480" y="225" width="135" height="110" rx="18" fill="#fff" stroke="#D8E0EF" stroke-width="2"/><text x="1547" y="270" class="label" text-anchor="middle" fill="#60AE78">+ Worker</text><text x="1547" y="302" class="label" text-anchor="middle" fill="#ED9B45">+ Agent</text><text x="1547" y="335" class="small" text-anchor="middle">업무 증가 시</text><rect x="80" y="680" width="350" height="135" rx="20" fill="#FBFCFF" stroke="#5574FF" stroke-width="2"/><text x="104" y="723" class="h3" text-anchor="start" fill="#5574FF">업무 추가가 쉬움</text><text x="104" y="766" class="small" text-anchor="start">새 Job은 Worker 실행 구조에 연결</text><rect x="470" y="680" width="350" height="135" rx="20" fill="#FBFCFF" stroke="#60AE78" stroke-width="2"/><text x="494" y="723" class="h3" text-anchor="start" fill="#60AE78">처리량 확장</text><text x="494" y="766" class="small" text-anchor="start">Worker / Agent를</text><text x="494" y="794" class="small" text-anchor="start">필요한 만큼 수평 추가</text><rect x="860" y="680" width="350" height="135" rx="20" fill="#FBFCFF" stroke="#7657E8" stroke-width="2"/><text x="884" y="723" class="h3" text-anchor="start" fill="#7657E8">운영 제어 분리</text><text x="884" y="766" class="small" text-anchor="start">실행 · 중지 · 상태를</text><text x="884" y="794" class="small" text-anchor="start">Control Plane에서 관리</text><rect x="1250" y="680" width="350" height="135" rx="20" fill="#FBFCFF" stroke="#ED9B45" stroke-width="2"/><text x="1274" y="723" class="h3" text-anchor="start" fill="#ED9B45">실패 후 정상화</text><text x="1274" y="766" class="small" text-anchor="start">Restart · Reprocess</text><text x="1274" y="794" class="small" text-anchor="start">UNKNOWN · Reconcile</text></svg>