<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941">
<rect width="1672" height="941" fill="#fff"/>
<style>text{font-family:"Noto Sans CJK KR",sans-serif; fill:#17233D}.h1{font-size:46px;font-weight:800}.sub{font-size:24px;fill:#68738A}.h2{font-size:28px;font-weight:800}.h3{font-size:24px;font-weight:700}.body{font-size:21px}.small{font-size:18px;fill:#68738A}.label{font-size:20px;font-weight:700}.item{font-size:20px;font-weight:700}</style>
<text x="48" y="72" class="h1">CPF 구성 방식</text>
<text x="48" y="112" class="sub">기본 제공 기능 위에 필요한 기능을 선택하고, 업무 Domain은 필요에 따라 생성합니다.</text>
<line x1="48" y1="135" x2="1624" y2="135" stroke="#D8E0EF" stroke-width="2"/>
<rect x="64" y="210" width="456" height="490" rx="28" fill="#FBFCFF" stroke="#5574FF" stroke-width="3"/><text x="98" y="265" class="h2" text-anchor="start" fill="#5574FF">01  기본 제공</text><rect x="98" y="330" width="388" height="70" rx="16" fill="#fff" stroke="#D8E0EF" stroke-width="1.5"/><text x="120" y="375" class="item" text-anchor="start">Core / 공통 실행 계약</text><rect x="98" y="430" width="388" height="70" rx="16" fill="#fff" stroke="#D8E0EF" stroke-width="1.5"/><text x="120" y="475" class="item" text-anchor="start">Build · Verification · Generator</text><rect x="98" y="530" width="388" height="70" rx="16" fill="#fff" stroke="#D8E0EF" stroke-width="1.5"/><text x="120" y="575" class="item" text-anchor="start">ADM · 운영 기반</text><rect x="584" y="210" width="456" height="490" rx="28" fill="#FBFCFF" stroke="#58B8C9" stroke-width="3"/><text x="618" y="265" class="h2" text-anchor="start" fill="#58B8C9">02  선택 기능 사용</text><rect x="618" y="330" width="388" height="70" rx="16" fill="#fff" stroke="#D8E0EF" stroke-width="1.5"/><text x="640" y="375" class="item" text-anchor="start">Profile · Starter 선택</text><rect x="618" y="430" width="388" height="70" rx="16" fill="#fff" stroke="#D8E0EF" stroke-width="1.5"/><text x="640" y="475" class="item" text-anchor="start">Data · Cache · Messaging · Security</text><rect x="618" y="530" width="388" height="70" rx="16" fill="#fff" stroke="#D8E0EF" stroke-width="1.5"/><text x="640" y="575" class="item" text-anchor="start">Gateway · Batch Runtime</text><rect x="1104" y="210" width="456" height="490" rx="28" fill="#FBFCFF" stroke="#7657E8" stroke-width="3"/><text x="1138" y="265" class="h2" text-anchor="start" fill="#7657E8">03  필요 시 업무 Domain 생성</text><rect x="1138" y="330" width="388" height="70" rx="16" fill="#fff" stroke="#D8E0EF" stroke-width="1.5"/><text x="1160" y="375" class="item" text-anchor="start">cpf-member</text><rect x="1138" y="430" width="388" height="70" rx="16" fill="#fff" stroke="#D8E0EF" stroke-width="1.5"/><text x="1160" y="475" class="item" text-anchor="start">cpf-external</text><rect x="1138" y="530" width="388" height="70" rx="16" fill="#fff" stroke="#D8E0EF" stroke-width="1.5"/><text x="1160" y="575" class="item" text-anchor="start">추가 업무 Domain</text><line x1="520" y1="455" x2="572" y2="455" stroke="#5574FF" stroke-width="4"/><polygon points="572,455 558,448 558,462" fill="#5574FF"/><line x1="1040" y1="455" x2="1092" y2="455" stroke="#58B8C9" stroke-width="4"/><polygon points="1092,455 1078,448 1078,462" fill="#58B8C9"/><rect x="190" y="760" width="1292" height="80" rx="20" fill="#EEF3FF" stroke="#D8E0EF" stroke-width="1"/><text x="836" y="812" class="h3" text-anchor="middle">공통 기반은 CPF가 관리하고, 개발자는 필요한 기능을 골라 업무 Domain 구현에 집중합니다.</text></svg>