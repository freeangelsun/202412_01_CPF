<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc">
<title id="title">업무영역 생성과 검증</title><desc id="desc">CPF 생성기를 이용한 신규 업무영역 확장 흐름</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06101D"/><stop offset="0.55" stop-color="#0A2038"/><stop offset="1" stop-color="#102E4D"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#36D3D0"/><stop offset="0.5" stop-color="#4FA3FF"/><stop offset="1" stop-color="#9B7CFF"/></linearGradient>
  <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC66D"/><stop offset="1" stop-color="#FF7A8A"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".25"/></filter>
  <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00152A" flood-opacity=".14"/></filter>
</defs>
<style>
 text{font-family:'NanumGothic','Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;}
 .h1{font-size:54px;font-weight:800;letter-spacing:-1.8px;fill:#F8FBFF}
 .h2{font-size:34px;font-weight:800;letter-spacing:-1px;fill:#F8FBFF}
 .h3{font-size:24px;font-weight:800;letter-spacing:-.4px;fill:#F8FBFF}
 .body{font-size:20px;font-weight:500;fill:#D7E6F7}
 .small{font-size:16px;font-weight:500;fill:#8FA9C6}
 .label{font-size:15px;font-weight:800;letter-spacing:1px;fill:#36D3D0}
 .darkh{font-size:30px;font-weight:800;letter-spacing:-.7px;fill:#10243D}
 .darkbody{font-size:18px;font-weight:500;fill:#34506D}
 .darksmall{font-size:15px;font-weight:500;fill:#607A96}
 .mono{font-family:'SFMono-Regular','Consolas','Liberation Mono',monospace;font-size:16px;fill:#D7E6F7}
 .chip{font-size:15px;font-weight:800;fill:#FFFFFF}
 .darkmodule{font-size:24px;font-weight:800;letter-spacing:-.4px;fill:#10243D}
</style><rect x="0" y="0" width="1440" height="780" rx="0" fill="#F3F7FC" stroke="none" stroke-width="1.4" /><text x="72" y="78" class="darkh" text-anchor="start">새 업무영역도 같은 구조와 품질 기준으로 시작합니다</text><text x="72" y="112" class="darkbody" text-anchor="start">하나의 생성기가 모듈, API, DB, 테스트, 문서와 배포 정보를 함께 만듭니다.</text><rect x="72" y="162" width="1296" height="110" rx="24" fill="#10243D" stroke="#10243D" stroke-width="1" /><text x="108" y="208" class="mono" text-anchor="start">pwsh -File .\cpf-tools\generator\create-domain.ps1 -DomainName payment -SystemCode PAY -DryRun</text><text x="108" y="242" class="small" text-anchor="start">충돌을 먼저 확인한 뒤 -Apply로 생성합니다.</text><rect x="72" y="330" width="240" height="280" rx="24" fill="#FFFFFF" stroke="#C7D7E8" stroke-width="1.4" filter="url(#softShadow)"/><circle cx="110" cy="370" r="22" fill="#4FA3FF" opacity="0.95"/><text x="110" y="378" class="body" text-anchor="middle">1</text><text x="100" y="430" class="darkh" text-anchor="start">식별 정보</text><text x="100" y="474" class="darkbody" text-anchor="start"><tspan x="100" dy="0">업무명</tspan><tspan x="100" dy="28">3자리 코드</tspan></text><rect x="100" y="548" width="184" height="34" rx="16" fill="#EEF5FC" stroke="#4FA3FF" stroke-width="1" /><text x="192" y="571" class="darksmall" text-anchor="middle">같은 기준으로 확장</text><line x1="312" y1="470" x2="348" y2="470" stroke="#7692AF" stroke-width="3" stroke-linecap="round"/><rect x="348" y="330" width="240" height="280" rx="24" fill="#FFFFFF" stroke="#C7D7E8" stroke-width="1.4" filter="url(#softShadow)"/><circle cx="386" cy="370" r="22" fill="#9B7CFF" opacity="0.95"/><text x="386" y="378" class="body" text-anchor="middle">2</text><text x="376" y="430" class="darkh" text-anchor="start">충돌 검사</text><text x="376" y="474" class="darkbody" text-anchor="start"><tspan x="376" dy="0">모듈</tspan><tspan x="376" dy="28">패키지</tspan><tspan x="376" dy="28">경로</tspan><tspan x="376" dy="28">DB</tspan></text><rect x="376" y="548" width="184" height="34" rx="16" fill="#EEF5FC" stroke="#9B7CFF" stroke-width="1" /><text x="468" y="571" class="darksmall" text-anchor="middle">같은 기준으로 확장</text><line x1="588" y1="470" x2="624" y2="470" stroke="#7692AF" stroke-width="3" stroke-linecap="round"/><rect x="624" y="330" width="240" height="280" rx="24" fill="#FFFFFF" stroke="#C7D7E8" stroke-width="1.4" filter="url(#softShadow)"/><circle cx="662" cy="370" r="22" fill="#36D3D0" opacity="0.95"/><text x="662" y="378" class="body" text-anchor="middle">3</text><text x="652" y="430" class="darkh" text-anchor="start">표준 생성</text><text x="652" y="474" class="darkbody" text-anchor="start"><tspan x="652" dy="0">API</tspan><tspan x="652" dy="28">DB</tspan><tspan x="652" dy="28">테스트</tspan><tspan x="652" dy="28">문서</tspan></text><rect x="652" y="548" width="184" height="34" rx="16" fill="#EEF5FC" stroke="#36D3D0" stroke-width="1" /><text x="744" y="571" class="darksmall" text-anchor="middle">같은 기준으로 확장</text><line x1="864" y1="470" x2="900" y2="470" stroke="#7692AF" stroke-width="3" stroke-linecap="round"/><rect x="900" y="330" width="240" height="280" rx="24" fill="#FFFFFF" stroke="#C7D7E8" stroke-width="1.4" filter="url(#softShadow)"/><circle cx="938" cy="370" r="22" fill="#FFC66D" opacity="0.95"/><text x="938" y="378" class="body" text-anchor="middle">4</text><text x="928" y="430" class="darkh" text-anchor="start">실행 검증</text><text x="928" y="474" class="darkbody" text-anchor="start"><tspan x="928" dy="0">빌드</tspan><tspan x="928" dy="28">설치</tspan><tspan x="928" dy="28">호출</tspan><tspan x="928" dy="28">화면</tspan></text><rect x="928" y="548" width="184" height="34" rx="16" fill="#EEF5FC" stroke="#FFC66D" stroke-width="1" /><text x="1020" y="571" class="darksmall" text-anchor="middle">같은 기준으로 확장</text><line x1="1140" y1="470" x2="1176" y2="470" stroke="#7692AF" stroke-width="3" stroke-linecap="round"/><rect x="1176" y="330" width="240" height="280" rx="24" fill="#FFFFFF" stroke="#C7D7E8" stroke-width="1.4" filter="url(#softShadow)"/><circle cx="1214" cy="370" r="22" fill="#47D7A5" opacity="0.95"/><text x="1214" y="378" class="body" text-anchor="middle">5</text><text x="1204" y="430" class="darkh" text-anchor="start">운영 등록</text><text x="1204" y="474" class="darkbody" text-anchor="start"><tspan x="1204" dy="0">서비스 등록부</tspan><tspan x="1204" dy="28">권한</tspan><tspan x="1204" dy="28">추적</tspan></text><rect x="1204" y="548" width="184" height="34" rx="16" fill="#EEF5FC" stroke="#47D7A5" stroke-width="1" /><text x="1296" y="571" class="darksmall" text-anchor="middle">같은 기준으로 확장</text><text x="72" y="690" class="darkbody" text-anchor="start">생성기 소유 영역과 고객 수정 영역을 구분하고, 재실행 시 사용자 코드를 임의로 덮어쓰지 않습니다.</text></svg>