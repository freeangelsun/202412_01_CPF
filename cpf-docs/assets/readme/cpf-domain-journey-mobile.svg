<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1500" viewBox="0 0 720 1500" role="img" aria-labelledby="title desc">
<title id="title">업무영역 생성과 검증</title><desc id="desc">모바일용 업무영역 생성 흐름</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06101D"/><stop offset="0.55" stop-color="#0A2038"/><stop offset="1" stop-color="#102E4D"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#36D3D0"/><stop offset="0.5" stop-color="#4FA3FF"/><stop offset="1" stop-color="#9B7CFF"/></linearGradient>
  <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC66D"/><stop offset="1" stop-color="#FF7A8A"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".25"/></filter>
  <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00152A" flood-opacity=".14"/></filter>
</defs>
<style>
 text{font-family:'NanumGothic','Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;}
 .h1{font-size:54px;font-weight:800;letter-spacing:-1.8px;fill:#F8FBFF}
 .h2{font-size:34px;font-weight:800;letter-spacing:-1px;fill:#F8FBFF}
 .h3{font-size:24px;font-weight:800;letter-spacing:-.4px;fill:#F8FBFF}
 .body{font-size:20px;font-weight:500;fill:#D7E6F7}
 .small{font-size:16px;font-weight:500;fill:#8FA9C6}
 .label{font-size:15px;font-weight:800;letter-spacing:1px;fill:#36D3D0}
 .darkh{font-size:30px;font-weight:800;letter-spacing:-.7px;fill:#10243D}
 .darkbody{font-size:18px;font-weight:500;fill:#34506D}
 .darksmall{font-size:15px;font-weight:500;fill:#607A96}
 .mono{font-family:'SFMono-Regular','Consolas','Liberation Mono',monospace;font-size:16px;fill:#D7E6F7}
 .chip{font-size:15px;font-weight:800;fill:#FFFFFF}
 .darkmodule{font-size:24px;font-weight:800;letter-spacing:-.4px;fill:#10243D}
</style><rect x="0" y="0" width="720" height="1500" rx="0" fill="#F3F7FC" stroke="none" stroke-width="1.4" /><text x="40" y="70" class="darkh" text-anchor="start"><tspan x="40" dy="0">새 업무영역도 같은 구조와</tspan><tspan x="40" dy="40">품질 기준으로 시작합니다</tspan></text><text x="40" y="168" class="darkbody" text-anchor="start"><tspan x="40" dy="0">하나의 생성기가 모듈, API, DB, 테스트, 문서와</tspan><tspan x="40" dy="28">배포 정보를 함께 만듭니다.</tspan></text><rect x="40" y="250" width="640" height="146" rx="22" fill="#10243D" stroke="#10243D" stroke-width="1" /><text x="72" y="294" class="mono" text-anchor="start"><tspan x="72" dy="0">create-domain.ps1</tspan><tspan x="72" dy="28">-DomainName payment -SystemCode PAY -DryRun</tspan></text><text x="72" y="368" class="small" text-anchor="start">충돌을 먼저 확인한 뒤 -Apply로 생성합니다.</text><rect x="40" y="440" width="640" height="150" rx="22" fill="#FFFFFF" stroke="#C7D7E8" stroke-width="1.4" filter="url(#softShadow)"/><circle cx="80" cy="482" r="20" fill="#4FA3FF" opacity="0.95"/><text x="80" y="489" class="body" text-anchor="middle">1</text><text x="118" y="488" class="darkh" text-anchor="start">식별 정보</text><text x="118" y="532" class="darkbody" text-anchor="start">업무명 · 3자리 코드</text><rect x="40" y="612" width="640" height="150" rx="22" fill="#FFFFFF" stroke="#C7D7E8" stroke-width="1.4" filter="url(#softShadow)"/><circle cx="80" cy="654" r="20" fill="#9B7CFF" opacity="0.95"/><text x="80" y="661" class="body" text-anchor="middle">2</text><text x="118" y="660" class="darkh" text-anchor="start">충돌 검사</text><text x="118" y="704" class="darkbody" text-anchor="start">모듈 · 패키지 · 경로 · DB</text><rect x="40" y="784" width="640" height="150" rx="22" fill="#FFFFFF" stroke="#C7D7E8" stroke-width="1.4" filter="url(#softShadow)"/><circle cx="80" cy="826" r="20" fill="#36D3D0" opacity="0.95"/><text x="80" y="833" class="body" text-anchor="middle">3</text><text x="118" y="832" class="darkh" text-anchor="start">표준 생성</text><text x="118" y="876" class="darkbody" text-anchor="start">API · DB · 테스트 · 문서</text><rect x="40" y="956" width="640" height="150" rx="22" fill="#FFFFFF" stroke="#C7D7E8" stroke-width="1.4" filter="url(#softShadow)"/><circle cx="80" cy="998" r="20" fill="#FFC66D" opacity="0.95"/><text x="80" y="1005" class="body" text-anchor="middle">4</text><text x="118" y="1004" class="darkh" text-anchor="start">실행 검증</text><text x="118" y="1048" class="darkbody" text-anchor="start">빌드 · 설치 · 호출 · 화면</text><rect x="40" y="1128" width="640" height="150" rx="22" fill="#FFFFFF" stroke="#C7D7E8" stroke-width="1.4" filter="url(#softShadow)"/><circle cx="80" cy="1170" r="20" fill="#47D7A5" opacity="0.95"/><text x="80" y="1177" class="body" text-anchor="middle">5</text><text x="118" y="1176" class="darkh" text-anchor="start">운영 등록</text><text x="118" y="1220" class="darkbody" text-anchor="start">서비스 등록부 · 권한 · 추적</text><rect x="40" y="1320" width="640" height="108" rx="20" fill="#EAF3FF" stroke="#A6C3E6" stroke-width="1.2" /><text x="72" y="1360" class="darkbody" text-anchor="start"><tspan x="72" dy="0">생성기 소유 영역과 고객 수정 영역을 구분하고,</tspan><tspan x="72" dy="28">재실행 시 사용자 코드를 임의로 덮어쓰지 않습니다.</tspan></text></svg>
