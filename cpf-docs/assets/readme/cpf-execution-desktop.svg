</style><rect x="0" y="0" width="1440" height="800" rx="0" fill="#F3F7FC" stroke="none" stroke-width="1.4" /><text x="72" y="78" class="darkh" text-anchor="start">처리 상태를 잃지 않고 안전하게 이어갑니다</text><text x="72" y="112" class="darkbody" text-anchor="start">온라인·비동기·배치·외부 연계의 상태와 이력을 일관되게 관리합니다.</text><rect x="72" y="210" width="240" height="170" rx="24" fill="#FFFFFF" stroke="#C7D7E8" stroke-width="1.4" filter="url(#softShadow)"/><circle cx="106" cy="246" r="13" fill="#4FA3FF" opacity="0.95"/><text x="130" y="254" class="darkh" text-anchor="start">요청 수신</text><text x="98" y="302" class="darkbody" text-anchor="start"><tspan x="98" dy="0">거래 식별자 생성</tspan><tspan x="98" dy="27">승계</tspan></text><line x1="312" y1="295" x2="348" y2="295" stroke="#7692AF" stroke-width="3" stroke-linecap="round"/><rect x="348" y="210" width="240" height="170" rx="24" fill="#FFFFFF" stroke="#C7D7E8" stroke-width="1.4" filter="url(#softShadow)"/><circle cx="382" cy="246" r="13" fill="#9B7CFF" opacity="0.95"/><text x="406" y="254" class="darkh" text-anchor="start">처리 시작</text><text x="374" y="302" class="darkbody" text-anchor="start"><tspan x="374" dy="0">권한</tspan><tspan x="374" dy="27">멱등성</tspan><tspan x="374" dy="27">시간 제한</tspan></text><line x1="588" y1="295" x2="624" y2="295" stroke="#7692AF" stroke-width="3" stroke-linecap="round"/><rect x="624" y="210" width="240" height="170" rx="24" fill="#FFFFFF" stroke="#C7D7E8" stroke-width="1.4" filter="url(#softShadow)"/><circle cx="658" cy="246" r="13" fill="#36D3D0" opacity="0.95"/><text x="682" y="254" class="darkh" text-anchor="start">결과 수신</text><text x="650" y="302" class="darkbody" text-anchor="start"><tspan x="650" dy="0">완료</tspan><tspan x="650" dy="27">처리 거절</tspan><tspan x="650" dy="27">결과 확인 필요</tspan></text><line x1="864" y1="295" x2="900" y2="295" stroke="#7692AF" stroke-width="3" stroke-linecap="round"/><rect x="900" y="210" width="240" height="170" rx="24" fill="#FFFFFF" stroke="#C7D7E8" stroke-width="1.4" filter="url(#softShadow)"/><circle cx="934" cy="246" r="13" fill="#FFC66D" opacity="0.95"/><text x="958" y="254" class="darkh" text-anchor="start">상태 대사</text><text x="926" y="302" class="darkbody" text-anchor="start"><tspan x="926" dy="0">실제 처리 결과 확인</tspan></text><line x1="1140" y1="295" x2="1176" y2="295" stroke="#7692AF" stroke-width="3" stroke-linecap="round"/><rect x="1176" y="210" width="240" height="170" rx="24" fill="#FFFFFF" stroke="#C7D7E8" stroke-width="1.4" filter="url(#softShadow)"/><circle cx="1210" cy="246" r="13" fill="#47D7A5" opacity="0.95"/><text x="1234" y="254" class="darkh" text-anchor="start">복구 실행</text><text x="1202" y="302" class="darkbody" text-anchor="start"><tspan x="1202" dy="0">재처리</tspan><tspan x="1202" dy="27">보상</tspan><tspan x="1202" dy="27">수동 확정</tspan></text><rect x="72" y="430" width="1296" height="280" rx="30" fill="#10243D" stroke="#10243D" stroke-width="1" /><text x="108" y="482" class="h3" text-anchor="start">결과 불명 거래</text><text x="108" y="526" class="body" text-anchor="start"><tspan x="108" dy="0">요청을 보낸 뒤 응답이 유실되면 성공이나 실패로 단정하지 않습니다.</tspan><tspan x="108" dy="32">상태 조회와 업무 대사를 통해 실제 결과를 확인한 뒤 다음 조치를 선택합니다.</tspan></text><rect x="108" y="610" width="280" height="54" rx="16" fill="#163553" stroke="#4FA3FF" stroke-width="1.2" /><text x="248" y="645" class="body" text-anchor="middle">UNKNOWN_RESULT</text><line x1="388" y1="637" x2="458" y2="637" stroke="#5D7EA2" stroke-width="3" stroke-linecap="round"/><rect x="458" y="610" width="280" height="54" rx="16" fill="#163553" stroke="#FFC66D" stroke-width="1.2" /><text x="598" y="645" class="body" text-anchor="middle">상태 조회 · 대사</text><line x1="738" y1="637" x2="808" y2="637" stroke="#5D7EA2" stroke-width="3" stroke-linecap="round"/><rect x="808" y="610" width="510" height="54" rx="16" fill="#163553" stroke="#47D7A5" stroke-width="1.2" /><text x="1063" y="645" class="body" text-anchor="middle">최종 확정 · 재처리 · 보상</text></svg>
