<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1450" viewBox="0 0 720 1450" role="img" aria-labelledby="title desc">
<title id="title">실행과 복구의 공통 흐름</title><desc id="desc">모바일용 실행·복구 흐름</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06101D"/><stop offset="0.55" stop-color="#0A2038"/><stop offset="1" stop-color="#102E4D"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#36D3D0"/><stop offset="0.5" stop-color="#4FA3FF"/><stop offset="1" stop-color="#9B7CFF"/></linearGradient>
  <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC66D"/><stop offset="1" stop-color="#FF7A8A"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".25"/></filter>
  <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00152A" flood-opacity=".14"/></filter>
</defs>
<style>
 text{font-family:'NanumGothic','Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;}
 .h1{font-size:54px;font-weight:800;letter-spacing:-1.8px;fill:#F8FBFF}
 .h2{font-size:34px;font-weight:800;letter-spacing:-1px;fill:#F8FBFF}
 .h3{font-size:24px;font-weight:800;letter-spacing:-.4px;fill:#F8FBFF}
 .body{font-size:20px;font-weight:500;fill:#D7E6F7}
 .small{font-size:16px;font-weight:500;fill:#8FA9C6}
 .label{font-size:15px;font-weight:800;letter-spacing:1px;fill:#36D3D0}
 .darkh{font-size:30px;font-weight:800;letter-spacing:-.7px;fill:#10243D}
 .darkbody{font-size:18px;font-weight:500;fill:#34506D}
 .darksmall{font-size:15px;font-weight:500;fill:#607A96}
 .mono{font-family:'SFMono-Regular','Consolas','Liberation Mono',monospace;font-size:16px;fill:#D7E6F7}
 .chip{font-size:15px;font-weight:800;fill:#FFFFFF}
 .darkmodule{font-size:24px;font-weight:800;letter-spacing:-.4px;fill:#10243D}
</style><rect x="0" y="0" width="720" height="1450" rx="0" fill="#F3F7FC" stroke="none" stroke-width="1.4" /><text x="40" y="70" class="darkh" text-anchor="start"><tspan x="40" dy="0">실패를 숨기지 않고</tspan><tspan x="40" dy="40">복구 가능한 상태로 남깁니다</tspan></text><text x="40" y="168" class="darkbody" text-anchor="start"><tspan x="40" dy="0">온라인·비동기·배치·외부 연계가 같은 식별자와</tspan><tspan x="40" dy="28">상태 원칙을 사용합니다.</tspan></text><rect x="40" y="260" width="640" height="126" rx="22" fill="#FFFFFF" stroke="#C7D7E8" stroke-width="1.4" filter="url(#softShadow)"/><circle cx="78" cy="300" r="12" fill="#4FA3FF" opacity="0.95"/><text x="108" y="308" class="darkh" text-anchor="start">요청 수신</text><text x="108" y="348" class="darkbody" text-anchor="start">거래 식별자 생성·승계</text><line x1="360" y1="386" x2="360" y2="408" stroke="#7692AF" stroke-width="3" stroke-linecap="round"/><rect x="40" y="408" width="640" height="126" rx="22" fill="#FFFFFF" stroke="#C7D7E8" stroke-width="1.4" filter="url(#softShadow)"/><circle cx="78" cy="448" r="12" fill="#9B7CFF" opacity="0.95"/><text x="108" y="456" class="darkh" text-anchor="start">처리 시작</text><text x="108" y="496" class="darkbody" text-anchor="start">권한·멱등성·시간 제한</text><line x1="360" y1="534" x2="360" y2="556" stroke="#7692AF" stroke-width="3" stroke-linecap="round"/><rect x="40" y="556" width="640" height="126" rx="22" fill="#FFFFFF" stroke="#C7D7E8" stroke-width="1.4" filter="url(#softShadow)"/><circle cx="78" cy="596" r="12" fill="#36D3D0" opacity="0.95"/><text x="108" y="604" class="darkh" text-anchor="start">결과 수신</text><text x="108" y="644" class="darkbody" text-anchor="start">성공·실패·결과 불명 분류</text><line x1="360" y1="682" x2="360" y2="704" stroke="#7692AF" stroke-width="3" stroke-linecap="round"/><rect x="40" y="704" width="640" height="126" rx="22" fill="#FFFFFF" stroke="#C7D7E8" stroke-width="1.4" filter="url(#softShadow)"/><circle cx="78" cy="744" r="12" fill="#FFC66D" opacity="0.95"/><text x="108" y="752" class="darkh" text-anchor="start">상태 대사</text><text x="108" y="792" class="darkbody" text-anchor="start">실제 처리 결과 확인</text><line x1="360" y1="830" x2="360" y2="852" stroke="#7692AF" stroke-width="3" stroke-linecap="round"/><rect x="40" y="852" width="640" height="126" rx="22" fill="#FFFFFF" stroke="#C7D7E8" stroke-width="1.4" filter="url(#softShadow)"/><circle cx="78" cy="892" r="12" fill="#47D7A5" opacity="0.95"/><text x="108" y="900" class="darkh" text-anchor="start">복구 실행</text><text x="108" y="940" class="darkbody" text-anchor="start">재처리·보상·수동 확정</text><rect x="40" y="1030" width="640" height="330" rx="28" fill="#10243D" stroke="#10243D" stroke-width="1" /><text x="72" y="1080" class="h3" text-anchor="start">결과 불명 거래</text><text x="72" y="1120" class="body" text-anchor="start"><tspan x="72" dy="0">요청 후 응답이 유실되면 성공이나 실패로</tspan><tspan x="72" dy="30">단정하지 않고 실제 상태를 확인합니다.</tspan></text><rect x="72" y="1210" width="576" height="52" rx="16" fill="#163553" stroke="#4FA3FF" stroke-width="1.2" /><text x="360" y="1244" class="body" text-anchor="middle">UNKNOWN_RESULT</text><rect x="72" y="1276" width="576" height="52" rx="16" fill="#163553" stroke="#FFC66D" stroke-width="1.2" /><text x="360" y="1310" class="body" text-anchor="middle">상태 조회 · 대사</text><rect x="72" y="1342" width="576" height="52" rx="16" fill="#163553" stroke="#47D7A5" stroke-width="1.2" /><text x="360" y="1376" class="body" text-anchor="middle">최종 확정 · 재처리 · 보상</text></svg>
