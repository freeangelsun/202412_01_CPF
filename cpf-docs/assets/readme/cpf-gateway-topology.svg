<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941">
<rect width="1672" height="941" fill="#fff"/>
<style>text{font-family:"Noto Sans CJK KR",sans-serif; fill:#17233D}.h1{font-size:46px;font-weight:800}.sub{font-size:24px;fill:#68738A}.h2{font-size:28px;font-weight:800}.h3{font-size:24px;font-weight:700}.body{font-size:21px}.small{font-size:18px;fill:#68738A}.label{font-size:20px;font-weight:700}</style>
<text x="48" y="72" class="h1">Gateway 사용 구성</text>
<text x="48" y="112" class="sub">Gateway는 선택 기능입니다. 배포 구조에 따라 L4만, Gateway만, L4 + Gateway를 선택할 수 있습니다.</text>
<line x1="48" y1="135" x2="1624" y2="135" stroke="#D8E0EF" stroke-width="2"/>
<rect x="55" y="185" width="474" height="600" rx="26" fill="#FBFCFF" stroke="#58B8C9" stroke-width="3"/><text x="83" y="235" class="h2" text-anchor="start" fill="#58B8C9">A. L4만 사용</text><rect x="123" y="285" width="338" height="64" rx="16" fill="#fff" stroke="#D8E0EF" stroke-width="1.5"/><text x="292" y="325" class="h3" text-anchor="middle">Client</text><line x1="292" y1="349" x2="292" y2="391" stroke="#58B8C9" stroke-width="4"/><polygon points="292,391 299.0,377.0 285.0,377.0" fill="#58B8C9"/><rect x="123" y="405" width="338" height="64" rx="16" fill="#fff" stroke="#D8E0EF" stroke-width="1.5"/><text x="292" y="445" class="h3" text-anchor="middle">L4 / Ingress</text><line x1="292" y1="469" x2="292" y2="511" stroke="#58B8C9" stroke-width="4"/><polygon points="292,511 299.0,497.0 285.0,497.0" fill="#58B8C9"/><rect x="123" y="525" width="338" height="64" rx="16" fill="#fff" stroke="#D8E0EF" stroke-width="1.5"/><text x="292" y="565" class="h3" text-anchor="middle">CPF 서비스 A · B · C</text><text x="93" y="690" class="body" text-anchor="start">• 기본 분산 진입</text><text x="93" y="724" class="body" text-anchor="start">• 서비스별 정책은 각 영역에서 관리</text><rect x="574" y="185" width="474" height="600" rx="26" fill="#FBFCFF" stroke="#7657E8" stroke-width="3"/><text x="602" y="235" class="h2" text-anchor="start" fill="#7657E8">B. Gateway만 사용</text><rect x="642" y="285" width="338" height="64" rx="16" fill="#fff" stroke="#D8E0EF" stroke-width="1.5"/><text x="811" y="325" class="h3" text-anchor="middle">Client</text><line x1="811" y1="349" x2="811" y2="391" stroke="#7657E8" stroke-width="4"/><polygon points="811,391 818.0,377.0 804.0,377.0" fill="#7657E8"/><rect x="642" y="405" width="338" height="64" rx="16" fill="#fff" stroke="#D8E0EF" stroke-width="1.5"/><text x="811" y="445" class="h3" text-anchor="middle">Gateway : 단일 진입점</text><line x1="811" y1="469" x2="811" y2="511" stroke="#7657E8" stroke-width="4"/><polygon points="811,511 818.0,497.0 804.0,497.0" fill="#7657E8"/><rect x="642" y="525" width="338" height="64" rx="16" fill="#fff" stroke="#D8E0EF" stroke-width="1.5"/><text x="811" y="565" class="h3" text-anchor="middle">CPF 서비스 A · B · C</text><text x="612" y="690" class="body" text-anchor="start">• Route · 인증/인가 · Trace 집중</text><text x="612" y="724" class="body" text-anchor="start">• 앞단은 Gateway 주소/Port만 사용</text><rect x="1093" y="185" width="474" height="600" rx="26" fill="#FBFCFF" stroke="#ED9B45" stroke-width="3"/><text x="1121" y="235" class="h2" text-anchor="start" fill="#ED9B45">C. L4 + Gateway</text><rect x="1161" y="270" width="338" height="56" rx="16" fill="#fff" stroke="#D8E0EF" stroke-width="1.5"/><text x="1330" y="306" class="h3" text-anchor="middle">Client</text><line x1="1330" y1="326" x2="1330" y2="351" stroke="#ED9B45" stroke-width="4"/><polygon points="1330,351 1337.0,337.0 1323.0,337.0" fill="#ED9B45"/><rect x="1161" y="365" width="338" height="56" rx="16" fill="#fff" stroke="#D8E0EF" stroke-width="1.5"/><text x="1330" y="401" class="h3" text-anchor="middle">L4 / Ingress</text><line x1="1330" y1="421" x2="1330" y2="446" stroke="#ED9B45" stroke-width="4"/><polygon points="1330,446 1337.0,432.0 1323.0,432.0" fill="#ED9B45"/><rect x="1161" y="460" width="338" height="56" rx="16" fill="#fff" stroke="#D8E0EF" stroke-width="1.5"/><text x="1330" y="496" class="h3" text-anchor="middle">Gateway Cluster</text><line x1="1330" y1="516" x2="1330" y2="541" stroke="#ED9B45" stroke-width="4"/><polygon points="1330,541 1337.0,527.0 1323.0,527.0" fill="#ED9B45"/><rect x="1161" y="555" width="338" height="56" rx="16" fill="#fff" stroke="#D8E0EF" stroke-width="1.5"/><text x="1330" y="591" class="h3" text-anchor="middle">CPF 서비스 A · B · C</text><text x="1131" y="690" class="body" text-anchor="start">• 외부 진입 고가용성</text><text x="1131" y="724" class="body" text-anchor="start">• Gateway에서 세부 Route/정책 통합</text><rect x="205" y="820" width="1262" height="66" rx="18" fill="#F5F1FF" stroke="#7657E8" stroke-width="2"/><text x="836" y="862" class="h3" text-anchor="middle">Gateway를 사용하면 서비스가 늘어나도 앞단 진입은 Gateway 중심으로 유지하고, 내부 변경은 Route로 흡수할 수 있습니다.</text></svg>