<defs>
 <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EFF6FF"/><stop offset="0.52" stop-color="#F5F3FF"/><stop offset="1" stop-color="#ECFEFF"/></linearGradient>
