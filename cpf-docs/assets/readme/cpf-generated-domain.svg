<rect x="0" y="0" width="1440" height="740" rx="18" fill="#FFFFFF"/><text x="64" y="68" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#0B1F4D" text-anchor="start">Generated Domain — 기본 구성과 선택형 구성</text><text x="64" y="104" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="19" font-weight="500" fill="#475569" text-anchor="start">업무 특성만 선택하면 CPF Generator가 필요한 프로젝트 구조와 기능 조합을 준비합니다.</text><rect x="64" y="160" width="300" height="440" rx="22" fill="#F8FAFF" stroke="#D9E2F2" filter="url(#shadow)"/><text x="214" y="205" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="#0B1F4D" text-anchor="middle">업무 정의</text><text x="100" y="250" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="17" font-weight="550" fill="#475569" text-anchor="start">• 도메인 이름 / 시스템 코드</text><text x="100" y="285" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="17" font-weight="550" fill="#475569" text-anchor="start">• Online / Batch 사용 여부</text><text x="100" y="320" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="17" font-weight="550" fill="#475569" text-anchor="start">• 데이터 처리 방식</text><text x="100" y="355" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="17" font-weight="550" fill="#475569" text-anchor="start">• 캐시 / 메시징 / 외부연계</text><text x="100" y="390" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="17" font-weight="550" fill="#475569" text-anchor="start">• 보안 / 권한 등 선택 기능</text><rect x="100" y="445" width="228" height="88" rx="16" fill="#EEF5FF" stroke="#2563EB"/><text x="214" y="480" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="19" font-weight="750" fill="#2563EB" text-anchor="middle">cpf-domain.yaml</text><text x="214" y="507" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#475569" text-anchor="middle">선언형 업무 구성</text><line x1="380" y1="380" x2="480" y2="380" stroke="#2563EB" stroke-width="4"/><path d="M468 368 L488 380 L468 392 Z" fill="#2563EB"/><rect x="500" y="160" width="390" height="440" rx="22" fill="#FBFBFF" stroke="#D9E2F2" filter="url(#shadow)"/><text x="695" y="205" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="#0B1F4D" text-anchor="middle">구성 선택</text><rect x="536" y="245" width="318" height="120" rx="16" fill="#EEF5FF" stroke="#2563EB"/><text x="695" y="282" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="20" font-weight="800" fill="#2563EB" text-anchor="middle">기본 구성</text><text x="695" y="315" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#475569" text-anchor="middle">권장 업무 구조와 기본 기능으로</text><text x="695" y="339" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#475569" text-anchor="middle">빠르게 프로젝트를 시작</text><rect x="536" y="400" width="318" height="140" rx="16" fill="#F3F0FF" stroke="#7C3AED"/><text x="695" y="437" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="20" font-weight="800" fill="#7C3AED" text-anchor="middle">선택형 구성</text><text x="695" y="470" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#475569" text-anchor="middle">필요한 기능만 선택해</text><text x="695" y="494" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#475569" text-anchor="middle">가볍게 시작하고 이후 Starter로</text><text x="695" y="518" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#475569" text-anchor="middle">기능을 추가</text><line x1="910" y1="380" x2="1000" y2="380" stroke="#7C3AED" stroke-width="4"/><path d="M988 368 L1008 380 L988 392 Z" fill="#7C3AED"/><rect x="1020" y="160" width="356" height="440" rx="22" fill="#F7FCFC" stroke="#D9E2F2" filter="url(#shadow)"/><text x="1198" y="205" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="#0B1F4D" text-anchor="middle">생성 결과</text><rect x="1060" y="250" width="276" height="76" rx="14" fill="#FFFFFF" stroke="#D9E2F2"/><circle cx="1090" cy="288" r="14" fill="#2563EB"/><text x="1120" y="282" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="19" font-weight="750" fill="#0B1F4D" text-anchor="start">online/</text><text x="1120" y="305" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#475569" text-anchor="start">업무 API · 서비스</text><rect x="1060" y="350" width="276" height="76" rx="14" fill="#FFFFFF" stroke="#D9E2F2"/><circle cx="1090" cy="388" r="14" fill="#4F46E5"/><text x="1120" y="382" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="19" font-weight="750" fill="#0B1F4D" text-anchor="start">batch/</text><text x="1120" y="405" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#475569" text-anchor="start">Batch 선택 시</text><rect x="1060" y="450" width="276" height="76" rx="14" fill="#FFFFFF" stroke="#D9E2F2"/><circle cx="1090" cy="488" r="14" fill="#0F766E"/><text x="1120" y="482" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="19" font-weight="750" fill="#0B1F4D" text-anchor="start">domain/</text><text x="1120" y="505" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#475569" text-anchor="start">공유 코드가 필요할 때</text><text x="1060" y="565" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="15" font-weight="650" fill="#475569" text-anchor="start">생성 → 비교 → 재생성 → 업그레이드</text><rect x="64" y="630" width="1312" height="66" rx="18" fill="url(#g1)"/><text x="720" y="671" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0B1F4D" text-anchor="middle">업무 개발자는 필요한 구성을 선택하고 업무 로직에 집중합니다. 반복되는 프로젝트 기반 구성은 CPF가 일관되게 준비합니다.</text></svg>