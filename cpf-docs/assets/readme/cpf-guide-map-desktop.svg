</style><rect x="0" y="0" width="1440" height="760" rx="0" fill="url(#bg)" stroke="none" stroke-width="1.4" /><text x="72" y="78" class="h2" text-anchor="start">필요한 문서로 바로 이동하세요</text><text x="72" y="114" class="body" text-anchor="start">제품 소개는 전체 지도를 보여주고, 상세 가이드는 실제 작업을 끝까지 안내합니다.</text><rect x="72" y="178" width="280" height="400" rx="28" fill="#0D2138" stroke="#284766" stroke-width="1.4" filter="url(#shadow)"/><rect x="100" y="206" width="86" height="38" rx="19" fill="#9B7CFF" stroke="#9B7CFF" stroke-width="1" /><text x="143" y="232" class="body" text-anchor="middle">설계</text><text x="100" y="290" class="h3" text-anchor="start"><tspan x="100" dy="0">구조</tspan><tspan x="100" dy="32">소유권</tspan><tspan x="100" dy="32">배포 구성</tspan></text><circle cx="110" cy="382" r="7" fill="#9B7CFF" opacity="0.95"/><text x="132" y="388" class="body" text-anchor="start">구조와 배포</text><circle cx="110" cy="436" r="7" fill="#9B7CFF" opacity="0.95"/><text x="132" y="442" class="body" text-anchor="start">공개 API·SPI</text><circle cx="110" cy="490" r="7" fill="#9B7CFF" opacity="0.95"/><text x="132" y="496" class="body" text-anchor="start">보안·복구</text><rect x="400" y="178" width="280" height="400" rx="28" fill="#0D2138" stroke="#284766" stroke-width="1.4" filter="url(#shadow)"/><rect x="428" y="206" width="86" height="38" rx="19" fill="#36D3D0" stroke="#36D3D0" stroke-width="1" /><text x="471" y="232" class="body" text-anchor="middle">개발</text><text x="428" y="290" class="h3" text-anchor="start"><tspan x="428" dy="0">구현</tspan><tspan x="428" dy="32">생성</tspan><tspan x="428" dy="32">검증</tspan></text><circle cx="438" cy="382" r="7" fill="#36D3D0" opacity="0.95"/><text x="460" y="388" class="body" text-anchor="start">개발자 가이드</text><circle cx="438" cy="436" r="7" fill="#36D3D0" opacity="0.95"/><text x="460" y="442" class="body" text-anchor="start">기반 API</text><circle cx="438" cy="490" r="7" fill="#36D3D0" opacity="0.95"/><text x="460" y="496" class="body" text-anchor="start">업무영역 생성기</text><rect x="728" y="178" width="280" height="400" rx="28" fill="#0D2138" stroke="#284766" stroke-width="1.4" filter="url(#shadow)"/><rect x="756" y="206" width="86" height="38" rx="19" fill="#4FA3FF" stroke="#4FA3FF" stroke-width="1" /><text x="799" y="232" class="body" text-anchor="middle">운영</text><text x="756" y="290" class="h3" text-anchor="start"><tspan x="756" dy="0">상태</tspan><tspan x="756" dy="32">통제</tspan><tspan x="756" dy="32">장애대응</tspan></text><circle cx="766" cy="382" r="7" fill="#4FA3FF" opacity="0.95"/><text x="788" y="388" class="body" text-anchor="start">ADM·BZA</text><circle cx="766" cy="436" r="7" fill="#4FA3FF" opacity="0.95"/><text x="788" y="442" class="body" text-anchor="start">관측·사고 대응</text><circle cx="766" cy="490" r="7" fill="#4FA3FF" opacity="0.95"/><text x="788" y="496" class="body" text-anchor="start">게이트웨이·배치</text><rect x="1056" y="178" width="280" height="400" rx="28" fill="#0D2138" stroke="#284766" stroke-width="1.4" filter="url(#shadow)"/><rect x="1084" y="206" width="86" height="38" rx="19" fill="#47D7A5" stroke="#47D7A5" stroke-width="1" /><text x="1127" y="232" class="body" text-anchor="middle">공급</text><text x="1084" y="290" class="h3" text-anchor="start"><tspan x="1084" dy="0">설치</tspan><tspan x="1084" dy="32">DB</tspan><tspan x="1084" dy="32">배포</tspan></text><circle cx="1094" cy="382" r="7" fill="#47D7A5" opacity="0.95"/><text x="1116" y="388" class="body" text-anchor="start">설치·업그레이드</text><circle cx="1094" cy="436" r="7" fill="#47D7A5" opacity="0.95"/><text x="1116" y="442" class="body" text-anchor="start">데이터베이스</text><circle cx="1094" cy="490" r="7" fill="#47D7A5" opacity="0.95"/><text x="1116" y="496" class="body" text-anchor="start">CI/CD·도구</text><rect x="72" y="626" width="1264" height="70" rx="18" fill="#102B49" stroke="#345A7D" stroke-width="1" /><text x="704" y="670" class="body" text-anchor="middle">개념 → 절차 → 예제 → 오류·부분 실패 → 복구 → 보안·감사 → 검증</text></svg>
