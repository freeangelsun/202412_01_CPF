</style><rect x="0" y="0" width="720" height="1510" rx="0" fill="url(#bg)" stroke="none" stroke-width="1.4" /><text x="40" y="76" class="h2" text-anchor="start"><tspan x="40" dy="0">필요한 문서로</tspan><tspan x="40" dy="44">바로 이동하세요</tspan></text><text x="40" y="182" class="body" text-anchor="start"><tspan x="40" dy="0">제품 소개는 전체 지도를 보여주고, 상세 가이드는</tspan><tspan x="40" dy="30">실제 작업을 끝까지 안내합니다.</tspan></text><rect x="40" y="282" width="640" height="250" rx="26" fill="#0D2138" stroke="#284766" stroke-width="1.4" filter="url(#shadow)"/><rect x="72" y="310" width="84" height="38" rx="19" fill="#9B7CFF" stroke="#9B7CFF" stroke-width="1" /><text x="114" y="336" class="body" text-anchor="middle">설계</text><text x="184" y="338" class="h3" text-anchor="start">구조·소유권·배포 구성</text><circle cx="78" cy="398" r="7" fill="#9B7CFF" opacity="0.95"/><text x="104" y="404" class="body" text-anchor="start">구조와 배포</text><circle cx="78" cy="444" r="7" fill="#9B7CFF" opacity="0.95"/><text x="104" y="450" class="body" text-anchor="start">공개 API·SPI</text><circle cx="78" cy="490" r="7" fill="#9B7CFF" opacity="0.95"/><text x="104" y="496" class="body" text-anchor="start">보안·복구</text><rect x="40" y="554" width="640" height="250" rx="26" fill="#0D2138" stroke="#284766" stroke-width="1.4" filter="url(#shadow)"/><rect x="72" y="582" width="84" height="38" rx="19" fill="#36D3D0" stroke="#36D3D0" stroke-width="1" /><text x="114" y="608" class="body" text-anchor="middle">개발</text><text x="184" y="610" class="h3" text-anchor="start">구현·생성·검증</text><circle cx="78" cy="670" r="7" fill="#36D3D0" opacity="0.95"/><text x="104" y="676" class="body" text-anchor="start">개발자 가이드</text><circle cx="78" cy="716" r="7" fill="#36D3D0" opacity="0.95"/><text x="104" y="722" class="body" text-anchor="start">기반 API</text><circle cx="78" cy="762" r="7" fill="#36D3D0" opacity="0.95"/><text x="104" y="768" class="body" text-anchor="start">업무영역 생성기</text><rect x="40" y="826" width="640" height="250" rx="26" fill="#0D2138" stroke="#284766" stroke-width="1.4" filter="url(#shadow)"/><rect x="72" y="854" width="84" height="38" rx="19" fill="#4FA3FF" stroke="#4FA3FF" stroke-width="1" /><text x="114" y="880" class="body" text-anchor="middle">운영</text><text x="184" y="882" class="h3" text-anchor="start">상태·통제·장애대응</text><circle cx="78" cy="942" r="7" fill="#4FA3FF" opacity="0.95"/><text x="104" y="948" class="body" text-anchor="start">ADM·BZA</text><circle cx="78" cy="988" r="7" fill="#4FA3FF" opacity="0.95"/><text x="104" y="994" class="body" text-anchor="start">관측·사고 대응</text><circle cx="78" cy="1034" r="7" fill="#4FA3FF" opacity="0.95"/><text x="104" y="1040" class="body" text-anchor="start">게이트웨이·배치</text><rect x="40" y="1098" width="640" height="250" rx="26" fill="#0D2138" stroke="#284766" stroke-width="1.4" filter="url(#shadow)"/><rect x="72" y="1126" width="84" height="38" rx="19" fill="#47D7A5" stroke="#47D7A5" stroke-width="1" /><text x="114" y="1152" class="body" text-anchor="middle">공급</text><text x="184" y="1154" class="h3" text-anchor="start">설치·DB·배포</text><circle cx="78" cy="1214" r="7" fill="#47D7A5" opacity="0.95"/><text x="104" y="1220" class="body" text-anchor="start">설치·업그레이드</text><circle cx="78" cy="1260" r="7" fill="#47D7A5" opacity="0.95"/><text x="104" y="1266" class="body" text-anchor="start">데이터베이스</text><circle cx="78" cy="1306" r="7" fill="#47D7A5" opacity="0.95"/><text x="104" y="1312" class="body" text-anchor="start">CI/CD·도구</text><rect x="40" y="1385" width="640" height="82" rx="18" fill="#102B49" stroke="#345A7D" stroke-width="1" /><text x="360" y="1418" class="body" text-anchor="middle"><tspan x="360" dy="0">개념 → 절차 → 예제 → 오류·부분 실패</tspan><tspan x="360" dy="28">복구 → 보안·감사 → 검증</tspan></text></svg>