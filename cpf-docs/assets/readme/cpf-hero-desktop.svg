360" y2="620" stroke="#17324D" stroke-width="1" stroke-linecap="round"/><line x1="0" y1="0" x2="1440" y2="0" stroke="#17324D" stroke-width="1" stroke-linecap="round"/><line x1="0" y1="80" x2="1440" y2="80" stroke="#17324D" stroke-width="1" stroke-linecap="round"/><line x1="0" y1="160" x2="1440" y2="160" stroke="#17324D" stroke-width="1" stroke-linecap="round"/><line x1="0" y1="240" x2="1440" y2="240" stroke="#17324D" stroke-width="1" stroke-linecap="round"/><line x1="0" y1="320" x2="1440" y2="320" stroke="#17324D" stroke-width="1" stroke-linecap="round"/><line x1="0" y1="400" x2="1440" y2="400" stroke="#17324D" stroke-width="1" stroke-linecap="round"/><line x1="0" y1="480" x2="1440" y2="480" stroke="#17324D" stroke-width="1" stroke-linecap="round"/><line x1="0" y1="560" x2="1440" y2="560" stroke="#17324D" stroke-width="1" stroke-linecap="round"/><rect x="74" y="58" width="168" height="42" rx="21" fill="#0E2946" stroke="#36D3D0" stroke-width="1.2" /><text x="158" y="86" class="label" text-anchor="middle">CORE PLATFORM FRAMEWORK</text><text x="76" y="178" class="h1" text-anchor="start">업무 시스템을 위한</text><text x="76" y="245" class="h1" text-anchor="start">하나의 실행·운영 기준</text><text x="78" y="300" class="body" text-anchor="start"><tspan x="78" dy="0">동일 JVM과 분리 WAS, 온라인과 배치, 연계와 메시징,</tspan><tspan x="78" dy="32">보안과 감사, 설치와 복구를 같은 제품 규칙으로 연결합니다.</tspan></text><rect x="78" y="400" width="150" height="40" rx="20" fill="#0E2946" stroke="#36D3D0" stroke-width="1" /><text x="153.0" y="426" class="small" text-anchor="middle">모듈형 단일체</text><rect x="242" y="400" width="150" height="40" rx="20" fill="#0E2946" stroke="#4FA3FF" stroke-width="1" /><text x="317.0" y="426" class="small" text-anchor="middle">마이크로서비스</text><rect x="406" y="400" width="150" height="40" rx="20" fill="#0E2946" stroke="#9B7CFF" stroke-width="1" /><text x="481.0" y="426" class="small" text-anchor="middle">다중 인스턴스</text><rect x="570" y="400" width="172" height="40" rx="20" fill="#0E2946" stroke="#47D7A5" stroke-width="1" /><text x="656.0" y="426" class="small" text-anchor="middle">업무영역 생성기</text><rect x="850" y="76" width="500" height="460" rx="32" fill="#0D2138" stroke="#284766" stroke-width="1.5" filter="url(#shadow)"/><rect x="894" y="112" width="412" height="82" rx="20" fill="#132E4A" stroke="#FF7A8A" stroke-width="1.2" /><circle cx="926" cy="153" r="12" fill="#FF7A8A" opacity="0.9"/><text x="954" y="146" class="h3" text-anchor="start">운영·통제</text><text x="954" y="172" class="small" text-anchor="start">ADM · BZA</text><line x1="1100" y1="194" x2="1100" y2="217" stroke="#426281" stroke-width="2" stroke-linecap="round"/><rect x="894" y="216" width="412" height="82" rx="20" fill="#132E4A" stroke="#4FA3FF" stroke-width="1.2" /><circle cx="926" cy="257" r="12" fill="#4FA3FF" opacity="0.9"/><text x="954" y="250" class="h3" text-anchor="start">업무 실행</text><text x="954" y="276" class="small" text-anchor="start">온라인 · 비동기 · 배치</text><line x1="1100" y1="298" x2="1100" y2="321" stroke="#426281" stroke-width="2" stroke-linecap="round"/><rect x="894" y="320" width="412" height="82" rx="20" fill="#132E4A" stroke="#36D3D0" stroke-width="1.2" /><circle cx="926" cy="361" r="12" fill="#36D3D0" opacity="0.9"/><text x="954" y="354" class="h3" text-anchor="start">공개 계약</text><text x="954" y="380" class="small" text-anchor="start">API · SPI · 표준 문맥</text><line x1="1100" y1="402" x2="1100" y2="425" stroke="#426281" stroke-width="2" stroke-linecap="round"/><rect x="894" y="424" width="412" height="82" rx="20" fill="#132E4A" stroke="#9B7CFF" stroke-width="1.2" /><circle cx="926" cy="465" r="12" fill="#9B7CFF" opacity="0.9"/><text x="954" y="458" class="h3" text-anchor="start">도구·공급</text><text x="954" y="484" class="small" text-anchor="start">생성 · 설치 · 검증 · 배포</text><text x="78" y="548" class="small" text-anchor="start">개발자 · 운영자 · 설계자 · 배포 담당자가 같은 구조를 봅니다.</text></svg>
