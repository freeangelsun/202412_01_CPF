 .label{font-size:15px;font-weight:800;letter-spacing:1px;fill:#36D3D0}
 .darkh{font-size:30px;font-weight:800;letter-spacing:-.7px;fill:#10243D}
 .darkbody{font-size:18px;font-weight:500;fill:#34506D}
 .darksmall{font-size:15px;font-weight:500;fill:#607A96}
 .mono{font-family:'SFMono-Regular','Consolas','Liberation Mono',monospace;font-size:16px;fill:#D7E6F7}
 .chip{font-size:15px;font-weight:800;fill:#FFFFFF}
 .darkmodule{font-size:24px;font-weight:800;letter-spacing:-.4px;fill:#10243D}
</style><rect x="0" y="0" width="720" height="1040" rx="0" fill="url(#bg)" stroke="none" stroke-width="1.4" /><circle cx="610" cy="100" r="180" fill="#4FA3FF" opacity="0.12"/><circle cx="670" cy="920" r="240" fill="#9B7CFF" opacity="0.12"/><circle cx="20" cy="760" r="180" fill="#36D3D0" opacity="0.08"/><rect x="40" y="42" width="210" height="42" rx="21" fill="#0E2946" stroke="#36D3D0" stroke-width="1.2" /><text x="145" y="70" class="label" text-anchor="middle">CORE PLATFORM FRAMEWORK</text><text x="42" y="158" class="h1" text-anchor="start"><tspan x="42" dy="0">업무 시스템을 위한</tspan><tspan x="42" dy="68">하나의 실행·운영 기준</tspan></text><text x="44" y="318" class="body" text-anchor="start"><tspan x="44" dy="0">동일 JVM과 분리 WAS, 온라인과 배치,</tspan><tspan x="44" dy="34">연계와 메시징, 보안과 감사, 설치와 복구를</tspan><tspan x="44" dy="34">같은 제품 규칙으로 연결합니다.</tspan></text><rect x="44" y="458" width="190" height="40" rx="20" fill="#0E2946" stroke="#36D3D0" stroke-width="1" /><text x="139.0" y="484" class="small" text-anchor="middle">모듈형 단일체</text><rect x="378" y="458" width="180" height="40" rx="20" fill="#0E2946" stroke="#4FA3FF" stroke-width="1" /><text x="468.0" y="484" class="small" text-anchor="middle">마이크로서비스</text><rect x="44" y="514" width="190" height="40" rx="20" fill="#0E2946" stroke="#9B7CFF" stroke-width="1" /><text x="139.0" y="540" class="small" text-anchor="middle">다중 인스턴스</text><rect x="378" y="514" width="180" height="40" rx="20" fill="#0E2946" stroke="#47D7A5" stroke-width="1" /><text x="468.0" y="540" class="small" text-anchor="middle">업무영역 생성기</text><rect x="42" y="598" width="636" height="350" rx="30" fill="#0D2138" stroke="#284766" stroke-width="1.5" filter="url(#shadow)"/><rect x="74" y="628" width="572" height="62" rx="18" fill="#132E4A" stroke="#FF7A8A" stroke-width="1.1" /><circle cx="104" cy="659" r="10" fill="#FF7A8A" opacity="0.9"/><text x="130" y="655" class="h3" text-anchor="start">운영·통제</text><text x="130" y="677" class="small" text-anchor="start">ADM · BZA</text><rect x="74" y="704" width="572" height="62" rx="18" fill="#132E4A" stroke="#4FA3FF" stroke-width="1.1" /><circle cx="104" cy="735" r="10" fill="#4FA3FF" opacity="0.9"/><text x="130" y="731" class="h3" text-anchor="start">업무 실행</text><text x="130" y="753" class="small" text-anchor="start">온라인 · 비동기 · 배치</text><rect x="74" y="780" width="572" height="62" rx="18" fill="#132E4A" stroke="#36D3D0" stroke-width="1.1" /><circle cx="104" cy="811" r="10" fill="#36D3D0" opacity="0.9"/><text x="130" y="807" class="h3" text-anchor="start">공개 계약</text><text x="130" y="829" class="small" text-anchor="start">API · SPI · 표준 문맥</text><rect x="74" y="856" width="572" height="62" rx="18" fill="#132E4A" stroke="#9B7CFF" stroke-width="1.1" /><circle cx="104" cy="887" r="10" fill="#9B7CFF" opacity="0.9"/><text x="130" y="883" class="h3" text-anchor="start">도구·공급</text><text x="130" y="905" class="small" text-anchor="start">생성 · 설치 · 검증 · 배포</text><text x="42" y="1000" class="small" text-anchor="start">개발자 · 운영자 · 설계자 · 배포 담당자가 같은 구조를 봅니다.</text></svg>