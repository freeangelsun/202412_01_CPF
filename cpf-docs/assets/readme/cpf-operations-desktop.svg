</style><rect x="0" y="0" width="1440" height="820" rx="0" fill="url(#bg)" stroke="none" stroke-width="1.4" /><text x="72" y="78" class="h2" text-anchor="start">운영자는 상태를 보고, 근거를 남기고, 안전하게 조치합니다</text><text x="72" y="114" class="body" text-anchor="start">조회 화면과 위험 명령을 분리하고 권한·사유·승인·감사를 공통 절차로 적용합니다.</text><rect x="72" y="176" width="624" height="410" rx="30" fill="#0D2138" stroke="#284766" stroke-width="1.4" filter="url(#shadow)"/><rect x="108" y="210" width="84" height="40" rx="20" fill="#4FA3FF" stroke="#4FA3FF" stroke-width="1" /><text x="150" y="238" class="body" text-anchor="middle">ADM</text><text x="214" y="242" class="h2" text-anchor="start">플랫폼 운영</text><circle cx="120" cy="304" r="7" fill="#4FA3FF" opacity="0.95"/><text x="144" y="310" class="body" text-anchor="start">서비스 등록부·인스턴스 상태</text><circle cx="120" cy="366" r="7" fill="#4FA3FF" opacity="0.95"/><text x="144" y="372" class="body" text-anchor="start">Gateway 적용·ACK·실시간 상태</text><circle cx="120" cy="428" r="7" fill="#4FA3FF" opacity="0.95"/><text x="144" y="434" class="body" text-anchor="start">Batch 승인·투영·시도 원장</text><circle cx="120" cy="490" r="7" fill="#4FA3FF" opacity="0.95"/><text x="144" y="496" class="body" text-anchor="start">로그 수집 정책·감사 반출</text><rect x="744" y="176" width="624" height="410" rx="30" fill="#0D2138" stroke="#284766" stroke-width="1.4" filter="url(#shadow)"/><rect x="780" y="210" width="84" height="40" rx="20" fill="#9B7CFF" stroke="#9B7CFF" stroke-width="1" /><text x="822" y="238" class="body" text-anchor="middle">BZA</text><text x="886" y="242" class="h2" text-anchor="start">업무 관리</text><circle cx="792" cy="304" r="7" fill="#9B7CFF" opacity="0.95"/><text x="816" y="310" class="body" text-anchor="start">조직·사용자·역할·권한</text><circle cx="792" cy="366" r="7" fill="#9B7CFF" opacity="0.95"/><text x="816" y="372" class="body" text-anchor="start">결재 정책·대리결재·이력</text><circle cx="792" cy="428" r="7" fill="#9B7CFF" opacity="0.95"/><text x="816" y="434" class="body" text-anchor="start">첨부·검사·격리·다운로드</text><circle cx="792" cy="490" r="7" fill="#9B7CFF" opacity="0.95"/><text x="816" y="496" class="body" text-anchor="start">알림·업무 감사·상태 관리</text><rect x="72" y="630" width="1296" height="118" rx="24" fill="#102B49" stroke="#345A7D" stroke-width="1" /><rect x="100" y="668" width="118" height="44" rx="14" fill="#163553" stroke="#36D3D0" stroke-width="1" /><text x="159.0" y="697" class="small" text-anchor="middle">대상 조회</text><line x1="218" y1="690" x2="234" y2="690" stroke="#5D7EA2" stroke-width="2" stroke-linecap="round"/><rect x="234" y="668" width="118" height="44" rx="14" fill="#163553" stroke="#36D3D0" stroke-width="1" /><text x="293.0" y="697" class="small" text-anchor="middle">현재 상태</text><line x1="352" y1="690" x2="368" y2="690" stroke="#5D7EA2" stroke-width="2" stroke-linecap="round"/><rect x="368" y="668" width="118" height="44" rx="14" fill="#163553" stroke="#36D3D0" stroke-width="1" /><text x="427.0" y="697" class="small" text-anchor="middle">권한</text><line x1="486" y1="690" x2="502" y2="690" stroke="#5D7EA2" stroke-width="2" stroke-linecap="round"/><rect x="502" y="668" width="118" height="44" rx="14" fill="#163553" stroke="#36D3D0" stroke-width="1" /><text x="561.0" y="697" class="small" text-anchor="middle">사유</text><line x1="620" y1="690" x2="636" y2="690" stroke="#5D7EA2" stroke-width="2" stroke-linecap="round"/><rect x="636" y="668" width="118" height="44" rx="14" fill="#163553" stroke="#36D3D0" stroke-width="1" /><text x="695.0" y="697" class="small" text-anchor="middle">승인</text><line x1="754" y1="690" x2="770" y2="690" stroke="#5D7EA2" stroke-width="2" stroke-linecap="round"/><rect x="770" y="668" width="118" height="44" rx="14" fill="#163553" stroke="#47D7A5" stroke-width="1" /><text x="829.0" y="697" class="small" text-anchor="middle">실행</text><line x1="888" y1="690" x2="904" y2="690" stroke="#5D7EA2" stroke-width="2" stroke-linecap="round"/><rect x="904" y="668" width="118" height="44" rx="14" fill="#163553" stroke="#47D7A5" stroke-width="1" /><text x="963.0" y="697" class="small" text-anchor="middle">결과 확인</text><line x1="1022" y1="690" x2="1038" y2="690" stroke="#5D7EA2" stroke-width="2" stroke-linecap="round"/><rect x="1038" y="668" width="142" height="44" rx="14" fill="#163553" stroke="#47D7A5" stroke-width="1" /><text x="1109.0" y="697" class="small" text-anchor="middle">대사·되돌리기</text><line x1="1180" y1="690" x2="1196" y2="690" stroke="#5D7EA2" stroke-width="2" stroke-linecap="round"/><rect x="1196" y="668" width="118" height="44" rx="14" fill="#163553" stroke="#47D7A5" stroke-width="1" /><text x="1255.0" y="697" class="small" text-anchor="middle">감사·증적</text></svg>