 .body{font-size:20px;font-weight:500;fill:#D7E6F7}
 .small{font-size:16px;font-weight:500;fill:#8FA9C6}
 .label{font-size:15px;font-weight:800;letter-spacing:1px;fill:#36D3D0}
 .darkh{font-size:30px;font-weight:800;letter-spacing:-.7px;fill:#10243D}
 .darkbody{font-size:18px;font-weight:500;fill:#34506D}
 .darksmall{font-size:15px;font-weight:500;fill:#607A96}
 .mono{font-family:'SFMono-Regular','Consolas','Liberation Mono',monospace;font-size:16px;fill:#D7E6F7}
 .chip{font-size:15px;font-weight:800;fill:#FFFFFF}
 .darkmodule{font-size:24px;font-weight:800;letter-spacing:-.4px;fill:#10243D}
</style><rect x="0" y="0" width="720" height="1480" rx="0" fill="url(#bg)" stroke="none" stroke-width="1.4" /><text x="40" y="74" class="h2" text-anchor="start"><tspan x="40" dy="0">운영자는 상태를 보고,</tspan><tspan x="40" dy="42">근거를 남기고, 안전하게 조치합니다</tspan></text><text x="40" y="180" class="body" text-anchor="start"><tspan x="40" dy="0">조회 화면과 위험 명령을 분리하고 권한·사유·</tspan><tspan x="40" dy="30">승인·감사를 공통 절차로 적용합니다.</tspan></text><rect x="40" y="280" width="640" height="380" rx="28" fill="#0D2138" stroke="#284766" stroke-width="1.4" filter="url(#shadow)"/><rect x="72" y="312" width="82" height="38" rx="19" fill="#4FA3FF" stroke="#4FA3FF" stroke-width="1" /><text x="113" y="338" class="body" text-anchor="middle">ADM</text><text x="180" y="342" class="h2" text-anchor="start">플랫폼 운영</text><circle cx="76" cy="404" r="7" fill="#4FA3FF" opacity="0.95"/><text x="102" y="410" class="body" text-anchor="start">서비스 등록부·인스턴스 상태</text><circle cx="76" cy="462" r="7" fill="#4FA3FF" opacity="0.95"/><text x="102" y="468" class="body" text-anchor="start">Gateway 적용·ACK·실시간 상태</text><circle cx="76" cy="520" r="7" fill="#4FA3FF" opacity="0.95"/><text x="102" y="526" class="body" text-anchor="start">Batch 승인·투영·시도 원장</text><circle cx="76" cy="578" r="7" fill="#4FA3FF" opacity="0.95"/><text x="102" y="584" class="body" text-anchor="start">로그 수집 정책·감사 반출</text><rect x="40" y="686" width="640" height="380" rx="28" fill="#0D2138" stroke="#284766" stroke-width="1.4" filter="url(#shadow)"/><rect x="72" y="718" width="82" height="38" rx="19" fill="#9B7CFF" stroke="#9B7CFF" stroke-width="1" /><text x="113" y="744" class="body" text-anchor="middle">BZA</text><text x="180" y="748" class="h2" text-anchor="start">업무 관리</text><circle cx="76" cy="810" r="7" fill="#9B7CFF" opacity="0.95"/><text x="102" y="816" class="body" text-anchor="start">조직·사용자·역할·권한</text><circle cx="76" cy="868" r="7" fill="#9B7CFF" opacity="0.95"/><text x="102" y="874" class="body" text-anchor="start">결재 정책·대리결재·이력</text><circle cx="76" cy="926" r="7" fill="#9B7CFF" opacity="0.95"/><text x="102" y="932" class="body" text-anchor="start">첨부·검사·격리·다운로드</text><circle cx="76" cy="984" r="7" fill="#9B7CFF" opacity="0.95"/><text x="102" y="990" class="body" text-anchor="start">알림·업무 감사·상태 관리</text><rect x="40" y="1110" width="640" height="290" rx="24" fill="#102B49" stroke="#345A7D" stroke-width="1" /><text x="72" y="1156" class="h3" text-anchor="start">위험 조치 공통 절차</text><rect x="72" y="1190" width="270" height="44" rx="14" fill="#163553" stroke="#36D3D0" stroke-width="1" /><text x="207" y="1219" class="small" text-anchor="middle">대상 조회</text><rect x="366" y="1190" width="270" height="44" rx="14" fill="#163553" stroke="#36D3D0" stroke-width="1" /><text x="501" y="1219" class="small" text-anchor="middle">현재 상태</text><rect x="72" y="1248" width="270" height="44" rx="14" fill="#163553" stroke="#36D3D0" stroke-width="1" /><text x="207" y="1277" class="small" text-anchor="middle">권한·사유</text><rect x="366" y="1248" width="270" height="44" rx="14" fill="#163553" stroke="#36D3D0" stroke-width="1" /><text x="501" y="1277" class="small" text-anchor="middle">필요 시 승인</text><rect x="72" y="1306" width="270" height="44" rx="14" fill="#163553" stroke="#47D7A5" stroke-width="1" /><text x="207" y="1335" class="small" text-anchor="middle">실행</text><rect x="366" y="1306" width="270" height="44" rx="14" fill="#163553" stroke="#47D7A5" stroke-width="1" /><text x="501" y="1335" class="small" text-anchor="middle">결과 확인</text><rect x="72" y="1364" width="270" height="44" rx="14" fill="#163553" stroke="#47D7A5" stroke-width="1" /><text x="207" y="1393" class="small" text-anchor="middle">대사·되돌리기</text><rect x="366" y="1364" width="270" height="44" rx="14" fill="#163553" stroke="#47D7A5" stroke-width="1" /><text x="501" y="1393" class="small" text-anchor="middle">감사·증적</text></svg>
