<rect x="0" y="0" width="1440" height="700" rx="18" fill="#FFFFFF"/><text x="64" y="68" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#0B1F4D" text-anchor="start">오케스트레이션 — 나뉜 서비스를 하나의 업무 흐름으로</text><text x="64" y="104" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="19" font-weight="500" fill="#475569" text-anchor="start">같은 JVM이든 원격 서비스든, 업무 호출과 후속 처리를 같은 흐름에서 이해할 수 있게 연결합니다.</text><rect x="80" y="210" width="210" height="150" rx="18" fill="#FFFFFF" stroke="#D9E2F2" filter="url(#shadow)"/><circle cx="185" cy="248" r="22" fill="#2563EB"/><text x="185" y="297" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="20" font-weight="800" fill="#0B1F4D" text-anchor="middle">요청</text><text x="185" y="327" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#475569" text-anchor="middle">Gateway</text><rect x="330" y="210" width="210" height="150" rx="18" fill="#FFFFFF" stroke="#D9E2F2" filter="url(#shadow)"/><circle cx="435" cy="248" r="22" fill="#7C3AED"/><text x="435" y="297" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="20" font-weight="800" fill="#0B1F4D" text-anchor="middle">도메인 A</text><text x="435" y="327" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#475569" text-anchor="middle">업무 처리</text><rect x="580" y="210" width="210" height="150" rx="18" fill="#FFFFFF" stroke="#D9E2F2" filter="url(#shadow)"/><circle cx="685" cy="248" r="22" fill="#0891B2"/><text x="685" y="297" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="20" font-weight="800" fill="#0B1F4D" text-anchor="middle">도메인 B</text><text x="685" y="327" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#475569" text-anchor="middle">타 도메인 호출</text><rect x="830" y="210" width="210" height="150" rx="18" fill="#FFFFFF" stroke="#D9E2F2" filter="url(#shadow)"/><circle cx="935" cy="248" r="22" fill="#0F766E"/><text x="935" y="297" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="20" font-weight="800" fill="#0B1F4D" text-anchor="middle">외부 연계</text><text x="935" y="327" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#475569" text-anchor="middle">기관·파트너</text><rect x="1080" y="210" width="210" height="150" rx="18" fill="#FFFFFF" stroke="#D9E2F2" filter="url(#shadow)"/><circle cx="1185" cy="248" r="22" fill="#4F46E5"/><text x="1185" y="297" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="20" font-weight="800" fill="#0B1F4D" text-anchor="middle">후속 처리</text><text x="1185" y="327" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#475569" text-anchor="middle">메시징·Batch</text><line x1="302" y1="285" x2="318" y2="285" stroke="#2563EB" stroke-width="3"/><path d="M306 275 L322 285 L306 295 Z" fill="#2563EB"/><line x1="552" y1="285" x2="568" y2="285" stroke="#2563EB" stroke-width="3"/><path d="M556 275 L572 285 L556 295 Z" fill="#2563EB"/><line x1="802" y1="285" x2="818" y2="285" stroke="#2563EB" stroke-width="3"/><path d="M806 275 L822 285 L806 295 Z" fill="#2563EB"/><line x1="1052" y1="285" x2="1068" y2="285" stroke="#2563EB" stroke-width="3"/><path d="M1056 275 L1072 285 L1056 295 Z" fill="#2563EB"/><rect x="110" y="410" width="1190" height="74" rx="18" fill="url(#g1)"/><text x="705" y="442" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="18" font-weight="800" fill="#0B1F4D" text-anchor="middle">공통 거래 정보 · 호출 결과 · 실행 흐름</text><text x="705" y="468" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#475569" text-anchor="middle">서비스가 나뉘어도 어디서 시작해 어떤 경로를 거쳤는지 같은 기준으로 확인</text><rect x="100" y="535" width="285" height="105" rx="16" fill="#FFFFFF" stroke="#D9E2F2"/><circle cx="130" cy="565" r="10" fill="#0F766E"/><text x="150" y="571" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="17" font-weight="750" fill="#0B1F4D" text-anchor="start">정상 처리</text><text x="124" y="606" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#475569" text-anchor="start">다음 업무 진행</text><rect x="415" y="535" width="285" height="105" rx="16" fill="#FFFFFF" stroke="#D9E2F2"/><circle cx="445" cy="565" r="10" fill="#D97706"/><text x="465" y="571" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="17" font-weight="750" fill="#0B1F4D" text-anchor="start">업무 오류</text><text x="439" y="606" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#475569" text-anchor="start">업무 규칙에 따라 안내</text><rect x="730" y="535" width="285" height="105" rx="16" fill="#FFFFFF" stroke="#D9E2F2"/><circle cx="760" cy="565" r="10" fill="#EA580C"/><text x="780" y="571" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="17" font-weight="750" fill="#0B1F4D" text-anchor="start">기술 오류</text><text x="754" y="606" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#475569" text-anchor="start">재시도 가능 여부 판단</text><rect x="1045" y="535" width="285" height="105" rx="16" fill="#FFFFFF" stroke="#D9E2F2"/><circle cx="1075" cy="565" r="10" fill="#7C3AED"/><text x="1095" y="571" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="17" font-weight="750" fill="#0B1F4D" text-anchor="start">결과 확인 필요</text><text x="1069" y="606" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#475569" text-anchor="start">실제 처리 여부 확인 후 진행</text></svg>