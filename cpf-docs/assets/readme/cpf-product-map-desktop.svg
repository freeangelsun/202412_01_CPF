</style><rect x="0" y="0" width="1440" height="900" rx="0" fill="#F3F7FC" stroke="none" stroke-width="1.4" /><text x="72" y="80" class="darkh" text-anchor="start">CPF 제품 지도</text><text x="72" y="114" class="darkbody" text-anchor="start">업무 기능과 운영 기능, 공통 기반과 실행 제품의 책임을 분리합니다.</text><rect x="120" y="640" width="1200" height="180" rx="30" fill="#EAF3FF" stroke="#A6C3E6" stroke-width="1.8" filter="url(#softShadow)"/><text x="160" y="690" class="darkh" text-anchor="start">공통 기반</text><rect x="160" y="720" width="500" height="66" rx="18" fill="#FFFFFF" stroke="#9B7CFF" stroke-width="1.5" /><text x="190" y="748" class="darkmodule" text-anchor="start">cpf-core</text><text x="190" y="774" class="darksmall" text-anchor="start">공개 계약 · 실행 문맥 · 오류 · 추적</text><rect x="690" y="720" width="590" height="66" rx="18" fill="#FFFFFF" stroke="#36D3D0" stroke-width="1.5" /><text x="720" y="748" class="darkmodule" text-anchor="start">cpf-common</text><text x="720" y="774" class="darksmall" text-anchor="start">고객 업무 공통 정책 · 공통 기준정보</text><rect x="120" y="250" width="260" height="300" rx="28" fill="#FFFFFF" stroke="#C7D7E8" stroke-width="1.5" filter="url(#softShadow)"/><rect x="144" y="274" width="92" height="34" rx="17" fill="#FF7A8A" stroke="#FF7A8A" stroke-width="1" /><text x="190" y="297" class="chip" text-anchor="middle">업무·운영</text><text x="144" y="352" class="darkh" text-anchor="start">cpf-admin</text><text x="144" y="390" class="darkbody" text-anchor="start"><tspan x="144" dy="0">플랫폼 운영·관제·승인·감사</tspan><tspan x="144" dy="28">독립 소유권과 공개 계약</tspan></text><line x1="250" y1="550" x2="250" y2="640" stroke="#7896B5" stroke-width="2" stroke-linecap="round"/><rect x="420" y="250" width="260" height="300" rx="28" fill="#FFFFFF" stroke="#C7D7E8" stroke-width="1.5" filter="url(#softShadow)"/><rect x="444" y="274" width="92" height="34" rx="17" fill="#9B7CFF" stroke="#9B7CFF" stroke-width="1" /><text x="490" y="297" class="chip" text-anchor="middle">업무·운영</text><text x="444" y="352" class="darkh" text-anchor="start">cpf-biz-admin</text><text x="444" y="390" class="darkbody" text-anchor="start"><tspan x="444" dy="0">조직·사용자·권한·결재</tspan><tspan x="444" dy="28">독립 소유권과 공개 계약</tspan></text><line x1="550" y1="550" x2="550" y2="640" stroke="#7896B5" stroke-width="2" stroke-linecap="round"/><rect x="720" y="250" width="260" height="300" rx="28" fill="#FFFFFF" stroke="#C7D7E8" stroke-width="1.5" filter="url(#softShadow)"/><rect x="744" y="274" width="92" height="34" rx="17" fill="#47D7A5" stroke="#47D7A5" stroke-width="1" /><text x="790" y="297" class="chip" text-anchor="middle">업무·운영</text><text x="744" y="352" class="darkh" text-anchor="start">생성 업무영역</text><text x="744" y="390" class="darkbody" text-anchor="start"><tspan x="744" dy="0">업무 API·원장·연계·화면</tspan><tspan x="744" dy="28">독립 소유권과 공개 계약</tspan></text><line x1="850" y1="550" x2="850" y2="640" stroke="#7896B5" stroke-width="2" stroke-linecap="round"/><rect x="1020" y="250" width="300" height="300" rx="28" fill="#FFF8EA" stroke="#E7C277" stroke-width="1.5" filter="url(#softShadow)"/><text x="1050" y="298" class="darkh" text-anchor="start">선택 실행 제품</text><rect x="1050" y="330" width="240" height="70" rx="18" fill="#FFFFFF" stroke="#4FA3FF" stroke-width="1.3" /><text x="1074" y="361" class="darkmodule" text-anchor="start">cpf-gateway</text><text x="1074" y="386" class="darksmall" text-anchor="start">외부 진입·경로 선택</text><rect x="1050" y="420" width="240" height="90" rx="18" fill="#FFFFFF" stroke="#FFC66D" stroke-width="1.3" /><text x="1074" y="452" class="darkmodule" text-anchor="start">cpf-batch</text><text x="1074" y="476" class="darksmall" text-anchor="start"><tspan x="1074" dy="0">일정·작업자·에이전트</tspan><tspan x="1074" dy="22">대량 실행·재처리</tspan></text><line x1="1170" y1="550" x2="1170" y2="640" stroke="#7896B5" stroke-width="2" stroke-linecap="round"/><rect x="120" y="150" width="1200" height="64" rx="20" fill="#10243D" stroke="#10243D" stroke-width="1" /><text x="160" y="191" class="body" text-anchor="start">생성