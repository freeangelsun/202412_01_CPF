"150" rx="24" fill="#FFFFFF" stroke="#C7D7E8" stroke-width="1.4" filter="url(#softShadow)"/><rect x="68" y="822" width="100" height="32" rx="16" fill="#4FA3FF" stroke="#4FA3FF" stroke-width="1" /><text x="118" y="844" class="chip" text-anchor="middle">선택 실행</text><text x="68" y="890" class="darkh" text-anchor="start">cpf-gateway</text><text x="68" y="922" class="darkbody" text-anchor="start">외부 진입·경로 선택</text><rect x="40" y="968" width="640" height="150" rx="24" fill="#FFFFFF" stroke="#C7D7E8" stroke-width="1.4" filter="url(#softShadow)"/><rect x="68" y="994" width="100" height="32" rx="16" fill="#FFC66D" stroke="#FFC66D" stroke-width="1" /><text x="118" y="1016" class="chip" text-anchor="middle">선택 실행</text><text x="68" y="1062" class="darkh" text-anchor="start">cpf-batch</text><text x="68" y="1094" class="darkbody" text-anchor="start">일정·작업자·에이전트·대량 실행</text><rect x="40" y="1148" width="640" height="330" rx="28" fill="#EAF3FF" stroke="#A6C3E6" stroke-width="1.6" filter="url(#softShadow)"/><text x="72" y="1196" class="darkh" text-anchor="start">공통 기반</text><rect x="72" y="1230" width="576" height="98" rx="20" fill="#FFFFFF" stroke="#9B7CFF" stroke-width="1.4" /><text x="100" y="1267" class="darkmodule" text-anchor="start">cpf-core</text><text x="100" y="1300" class="darkbody" text-anchor="start">공개 계약 · 실행 문맥 · 오류 · 추적</text><rect x="72" y="1350" width="576" height="98" rx="20" fill="#FFFFFF" stroke="#36D3D0" stroke-width="1.4" /><text x="100" y="1387" class="darkmodule" text-anchor="start">cpf-common</text><text x="100" y="1420" class="darkbody" text-anchor="start">고객 업무 공통 정책 · 공통 기준정보</text></svg>
