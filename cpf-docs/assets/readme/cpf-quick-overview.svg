<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941">
<rect width="1672" height="941" fill="#fff"/>
<style>text{font-family:"Noto Sans CJK KR",sans-serif; fill:#17233D}.h1{font-size:46px;font-weight:800}.sub{font-size:24px;fill:#68738A}.h2{font-size:28px;font-weight:800}.h3{font-size:24px;font-weight:700}.body{font-size:21px}.small{font-size:18px;fill:#68738A}.label{font-size:20px;font-weight:700}</style>
<text x="48" y="72" class="h1">CPF 한눈에 보기</text>
<text x="48" y="112" class="sub">업무 개발자는 업무 Domain에 집중하고, 필요한 기능과 Runtime은 CPF의 표준 구조에서 선택합니다.</text>
<line x1="48" y1="135" x2="1624" y2="135" stroke="#D8E0EF" stroke-width="2"/>
<rect x="65" y="250" width="300" height="220" rx="26" fill="#FBFCFF" stroke="#5574FF" stroke-width="3"/><text x="215.0" y="315" class="h2" text-anchor="middle" fill="#5574FF">요청 · 실행</text><text x="215.0" y="372" class="body" text-anchor="middle">Online 요청</text><text x="215.0" y="412" class="body" text-anchor="middle">Batch 실행</text><line x1="365" y1="360" x2="402" y2="335" stroke="#5574FF" stroke-width="4"/><polygon points="402,335 386.48075255937425,337.0378809770519 394.31875631726604,348.6381265387318" fill="#5574FF"/><rect x="420" y="225" width="360" height="220" rx="26" fill="#FBFCFF" stroke="#7657E8" stroke-width="3"/><text x="600.0" y="290" class="h2" text-anchor="middle" fill="#7657E8">업무 Domain</text><text x="600.0" y="347" class="body" text-anchor="middle">Controller · Service</text><text x="600.0" y="387" class="body" text-anchor="middle">Repository · Batch</text><line x1="780" y1="335" x2="817" y2="335" stroke="#7657E8" stroke-width="4"/><polygon points="817,335 803.0,328.0 803.0,342.0" fill="#7657E8"/><rect x="835" y="225" width="390" height="220" rx="26" fill="#FBFCFF" stroke="#58B8C9" stroke-width="3"/><text x="1030.0" y="290" class="h2" text-anchor="middle" fill="#58B8C9">CPF 공통 기능</text><text x="1030.0" y="347" class="body" text-anchor="middle">TX · Cache · Logging</text><text x="1030.0" y="387" class="body" text-anchor="middle">호출 · 연계 · Security</text><line x1="1225" y1="335" x2="1262" y2="360" stroke="#58B8C9" stroke-width="4"/><polygon points="1262,360 1254.318756317266,346.3618734612682 1246.4807525593742,357.9621190229481" fill="#58B8C9"/><rect x="1280" y="250" width="325" height="220" rx="26" fill="#FBFCFF" stroke="#60AE78" stroke-width="3"/><text x="1442.5" y="315" class="h2" text-anchor="middle" fill="#60AE78">데이터 · 외부</text><text x="1442.5" y="372" class="body" text-anchor="middle">DB · Messaging</text><text x="1442.5" y="412" class="body" text-anchor="middle">Storage · External</text><rect x="80" y="620" width="350" height="125" rx="20" fill="#fff" stroke="#ED9B45" stroke-width="2"/><text x="255" y="665" class="h3" text-anchor="middle" fill="#ED9B45">Gateway (필요 시)</text><text x="255" y="705" class="small" text-anchor="middle">외부 진입 · Route · 정책</text><rect x="470" y="620" width="350" height="125" rx="20" fill="#fff" stroke="#7657E8" stroke-width="2"/><text x="645" y="665" class="h3" text-anchor="middle" fill="#7657E8">Batch Runtime</text><text x="645" y="705" class="small" text-anchor="middle">Scheduler · Worker · Agent</text><rect x="860" y="620" width="350" height="125" rx="20" fill="#fff" stroke="#5574FF" stroke-width="2"/><text x="1035" y="665" class="h3" text-anchor="middle" fill="#5574FF">ADM / BZA</text><text x="1035" y="705" class="small" text-anchor="middle">조회 · 제어 · 권한 · 감사</text><rect x="1250" y="620" width="350" height="125" rx="20" fill="#fff" stroke="#58B8C9" stroke-width="2"/><text x="1425" y="665" class="h3" text-anchor="middle" fill="#58B8C9">Build / Generator / 검증</text><text x="1425" y="705" class="small" text-anchor="middle">생성 · 빌드 · 테스트 · Gate</text><rect x="215" y="805" width="1240" height="62" rx="18" fill="#EEF3FF" stroke="#D8E0EF" stroke-width="1"/><text x="835" y="846" class="h3" text-anchor="middle">기본 제공 기반 위에서 필요한 기능만 선택하고, 업무 확장 시 Domain · Starter · Runtime을 같은 방식으로 확장합니다.</text></svg>