<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941">
<rect width="1672" height="941" fill="#fff"/>
<style>text{font-family:"Noto Sans CJK KR",sans-serif; fill:#17233D}.h1{font-size:46px;font-weight:800}.sub{font-size:24px;fill:#68738A}.h2{font-size:28px;font-weight:800}.h3{font-size:24px;font-weight:700}.body{font-size:21px}.small{font-size:18px;fill:#68738A}.label{font-size:20px;font-weight:700}</style>
<text x="48" y="72" class="h1">필요한 기능을 Starter로 선택</text>
<text x="48" y="112" class="sub">기능을 직접 조립하지 않고 CPF Starter로 선택하면 설정·의존성·Provider 연결을 같은 방식으로 관리할 수 있습니다.</text>
<line x1="48" y1="135" x2="1624" y2="135" stroke="#D8E0EF" stroke-width="2"/>
<rect x="60" y="220" width="290" height="145" rx="22" fill="#FBFCFF" stroke="#5574FF" stroke-width="3"/><text x="205.0" y="274" class="h2" text-anchor="middle" fill="#5574FF">업무 목적</text><text x="205.0" y="320" class="body" text-anchor="middle">REST API / Batch / Event</text><line x1="350" y1="292" x2="387" y2="292" stroke="#5574FF" stroke-width="4"/><polygon points="387,292 373.0,285.0 373.0,299.0" fill="#5574FF"/><rect x="405" y="220" width="300" height="145" rx="22" fill="#FBFCFF" stroke="#58B8C9" stroke-width="3"/><text x="555.0" y="274" class="h2" text-anchor="middle" fill="#58B8C9">Profile 선택</text><text x="555.0" y="320" class="body" text-anchor="middle">web-api · secure-api · batch</text><line x1="705" y1="292" x2="742" y2="292" stroke="#58B8C9" stroke-width="4"/><polygon points="742,292 728.0,285.0 728.0,299.0" fill="#58B8C9"/><rect x="760" y="220" width="360" height="145" rx="22" fill="#FBFCFF" stroke="#7657E8" stroke-width="3"/><text x="940.0" y="274" class="h2" text-anchor="middle" fill="#7657E8">Starter / Provider</text><text x="940.0" y="320" class="body" text-anchor="middle">DB · Cache · Messaging · Security</text><line x1="1120" y1="292" x2="1157" y2="292" stroke="#7657E8" stroke-width="4"/><polygon points="1157,292 1143.0,285.0 1143.0,299.0" fill="#7657E8"/><rect x="1175" y="220" width="420" height="145" rx="22" fill="#FBFCFF" stroke="#60AE78" stroke-width="3"/><text x="1385.0" y="274" class="h2" text-anchor="middle" fill="#60AE78">CPF가 구성</text><text x="1385.0" y="320" class="body" text-anchor="middle">의존성 · AutoConfiguration · 표준 설정</text><line x1="1385" y1="365" x2="1385" y2="455" stroke="#60AE78" stroke-width="4"/><polygon points="1385,455 1392.0,441.0 1378.0,441.0" fill="#60AE78"/><rect x="1135" y="455" width="500" height="110" rx="22" fill="#F2F5FF" stroke="#5574FF" stroke-width="2"/><text x="1385" y="500" class="h2" text-anchor="middle" fill="#5574FF">Generator로 생성한 업무 Domain</text><text x="1385" y="538" class="body" text-anchor="middle">업무 코드는 Public Starter API 중심으로 사용</text><rect x="64" y="640" width="365" height="155" rx="22" fill="#FBFCFF" stroke="#5574FF" stroke-width="2"/><text x="88" y="686" class="h3" text-anchor="start" fill="#5574FF">필요한 기능만 선택</text><text x="88" y="728" class="small" text-anchor="start">불필요한 Provider를</text><text x="88" y="756" class="small" text-anchor="start">프로젝트에 강제하지 않음</text><rect x="460" y="640" width="365" height="155" rx="22" fill="#FBFCFF" stroke="#58B8C9" stroke-width="2"/><text x="484" y="686" class="h3" text-anchor="start" fill="#58B8C9">추가·교체가 쉬움</text><text x="484" y="728" class="small" text-anchor="start">Starter / Provider 단위로</text><text x="484" y="756" class="small" text-anchor="start">기능을 변경</text><rect x="856" y="640" width="365" height="155" rx="22" fill="#FBFCFF" stroke="#7657E8" stroke-width="2"/><text x="880" y="686" class="h3" text-anchor="start" fill="#7657E8">설정 방식 통일</text><text x="880" y="728" class="small" text-anchor="start">의존성 · 설정 · AutoConfiguration을</text><text x="880" y="756" class="small" text-anchor="start">CPF가 같은 방식으로 관리</text><rect x="1252" y="640" width="365" height="155" rx="22" fill="#FBFCFF" stroke="#60AE78" stroke-width="2"/><text x="1276" y="686" class="h3" text-anchor="start" fill="#60AE78">업무 코드 영향 최소화</text><text x="1276" y="728" class="small" text-anchor="start">Provider가 바뀌어도</text><text x="1276" y="756" class="small" text-anchor="start">공개 API 사용 패턴을 유지</text><text x="64" y="850" class="h3" text-anchor="start">자주 선택하는 범위</text><text x="270" y="850" class="body" text-anchor="start">Web/API · JDBC/MyBatis/JPA · Caffeine/Redis/Valkey · Kafka/JMS/IBM MQ/RabbitMQ · OIDC/Session · S3 · GraphQL · Realtime</text></svg>