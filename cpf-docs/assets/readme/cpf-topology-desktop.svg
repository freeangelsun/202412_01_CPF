<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="840" viewBox="0 0 1440 840" role="img" aria-labelledby="title desc">
<title id="title">배포 구성과 호출 경로</title><desc id="desc">직접 진입, 선택형 게이트웨이, 동일 JVM, 분리 WAS 구성</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06101D"/><stop offset="0.55" stop-color="#0A2038"/><stop offset="1" stop-color="#102E4D"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#36D3D0"/><stop offset="0.5" stop-color="#4FA3FF"/><stop offset="1" stop-color="#9B7CFF"/></linearGradient>
  <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC66D"/><stop offset="1" stop-color="#FF7A8A"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".25"/></filter>
  <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00152A" flood-opacity=".14"/></filter>
</defs>
<style>
 text{font-family:'NanumGothic','Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;}
 .h1{font-size:54px;font-weight:800;letter-spacing:-1.8px;fill:#F8FBFF}
 .h2{font-size:34px;font-weight:800;letter-spacing:-1px;fill:#F8FBFF}
 .h3{font-size:24px;font-weight:800;letter-spacing:-.4px;fill:#F8FBFF}
 .body{font-size:20px;font-weight:500;fill:#D7E6F7}
 .small{font-size:16px;font-weight:500;fill:#8FA9C6}
 .label{font-size:15px;font-weight:800;letter-spacing:1px;fill:#36D3D0}
 .darkh{font-size:30px;font-weight:800;letter-spacing:-.7px;fill:#10243D}
 .darkbody{font-size:18px;font-weight:500;fill:#34506D}
 .darksmall{font-size:15px;font-weight:500;fill:#607A96}
 .mono{font-family:'SFMono-Regular','Consolas','Liberation Mono',monospace;font-size:16px;fill:#D7E6F7}
 .chip{font-size:15px;font-weight:800;fill:#FFFFFF}
 .darkmodule{font-size:24px;font-weight:800;letter-spacing:-.4px;fill:#10243D}
</style><rect x="0" y="0" width="1440" height="840" rx="0" fill="url(#bg)" stroke="none" stroke-width="1.4" /><text x="72" y="82" class="h2" text-anchor="start">배포가 달라도 업무 계약은 같습니다</text><text x="72" y="116" class="body" text-anchor="start">호출 경로는 달라져도 헤더·오류·권한·추적·멱등성의 의미는 유지됩니다.</text><rect x="72" y="170" width="620" height="560" rx="30" fill="#0D2138" stroke="#284766" stroke-width="1.4" /><text x="110" y="220" class="h3" text-anchor="start">외부 진입</text><rect x="110" y="260" width="210" height="76" rx="20" fill="#163553" stroke="#36D3D0" stroke-width="1.2" /><text x="215" y="305" class="body" text-anchor="middle">채널 / 파트너</text><line x1="320" y1="298" x2="440" y2="298" stroke="#36D3D0" stroke-width="4" stroke-linecap="round"/><rect x="440" y="260" width="210" height="76" rx="20" fill="#163553" stroke="#47D7A5" stroke-width="1.2" /><text x="545" y="305" class="body" text-anchor="middle">업무영역</text><text x="110" y="370" class="label" text-anchor="start">직접 진입</text><text x="210" y="370" class="small" text-anchor="start">필요한 경우 업무영역으로 바로 연결</text><rect x="110" y="430" width="170" height="76" rx="20" fill="#163553" stroke="#36D3D0" stroke-width="1.2" /><text x="195" y="475" class="body" text-anchor="middle">채널</text><line x1="280" y1="468" x2="340" y2="468" stroke="#4FA3FF" stroke-width="4" stroke-linecap="round"/><rect x="340" y="430" width="150" height="76" rx="20" fill="#163553" stroke="#4FA3FF" stroke-width="1.2" /><text x="415" y="475" class="body" text-anchor="middle">Gateway</text><line x1="490" y1="468" x2="540" y2="468" stroke="#47D7A5" stroke-width="4" stroke-linecap="round"/><rect x="540" y="430" width="110" height="76" rx="20" fill="#163553" stroke="#47D7A5" stroke-width="1.2" /><text x="595" y="475" class="body" text-anchor="middle">업무</text><text x="110" y="545" class="label" text-anchor="start">선택형 Gateway</text><text x="110" y="580" class="small" text-anchor="start"><tspan x="110" dy="0">공통 인증·경로 선택·호출량 제한·장애 격리가</tspan><tspan x="110" dy="26">필요한 경우에만 사용합니다.</tspan></text><rect x="748" y="170" width="620" height="560" rx="30" fill="#0D2138" stroke="#284766" stroke-width="1.4" /><text x="786" y="220" class="h3" text-anchor="start">업무영역 간 호출</text><rect x="786" y="270" width="170" height="76" rx="20" fill="#163553" stroke="#9B7CFF" stroke-width="1.2" /><text x="871" y="315" class="body" text-anchor="middle">업무 A</text><line x1="956" y1="308" x2="1140" y2="308" stroke="#9B7CFF" stroke-width="4" stroke-linecap="round"/><rect x="1140" y="270" width="170" height="76" rx="20" fill="#163553" stroke="#47D7A5" stroke-width="1.2" /><text x="1225" y="315" class="body" text-anchor="middle">업무 B</text><text x="786" y="384" class="label" text-anchor="start">동일 JVM</text><text x="892" y="384" class="small" text-anchor="start">로컬 어댑터로 공개 계약 호출</text><rect x="786" y="448" width="170" height="76" rx="20" fill="#163553" stroke="#9B7CFF" stroke-width="1.2" /><text x="871" y="493" class="body" text-anchor="middle">업무 A</text><line x1="956" y1="486" x2="1040" y2="486" stroke="#4FA3FF" stroke-width="4" stroke-linecap="round"/><rect x="1040" y="448" width="160" height="76" rx="20" fill="#163553" stroke="#4FA3FF" stroke-width="1.2" /><text x="1120" y="493" class="body" text-anchor="middle">원격 호출</text><line x1="1200" y1="486" x2="1238" y2="486" stroke="#47D7A5" stroke-width="4" stroke-linecap="round"/><rect x="1238" y="448" width="72" height="76" rx="20" fill="#163553" stroke="#47D7A5" stroke-width="1.2" /><text x="1274" y="493" class="body" text-anchor="middle">B</text><text x="786" y="562" class="label" text-anchor="start">분리 WAS</text><text x="786" y="597" class="small" text-anchor="start"><tspan x="786" dy="0">서비스 등록부와 상태 정보를 사용해 대상 인스턴스를</tspan><tspan x="786" dy="26">선택하고 같은 공개 계약으로 호출합니다.</tspan></text><rect x="72" y="760" width="1296" height="52" rx="16" fill="#102B49" stroke="#345A7D" stroke-width="1" /><text x="720" y="794" class="body" text-anchor="middle">표준 헤더 · 인증·권한 · 오류 계약 · 시간 제한 · 멱등성 · 추적 정보</text></svg>