<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
<title id="title">CPF 핵심 가치</title><desc id="desc">배포 독립 계약, 복구 가능한 실행, 실행과 연결된 운영, 표준화된 확장</desc>
<defs>
  <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07182D"/><stop offset=".55" stop-color="#0B2748"/><stop offset="1" stop-color="#132F56"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#39BDF8"/><stop offset="1" stop-color="#356CF4"/></linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9A78FF"/><stop offset="1" stop-color="#6E55F7"/></linearGradient>
  <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#35D2AE"/><stop offset="1" stop-color="#17A98A"/></linearGradient>
  <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFCA65"/><stop offset="1" stop-color="#F29B38"/></linearGradient>
  <linearGradient id="soft" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FBFF"/><stop offset="1" stop-color="#EEF4FC"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#06162A" flood-opacity=".14"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
  <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#6C83A2"/></marker>
</defs><style>
text{font-family:'NanumSquare','Noto Sans CJK KR','Malgun Gothic','Segoe UI',Arial,sans-serif;fill:#F7FAFF}
.title{font-size:46px;font-weight:800;letter-spacing:-1.6px}
.subtitle{font-size:20px;font-weight:500;fill:#AFC2D8}
.kicker{font-size:13px;font-weight:800;letter-spacing:1.8px}
.cardTitle{font-size:24px;font-weight:800;letter-spacing:-.6px}
.body{font-size:16px;font-weight:550;fill:#AFC2D8}
.small{font-size:13px;font-weight:650;fill:#AFC2D8}
.pill{font-size:12px;font-weight:800}
.number{font-size:30px;font-weight:800}
</style>
<rect width="1600" height="760" fill="url(#navy)"/>
<circle cx="180" cy="120" r="170" fill="#2E6CF2" opacity=".15" filter="url(#glow)"/><circle cx="1430" cy="650" r="210" fill="#7A5AF8" opacity=".14" filter="url(#glow)"/>
<path d="M0 132 H1600 M0 264 H1600 M0 396 H1600 M0 528 H1600 M0 660 H1600" stroke="#9AB0C8" opacity=".055"/><path d="M180 0 V760 M420 0 V760 M660 0 V760 M900 0 V760 M1140 0 V760 M1380 0 V760" stroke="#9AB0C8" opacity=".055"/>
<text x="70" y="66" class="kicker" style="fill:#56C9FA">WHY CPF</text><text x="70" y="122" class="title">복잡성을 감추지 않고, 운영 가능한 기준으로 바꿉니다</text><text x="70" y="158" class="subtitle">기능의 개수보다 배포·실패·운영·확장이 같은 원칙으로 이어지는지를 먼저 설계합니다.</text>
<g filter="url(#shadow)"><rect x="70" y="226" width="340" height="420" rx="26" fill="#102A48" stroke="#36516F" stroke-width="1.4"/></g>
<rect x="96" y="252" width="66" height="66" rx="18" fill="url(#blue)"/><text x="129" y="296" class="number" text-anchor="middle" style="fill:#fff">01</text>
<text x="96" y="366" class="cardTitle">배포 독립 계약</text><text x="96" y="414" class="body"><tspan x="96" dy="0">같은 JVM과 분리 WAS에서</tspan><tspan x="96" dy="27">헤더·오류·추적·권한의 의미 유지</tspan></text>
<path d="M96 493 H384" stroke="#3ABDF8" opacity=".34"/><rect x="96" y="534" width="269" height="36" rx="18" fill="#3ABDF8" opacity=".14" stroke="#3ABDF8"/><text x="112" y="558" class="pill" style="fill:#3ABDF8">Local · Remote · Hybrid</text>
<text x="96" y="612" class="small">정상·오류·부분 실패·복구·감사를 함께 검증</text><g filter="url(#shadow)"><rect x="445" y="226" width="340" height="420" rx="26" fill="#102A48" stroke="#36516F" stroke-width="1.4"/></g>
<rect x="471" y="252" width="66" height="66" rx="18" fill="url(#violet)"/><text x="504" y="296" class="number" text-anchor="middle" style="fill:#fff">02</text>
<text x="471" y="366" class="cardTitle">복구 가능한 실행</text><text x="471" y="414" class="body"><tspan x="471" dy="0">시간 초과와 응답 유실을</tspan><tspan x="471" dy="27">결과 불명·대사·보상 흐름으로 보존</tspan></text>
<path d="M471 493 H759" stroke="#9A78FF" opacity=".34"/><rect x="471" y="534" width="269" height="36" rx="18" fill="#9A78FF" opacity=".14" stroke="#9A78FF"/><text x="487" y="558" class="pill" style="fill:#9A78FF">Idempotency · Reconcile</text>
<text x="471" y="612" class="small">정상·오류·부분 실패·복구·감사를 함께 검증</text><g filter="url(#shadow)"><rect x="820" y="226" width="340" height="420" rx="26" fill="#102A48" stroke="#36516F" stroke-width="1.4"/></g>
<rect x="846" y="252" width="66" height="66" rx="18" fill="url(#mint)"/><text x="879" y="296" class="number" text-anchor="middle" style="fill:#fff">03</text>
<text x="846" y="366" class="cardTitle">실행과 연결된 운영</text><text x="846" y="414" class="body"><tspan x="846" dy="0">조회 화면을 넘어 소유 실행 환경의</tspan><tspan x="846" dy="27">제어 계약·적용 확인·감사까지 연결</tspan></text>
<path d="M846 493 H1134" stroke="#35D2AE" opacity=".34"/><rect x="846" y="534" width="247" height="36" rx="18" fill="#35D2AE" opacity=".14" stroke="#35D2AE"/><text x="862" y="558" class="pill" style="fill:#35D2AE">ADM · Gateway · Batch</text>
<text x="846" y="612" class="small">정상·오류·부분 실패·복구·감사를 함께 검증</text><g filter="url(#shadow)"><rect x="1195" y="226" width="340" height="420" rx="26" fill="#102A48" stroke="#36516F" stroke-width="1.4"/></g>
<rect x="1221" y="252" width="66" height="66" rx="18" fill="url(#amber)"/><text x="1254" y="296" class="number" text-anchor="middle" style="fill:#fff">04</text>
<text x="1221" y="366" class="cardTitle">표준화된 확장</text><text x="1221" y="414" class="body"><tspan x="1221" dy="0">새 업무영역도 모듈·DB·시험·문서를</tspan><tspan x="1221" dy="27">하나의 생성 기준으로 시작</tspan></text>
<path d="M1221 493 H1509" stroke="#FFCA65" opacity=".34"/><rect x="1221" y="534" width="269" height="36" rx="18" fill="#FFCA65" opacity=".14" stroke="#FFCA65"/><text x="1237" y="558" class="pill" style="fill:#FFCA65">Generator · Vendor Pack</text>
<text x="1221" y="612" class="small">정상·오류·부분 실패·복구·감사를 함께 검증</text><text x="70" y="708" class="small">CPF의 기준은 Source · API · SQL · Test · 문서 · 실행 증적이 같은 변경을 가리킬 때 완성됩니다.</text></svg>
