<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1840" viewBox="0 0 900 1840" role="img" aria-labelledby="title desc">
<title id="title">CPF 핵심 가치</title><desc id="desc">배포 독립 계약, 복구 가능한 실행, 실행과 연결된 운영, 표준화된 확장</desc>
<defs>
  <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07182D"/><stop offset=".55" stop-color="#0B2748"/><stop offset="1" stop-color="#132F56"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#39BDF8"/><stop offset="1" stop-color="#356CF4"/></linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9A78FF"/><stop offset="1" stop-color="#6E55F7"/></linearGradient>
  <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#35D2AE"/><stop offset="1" stop-color="#17A98A"/></linearGradient>
  <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFCA65"/><stop offset="1" stop-color="#F29B38"/></linearGradient>
  <linearGradient id="soft" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FBFF"/><stop offset="1" stop-color="#EEF4FC"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#06162A" flood-opacity=".14"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
  <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#6C83A2"/></marker>
</defs><style>
text{font-family:'NanumSquare','Noto Sans CJK KR','Malgun Gothic','Segoe UI',Arial,sans-serif;fill:#F7FAFF}
.title{font-size:46px;font-weight:800;letter-spacing:-1.6px}
.subtitle{font-size:20px;font-weight:500;fill:#AFC2D8}
.kicker{font-size:13px;font-weight:800;letter-spacing:1.8px}
.cardTitle{font-size:24px;font-weight:800;letter-spacing:-.6px}
.body{font-size:16px;font-weight:550;fill:#AFC2D8}
.small{font-size:13px;font-weight:650;fill:#AFC2D8}
.pill{font-size:12px;font-weight:800}
.number{font-size:30px;font-weight:800}
</style>
<rect width="900" height="1840" fill="url(#navy)"/><circle cx="80" cy="100" r="180" fill="#2E6CF2" opacity=".14" filter="url(#glow)"/><circle cx="820" cy="1700" r="200" fill="#7A5AF8" opacity=".13" filter="url(#glow)"/>
<text x="48" y="68" class="kicker" style="fill:#56C9FA">WHY CPF</text><text x="48" y="122" class="title" style="font-size:39px"><tspan x="48">복잡성을 감추지 않고,</tspan><tspan x="48" dy="50">운영 가능한 기준으로 바꿉니다</tspan></text><text x="48" y="246" class="subtitle"><tspan x="48">배포·실패·운영·확장이 같은 원칙으로</tspan><tspan x="48" dy="31">이어지는지를 먼저 설계합니다.</tspan></text>
<g filter="url(#shadow)"><rect x="48" y="340" width="804" height="300" rx="28" fill="#102A48" stroke="#36516F" stroke-width="1.4"/></g>
<rect x="76" y="366" width="68" height="68" rx="18" fill="url(#blue)"/><text x="110" y="412" class="number" text-anchor="middle" style="fill:#fff">01</text>
<text x="170" y="412" class="cardTitle" style="font-size:27px">배포 독립 계약</text><text x="76" y="479" class="body" style="font-size:18px"><tspan x="76">같은 JVM과 분리 WAS에서</tspan><tspan x="76" dy="31">헤더·오류·추적·권한의 의미 유지</tspan></text>
<rect x="76" y="562" width="350" height="42" rx="21" fill="#3ABDF8" opacity=".14" stroke="#3ABDF8"/><text x="96" y="590" class="pill" style="fill:#3ABDF8;font-size:14px">Local · Remote · Hybrid</text><g filter="url(#shadow)"><rect x="48" y="685" width="804" height="300" rx="28" fill="#102A48" stroke="#36516F" stroke-width="1.4"/></g>
<rect x="76" y="711" width="68" height="68" rx="18" fill="url(#violet)"/><text x="110" y="757" class="number" text-anchor="middle" style="fill:#fff">02</text>
<text x="170" y="757" class="cardTitle" style="font-size:27px">복구 가능한 실행</text><text x="76" y="824" class="body" style="font-size:18px"><tspan x="76">시간 초과와 응답 유실을</tspan><tspan x="76" dy="31">결과 불명·대사·보상 흐름으로 보존</tspan></text>
<rect x="76" y="907" width="350" height="42" rx="21" fill="#9A78FF" opacity=".14" stroke="#9A78FF"/><text x="96" y="935" class="pill" style="fill:#9A78FF;font-size:14px">Idempotency · Reconcile</text><g filter="url(#shadow)"><rect x="48" y="1030" width="804" height="300" rx="28" fill="#102A48" stroke="#36516F" stroke-width="1.4"/></g>
<rect x="76" y="1056" width="68" height="68" rx="18" fill="url(#mint)"/><text x="110" y="1102" class="number" text-anchor="middle" style="fill:#fff">03</text>
<text x="170" y="1102" class="cardTitle" style="font-size:27px">실행과 연결된 운영</text><text x="76" y="1169" class="body" style="font-size:18px"><tspan x="76">조회 화면을 넘어 소유 실행 환경의</tspan><tspan x="76" dy="31">제어 계약·적용 확인·감사까지 연결</tspan></text>
<rect x="76" y="1252" width="322" height="42" rx="21" fill="#35D2AE" opacity=".14" stroke="#35D2AE"/><text x="96" y="1280" class="pill" style="fill:#35D2AE;font-size:14px">ADM · Gateway · Batch</text><g filter="url(#shadow)"><rect x="48" y="1375" width="804" height="300" rx="28" fill="#102A48" stroke="#36516F" stroke-width="1.4"/></g>
<rect x="76" y="1401" width="68" height="68" rx="18" fill="url(#amber)"/><text x="110" y="1447" class="number" text-anchor="middle" style="fill:#fff">04</text>
<text x="170" y="1447" class="cardTitle" style="font-size:27px">표준화된 확장</text><text x="76" y="1514" class="body" style="font-size:18px"><tspan x="76">새 업무영역도 모듈·DB·시험·문서를</tspan><tspan x="76" dy="31">하나의 생성 기준으로 시작</tspan></text>
<rect x="76" y="1597" width="350" height="42" rx="21" fill="#FFCA65" opacity=".14" stroke="#FFCA65"/><text x="96" y="1625" class="pill" style="fill:#FFCA65;font-size:14px">Generator · Vendor Pack</text><text x="48" y="1760" class="small" style="font-size:15px"><tspan x="48">Source · API · SQL · Test · 문서 · 실행 증적이</tspan><tspan x="48" dy="26">같은 변경을 가리킬 때 하나의 기능이 완성됩니다.</tspan></text></svg>
