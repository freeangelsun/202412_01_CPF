<rect x="0" y="0" width="1440" height="620" rx="18" fill="#FFFFFF"/><text x="64" y="70" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#0B1F4D" text-anchor="start">CPF를 도입하면 달라지는 점</text><text x="64" y="106" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="19" font-weight="500" fill="#475569" text-anchor="start">업무 개발자가 반복 기반기술보다 업무 로직과 서비스 품질에 집중할 수 있도록 개발 경로를 정리합니다.</text><rect x="64" y="150" width="408" height="182" rx="20" fill="#FFFFFF" stroke="#D9E2F2" filter="url(#shadow)"/><circle cx="112" cy="198" r="27" fill="#2563EB"/><text x="112" y="206" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">01</text><text x="152" y="196" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="22" font-weight="750" fill="#0B1F4D" text-anchor="start">업무 시작이 빠릅니다</text><text x="96" y="240" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="17" font-weight="500" fill="#475569" text-anchor="start">기본형·선택형 Generated Domain으로</text><text x="96" y="268" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="17" font-weight="500" fill="#475569" text-anchor="start">필요한 구조를 빠르게 준비합니다.</text><rect x="504" y="150" width="408" height="182" rx="20" fill="#FFFFFF" stroke="#D9E2F2" filter="url(#shadow)"/><circle cx="552" cy="198" r="27" fill="#7C3AED"/><text x="552" y="206" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">02</text><text x="592" y="196" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="22" font-weight="750" fill="#0B1F4D" text-anchor="start">기능 추가가 쉽습니다</text><text x="536" y="240" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="17" font-weight="500" fill="#475569" text-anchor="start">Starter를 추가해 DB·캐시·메시징·외부연계</text><text x="536" y="268" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="17" font-weight="500" fill="#475569" text-anchor="start">등 필요한 기능을 확장합니다.</text><rect x="944" y="150" width="408" height="182" rx="20" fill="#FFFFFF" stroke="#D9E2F2" filter="url(#shadow)"/><circle cx="992" cy="198" r="27" fill="#0891B2"/><text x="992" y="206" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">03</text><text x="1032" y="196" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="22" font-weight="750" fill="#0B1F4D" text-anchor="start">개발 방식이 일관됩니다</text><text x="976" y="240" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="17" font-weight="500" fill="#475569" text-anchor="start">Online·Batch·타 도메인 호출까지 같은</text><text x="976" y="268" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="17" font-weight="500" fill="#475569" text-anchor="start">사용 규칙과 공통 기능을 활용합니다.</text><rect x="64" y="364" width="408" height="182" rx="20" fill="#FFFFFF" stroke="#D9E2F2" filter="url(#shadow)"/><circle cx="112" cy="412" r="27" fill="#0F766E"/><text x="112" y="420" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">04</text><text x="152" y="410" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="22" font-weight="750" fill="#0B1F4D" text-anchor="start">업무 흐름을 연결합니다</text><text x="96" y="454" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="17" font-weight="500" fill="#475569" text-anchor="start">도메인·서비스·메시징·Batch가 이어져도 거래</text><text x="96" y="482" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="17" font-weight="500" fill="#475569" text-anchor="start">흐름을 한 기준으로 확인합니다.</text><rect x="504" y="364" width="408" height="182" rx="20" fill="#FFFFFF" stroke="#D9E2F2" filter="url(#shadow)"/><circle cx="552" cy="412" r="27" fill="#4F46E5"/><text x="552" y="420" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">05</text><text x="592" y="410" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="22" font-weight="750" fill="#0B1F4D" text-anchor="start">Batch가 강력합니다</text><text x="536" y="454" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="17" font-weight="500" fill="#475569" text-anchor="start">스케줄·분산 Worker·이어 실행·선택</text><text x="536" y="482" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="17" font-weight="500" fill="#475569" text-anchor="start">재처리·Center-Cut을 함께 제공합니다.</text><rect x="944" y="364" width="408" height="182" rx="20" fill="#FFFFFF" stroke="#D9E2F2" filter="url(#shadow)"/><circle cx="992" cy="412" r="27" fill="#EA580C"/><text x="992" y="420" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">06</text><text x="1032" y="410" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="22" font-weight="750" fill="#0B1F4D" text-anchor="start">환경 변화에 유연합니다</text><text x="976" y="454" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="17" font-weight="500" fill="#475569" text-anchor="start">단일 서비스부터 분리 WAS·MSA·다중</text><text x="976" y="482" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="17" font-weight="500" fill="#475569" text-anchor="start">인스턴스까지 같은 개발 방식을 유지합니다.</text></svg>