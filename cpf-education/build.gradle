plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'java'
}

group = 'com.cpf.education'
java { toolchain { languageVersion = JavaLanguageVersion.of(rootProject.ext.cpfJavaVersion) } }
repositories { mavenCentral() }

def educationDbVendor = (findProperty('cpfDbVendor') ?: System.getenv('EDU_DATABASE_VENDOR') ?: 'mariadb').toString().toLowerCase(Locale.ROOT)
def educationSupportedDbVendors = ['mariadb','oracle','postgresql'] as Set
if (!educationSupportedDbVendors.contains(educationDbVendor)) {
    throw new GradleException("Unsupported cpfDbVendor for cpf-education: ${educationDbVendor}")
}
def educationJdbcDriverByVendor = [
        mariadb:'org.mariadb.jdbc:mariadb-java-client', oracle:'com.oracle.database.jdbc:ojdbc11', postgresql:'org.postgresql:postgresql'
]

dependencies {
    // 업무 개발자는 Public Profile/Starter/API만 직접 소비합니다.
    implementation project(':starters:profiles:secure-api')
    implementation project(':starters:profiles:batch')
    implementation project(':starters:common')
    implementation project(':starters:data:jdbc')
    implementation project(':starters:integration:fixed-length')
    implementation project(':starters:messaging:kafka')
    implementation project(':starters:cache:redis')
    implementation project(':starters:file:object-storage:s3')

    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework:spring-tx'
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly educationJdbcDriverByVendor[educationDbVendor]
    // Gradle 9 / JUnit Platform 6 는 Test Executor 에 launcher 를 자동 주입하지 않고,
    // spring-boot-starter-webmvc-test 는 launcher 를 전이 제공하지 않는다. 직접 선언하지 않으면
    // Test 가 실패하는 것이 아니라 Executor 자체가 'Failed to load JUnit Platform' 으로 기동하지 못한다.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def canonicalRoot = file('src/main/java/com/cpf/education')
def onlineRoot = file('src/main/java/com/cpf/education/online')
def batchRoot = file('src/main/java/com/cpf/education/batch')

tasks.register('verifyEducationCanonical35') {
    description = 'Canonical EDU 기능 package와 Catalog 20+15를 검증합니다.'
    doLast {
        def catalog=new groovy.json.JsonSlurper().parse(file('src/main/resources/education/cpf-education-canonical-35.json'))
        if(catalog.onlineCount!=20 || catalog.batchCount!=15 || catalog.totalCount!=35 || catalog.examples.size()!=35) throw new GradleException("EDU canonical catalog mismatch")
        def roots=canonicalRoot.listFiles()?.findAll{it.isDirectory()}*.name?.toSet() ?: [] as Set
        if(roots != (['online','batch'] as Set)) throw new GradleException("EDU package roots must be exactly online/batch: ${roots.sort()}")
        def flat=fileTree(canonicalRoot){include 'online/*.java','batch/*.java'}.files
        def bad=fileTree(canonicalRoot){include '**/*.java'}.files.findAll{it.name ==~ /(?:Online|Batch)\d+.*|.*(?:Example|Sample|Demo)\.java/}
        if(!flat.empty || !bad.empty) throw new GradleException("EDU flat/numeric/example source remains")
        def physicalOnlineGroups = onlineRoot.listFiles()?.findAll { d -> d.isDirectory() && !fileTree(d){ include '**/*.java' }.files.empty }*.name?.toSet() ?: [] as Set
        def physicalBatchGroups = batchRoot.listFiles()?.findAll { d -> d.isDirectory() && !fileTree(d){ include '**/*.java' }.files.empty }*.name?.toSet() ?: [] as Set
        if (physicalOnlineGroups.size() != 20) throw new GradleException("EDU physical Online group count must be 20: ${physicalOnlineGroups.sort()}")
        if (physicalBatchGroups.size() != 15) throw new GradleException("EDU physical Batch group count must be 15: ${physicalBatchGroups.sort()}")
        if (!file('src/test/java/com/cpf/education/contract/BatchCanonical15ExecutableContractTest.java').isFile()) throw new GradleException('Batch executable contract test missing')
        catalog.examples.each { row ->
            def pkgDir=file('src/main/java/'+row.package.replace('.','/'))
            if(!pkgDir.isDirectory()) throw new GradleException("EDU package missing: ${row.package}")
            if(fileTree(pkgDir){include "**/${row.primaryClass}.java"}.files.empty) throw new GradleException("EDU primary class missing: ${row.id}/${row.primaryClass}")
            if(fileTree('src/test/java'){include "**/${row.testClass}.java"}.files.empty) throw new GradleException("EDU test missing: ${row.id}/${row.testClass}")
        }
    }
}

tasks.register('verifyEducationPublicGoldenPath') { description='EDU Public API/Raw 우회를 검증합니다.'
    doLast {
        def direct=configurations.implementation.dependencies.findAll{it instanceof org.gradle.api.artifacts.ProjectDependency}.collect{it.path}.toSet()
        def internal=direct.findAll{it.startsWith(':internal:') || it==':framework:core'}
        if(!internal.empty) throw new GradleException("EDU direct internal/core dependency is forbidden: ${internal.sort()}")
        def forbidden=[/\bWebClient\b/,/\bKafkaTemplate\b/,/\bRabbitTemplate\b/,/\bJmsTemplate\b/,/\bRedisTemplate\b/,/\bJdbcTemplate\b/,/\bNamedParameterJdbcTemplate\b/,/@Transactional\b/,/MDC\.put\s*\(/,/new\s+Thread\s*\(/,/Executors\./,/Thread\.sleep\s*\(/,/X-Transaction-Id/,/X-Original-System-Code/,/X-System-Code/,/X-Caller-System-Code/,/X-Target-System-Code/,/X-Target-Operation-Id/,/com\.cpf\.[A-Za-z0-9_.]*\.internal\./]
        def violations=[]; fileTree(canonicalRoot){include '**/*.java'}.files.each{f->def text=f.getText('UTF-8');forbidden.each{pat->if(text =~ pat) violations << "${project.relativePath(f)} :: ${pat}"}}
        if(!violations.empty) throw new GradleException("EDU forbidden/raw pattern detected:\n"+violations.join('\n'))
    }
}

tasks.register('verifyEducationOperationIds') { description='업무 Online Controller operationId/OpenAPI 동일성을 검증합니다.'
    doLast {
        def failures=[];def ids=[]
        fileTree(onlineRoot){include '**/*.java'}.files.sort().each{f->def text=f.getText('UTF-8');def cpf=(text =~ /@CpfOnlineTransaction\s*\(\s*operationId\s*=\s*"([^"]+)"/);def api=(text =~ /@Operation\s*\(\s*operationId\s*=\s*"([^"]+)"/);if(cpf.find()){if(!api.find())failures<<"missing OpenAPI operation: ${project.relativePath(f)}";else{ids<<cpf.group(1);if(cpf.group(1)!=api.group(1))failures<<"operationId mismatch: ${project.relativePath(f)}"}}}
        if(ids.size()!=ids.toSet().size()) failures<<"duplicate online operationId"
        if(!failures.empty) throw new GradleException(failures.join('\n'))
    }
}

tasks.register('verifyEducationLegacyZero') { description='구 EDU flat/numeric/legacy 구조 0건을 검증합니다.'
    doLast {
        def violations=[];fileTree('src'){include '**/*';exclude '**/build/**'}.files.findAll{it.isFile()}.each{f->def text=f.getText('UTF-8');if(text =~ /EDU-(?:DEV|BAT|ADM|BZA|GW|OPS)-[0-9]+/)violations<<"${project.relativePath(f)} legacy-id";if(f.name ==~ /(?:Online|Batch)\d+.*|.*(?:Example|Sample|Demo)\.java/)violations<<"${project.relativePath(f)} legacy-name"}
        if(!violations.empty) throw new GradleException("stale EDU reference remains:\n"+violations.take(200).join('\n'))
    }
}

tasks.named('test') {
    dependsOn 'verifyEducationCanonical35','verifyEducationPublicGoldenPath','verifyEducationOperationIds','verifyEducationLegacyZero'
    useJUnitPlatform()
    systemProperty 'cpf.db.vendor', educationDbVendor
}
check.dependsOn 'verifyEducationCanonical35','verifyEducationPublicGoldenPath','verifyEducationOperationIds','verifyEducationLegacyZero'
