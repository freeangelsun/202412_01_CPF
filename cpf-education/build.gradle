plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'java'
}

group = 'com.cpf.education'
java { toolchain { languageVersion = JavaLanguageVersion.of(rootProject.ext.cpfJavaVersion) } }
repositories { mavenCentral() }

def educationDbVendor = (findProperty('cpfDbVendor') ?: System.getenv('EDU_DATABASE_VENDOR') ?: 'mariadb').toString().toLowerCase(Locale.ROOT)
def educationSupportedDbVendors = ['mariadb','oracle','postgresql'] as Set
if (!educationSupportedDbVendors.contains(educationDbVendor)) {
    throw new GradleException("Unsupported cpfDbVendor for cpf-education: ${educationDbVendor}")
}
def educationJdbcDriverByVendor = [
        mariadb:'org.mariadb.jdbc:mariadb-java-client', oracle:'com.oracle.database.jdbc:ojdbc11', postgresql:'org.postgresql:postgresql'
]

dependencies {
    // 업무 개발자는 Public Profile/Starter/API만 직접 소비합니다.
    implementation project(':starters:profiles:secure-api')
    implementation project(':starters:profiles:batch')
    implementation project(':starters:data:jdbc')
    implementation project(':starters:integration:fixed-length')
    implementation project(':starters:messaging:kafka')
    implementation project(':starters:cache:redis')
    implementation project(':starters:file:object-storage:s3')

    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework:spring-tx'
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly educationJdbcDriverByVendor[educationDbVendor]
}

def canonicalRoot = file('src/main/java/com/cpf/education')
def onlineRoot = file('src/main/java/com/cpf/education/online')
def batchRoot = file('src/main/java/com/cpf/education/batch')

tasks.register('verifyEducationCanonical35') {
    group = 'verification'
    description = 'Canonical EDU가 online 20 + batch 15 = 35개인지 검증합니다.'
    doLast {
        def online = fileTree(onlineRoot) { include 'Online??*Example.java' }.files
        def batch = fileTree(batchRoot) { include 'Batch??*Example.java' }.files
        if (online.size() != 20 || batch.size() != 15 || online.size() + batch.size() != 35) {
            throw new GradleException("EDU canonical count mismatch: online=${online.size()}, batch=${batch.size()}, total=${online.size()+batch.size()}")
        }
        def roots = canonicalRoot.listFiles()?.findAll { it.isDirectory() }*.name?.toSet() ?: [] as Set
        if (roots != (['online','batch'] as Set)) {
            throw new GradleException("EDU package roots must be exactly online/batch after Delete Manifest apply: ${roots.sort()}")
        }
    }
}

tasks.register('verifyEducationPublicGoldenPath') {
    group = 'verification'
    description = 'EDU 35가 Public API를 사용하고 구형/Raw 우회 구현을 포함하지 않는지 검증합니다.'
    doLast {
        def direct = configurations.implementation.dependencies
                .findAll { it instanceof org.gradle.api.artifacts.ProjectDependency }
                .collect { it.path }.toSet()
        def internal = direct.findAll { it.startsWith(':internal:') || it == ':framework:core' }
        if (!internal.isEmpty()) throw new GradleException("EDU direct internal/core dependency is forbidden: ${internal.sort()}")

        def sources = (fileTree(onlineRoot) { include '**/*.java' }.files + fileTree(batchRoot) { include '**/*.java' }.files)
        def forbidden = [
                /\bRestClient\b(?!\s*;)/, /\bWebClient\b/, /\bKafkaTemplate\b/, /\bRabbitTemplate\b/, /\bJmsTemplate\b/,
                /\bRedisTemplate\b/, /\bJdbcTemplate\b/, /\bNamedParameterJdbcTemplate\b/, /@Transactional\b/,
                /MDC\.put\s*\(/, /UUID\.randomUUID\s*\(/, /new\s+Thread\s*\(/, /Executors\./, /Thread\.sleep\s*\(/,
                /X-Transaction-Id/, /X-Original-System-Code/, /X-System-Code/, /X-Caller-System-Code/, /X-Target-System-Code/, /X-Target-Operation-Id/,
                /com\.cpf\.[A-Za-z0-9_.]*\.internal\./
        ]
        def violations=[]
        sources.each { f ->
            def text=f.getText('UTF-8')
            forbidden.each { p -> if (text =~ p) violations << "${project.relativePath(f)} :: ${p}" }
        }
        if (!violations.isEmpty()) throw new GradleException("EDU forbidden/raw pattern detected:\n" + violations.join('\n'))
    }
}

tasks.register('verifyEducationOperationIds') {
    group='verification'
    description='온라인 20개에서 CpfOnlineTransaction operationId와 OpenAPI operationId가 동일한지 검증합니다.'
    doLast {
        def failures=[]; def ids=[]
        fileTree(onlineRoot) { include 'Online??*Example.java' }.files.sort().each { f ->
            def text=f.getText('UTF-8')
            def cpf=(text =~ /@CpfOnlineTransaction\s*\(\s*operationId\s*=\s*"([^"]+)"/)
            def api=(text =~ /@Operation\s*\(\s*operationId\s*=\s*"([^"]+)"/)
            if (!cpf.find() || !api.find()) failures << "missing operation annotation: ${project.relativePath(f)}"
            else { ids << cpf.group(1); if (cpf.group(1) != api.group(1)) failures << "operationId mismatch: ${project.relativePath(f)}" }
        }
        def expected=(1..20).collect { String.format('EDU-ONLINE-%02d',it) }.toSet()
        if (ids.toSet()!=expected) failures << "online operationId set mismatch: ${ids.toSet().sort()}"
        if (!failures.isEmpty()) throw new GradleException(failures.join('\n'))
    }
}

tasks.register('verifyEducationLegacyZero') {
    group='verification'
    description='구 EDU ID/package/count가 Current EDU에 남지 않았는지 검증합니다.'
    doLast {
        def patterns=[/EDU-DEV-[0-9]+/,/EDU-BAT-[0-9]+/,/EDU-ADM-[0-9]+/,/EDU-BZA-[0-9]+/,/EDU-GW-[0-9]+/,/EDU-OPS-[0-9]+/,/\bLegacy\b/,/\bCompatibility\b/]
        def violations=[]
        fileTree('src') { include '**/*'; exclude '**/build/**' }.files.findAll { it.isFile() }.each { f ->
            def text=f.getText('UTF-8')
            patterns.each { pattern -> if (text =~ pattern) violations << "${project.relativePath(f)} :: ${pattern}" }
        }
        if (!violations.isEmpty()) throw new GradleException("stale EDU reference remains:\n"+violations.take(200).join('\n'))
    }
}

tasks.named('test') {
    dependsOn 'verifyEducationCanonical35','verifyEducationPublicGoldenPath','verifyEducationOperationIds','verifyEducationLegacyZero'
    useJUnitPlatform()
    systemProperty 'cpf.db.vendor', educationDbVendor
}
check.dependsOn 'verifyEducationCanonical35','verifyEducationPublicGoldenPath','verifyEducationOperationIds','verifyEducationLegacyZero'
