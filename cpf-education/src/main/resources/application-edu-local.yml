# EDU/EDU local profile 설정입니다.

server:
  port: ${EDU_SERVER_PORT:8099}

spring:
  datasource:
    ref:
      url: ${EDU_DATASOURCE_URL:${EDU_DB_URL:}}
      database-name: ${EDU_DB_NAME:cpfDB}
      username: ${EDU_DATASOURCE_USERNAME:${EDU_DB_USERNAME:cpf_ref_app}}
      password: ${EDU_DATASOURCE_PASSWORD:${EDU_DB_PASSWORD:__REPLACE_BY_ENV__}}
