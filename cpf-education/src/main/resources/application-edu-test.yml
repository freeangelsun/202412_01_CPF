# EDU test profile 설정입니다.
# 용도: 자동화/통합 테스트에서 EDU Runtime을 실제 DB 연결로 검증합니다.
# 허용값: Port는 1~65535, DB URL/계정/비밀번호는 테스트 환경 Secret/환경변수로 주입합니다.
# 기본값: 보안상 DB 연결정보 기본값을 제공하지 않습니다.
# 운영 주의: 운영 Profile로 사용하지 말고 test 전용 DB/User만 연결합니다.
server:
  port: ${EDU_SERVER_PORT:8080}

spring:
  datasource:
    ref:
      url: ${EDU_DATASOURCE_URL}
      username: ${EDU_DATASOURCE_USERNAME}
      password: ${EDU_DATASOURCE_PASSWORD}
