# EDU 교육 서비스 설정입니다. 교육 기능은 이 업무 모듈 내부의 sample 분류로 제공합니다.

spring:
  config:
    import:
      - optional:classpath:application-cpf.yml
      - optional:classpath:application-cpf-${spring.profiles.active:local}.yml
      - optional:classpath:application-cmn.yml
      - optional:classpath:application-cmn-${spring.profiles.active:local}.yml
      - optional:classpath:application-edu.yml
      - optional:classpath:application-edu-${spring.profiles.active:local}.yml
  application:
    name: cpf-education
  profiles:
    active: local
    include: cpf, cmn
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

server:
  port: ${EDU_SERVER_PORT:8099}

logging:
  config: classpath:log/cpf-logback-spring.xml
  level:
    root: INFO
    com.cpf.core: INFO
    com.cpf.common: INFO
    com.cpf.education: DEBUG

cpf:
  logging:
    # 일반 Runtime 로그는 Application/Instance별 경로로 분리하며 Transaction Evidence와 혼용하지 않습니다.
    enabled: true
    root: ${CPF_LOG_ROOT:logs}
    instance-id: ${CPF_RUNTIME_INSTANCE_ID:${HOSTNAME:local}}
    maintenance-interval: ${CPF_LOG_MAINTENANCE_INTERVAL:1h}
    files:
      runtime:
        # 전체 Runtime 흐름을 기록하는 기본 파일입니다. Console 출력도 함께 유지됩니다.
        enabled: true
        file-name: runtime.log
        rolling: DAILY
        compress-after-days: 5
        delete-after-days: 365
      error:
        # ERROR 이상을 별도 파일에도 기록하여 운영 장애 탐색 경로를 명확히 합니다.
        enabled: true
        file-name: error.log
        level: ERROR
        rolling: DAILY
        compress-after-days: 5
        delete-after-days: 365
  cmn:
    sample-db:
      # DB 없는 기본 기동을 보장하고 명시적 Sample Profile에서만 Owner 제공 Reference Fixture를 활성화합니다.
      enabled: ${CPF_CMN_SAMPLE_DB_ENABLED:false}
  # Runtime 거래 식별용 System Code입니다. CPF Platform DB의 Schema/Table Prefix는 이 값과 무관하게 Canonical 고정입니다.
  system-code: EDU
  # Architecture Role 정본: cpf-tools/governance/cpf-product-surface-policy.json (Harness 30.16)
  architecture-role: REFERENCE_RUNTIME
  framework:
    module-id: EDU
    was-id: ${WAS_ID:EDUAP01}
