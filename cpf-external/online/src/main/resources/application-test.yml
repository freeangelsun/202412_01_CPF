# 자동화 Test는 ephemeral port를 사용합니다. 실제 외부기관 연결을 구성하지 않습니다.
# 환경별 기본 레벨은 개발 추적성과 운영 안정성의 Canonical 기준이며 CPF_LOG_LEVEL로 명시 조정할 수 있습니다.
logging:
  level:
    root: ${CPF_LOG_LEVEL:DEBUG}
server:
  port: 0
cpf:
  integration:
    domain-call:
      bindings:
        MBR:
          # 동일 JVM operation이 있으면 LOCAL, 없으면 Registry 기반 REMOTE를 선택합니다.
          mode: AUTO
          service-id: MBR
