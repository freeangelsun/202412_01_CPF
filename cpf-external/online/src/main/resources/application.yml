spring:
  application:
    name: external-online
  datasource:
    # 운영 Secret/Endpoint는 환경 Binding으로 주입하며 Sample credential fallback을 두지 않습니다.
    url: ${EXS_DATASOURCE_URL}
    username: ${EXS_DATASOURCE_USERNAME}
    password: ${EXS_DATASOURCE_PASSWORD}
    driver-class-name: ${EXS_DATASOURCE_DRIVER}
cpf:
  # cpf-starter-common 의 code/message 정본은 CPF Platform 스키마다.
  # 업무 Domain Runtime 도 CPF_PLATFORM_DB role 을 요구하므로 자기 설정으로 해석할 수 있어야 한다.
  # 선언이 없으면 단독 기동이 "CPF DataSource is required for role: CPF_PLATFORM_DB" 로 실패한다.
  # 업무 DB(CUSTOMER_BUSINESS_DB)와는 다른 논리 role 이며 접속 정보도 별개다.
  data:
    persistence:
      jdbc:
        role-datasources:
          cpf-platform-db:
            enabled: true
            url: ${CPF_PLATFORM_DB_URL:}
            username: ${CPF_PLATFORM_DB_USERNAME:cpf_app}
            password: ${CPF_PLATFORM_DB_PASSWORD:}
            driver-class-name: ${CPF_PLATFORM_DB_DRIVER:}
            pool-name: ${CPF_PLATFORM_DB_POOL_NAME:cpf-platform}
  generated-domain:
    name: external
    # 이 Domain 의 canonical SystemCode 입니다. Generator input 의 domain.systemCode 를
    # literal 로 기록합니다. Runtime 이 고르는 설정값이 아니며 환경변수 default 를 두지
    # 않습니다(Harness 30.20). DB 물리 Prefix 는 별개 Namespace 입니다(Harness 30.19).
    system-code: EXS
    # Architecture Role 정본: cpf-tools/governance/cpf-product-surface-policy.json
    architecture-role: BUSINESS_DOMAIN
    database-role: CUSTOMER_BUSINESS_DB
    table-prefix: EXS
  domain:
    persistence:
      enabled: true
      required: true
      provider: mybatis
      data-source-prefix: spring.datasource
  operation-policy:
    seed:
      # 최초 Operation 등록 때만 적용되며, 이후 ADM Policy를 restart/redeploy가 덮지 않습니다.
      allowed-callers: ${CPF_OPERATION_POLICY_SEED_ALLOWED_CALLERS:}
      source: YML
      revision: ${CPF_OPERATION_POLICY_SEED_REVISION:GENERATED-1}
  logging:
    # 일반 Runtime 로그는 Application/Instance별 경로로 분리하며 Transaction Evidence와 혼용하지 않습니다.
    enabled: true
    root: ${CPF_LOG_ROOT:logs}
    instance-id: ${CPF_RUNTIME_INSTANCE_ID:${HOSTNAME:local}}
    maintenance-interval: ${CPF_LOG_MAINTENANCE_INTERVAL:1h}
    files:
      runtime:
        # 전체 Runtime 흐름을 기록하는 기본 파일입니다. Console 출력도 함께 유지됩니다.
        enabled: true
        file-name: runtime.log
        rolling: DAILY
        compress-after-days: 5
        delete-after-days: 365
      error:
        # ERROR 이상을 별도 파일에도 기록하여 운영 장애 탐색 경로를 명확히 합니다.
        enabled: true
        file-name: error.log
        level: ERROR
        rolling: DAILY
        compress-after-days: 5
        delete-after-days: 365
mybatis:
  # Oracle/PostgreSQL/MariaDB 공통 Mapper만 로드하며 Vendor별 Business SQL 복제를 금지합니다.
  mapper-locations: classpath*:db/mapper/*.xml
