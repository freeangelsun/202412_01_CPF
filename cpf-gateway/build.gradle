plugins { id 'java'; id 'org.springframework.boot'; id 'io.spring.dependency-management' }
group='com.cpf.gateway'
dependencies {
 implementation project(':cpf-starter-profile-secure-api')
 implementation project(':cpf-core')
 implementation project(':cpf-starter-data-persistence-jdbc')
 implementation project(':cpf-starter-integration-resilience')
 implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webmvc'
 implementation 'org.apache.httpcomponents.client5:httpclient5'
 implementation 'com.fasterxml.jackson.core:jackson-databind'
 testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
}
tasks.named('test'){useJUnitPlatform()}
tasks.named('bootJar'){enabled=true}
