plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'java'
}

group = 'com.cpf.local.batch'

dependencies {
    implementation project(':cpf-core')
    implementation project(':cpf-batch:contract')
    implementation project(':cpf-batch:runtime-common')
    implementation project(':cpf-batch:control-server')
    implementation project(':cpf-batch:scheduler')
    implementation project(':cpf-batch:worker')
    implementation project(':cpf-batch:center-cut-runner')
    implementation project(':cpf-batch:host-agent')

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

springBoot {
    mainClass = 'com.cpf.local.batch.CpfLocalBatchRuntimeApplication'
}

tasks.named('bootJar') {
    enabled = true
    archiveClassifier = 'local-batch'
}
