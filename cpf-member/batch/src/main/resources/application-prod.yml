# Batch Generated Domain은 non-web Runtime이며 Domain Call binding은 Online과 같은 Canonical profile 계약을 사용합니다.
cpf:
  integration:
    domain-call:
      bindings:
        EXS:
          # 공유/운영 환경은 topology와 serviceId를 Deployment Binding으로 명시합니다.
          mode: ${CPF_DOMAIN_EXS_MODE}
          service-id: ${CPF_DOMAIN_EXS_SERVICE_ID}
