plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'java'
}

group = 'com.cpf.reference'
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(rootProject.ext.cpfJavaVersion)
    }
}

repositories { mavenCentral() }

// All EDU code stays in the single cpf-reference module. Optional feature families are package-removable.
def featureEnabled = { String name ->
    providers.gradleProperty("cpf.reference.features.${name}.enabled")
            .map { it.toBoolean() }
            .orElse(true)
            .get()
}
def batchEnabled = featureEnabled('batch')
def operationsEnabled = featureEnabled('operations')
def backofficeEnabled = featureEnabled('backoffice')
def gatewayEnabled = featureEnabled('gateway')
def isolationVerification = providers.gradleProperty('cpf.reference.featureIsolationVerification').map { it.toBoolean() }.orElse(false).get()
def featureVariant = [batchEnabled ? 'batch' : 'no-batch', operationsEnabled ? 'operations' : 'no-operations', backofficeEnabled ? 'backoffice' : 'no-backoffice', gatewayEnabled ? 'gateway' : 'no-gateway'].join('-')
def referenceDbMigrations = ['V93__manual_edu_135_operation_ledger.sql'] + (batchEnabled ? ['V94__reference_batch_job_pack.sql'] : [])
def referenceDbVendor = (findProperty('cpfDbVendor')
        ?: System.getenv('REF_DATABASE_VENDOR')
        ?: 'mariadb')
        .toString()
        .toLowerCase(Locale.ROOT)
def referenceSupportedDbVendors = ['mariadb', 'oracle', 'postgresql'] as Set
if (!referenceSupportedDbVendors.contains(referenceDbVendor)) {
    throw new GradleException("Unsupported cpfDbVendor for cpf-reference: ${referenceDbVendor}")
}
def referenceDbResourceRoot = rootProject.file("cpf-tools/db/vendor/${referenceDbVendor}")
def referenceJdbcDriverByVendor = [
        'mariadb': 'org.mariadb.jdbc:mariadb-java-client',
        'oracle': 'com.oracle.database.jdbc:ojdbc11',
        'postgresql': 'org.postgresql:postgresql'
]
if (isolationVerification) {
    layout.buildDirectory = rootProject.layout.buildDirectory.dir("reference-feature-variants/${featureVariant}")
}

sourceSets {
    main {
        java {
            if (!batchEnabled) exclude 'com/cpf/reference/batch/**'
            if (!operationsEnabled) exclude 'com/cpf/reference/optional/operations/**'
            if (!backofficeEnabled) exclude 'com/cpf/reference/optional/backoffice/**'
            if (!gatewayEnabled) exclude 'com/cpf/reference/optional/gateway/**'
        }
        resources {
            if (!batchEnabled) exclude 'edu/batch/**'
            if (!operationsEnabled) exclude 'edu/optional/operations/**'
            if (!backofficeEnabled) exclude 'edu/optional/backoffice/**'
            if (!gatewayEnabled) exclude 'edu/optional/gateway/**'
        }
    }
    test {
        java {
            if (!batchEnabled) exclude 'com/cpf/reference/batch/**'
            if (!operationsEnabled) exclude 'com/cpf/reference/optional/operations/**'
            if (!backofficeEnabled) exclude 'com/cpf/reference/optional/backoffice/**'
            if (!gatewayEnabled) exclude 'com/cpf/reference/optional/gateway/**'
        }
        resources {
            if (!batchEnabled) exclude 'edu/batch/**'
            if (!operationsEnabled) exclude 'edu/optional/operations/**'
            if (!backofficeEnabled) exclude 'edu/optional/backoffice/**'
            if (!gatewayEnabled) exclude 'edu/optional/gateway/**'
        }
    }
}

dependencies {
    implementation project(':cpf-starter-integration-soap')
    implementation project(':cpf-starter-integration-ai')
    implementation project(':cpf-starter-profile-secure-api')
    implementation project(':cpf-starter-data-persistence-mybatis')
    implementation project(':cpf-starter-messaging-kafka')
    implementation project(':cpf-starter-messaging-reliability-jdbc')
    implementation project(':cpf-starter-file-sftp')
    implementation project(':cpf-starter-file-attachment')
    implementation project(':cpf-starter-data-persistence-jpa')
    implementation project(':cpf-starter-data-lock-valkey')
    implementation project(':cpf-starter-platform-operations-health')
    implementation project(':cpf-starter-security-session-valkey')
    implementation project(':cpf-starter-file-object-storage-s3')
    implementation project(':cpf-starter-messaging-schema-governance')
    implementation project(':cpf-starter-integration-graphql')
    implementation project(':cpf-starter-integration-realtime')
    implementation project(':cpf-core')
    implementation project(':cpf-common')
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework:spring-tx'
    implementation 'org.springframework:spring-jdbc'
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    if (batchEnabled) {
        implementation project(':cpf-batch:contract')
        implementation 'org.springframework.boot:spring-boot-starter-batch-jdbc'
    }

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly referenceJdbcDriverByVendor[referenceDbVendor]
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'cpf.db.vendor', referenceDbVendor
    systemProperty 'cpf.db.resource-root', referenceDbResourceRoot.absolutePath
    systemProperty 'cpf.reference.features.batch.enabled', batchEnabled
    systemProperty 'cpf.reference.features.operations.enabled', operationsEnabled
    systemProperty 'cpf.reference.features.backoffice.enabled', backofficeEnabled
    systemProperty 'cpf.reference.features.gateway.enabled', gatewayEnabled
    systemProperty 'cpf.reference.db.migrations', referenceDbMigrations.join(',')
    systemProperty 'cpf.reference.db.batch-pack.enabled', batchEnabled
}

tasks.register('verifyReferenceFeatureBoundaries') {
    group = 'verification'
    description = 'Fails if mandatory REF online/platform/runtime code imports removable Batch/Operations/Backoffice/Gateway packages.'
    doLast {
        def mandatoryRoots = [
                file('src/main/java/com/cpf/reference/edu/runtime'),
                file('src/main/java/com/cpf/reference/edu/counterparty'),
                file('src/main/java/com/cpf/reference/online'),
                file('src/main/java/com/cpf/reference/platform')
        ]
        def forbidden = [
                'com.cpf.reference.batch.',
                'com.cpf.reference.optional.operations.',
                'com.cpf.reference.optional.backoffice.',
                'com.cpf.reference.optional.gateway.'
        ]
        def violations = []
        mandatoryRoots.findAll { it.exists() }.each { mandatoryRoot ->
            fileTree(mandatoryRoot).matching { include '**/*.java' }.files.each { source ->
                def text = source.getText('UTF-8')
                forbidden.each { prefix ->
                    if (text.contains('import ' + prefix)) violations << "${source}: ${prefix}"
                }
                if (text.contains('CPF_REF_BAT_')) violations << "${source}: CPF_REF_BAT_"
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException('Reference optional boundary violations:\n' + violations.join('\n'))
        }
    }
}

tasks.register('printReferenceDbPackSelection') {
    group = 'verification'
    description = 'Prints the exact refDB migration pack selected by cpf.reference.features.batch.enabled.'
    doLast {
        println "[CPF][REFERENCE][DB-PACK] ${referenceDbMigrations.join(',')}"
    }
}

tasks.register('printReferenceFeatureVariant') {
    group = 'verification'
    doLast { println "[CPF][REFERENCE][FEATURE-VARIANT] ${featureVariant}" }
}

check.dependsOn tasks.named('verifyReferenceFeatureBoundaries')


tasks.register('runOnlineAbcdSpringJdbcHarness', JavaExec) {
    group = 'verification'
    description = 'Runs the real DB Online A->B->C/D Spring TransactionTemplate reference harness.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.cpf.reference.online.integrated.OnlineAbcdSpringJdbcRuntimeHarness'
}
