plugins { id 'java-library'; id 'maven-publish' }
group = 'com.cpf.starter'

dependencies {
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Public default entry is intentionally lightweight. Optional Common/Persistence capabilities are explicit selections.
    api project(':framework:base-runtime')
}

tasks.named('test') { useJUnitPlatform() }
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'cpf-starter'
        }
    }
}
