plugins { id 'java-library'; id 'maven-publish'; id 'io.spring.dependency-management' }
group = 'com.cpf.starter'

dependencies {
    api project(':cpf-common')
    api project(':framework:core')
    api project(':framework:base-runtime')
    // Common은 DataSource Registry 계약만 필요하며 JDBC Provider를 모든 Profile에 강제하지 않습니다.
    implementation project(':framework:data:persistence')
    implementation project(':internal:platform-operations:runtime-control')

    implementation 'com.fasterxml.jackson.core:jackson-databind'
    api 'jakarta.validation:jakarta.validation-api:3.1.1'
    implementation 'org.springframework:spring-context'
    implementation 'org.springframework:spring-tx'
    implementation 'org.springframework:spring-jdbc'
    implementation 'org.springframework:spring-context-support'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-core'
    compileOnly "org.mybatis:mybatis:${rootProject.ext.cpfMybatisVersion}"
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.hibernate.validator:hibernate-validator'
}

// Product implementation은 cpf-common의 단일 Owner입니다. 이 Starter는 runtime/wiring만 compile합니다.
sourceSets {
    main {
        java.setSrcDirs(['src/main/java'])
        java.include 'com/cpf/common/runtime/**'
        java.include 'com/cpf/common/calendar/runtime/**'
        java.include 'com/cpf/common/message/service/CmnMessageProductAutoConfiguration.java'
        java.include 'com/cpf/common/code/reference/service/CmnCacheRuntimeApplier.java'
        resources.setSrcDirs(['src/main/resources'])
        resources.exclude 'cpf-sql/**'
    }
    test {
        java.setSrcDirs(['src/test/java'])
        java.include 'com/cpf/common/runtime/**'
    }
}

tasks.named('test') { useJUnitPlatform() }
publishing {
    publications {
        mavenJava(MavenPublication) { from components.java; artifactId = 'cpf-starter-common' }
    }
}
