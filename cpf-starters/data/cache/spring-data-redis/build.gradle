plugins { id 'java-library'; id 'maven-publish' }
group = 'com.cpf.internal'
dependencies {
    api project(':framework:data')
    implementation project(':framework:operations')
    api 'org.springframework.data:spring-data-redis'
    implementation 'org.springframework:spring-jdbc'
    implementation 'org.springframework:spring-context'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
tasks.named('test') { useJUnitPlatform() }
publishing { publications { mavenJava(MavenPublication) { from components.java; artifactId = 'cpf-cache-spring-data-redis' } } }
