plugins { id 'java-library'; id 'maven-publish' }
group = 'com.cpf.starter'

dependencies {
    api project(':cpf-core')
    api project(':cpf-starter-foundation-base')
    api 'jakarta.transaction:jakarta.transaction-api'
    api 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'org.springframework.boot:spring-boot-actuator'
    implementation 'org.jboss.narayana.jta:narayana-jta:7.3.4.Final'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.assertj:assertj-core'
}

tasks.named('test') { useJUnitPlatform() }

publishing { publications { mavenJava(MavenPublication) { from components.java; artifactId = 'cpf-starter-data-transaction-jta' } } }

tasks.register('runXaCrashHarness', JavaExec) {
    group = 'verification'
    description = 'Runs the opt-in DB+DB prepare-kill/recovery harness against disposable XA resources.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.cpf.starter.data.transaction.jta.CpfXaCrashRecoveryHarness'
    args providers.gradleProperty('cpfXaHarnessMode').orElse('recover').get()
}
