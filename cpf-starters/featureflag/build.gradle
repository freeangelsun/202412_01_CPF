plugins { id 'java-library'; id 'maven-publish' }
group = 'com.cpf.starter'
dependencies {
    api project(':cpf-core')
    api 'dev.openfeature:sdk:1.17.0'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
}
publishing { publications { mavenJava(MavenPublication) { from components.java; artifactId = 'cpf-starter-featureflag' } } }
