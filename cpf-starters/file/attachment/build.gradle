plugins { id 'java-library'; id 'maven-publish' }
group = 'com.cpf.starter'
dependencies {
    implementation project(':cpf-starter-platform-operations-runtime-control-client')
    api project(':cpf-core')
implementation 'org.springframework.boot:spring-boot-autoconfigure'
}
tasks.named('test') { useJUnitPlatform() }
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'cpf-starter-file-attachment'
        }
    }
}

