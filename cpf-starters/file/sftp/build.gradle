plugins { id 'java-library'; id 'maven-publish' }
group = 'com.cpf.starter'
dependencies {
    api project(':framework:operations')
    api project(':framework:data')
    api project(':framework:security')
    api project(':framework:file')
    api project(':internal:security:secret')
    implementation project(':internal:platform-operations:runtime-control')
    api project(':framework:core')
implementation project(':framework:base-runtime')
implementation project(':framework:data:persistence')
implementation project(':starters:data:jdbc')
api 'org.apache.sshd:sshd-sftp:2.14.0'
compileOnly 'com.fasterxml.jackson.core:jackson-annotations'
implementation 'org.springframework.boot:spring-boot-starter-actuator'
annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
tasks.named('test') { useJUnitPlatform() }
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'cpf-starter-file-sftp'
        }
    }
}
