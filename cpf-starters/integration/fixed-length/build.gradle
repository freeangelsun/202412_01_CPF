plugins { id 'java-library'; id 'maven-publish' }
group = 'com.cpf.starter'

dependencies {
    api project(':framework:integration')
    implementation project(':framework:core')
    implementation project(':framework:base-runtime')
    // Runtime-control integration uses only the Platform Operations neutral contract, never the provider leaf.
    implementation project(':framework:operations')
    implementation project(':internal:platform-operations:runtime-control')
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') { useJUnitPlatform() }
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'cpf-starter-integration-fixed-length'
        }
    }
}
