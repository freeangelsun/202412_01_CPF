plugins { id 'java-library'; id 'maven-publish' }
group='com.cpf.starter'
dependencies { api project(':cpf-core'); api 'org.springframework.boot:spring-boot-starter-web'; implementation 'org.springframework.boot:spring-boot-autoconfigure'; annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'; testImplementation 'org.springframework.boot:spring-boot-starter-test' }
tasks.named('test'){useJUnitPlatform()}
publishing { publications { mavenJava(MavenPublication){from components.java;artifactId='cpf-starter-integration-realtime'} } }
