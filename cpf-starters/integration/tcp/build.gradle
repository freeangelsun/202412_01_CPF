plugins { id 'java-library'; id 'maven-publish' }
group='com.cpf.starter'
dependencies {
    api project(':framework:integration')
 api project(':framework:core')
 implementation project(':framework:base-runtime')
 implementation project(':internal:integration:resilience')
 implementation 'org.springframework.boot:spring-boot-autoconfigure'
 implementation 'org.springframework.boot:spring-boot-starter-actuator'
 compileOnly 'com.fasterxml.jackson.core:jackson-annotations'
 annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
 testImplementation 'org.junit.jupiter:junit-jupiter'
 testImplementation 'org.assertj:assertj-core'
}
tasks.named('test'){useJUnitPlatform()}
publishing { publications { mavenJava(MavenPublication){from components.java;artifactId = 'cpf-starter-integration-tcp'} } }
