plugins { id 'java-library'; id 'maven-publish' }
group = 'com.cpf.starter'
dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    api project(':framework:operations')
    api project(':framework:integration')
    api project(':framework:operations:observability')
    api project(':framework:messaging')
    implementation project(':internal:platform-operations:runtime-control')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.springframework:spring-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    api project(':framework:core')
implementation project(':framework:base-runtime')
// Broker 신뢰성 원장은 CPF Platform DB Role 에 있다. Runtime 에 업무 Domain DataSource 가
// 함께 존재하므로 타입 주입은 모호해진다. Role 해석 계약을 쓰기 위해 선언한다.
api project(':framework:data:persistence')
implementation 'org.springframework:spring-jdbc'
implementation 'org.springframework.boot:spring-boot-starter-actuator'
implementation 'org.springframework.boot:spring-boot-autoconfigure'
annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
}
tasks.named('test') { useJUnitPlatform() }
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'cpf-starter-messaging-reliability-jdbc'
        }
    }
}
