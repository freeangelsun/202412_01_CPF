plugins { id 'java-library'; id 'maven-publish' }
group = 'com.cpf.internal'

dependencies {
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    api project(':framework:operations')
    implementation project(':framework:security')
    implementation project(':internal:platform-operations:runtime-control')
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'org.springframework:spring-context'
    implementation 'org.springframework:spring-tx'
    implementation 'org.springframework:spring-jdbc'
    implementation 'org.springframework:spring-web'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'org.slf4j:slf4j-api'
    implementation 'org.aspectj:aspectjweaver'
    implementation 'io.opentelemetry:opentelemetry-api'
    compileOnly 'jakarta.servlet:jakarta.servlet-api'
    compileOnly 'jakarta.annotation:jakarta.annotation-api'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
}

tasks.named('test') { useJUnitPlatform() }
publishing { publications { mavenJava(MavenPublication) { from components.java; artifactId = 'cpf-platform-operations-observability' } } }
