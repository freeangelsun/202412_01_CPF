plugins { id 'java-library'; id 'maven-publish' }
group = 'com.cpf.starter'
dependencies {
    implementation project(':cpf-starter-platform-operations-runtime-control-client')
    api project(':cpf-core')
    api 'io.micrometer:micrometer-observation'
    api 'io.micrometer:micrometer-tracing-bridge-otel'
    api 'io.opentelemetry:opentelemetry-exporter-otlp'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
publishing { publications { mavenJava(MavenPublication) { from components.java; artifactId = 'cpf-starter-platform-operations-observability' } } }

tasks.named('test') { useJUnitPlatform() }
