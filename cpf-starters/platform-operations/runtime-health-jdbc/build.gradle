plugins { id 'java-library'; id 'maven-publish' }
group='com.cpf.starter'
dependencies {
 api project(':cpf-core')
 implementation project(':cpf-starter-data-persistence-jdbc')
 implementation 'org.springframework.boot:spring-boot-autoconfigure'
 implementation 'org.springframework:spring-jdbc'
 implementation 'com.fasterxml.jackson.core:jackson-databind'
 annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
 testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
tasks.named('test'){useJUnitPlatform()}
publishing { publications { mavenJava(MavenPublication){from components.java;artifactId='cpf-starter-platform-operations-runtime-health-jdbc'} } }
