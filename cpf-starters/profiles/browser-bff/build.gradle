plugins { id 'java-library'; id 'maven-publish' }
group = 'com.cpf.starter'

dependencies {
    api project(':cpf-starter-profile-web-api')
    api project(':cpf-starter-security-session-jdbc')
    api project(':cpf-starter-secret')
}

tasks.named('test') { useJUnitPlatform() }

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'cpf-starter-profile-browser-bff'
            pom {
                name = 'CPF browser-bff profile'
                description = 'QA39 public use-case profile. Optional capability/provider leaves remain Generator-selected.'
            }
        }
    }
}
