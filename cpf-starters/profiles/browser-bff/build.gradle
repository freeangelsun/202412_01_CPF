plugins { id 'java-library'; id 'maven-publish' }
group='com.cpf.starter'
dependencies {
 api project(':cpf-starter-profile-web-api')
 api project(':cpf-starter-security-secret')
 api 'org.springframework.boot:spring-boot-starter-security'
 api 'org.springframework.session:spring-session-jdbc'
 testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
}
tasks.named('test'){useJUnitPlatform()}
publishing { publications { mavenJava(MavenPublication){from components.java;artifactId='cpf-starter-profile-browser-bff'} } }
