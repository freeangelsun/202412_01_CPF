plugins { id 'java-library'; id 'maven-publish' }
group = 'com.cpf.starter'
dependencies {
    api project(':cpf-starter-base')
    api project(':cpf-starter-validation')
    api project(':cpf-starter-openapi-webmvc')
    api project(':cpf-starter-http-client')
}
tasks.named('test') { useJUnitPlatform() }
publishing { publications { mavenJava(MavenPublication) { from components.java; artifactId = 'cpf-starter-profile-domain-web-api' } } }
