plugins { id 'java-library'; id 'maven-publish' }
group = 'com.cpf.starter'
dependencies {
    api project(':cpf-starter-messaging-reliability-jdbc')
    api project(':cpf-starter-messaging-kafka')
    api project(':cpf-starter-observability')
    api project(':cpf-starter-resilience')
}
tasks.named('test') { useJUnitPlatform() }
publishing { publications { mavenJava(MavenPublication) { from components.java; artifactId = 'cpf-starter-profile-event-kafka' } } }
