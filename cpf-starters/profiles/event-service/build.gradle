plugins { id 'java-library'; id 'maven-publish' }
group='com.cpf.starter'
dependencies {
    api project(':starters:base')
    implementation project(':framework:messaging')
    implementation project(':framework:integration')
    api 'org.springframework.boot:spring-boot-starter-actuator'
}
tasks.named('test'){useJUnitPlatform()}
publishing { publications { mavenJava(MavenPublication){from components.java;artifactId = 'cpf-starter-event'} } }
