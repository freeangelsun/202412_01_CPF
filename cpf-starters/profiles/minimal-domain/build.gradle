plugins { id 'java-library'; id 'maven-publish' }
group = 'com.cpf.starter'

dependencies {
    api project(':cpf-starter-base')
}

tasks.named('test') { useJUnitPlatform() }

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'cpf-starter-profile-minimal-domain'
            pom {
                name = 'CPF minimal-domain profile'
                description = 'QA39 public use-case profile. Optional capability/provider leaves remain Generator-selected.'
            }
        }
    }
}
