plugins { id 'java-library'; id 'maven-publish' }
group='com.cpf.starter'
dependencies {
    // secure-api is the exactly-one top-level profile and inherits the public Web profile contract.
    api project(':starters:profiles:web-api')
    // Consumer-facing Domain Call contracts are part of the secure-api compile surface.
    api project(':framework:integration')
    // Security and provider implementations remain inside the profile runtime composition.
    implementation project(':framework:security')
    implementation project(':internal:security:resource-server')
    implementation project(':internal:integration:http')
    implementation project(':internal:integration:resilience')
    api 'org.springframework.boot:spring-boot-starter-security'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
}
tasks.named('test'){useJUnitPlatform()}
publishing { publications { mavenJava(MavenPublication){from components.java;artifactId = 'cpf-starter-secure-api'} } }
