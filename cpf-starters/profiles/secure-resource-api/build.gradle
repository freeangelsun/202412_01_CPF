plugins { id 'java-library'; id 'maven-publish' }
group = 'com.cpf.starter'
dependencies {
    api project(':cpf-starter-profile-domain-web-api')
    api project(':cpf-starter-security-resource-server')
    api project(':cpf-starter-security-service-identity')
    api project(':cpf-starter-observability')
}
tasks.named('test') { useJUnitPlatform() }
publishing { publications { mavenJava(MavenPublication) { from components.java; artifactId = 'cpf-starter-profile-secure-resource-api' } } }
