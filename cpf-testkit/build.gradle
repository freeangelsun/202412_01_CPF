plugins { id 'java-library'; id 'maven-publish' }
group='com.cpf.testkit'
dependencies { api project(':cpf-core'); api project(':cpf-foundation'); implementation 'org.springframework.boot:spring-boot-autoconfigure'; implementation 'org.springframework:spring-context'; implementation 'org.springframework:spring-core'; implementation 'org.springframework:spring-aop'; implementation 'org.aspectj:aspectjweaver'; testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'; testImplementation 'org.assertj:assertj-core:3.26.3' }
tasks.named('test'){useJUnitPlatform()}
publishing { publications { mavenJava(MavenPublication){from components.java;artifactId='cpf-testkit'} } }
