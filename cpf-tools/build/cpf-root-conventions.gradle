import org.gradle.api.tasks.compile.JavaCompile
import org.gradle.api.tasks.testing.Test
import org.gradle.api.artifacts.ExternalModuleDependency
import org.gradle.api.publish.maven.MavenPublication
import groovy.json.JsonSlurper

/*
 * CPF Root Build Convention.
 * Root build.gradle은 선언만 유지하고 공통 Build/검증 책임은 이 파일에서 소유합니다.
 */
def stack = new Properties()
file('gradle/cpf-stack.properties').withInputStream { stack.load(it) }
def platform = new Properties()
file('gradle/cpf-platform.properties').withInputStream { platform.load(it) }

def stackInt = { String key -> Integer.parseInt(stack.getProperty(key)) }
def stackText = { String key -> stack.getProperty(key) }

def cpfPython = providers.environmentVariable('CPF_PYTHON').orElse('python').get()

// Repository-root generated state belongs under the managed Evidence workspace.
// Module build outputs retain their catalog-owned conventional paths while final cleanup removes them.
def cpfGeneratedEvidenceRoot = rootProject.layout.projectDirectory.dir('cpf-docs/governance/development-harness/evidence/platform/current/generated')
def cpfJvmCrashDir = cpfGeneratedEvidenceRoot.dir('jvm/crash').asFile
def cpfJvmHeapDumpDir = cpfGeneratedEvidenceRoot.dir('jvm/heap-dump').asFile
rootProject.layout.buildDirectory.set(cpfGeneratedEvidenceRoot.dir('gradle/root-build'))


// All canonical Starter/runtime modules publish Runtime/ADM management metadata from one catalog.
// Public Starters and operator-visible internal providers fail closed when the management contract is missing;
// foundations are registered as hidden components so CPF still knows what is on the runtime classpath.
def cpfStarterCatalogFile = file('cpf-tools/generator/contracts/cpf-starter-catalog.json')
def cpfStarterCatalog = new JsonSlurper().parse(cpfStarterCatalogFile)
def cpfStarterManagementByProject = (cpfStarterCatalog.modules ?: [])
        .collectEntries { module -> [(module.projectPath.toString()): module] }

// Composite Build의 자동 치환 좌표는 publication artifactId가 아니라
// ${project.group}:${project.name}입니다. jdbc/valkey처럼 동일 leaf name을 가진
// 여러 프로젝트는 서로를 잘못 치환할 수 있으므로, 충돌 Owner만 Source-build
// 전용 group으로 분리합니다. Maven publication 좌표는 Catalog 정본을 그대로 유지합니다.
def cpfCompositeIdentityCollisions = (cpfStarterCatalog.modules ?: []).groupBy { module ->
    def leafName = module.projectPath.toString().tokenize(':').last()
    "${module.groupId}:${leafName}".toString()
}.findAll { coordinate, modules -> modules.size() > 1 }
def cpfCompositeGroupByProject = cpfCompositeIdentityCollisions.values().flatten().collectEntries { module ->
    def suffix = module.artifactId.toString().replaceAll('[^A-Za-z0-9_.]', '.')
    [(module.projectPath.toString()): "${module.groupId}.composite.${suffix}".toString()]
}

gradle.afterProject { target, state ->
    def module = cpfStarterManagementByProject[target.path]
    def compositeGroup = cpfCompositeGroupByProject[target.path]
    if (module != null) {
        target.plugins.withId('base') {
            // Executable archives embed project Jars by their local filename. The
            // canonical artifactId is globally unique, while leaf project names
            // such as jdbc/valkey are intentionally repeated across capabilities.
            target.base.archivesName.set(module.artifactId.toString())
        }
    }
    if (module != null && compositeGroup != null) {
        target.group = compositeGroup
        target.plugins.withId('maven-publish') {
            target.publishing.publications.withType(MavenPublication).configureEach {
                groupId = module.groupId.toString()
            }
        }
    }
}

// The final artifact catalog owns documentation publication. Individual
// modules must not independently drift sources/javadoc disclosure on or off.
def cpfFinalArtifactCatalogFile = file('cpf-tools/release/cpf-final-artifact-catalog.json')
def cpfFinalArtifactCatalog = new JsonSlurper().parse(cpfFinalArtifactCatalogFile)
def cpfPublicationRows = (cpfFinalArtifactCatalog.artifacts ?: []) as List
def cpfDocumentationByOwner = cpfPublicationRows.groupBy { row ->
    row.ownerPath?.toString()?.replace('\\', '/')?.replaceAll('/+$', '')
}.collectEntries { owner, rows ->
    [(owner): [
            publishSources: rows.any { it.publishSources == true },
            publishJavadoc: rows.any { it.publishJavadoc == true }
    ]]
}
def cpfPublicPublicationClasses = [
        'PUBLIC_COMPILE_TIME_JAVA', 'PUBLIC_RUNTIME', 'PUBLIC_BOM', 'PUBLIC_TOOLING', 'PUBLIC_STARTER'
] as Set
def cpfPublicPublicationOwners = cpfPublicationRows.findAll { row ->
    cpfPublicPublicationClasses.contains(row.publicationClass?.toString()) &&
            !(row.publicGroupId?.toString() ?: '').trim().isEmpty()
}.collect { row -> row.ownerPath?.toString()?.replace('\\', '/')?.replaceAll('/+$', '') }.findAll { it }.toSet()

// Public Release의 Maven 좌표는 Private/Composite project identity와 분리합니다.
// 일반 개발/내부 Publication에서는 기존 native 좌표를 그대로 유지하고,
// -PcpfPublicBinaryRepository가 명시된 Fresh Open Git Release에서만 Final Artifact Catalog의
// publicGroupId/artifactId로 publication을 투영합니다. 동일 Source owner가 Public Starter와
// Runtime alias를 함께 제공하는 경우에도 Catalog row별 publication을 독립 생성합니다.
def cpfPublicRowsByProject = cpfPublicationRows.findAll { row ->
    cpfPublicPublicationClasses.contains(row.publicationClass?.toString()) &&
            !(row.publicGroupId?.toString() ?: '').trim().isEmpty() &&
            !(row.publicProjectPath?.toString() ?: '').trim().isEmpty()
}.groupBy { row -> row.publicProjectPath.toString() }

def cpfPublicPublicationPriority = { row ->
    switch (row.publicationClass?.toString()) {
        case 'PUBLIC_COMPILE_TIME_JAVA': return 0
        case 'PUBLIC_STARTER': return 1
        case 'PUBLIC_RUNTIME': return 2
        case 'PUBLIC_TOOLING': return 3
        case 'PUBLIC_BOM': return 4
        default: return 9
    }
}

def capabilityPropertiesText = { Map module ->
    def management = module.management instanceof Map ? module.management : [:]
    def supports = management.supports instanceof Map ? management.supports : [:]
    def lines = [
            "id=${management.id ?: ''}",
            "starterArtifactId=${module.artifactId ?: ''}",
            "capability=${management.capabilityId ?: ''}",
            "provider=${management.provider ?: ''}",
            "configPrefix=${module.configPrefix ?: ''}",
            "ownerGroup=${module.ownerGroup ?: ''}",
            "runtimeRequired=${module.runtimeRequired == true}",
            "usageLevel=${module.usageLevel ?: ''}",
            "managementCategory=${management.category ?: 'RUNTIME'}",
            "dedicatedWorkflow=${management.dedicatedWorkflow == true}",
            "operatorVisible=${management.operatorVisible == true}",
            "automaticRegistration=${management.automaticRegistration == true}",
            "managementScope=${management.scope ?: 'component'}",
            "commonAreas=${(management.commonAreas ?: []).join(',')}",
    ]
    ['health','metrics','logs','trace','effectiveConfig','failure','audit','dynamicConfig','runtimeControl','recovery'].each { key ->
        lines << "supports.${key}=${supports[key] == true}"
    }
    lines << "meta.displayNameKo=${module.displayNameKo ?: module.artifactId ?: ''}"
    lines << "meta.packageBase=${module.packageBase ?: ''}"
    lines << "meta.visibility=${module.visibility ?: 'internal'}"
    lines << "meta.selectionGroup=${module.selectionGroup ?: ''}"
    return lines.join(System.lineSeparator()) + System.lineSeparator()
}

// CPF 프로젝트 자원 정책은 gradle/cpf-runtime/{common,profile}.properties 한 곳에서 관리합니다.
// 모듈별 예외는 해당 모듈의 cpf-resource.properties가 있을 때만 적용합니다.
def loadCpfResourceProperties = { File source ->
    def values = new Properties()
    if (!source.isFile()) throw new GradleException("CPF resource policy is missing: ${source}")
    source.withInputStream { values.load(it) }
    values
}
def cpfResourceProfile = providers.gradleProperty('cpfResourceProfile')
        .orElse(providers.environmentVariable('CPF_RESOURCE_PROFILE'))
        .orElse('local').get()
if (!(cpfResourceProfile in ['local','dev','test','stg','prod'])) {
    throw new GradleException("Unsupported cpfResourceProfile=${cpfResourceProfile}; expected local/dev/test/stg/prod")
}
def cpfResourceCommon = loadCpfResourceProperties(file('gradle/cpf-runtime/common.properties'))
def cpfResourceEnvironment = loadCpfResourceProperties(file("gradle/cpf-runtime/${cpfResourceProfile}.properties"))
def cpfResourceCli = { String key ->
    def value = providers.gradleProperty("cpfResource.${key}").orNull
    value == null || value.toString().trim().isEmpty() ? null : value.toString().trim()
}
def cpfResourceGlobal = { String key ->
    cpfResourceCli(key) ?: cpfResourceEnvironment.getProperty(key) ?: cpfResourceCommon.getProperty(key)
}
def cpfModuleResourceCache = [:]
def cpfModuleResources = { Project target ->
    cpfModuleResourceCache.computeIfAbsent(target.path) {
        def values = new Properties()
        def source = target.file('cpf-resource.properties')
        if (source.isFile()) source.withInputStream { values.load(it) }
        values
    }
}
def cpfResourceValue = { Project target, String key ->
    // 사용자 확정 우선순위: 모듈 명시값 > 실행 시 -P 값 > 환경별 중앙값 > 공통 기본값
    cpfModuleResources(target).getProperty(key) ?: cpfResourceGlobal(key)
}
def cpfMemoryMb = { String value ->
    if (value == null) return null
    def normalized = value.trim().toLowerCase(Locale.ROOT)
    def matcher = normalized =~ /^([0-9]+)([mg])$/
    if (!matcher.matches()) throw new GradleException("Invalid CPF memory value=${value}; use <number>m or <number>g")
    def amount = Integer.parseInt(matcher.group(1))
    matcher.group(2) == 'g' ? amount * 1024 : amount
}
def cpfValidateHeap = { String key, String value ->
    if (value == null) return
    def enforce = (cpfResourceGlobal('runtime.memory.enforceCeiling') ?: 'true').toBoolean()
    if (!enforce) return
    def mb = cpfMemoryMb(value)
    def step = Integer.parseInt(cpfResourceCommon.getProperty('heap.step.mb', '250'))
    def ceiling = Integer.parseInt(cpfResourceGlobal('runtime.memory.ceiling.mb') ?: '1000')
    if (mb < step || mb > ceiling || mb % step != 0) {
        throw new GradleException("CPF memory ${key}=${value} must use ${step}MB increments and stay between ${step}MB and ${ceiling}MB")
    }
}
ext.cpfJavaVersion = stackInt('javaVersion')
ext.cpfPlatformVersion = platform.getProperty('platformVersion')
ext.cpfSpringBootVersion = stackText('springBootVersion')
ext.cpfSpringCloudVersion = stackText('springCloudVersion')
ext.cpfAwsSdkVersion = stackText('awsSdkVersion')
ext.cpfMybatisVersion = stackText('mybatisVersion')
ext.cpfSpringdocVersion = stackText('springdocVersion')
ext.cpfOpenFeatureVersion = stackText('openFeatureVersion')
ext.cpfDbSchedulerVersion = stackText('dbSchedulerVersion')

version = ext.cpfPlatformVersion

// VS Code Buildship/JDT resolves source-empty Java projects as project dependencies too.
// Gradle's default compileJava output lives below each project build/ tree, so a clean
// removes that directory even though NO-SOURCE projects have no compiler invocation that
// would recreate it. Keep only those empty outputs in Gradle User Home. Never add fake Java API/classes.
def cpfIdeRootIdentity = java.security.MessageDigest.getInstance('SHA-256')
        .digest(rootDir.canonicalPath.getBytes('UTF-8')).encodeHex().toString().substring(0, 16)
def cpfIdeClasspathRoot = new File(gradle.gradleUserHomeDir, "cpf-ide-classpath/${cpfIdeRootIdentity}")
def sourceEmptyJavaProjects = []

subprojects {
    plugins.withId('java') {
        project.afterEvaluate {
            if (sourceSets.main.java.files.empty) {
                def stableRelativePath = project.path.substring(1).replace(':', '/')
                def stableOutputDir = new File(cpfIdeClasspathRoot, "${stableRelativePath}/main")
                if (!stableOutputDir.mkdirs() && !stableOutputDir.isDirectory()) {
                    throw new GradleException("Cannot materialize CPF IDE classpath output: ${stableOutputDir}")
                }
                compileJava.destinationDirectory.set(stableOutputDir)
                project.ext.cpfIdeClasspathMaterializedOnConfiguration = stableOutputDir.absolutePath
                sourceEmptyJavaProjects << project.path
            }
        }
    }
}

tasks.register('cpfPrepareIdeClasspath') {
    group = 'verification'
    description = 'Fresh/clean 이후에도 source-empty Java project의 Buildship/JDT classpath output을 안정적으로 준비합니다.'
    doLast {
        def javaProjects = subprojects.findAll { it.plugins.hasPlugin('java') }
        def expected = javaProjects.findAll { it.sourceSets.main.java.files.empty }
        def missing = []
        expected.each { target ->
            if (!target.ext.has('cpfIdeClasspathMaterializedOnConfiguration')) {
                missing << "${target.path}:configuration-marker-missing"
                return
            }
            def stable = file(target.ext.cpfIdeClasspathMaterializedOnConfiguration.toString())
            if (!stable.mkdirs() && !stable.isDirectory()) missing << "${target.path}:${stable}"
            println "CPF_IDE_CLASSPATH_PROJECT=${target.path} stable=${stable}"
        }
        if (!missing.isEmpty()) {
            throw new GradleException("CPF IDE classpath preparation failed:\n - ${missing.join('\\n - ')}")
        }
        println "CPF_IDE_CLASSPATH_READY projects=${expected.size()} root=${cpfIdeClasspathRoot}"
    }
}

tasks.register('cpfVerifyIdeClasspathModel') {
    group = 'verification'
    description = 'source-empty Java project만 stable IDE output을 사용하고 Source project dependency를 변경하지 않았는지 검증합니다.'
    doLast {
        def javaProjects = subprojects.findAll { it.plugins.hasPlugin('java') }
        def sourceEmpty = javaProjects.findAll { it.sourceSets.main.java.files.empty }
        def failures = []
        sourceEmpty.each { target ->
            if (!target.ext.has('cpfIdeClasspathMaterializedOnConfiguration')) {
                failures << "${target.path}:stable-output-not-configured"
                return
            }
            def stable = file(target.ext.cpfIdeClasspathMaterializedOnConfiguration.toString()).canonicalFile
            def actual = target.tasks.named('compileJava', JavaCompile).get().destinationDirectory.get().asFile.canonicalFile
            if (actual != stable) failures << "${target.path}:expected=${stable}:actual=${actual}"
            if (!stable.isDirectory()) failures << "${target.path}:stable-output-missing=${stable}"
        }
        def sourcefulOverridden = javaProjects.findAll {
            !it.sourceSets.main.java.files.empty && it.ext.has('cpfIdeClasspathMaterializedOnConfiguration')
        }.collect { it.path }
        if (!sourcefulOverridden.isEmpty()) failures << "sourceful-project-overridden=${sourcefulOverridden.sort()}"
        if (!failures.isEmpty()) {
            throw new GradleException("CPF IDE classpath model failed:\n - ${failures.join('\\n - ')}")
        }
        println "CPF_IDE_CLASSPATH_MODEL=PASS sourceEmptyJavaProjects=${sourceEmpty.size()} stable=${cpfIdeClasspathRoot}"
    }
}

allprojects {
    version = rootProject.ext.cpfPlatformVersion
    repositories {
        mavenLocal()
        mavenCentral()
    }
}

subprojects {
    def cpfManagementModule = cpfStarterManagementByProject[project.path]
    if (cpfManagementModule != null) {
        def generatedCapabilityDir = layout.buildDirectory.dir('generated/cpf-runtime-capability')
        tasks.register('generateCpfRuntimeCapabilityMetadata') {
            group = 'CPF Configuration/Discovery'
            description = 'Canonical Starter Catalog에서 Runtime/ADM Capability metadata를 자동 생성합니다.'
            inputs.file(rootProject.file('cpf-tools/generator/contracts/cpf-starter-catalog.json'))
            outputs.file(generatedCapabilityDir.map { it.file('META-INF/cpf/runtime-capability.properties') })
            doLast {
                def target = generatedCapabilityDir.get().file('META-INF/cpf/runtime-capability.properties').asFile
                target.parentFile.mkdirs()
                target.setText(capabilityPropertiesText(cpfManagementModule as Map), 'UTF-8')
            }
        }
        plugins.withId('java') {
            // 과거 정적 descriptor는 호환성 비교용 Source로 보존하되 Build 입력에서는 정확히 제외합니다.
            // Catalog가 생성한 단일 descriptor만 resource/source archive에 들어가며 다른 중복은 FAIL합니다.
            def compatibilityCapabilityFile = file('src/main/resources/META-INF/cpf/runtime-capability.properties').canonicalFile
            sourceSets.main.resources.exclude { element ->
                element.file.canonicalFile == compatibilityCapabilityFile
            }
            sourceSets.main.resources.srcDir(generatedCapabilityDir)
            tasks.named('processResources') {
                dependsOn 'generateCpfRuntimeCapabilityMetadata'
                duplicatesStrategy = DuplicatesStrategy.FAIL
            }
            tasks.matching { it.name == 'sourcesJar' }.configureEach {
                dependsOn 'generateCpfRuntimeCapabilityMetadata'
                duplicatesStrategy = DuplicatesStrategy.FAIL
            }
        }
    }
    plugins.withId('java') {
        def cpfOwnerPath = rootProject.relativePath(projectDir).replace('\\', '/').replaceAll('/+$', '')
        def cpfDocumentation = cpfDocumentationByOwner[cpfOwnerPath]
        if (cpfDocumentation?.publishSources == true) {
            java.withSourcesJar()
        }
        if (cpfDocumentation?.publishJavadoc == true) {
            java.withJavadocJar()
        }
        // cpf-core를 제외한 Root Build Java Module은 동일한 기술 Stack BOM을 사용합니다.
        // cpf-core는 JDK-only public contract이므로 POM에 dependencyManagement를 노출하지 않습니다.
        // 개별 Module이 Boot application plugin을 적용하는지와 무관하게 versionless
        // Spring/OSS 좌표가 해석되어야 하므로 dependency-management 적용 책임은
        // Module build.gradle이 아니라 이 Root Convention이 소유합니다.
        if (path != ':framework:core') {
            pluginManager.apply('io.spring.dependency-management')
            dependencies.add('testImplementation', 'org.junit.jupiter:junit-jupiter')
            dependencies.add('testImplementation', 'org.assertj:assertj-core')
            dependencies.add('testRuntimeOnly', 'org.junit.platform:junit-platform-launcher')
        }
        java {
            toolchain { languageVersion = JavaLanguageVersion.of(rootProject.ext.cpfJavaVersion) }
        }
        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
            options.release = rootProject.ext.cpfJavaVersion
            options.compilerArgs += ['-parameters']
        }
        tasks.withType(Test).configureEach {
            useJUnitPlatform()
            doFirst {
                if (!cpfJvmCrashDir.mkdirs() && !cpfJvmCrashDir.isDirectory()) {
                    throw new GradleException("Cannot create CPF JVM crash Evidence directory: ${cpfJvmCrashDir}")
                }
                if (!cpfJvmHeapDumpDir.mkdirs() && !cpfJvmHeapDumpDir.isDirectory()) {
                    throw new GradleException("Cannot create CPF JVM heap-dump Evidence directory: ${cpfJvmHeapDumpDir}")
                }
            }
            jvmArgs '-XX:+HeapDumpOnOutOfMemoryError',
                    "-XX:ErrorFile=${new File(cpfJvmCrashDir, 'test-hs_err_pid%p.log').absolutePath}",
                    "-XX:HeapDumpPath=${cpfJvmHeapDumpDir.absolutePath}"
            def xms = cpfResourceValue(project, 'test.xms')
            def xmx = cpfResourceValue(project, 'test.xmx')
            def forksText = cpfResourceValue(project, 'test.maxParallelForks')
            cpfValidateHeap("${project.path}:test.xms", xms)
            cpfValidateHeap("${project.path}:test.xmx", xmx)
            if (xms) minHeapSize = xms
            if (xmx) maxHeapSize = xmx
            if (forksText) {
                def forks = Integer.parseInt(forksText)
                if (forks < 1 || forks > 16) throw new GradleException("Invalid ${project.path} test.maxParallelForks=${forks}")
                maxParallelForks = forks
            }
        }
        tasks.withType(AbstractArchiveTask).configureEach {
            preserveFileTimestamps = false
            reproducibleFileOrder = true
        }
    }
    plugins.withId('org.springframework.boot') {
        // Spring Boot plugin이 bootRun Task를 등록하는 시점보다 먼저 조회하면 IDE/Gradle configuration 자체가 실패합니다.
        // matching(...).configureEach는 Task 생성 이후에만 적용되는 lazy configuration입니다.
        tasks.matching { it.name == 'bootRun' }.configureEach {
            def batchRuntime = project.path.toLowerCase(Locale.ROOT).contains('batch')
            def moduleValues = cpfModuleResources(project)
            def xms = moduleValues.getProperty('runtime.xms') ?: cpfResourceValue(project, batchRuntime ? 'runtime.batch.xms' : 'runtime.web.xms')
            def xmx = moduleValues.getProperty('runtime.xmx') ?: cpfResourceValue(project, batchRuntime ? 'runtime.batch.xmx' : 'runtime.web.xmx')
            cpfValidateHeap("${project.path}:bootRun.xms", xms)
            cpfValidateHeap("${project.path}:bootRun.xmx", xmx)
            if (cpfMemoryMb(xms) > cpfMemoryMb(xmx)) throw new GradleException("${project.path}: bootRun Xms must be <= Xmx")
            jvmArgs = [
                    "-Xms${xms}", "-Xmx${xmx}",
                    "-XX:MaxMetaspaceSize=${cpfResourceValue(project, 'runtime.jvm.maxMetaspace')}",
                    "-XX:MaxDirectMemorySize=${cpfResourceValue(project, 'runtime.jvm.maxDirectMemory')}",
                    "-XX:ReservedCodeCacheSize=${cpfResourceValue(project, 'runtime.jvm.reservedCodeCache')}",
                    "-Xss${cpfResourceValue(project, 'runtime.jvm.threadStack')}"
            ]
        }
    }
    tasks.withType(JavaExec).configureEach {
        doFirst {
            if (!cpfJvmCrashDir.mkdirs() && !cpfJvmCrashDir.isDirectory()) {
                throw new GradleException("Cannot create CPF JVM crash Evidence directory: ${cpfJvmCrashDir}")
            }
            if (!cpfJvmHeapDumpDir.mkdirs() && !cpfJvmHeapDumpDir.isDirectory()) {
                throw new GradleException("Cannot create CPF JVM heap-dump Evidence directory: ${cpfJvmHeapDumpDir}")
            }
        }
        jvmArgs '-XX:+HeapDumpOnOutOfMemoryError',
                "-XX:ErrorFile=${new File(cpfJvmCrashDir, 'runtime-hs_err_pid%p.log').absolutePath}",
                "-XX:HeapDumpPath=${cpfJvmHeapDumpDir.absolutePath}"
    }
    tasks.withType(Exec).matching { it.name.toLowerCase(Locale.ROOT).startsWith('frontend') }.configureEach {
        def nodeMb = cpfResourceValue(project, 'frontend.node.maxOldSpace.mb')
        if (nodeMb) environment 'NODE_OPTIONS', "--max-old-space-size=${nodeMb}"
    }
    plugins.withId('io.spring.dependency-management') {
        dependencyManagement {
            imports {
                mavenBom "org.springframework.boot:spring-boot-dependencies:${rootProject.ext.cpfSpringBootVersion}"
                mavenBom "org.springframework.cloud:spring-cloud-dependencies:${rootProject.ext.cpfSpringCloudVersion}"
            }
        }
    }
}

tasks.register('cpfResourcePolicy') {
    group = 'CPF Configuration/Discovery'
    description = '현재 CPF 환경별 중앙 자원정책과 모듈 override 우선순위를 표시합니다.'
    doLast {
        println "CPF_RESOURCE_PROFILE=${cpfResourceProfile}"
        println "CPF_RESOURCE_DIR=${file('gradle/cpf-runtime').absolutePath}"
        println 'PRIORITY=module cpf-resource.properties > -PcpfResource.<key> > environment profile > common'
        ['gradle.maxWorkers','gradle.parallel','test.xms','test.xmx','test.maxParallelForks',
         'frontend.node.maxOldSpace.mb','runtime.web.xms','runtime.web.xmx','runtime.batch.xms','runtime.batch.xmx'].each { key ->
            println "${key}=${cpfResourceGlobal(key)}"
        }
    }
}

tasks.register('cpfResourcePolicyGate') {
    group = 'verification'
    description = 'CPF 환경별 자원정책 파일, 250MB step/1000MB ceiling, module override contract를 검증합니다.'
    doLast {
        ['common','local','dev','test','stg','prod'].each { profile ->
            def source = file("gradle/cpf-runtime/${profile}.properties")
            if (!source.isFile()) throw new GradleException("Missing CPF resource profile: ${source}")
        }
        ['test.xms','test.xmx','runtime.web.xms','runtime.web.xmx','runtime.batch.xms','runtime.batch.xmx'].each { key ->
            def value = cpfResourceGlobal(key)
            if (value == null) throw new GradleException("Missing CPF resource key=${key}")
            cpfValidateHeap(key, value)
        }
    }
}

tasks.register('managedDependencyGate') {
    group = 'verification'
    description = '무버전 External Dependency가 적용된 canonical BOM에서 실제 관리되는지 검증합니다.'
    doLast {
        def violations = []
        subprojects.findAll { it.plugins.hasPlugin('java') }.each { p ->
            if (p.path == ':framework:core') {
                if (p.plugins.hasPlugin('io.spring.dependency-management')) {
                    violations << ':framework:core: dependency-management must not be applied to the JDK-only contract'
                }
                p.configurations.each { configuration ->
                    configuration.dependencies.withType(ExternalModuleDependency).each { dependency ->
                        if (dependency.version == null || dependency.version.trim().isEmpty()) {
                            violations << ":framework:core:${configuration.name}: ${dependency.group}:${dependency.name} must declare an explicit test-only version"
                        }
                    }
                }
                return
            }
            def management = p.extensions.findByName('dependencyManagement')
            if (management == null) {
                violations << "${p.path}: dependency-management convention missing"
                return
            }
            p.configurations.each { configuration ->
                def managedVersions = management.getManagedVersionsForConfigurationHierarchy(configuration)
                configuration.dependencies.withType(ExternalModuleDependency).each { dependency ->
                    if (dependency.version == null || dependency.version.trim().isEmpty()) {
                        // Groovy interpolation returns GString; Map<String, String>#containsKey does not
                        // consider an otherwise equal GString key equal to java.lang.String.
                        def coordinate = "${dependency.group}:${dependency.name}".toString()
                        if (!managedVersions.containsKey(coordinate)) {
                            violations << "${p.path}:${configuration.name}: ${coordinate}"
                        }
                    }
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Unmanaged versionless dependencies:\n - ${violations.unique().sort().join('\n - ')}")
        }
    }
}

tasks.register('corePomPurityGate') {
    group = 'verification'
    description = 'JDK-only cpf-core POM에 BOM/dependencyManagement 또는 Runtime dependency가 없는지 검증합니다.'
    dependsOn ':framework:core:generatePomFileForMavenJavaPublication'
    doLast {
        def pom = file('cpf-core/build/publications/mavenJava/pom-default.xml')
        if (!pom.isFile()) throw new GradleException("cpf-core generated POM is missing: ${pom}")
        def text = pom.getText('UTF-8')
        if (text.contains('<dependencyManagement>') || text.contains('<dependencies>')) {
            throw new GradleException('cpf-core POM must remain JDK-only without dependencyManagement/dependencies')
        }
    }
}

