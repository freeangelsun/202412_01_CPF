tasks.register('publishCpfVerifiedLocalPlatformArtifacts') {
    group = 'CPF Publication'
    description = 'Public release staging 또는 검증된 Local Maven Set을 생성하는 Canonical publication entrypoint입니다.'
    doLast {
        def publicReleaseMode = providers.gradleProperty('cpfPublicBinaryRepository').isPresent()
        def stagingRepository = providers.gradleProperty('cpfArtifactStagingRepository')
                .map { file(it) }
                .orElse(rootProject.layout.buildDirectory.dir('cpf-artifact-staging/repository').map { it.asFile })
                .get().canonicalFile
        if (!stagingRepository.isDirectory()) {
            throw new GradleException("CPF artifact staging repository was not created: ${stagingRepository}")
        }
        if (publicReleaseMode) {
            def requestedPublic = file(providers.gradleProperty('cpfPublicBinaryRepository').get()).canonicalFile
            if (requestedPublic != stagingRepository) {
                throw new GradleException("cpfPublicBinaryRepository and cpfArtifactStagingRepository must resolve to the same path: public=${requestedPublic} staging=${stagingRepository}")
            }
            println "CPF_PUBLIC_ARTIFACT_STAGING=${stagingRepository}"
            return
        }

        def localRepository = providers.gradleProperty('cpfLocalArtifactRepository')
                .orElse(providers.environmentVariable('CPF_LOCAL_ARTIFACT_REPOSITORY'))
                .orElse(new File(System.getProperty('user.home'), '.cpf/repository').absolutePath)
                .map { file(it).canonicalPath }.get()
        def command = [
                'pwsh', '-NoProfile', '-File',
                file('cpf-tools/release/tools/promote-cpf-verified-local-artifacts.ps1').absolutePath,
                '-Root', rootDir.absolutePath,
                '-StagingRepository', stagingRepository.absolutePath,
                '-LocalRepository', localRepository
        ]
        def process = new ProcessBuilder(command).directory(rootDir).inheritIO().start()
        def exit = process.waitFor()
        if (exit != 0) throw new GradleException("CPF verified local artifact promotion failed: exit=${exit}")
    }
}

tasks.register('qa34IntegrationTest') {
