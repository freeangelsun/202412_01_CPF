// CPF root regression must compile optional prebuilt Business Domains against the current Source Tree
// while the Business Domain build itself declares Public GAVs only. This prevents stale local publications
// without introducing project()/internal dependencies into the standalone Domain contract.
gradle.projectsEvaluated {
    def backoffice = rootProject.findProject(':apps:backoffice')
    if (backoffice != null) {
        def substitutions = [
                'com.cpf.starter:cpf-starter-secure-api': ':starters:profiles:secure-api',
                'com.cpf.starter:cpf-starter-data-mybatis': ':starters:data:mybatis',
                'com.cpf.starter:cpf-starter-common': ':starters:common',
                'com.cpf.starter:cpf-starter-file-attachment': ':starters:file:attachment',
                'com.cpf.testkit:cpf-testkit': ':internal:testing:testkit'
        ]
        // apps:backoffice 자신의 Standalone 계약(Public GAV)은 그대로 유지하되, 동일 GAV를
        // project(...)로도 참조하는 다른 root-owned aggregator(runtime:local 등)가 apps:backoffice를
        // 함께 조립할 때 같은 artifact가 module 좌표와 project 좌표 두 경로로 동시에 해석되어
        // bootJar Copy 단계에서 "Entry ... is a duplicate"로 fail하지 않도록, 이 substitution을
        // apps:backoffice 자신뿐 아니라 root 전체 subproject 해석 경로에도 동일하게 적용한다.
        rootProject.allprojects.each { project ->
            project.configurations.configureEach { configuration ->
                configuration.resolutionStrategy.dependencySubstitution { rules ->
                    substitutions.each { gav, projectPath ->
                        rules.substitute rules.module(gav) using rules.project(projectPath) because 'CPF root regression uses current Public Starter Source'
                    }
                }
            }
        }
    }
}
