def cpfVisibleTaskNames = cpfVisibleTaskGroups.keySet()
// Generated/Optional Domain은 root Project의 subproject가 아니라 독립 Gradle build다.
// GradleBuild로 parent build 안에서 Domain build를 중첩 실행하면 Domain settings의
// includeBuild(current root)가 parent build를 다시 include하려 해 Gradle이 fail-closed한다.
// 따라서 모든 Domain 축은 root wrapper를 별도 OS process로 실행한다. 이것은 현재 checkout을
// composite Consumer로 유지하면서 Gradle의 nested-composite 금지를 우회하는 유일한 실행 경계다.
// 모든 축(Build/Test/Run/Deploy)이 반드시 *현재* CPF Source와 같은 Vendor 선택을 전달한다.
def cpfDomainDefaultDbVendor = providers.gradleProperty('cpfDbVendor')
        .orElse(providers.environmentVariable('CPF_DB_VENDOR')).orElse('mariadb').get()
if (!(cpfDomainDefaultDbVendor in ['mariadb', 'postgresql', 'oracle'])) {
    throw new GradleException("Unsupported cpfDbVendor=${cpfDomainDefaultDbVendor}; expected mariadb|postgresql|oracle")
}
def cpfDomainGradleWrapper = file(System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows') ? 'gradlew.bat' : 'gradlew')
if (!cpfDomainGradleWrapper.isFile()) {
    throw new GradleException("CPF root Gradle wrapper is missing: ${cpfDomainGradleWrapper}")
}
def cpfStandaloneDomainProjectArguments = {
    def childProperties = new LinkedHashMap(gradle.startParameter.projectProperties)
    // Root entrypoint는 항상 현재 checkout을 Consumer로 쓴다. 외부 published artifact나 stale local
    // repository가 우연히 해석되어 통과하는 것을 허용하지 않는다.
    childProperties.put('cpfProductCompositeRoot', rootDir.canonicalFile.absolutePath)
    childProperties.putIfAbsent('cpfDbVendor', cpfDomainDefaultDbVendor)
    childProperties.collect { key, value -> "-P${key}=${value}".toString() }
}
def configureCpfStandaloneDomainTask = { Exec domainTask, File domainDir, Collection<String> requestedTasks ->
    domainTask.workingDir domainDir
    // `--project-dir`와 root wrapper 경로를 함께 고정한다. 현재 process의 CWD, Gradle daemon,
    // 또는 stale published artifact가 독립 Domain Consumer를 바꾸지 못하게 한다.
    domainTask.commandLine (([
            cpfDomainGradleWrapper.canonicalFile.absolutePath,
            '--project-dir', domainDir.canonicalFile.absolutePath
    ] + cpfStandaloneDomainProjectArguments() + [
            '--no-daemon', '--no-parallel', '--console=plain'
    ] + requestedTasks.collect { it.toString() }).collect { it.toString() })
}
// Domain module 단위 Build/Test 는 내부 orchestration 이다(사용자 그룹에 노출하지 않는다).
cpfDiscoveredDomains.each { d ->
    d.modules.each { m ->
        def suffix = m.substring(0, 1).toUpperCase(Locale.ROOT) + m.substring(1)
        if (d.mounted) {
            // Root에 mount된 Domain은 같은 Gradle graph의 논리 project를 직접 사용한다. 별도
            // process로 중복 build하지 않아도 current source/consumer 경계가 이미 보장된다.
            tasks.register("cpfInternalBuild${d.cap}${suffix}") {
                dependsOn "${d.mountedPath}:build"
            }
            tasks.register("cpfInternalTest${d.cap}${suffix}") {
                dependsOn "${d.mountedPath}:test"
            }
        } else {
            tasks.register("cpfInternalBuild${d.cap}${suffix}", Exec) { domainTask ->
                configureCpfStandaloneDomainTask(domainTask, d.dir, [":${m}:build".toString()])
            }
            tasks.register("cpfInternalTest${d.cap}${suffix}", Exec) { domainTask ->
                configureCpfStandaloneDomainTask(domainTask, d.dir, [":${m}:test".toString()])
            }
        }
    }
}

// Canonical Target 별 Build/Test 진입점. 세 축이 같은 Resolver 결과를 쓴다.
['ALL', 'DEV', 'ONLINE'].each { targetName ->
    def resolved = cpfResolveTarget(targetName)
    def spec = resolved.spec
    def suffixName = targetName == 'ALL' ? 'All' : (targetName == 'DEV' ? 'Dev' : 'Online')
    def appBuilds = resolved.apps.collect { "cpfBuild${it.cap}".toString() }
    def appTests = resolved.apps.collect { "cpfVerify${it.cap}".toString() }
    def domainBuilds = resolved.domainModules.collect {
        def s = it.module.substring(0, 1).toUpperCase(Locale.ROOT) + it.module.substring(1)
        "cpfInternalBuild${it.domain.cap}${s}".toString()
    }
    def domainTests = resolved.domainModules.collect {
        def s = it.module.substring(0, 1).toUpperCase(Locale.ROOT) + it.module.substring(1)
        "cpfInternalTest${it.domain.cap}${s}".toString()
    }
    if (targetName == 'ALL') {
        // ALL 은 canonical cpfBuildAll/cpfTestAll 이 이미 소유한다. 중복 진입점을 만들지 않는다.
        return
    }
    tasks.register("cpfBuild${suffixName}") {
        group = '10. CPF 빌드'
        description = "${spec.prefix} ${spec.summary}을 빌드합니다."
        dependsOn appBuilds
        dependsOn domainBuilds
    }
    tasks.register("cpfTest${suffixName}") {
        group = '15. CPF 테스트'
        description = "${spec.prefix} ${spec.summary}의 테스트를 실행합니다."
        dependsOn appTests
        dependsOn domainTests
    }
}

