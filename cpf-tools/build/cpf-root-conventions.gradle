        ':runtime:local-batch':'[실행] Batch 선택 프로젝트용 로컬 Batch Runtime',
        ':apps:education':'[실행/학습] CPF 기능 예제 및 교육 Runtime',
        ':framework:core':'[계약] topology-independent CPF Core Public Contract'
]
allprojects { target ->
    def catalogRow = cpfUxModulesByProjectPath[target.path]
    if (catalogRow != null) {
        def visibility = catalogRow.visibility?.toString() == 'public' ? '공개' : '내부'
        def selectable = catalogRow.userSelectable == true ? '선택 가능' : '직접 선택 안 함'
        def displayName = catalogRow.displayNameKo?.toString() ?: catalogRow.artifactId?.toString()
        def purpose = catalogRow.usageHintKo?.toString() ?: ''
        target.description = "[${visibility}/${selectable}] ${displayName} - ${purpose}".trim()
    } else if (cpfRunnableDescriptions.containsKey(target.path)) {
        target.description = cpfRunnableDescriptions[target.path]
    }
}
def registerCpfRunAlias = { String taskName, String targetTask, String descriptionText ->
    tasks.register(taskName) { group = 'CPF 30 | 실행'; description = descriptionText; dependsOn targetTask }
}
