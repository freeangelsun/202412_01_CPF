        def rows = (cpfStarterCatalogForUx.modules ?: []).findAll { it.visibility?.toString() == 'public' && it.userSelectable == true }
        rows.groupBy { it.selectionGroup?.toString() ?: it.ownerGroup?.toString() ?: 'other' }.sort { a,b -> a.key <=> b.key }.each { groupId, groupRows ->
            println "\n[${cpfUxGroupLabels[groupId] ?: groupId}]"
            groupRows.sort { a,b -> (a.displayNameKo?.toString() ?: a.artifactId?.toString()) <=> (b.displayNameKo?.toString() ?: b.artifactId?.toString()) }.each { row ->
                println " - ${row.displayNameKo ?: row.artifactId} (${row.artifactId})"
