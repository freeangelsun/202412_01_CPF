def cpfRunnableDescriptions = [
        ':runtime:local':'[실행/권장] ADM 중심 통합 로컬 Runtime - Optional Domain은 존재할 때만 조립 - 1 JVM / 1 Port',
        ':apps:admin':'[실행] CPF ADM 관리 Backend/Frontend',
