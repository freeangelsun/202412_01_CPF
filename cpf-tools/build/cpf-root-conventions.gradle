        'projects':'[내부 진단] Gradle Project 구조를 조회합니다.'
]
gradle.projectsEvaluated {
    allprojects { target ->
        target.tasks.configureEach { task ->
            def visibleRootTask = target == rootProject && cpfVisibleTaskNames.contains(task.name)
            if (!visibleRootTask) {
                task.group = cpfInternalTaskGroupFor(task.name)
                def readable = cpfInternalTaskDescriptions[task.name]
                if (readable != null) {
                    task.description = readable
                } else if (task.description == null || task.description.trim().isEmpty()) {
                    task.description = cpfInternalTaskPurpose[task.group]
                } else if (!task.description.startsWith('[내부') && !task.description.startsWith('[원시') &&
                        !task.description.startsWith('[호환')) {
                    task.description = "${cpfInternalTaskPurpose[task.group]} ${task.description}"
                }
            }
        }
    }
}

tasks.register('cpfTaskGroupContractGate') {
    description = 'VS Code Gradle Tasks가 00~60 사용자 진입점과 90~99 용도별 내부 그룹만 노출하는지 검증합니다.'
    doLast {
        def failures = []
        cpfVisibleTaskGroups.each { taskName, expectedGroup ->
            def task = tasks.findByName(taskName)
            if (task == null) failures << "missing=${taskName}"
            else if (task.group != expectedGroup) failures << "group=${taskName}:${task.group}->${expectedGroup}"
            if (taskName.toLowerCase().contains('full')) failures << "all-name-required=${taskName}"
        }
        allprojects.each { target ->
            target.tasks.each { task ->
                def expected = target == rootProject ? cpfVisibleTaskGroups[task.name] : null
                if (expected == null) {
                    def expectedInternal = cpfInternalTaskGroupFor(task.name)
                    if (task.group != expectedInternal) {
                        failures << "internal=${target.path}:${task.name}:${task.group}->${expectedInternal}"
                    }
                }
            }
        }
        def actualInternalGroups = allprojects.collectMany { target ->
            target.tasks.collect { task -> task.group }
        }.findAll { group -> cpfInternalTaskGroups.values().contains(group) }.toSet()
        def missingInternalGroups = cpfInternalTaskGroups.values().toSet() - actualInternalGroups
        if (!missingInternalGroups.isEmpty()) failures << "missing-internal-groups=${missingInternalGroups.sort()}"
        if (!failures.isEmpty()) {
            throw new GradleException("CPF task group contract mismatch: ${failures.take(30)} total=${failures.size()}")
        }
        println "CPF_TASK_GROUP_CONTRACT=PASS visible=${cpfVisibleTaskGroups.size()} userGroups=7 internalGroups=${cpfInternalTaskGroups.values().join(',')}"
    }
}
tasks.named('qualityGate') { dependsOn tasks.named('cpfTaskGroupContractGate') }

tasks.register('publicationGate') {
    description = 'Canonical Starter Catalog parity와 공개 가능한 Maven publication의 POM 생성 가능성을 검증합니다.'
    dependsOn 'starterCatalogGate', 'gradleLogicalTreeGate', 'gradleProjectDependencyClosureGate', 'gradleProjectDependencyClosureTest', 'managedDependencyGate', 'corePomPurityGate', 'compositeModuleIdentityGate'
}

tasks.register('compositeModuleIdentityGate') {
    description = 'Composite 자동 치환용 project group/name 충돌을 차단하고 Maven 공개 좌표 보존을 검증합니다.'
    doLast {
        def actualCoordinates = (cpfStarterCatalog.modules ?: []).collect { module ->
            def target = cpfBuildRoot.project(module.projectPath.toString())
            [module: module, target: target, coordinate: "${target.group}:${target.name}".toString()]
        }
        def duplicates = actualCoordinates.groupBy { it.coordinate }
                .findAll { coordinate, rows -> rows.size() > 1 }
                .collectEntries { coordinate, rows ->
                    [(coordinate): rows.collect { it.target.path }.sort()]
                }
        def wrongCompositeGroups = actualCoordinates.findAll { row ->
            def expected = cpfCompositeGroupByProject[row.target.path]
            expected != null && row.target.group.toString() != expected
        }.collect { row -> "${row.target.path}:${row.target.group}" }
        def publicReleaseMode = providers.gradleProperty('cpfPublicBinaryRepository').isPresent()
        def wrongPublicationGroups = actualCoordinates.findAll { row ->
            cpfCompositeGroupByProject.containsKey(row.target.path)
        }.collectMany { row ->
            def publicRows = cpfPublicRowsByProject[row.target.path] ?: []
            def allowedGroups = publicReleaseMode && !publicRows.isEmpty()
                    ? publicRows.collect { it.publicGroupId.toString() }.toSet()
                    : [row.module.groupId.toString()] as Set
            row.target.publishing.publications.withType(MavenPublication).findAll { publication ->
                !allowedGroups.contains(publication.groupId)
            }.collect { publication ->
                "${row.target.path}:${publication.name}:${publication.groupId}:allowed=${allowedGroups}"
            }
        }
        def archiveRows = actualCoordinates.collect { row ->
            def jarTask = row.target.tasks.named('jar').get()
            [row: row, archiveBaseName: jarTask.archiveBaseName.get(), archiveFileName: jarTask.archiveFileName.get()]
        }
        def wrongArchiveBaseNames = archiveRows.findAll { archive ->
            archive.archiveBaseName != archive.row.module.artifactId.toString()
        }.collect { archive ->
            "${archive.row.target.path}:${archive.archiveBaseName}->${archive.row.module.artifactId}"
        }
        def duplicateArchiveFileNames = archiveRows.groupBy { it.archiveFileName }
                .findAll { archiveFileName, rows -> rows.size() > 1 }
                .collectEntries { archiveFileName, rows ->
                    [(archiveFileName): rows.collect { it.row.target.path }.sort()]
                }
        if (!duplicates.isEmpty() || !wrongCompositeGroups.isEmpty() || !wrongPublicationGroups.isEmpty()
                || !wrongArchiveBaseNames.isEmpty() || !duplicateArchiveFileNames.isEmpty()) {
            throw new GradleException("CPF composite/archive identity mismatch: duplicate=${duplicates}, group=${wrongCompositeGroups}, publication=${wrongPublicationGroups}, archiveBase=${wrongArchiveBaseNames}, archiveFile=${duplicateArchiveFileNames}")
        }
        println "CPF_COMPOSITE_IDENTITY_READY modules=${actualCoordinates.size()} collisionOwners=${cpfCompositeGroupByProject.size()} uniqueArchives=${archiveRows.size()}"
    }
}

