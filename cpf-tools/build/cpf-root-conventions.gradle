tasks.register('cpfModules') {
    group = 'CPF 40 | 구성'
    description = '개발자가 직접 선택할 Public Profile/Provider를 기능별로 표시합니다.'
    doLast {
        println ''
        println '================ CPF PUBLIC MODULES ================'
        def rows = (cpfStarterCatalogForUx.modules ?: []).findAll { it.visibility?.toString() == 'public' && it.userSelectable == true }
        rows.groupBy { it.selectionGroup?.toString() ?: it.ownerGroup?.toString() ?: 'other' }.sort { a,b -> a.key <=> b.key }.each { groupId, groupRows ->
            println "\n[${cpfUxGroupLabels[groupId] ?: groupId}]"
            groupRows.sort { a,b -> (a.displayNameKo?.toString() ?: a.artifactId?.toString()) <=> (b.displayNameKo?.toString() ?: b.artifactId?.toString()) }.each { row ->
                println " - ${row.displayNameKo ?: row.artifactId} (${row.artifactId})"
                if (row.usageHintKo) println "   언제/역할: ${row.usageHintKo}"
            }
        }
        println '\nInternal leaf는 숨겨져 있습니다. ./gradlew cpfModulesAll 로만 확인합니다.'
    }
}

tasks.register('cpfModulesAll') {
    group = 'CPF 40 | 구성'
    description = 'Public/Internal 전체 Starter를 역할과 함께 표시합니다.'
    doLast {
        println ''
        println '================ CPF ALL STARTERS ================'
        (cpfStarterCatalogForUx.modules ?: []).sort { a,b -> a.artifactId?.toString() <=> b.artifactId?.toString() }.each { row ->
            def visibility = row.visibility?.toString() == 'public' ? 'PUBLIC' : 'INTERNAL'
            println "[${visibility}] ${row.displayNameKo ?: row.artifactId} (${row.artifactId})"
        }
    }
}
