tasks.register('compositeModuleIdentityGate') {
    group = 'verification'
    description = 'Composite 자동 치환용 project group/name 충돌을 차단하고 Maven 공개 좌표 보존을 검증합니다.'
    doLast {
        def actualCoordinates = (cpfStarterCatalog.modules ?: []).collect { module ->
            def target = project(module.projectPath.toString())
            [module: module, target: target, coordinate: "${target.group}:${target.name}".toString()]
        }
        def duplicates = actualCoordinates.groupBy { it.coordinate }
                .findAll { coordinate, rows -> rows.size() > 1 }
                .collectEntries { coordinate, rows ->
                    [(coordinate): rows.collect { it.target.path }.sort()]
                }
        def wrongCompositeGroups = actualCoordinates.findAll { row ->
            def expected = cpfCompositeGroupByProject[row.target.path]
            expected != null && row.target.group.toString() != expected
        }.collect { row -> "${row.target.path}:${row.target.group}" }
        def publicReleaseMode = providers.gradleProperty('cpfPublicBinaryRepository').isPresent()
        def wrongPublicationGroups = actualCoordinates.findAll { row ->
            cpfCompositeGroupByProject.containsKey(row.target.path)
        }.collectMany { row ->
            def publicRows = cpfPublicRowsByProject[row.target.path] ?: []
            def allowedGroups = publicReleaseMode && !publicRows.isEmpty()
                    ? publicRows.collect { it.publicGroupId.toString() }.toSet()
                    : [row.module.groupId.toString()] as Set
            row.target.publishing.publications.withType(MavenPublication).findAll { publication ->
                !allowedGroups.contains(publication.groupId)
            }.collect { publication ->
                "${row.target.path}:${publication.name}:${publication.groupId}:allowed=${allowedGroups}"
            }
        }
        def archiveRows = actualCoordinates.collect { row ->
            def jarTask = row.target.tasks.named('jar').get()
            [row: row, archiveBaseName: jarTask.archiveBaseName.get(), archiveFileName: jarTask.archiveFileName.get()]
        }
        def wrongArchiveBaseNames = archiveRows.findAll { archive ->
            archive.archiveBaseName != archive.row.module.artifactId.toString()
        }.collect { archive ->
            "${archive.row.target.path}:${archive.archiveBaseName}->${archive.row.module.artifactId}"
        }
        def duplicateArchiveFileNames = archiveRows.groupBy { it.archiveFileName }
                .findAll { archiveFileName, rows -> rows.size() > 1 }
                .collectEntries { archiveFileName, rows ->
                    [(archiveFileName): rows.collect { it.row.target.path }.sort()]
                }
        if (!duplicates.isEmpty() || !wrongCompositeGroups.isEmpty() || !wrongPublicationGroups.isEmpty()
                || !wrongArchiveBaseNames.isEmpty() || !duplicateArchiveFileNames.isEmpty()) {
            throw new GradleException("CPF composite/archive identity mismatch: duplicate=${duplicates}, group=${wrongCompositeGroups}, publication=${wrongPublicationGroups}, archiveBase=${wrongArchiveBaseNames}, archiveFile=${duplicateArchiveFileNames}")
        }
        println "CPF_COMPOSITE_IDENTITY_READY modules=${actualCoordinates.size()} collisionOwners=${cpfCompositeGroupByProject.size()} uniqueArchives=${archiveRows.size()}"
    }
}

