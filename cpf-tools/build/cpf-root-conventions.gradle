// Open Git/Public Maven projection. This executes only for the explicit public-release property.
// Project dependency POM coordinates are rewritten from the captured native publication coordinate to
// the canonical Public coordinate so com.cpf.internal/private aliases cannot leak into consumer POMs.
gradle.projectsEvaluated {
    if (providers.gradleProperty('cpfPublicBinaryRepository').isPresent()) {
        def nativeToPublic = [:]
        def primaryByProject = [:]

        cpfPublicRowsByProject.each { projectPath, rows ->
            def target = project.findProject(projectPath)
            if (target == null) {
                def includedName = projectPath.toString().replaceFirst('^:', '')
                if (gradle.includedBuilds.any { it.name == includedName }) {
                    return
                }
                throw new GradleException("Public artifact catalog project is not mounted: ${projectPath}")
            }
            if (!target.plugins.hasPlugin('maven-publish')) {
                throw new GradleException("Public artifact project must apply maven-publish: ${projectPath}")
            }
            def publications = target.publishing.publications.withType(MavenPublication).toList()
            if (publications.isEmpty()) {
                throw new GradleException("Public artifact project has no MavenPublication: ${projectPath}")
            }
            def orderedRows = rows.sort { a, b ->
                def p = cpfPublicPublicationPriority(a) <=> cpfPublicPublicationPriority(b)
                p != 0 ? p : a.artifactId.toString() <=> b.artifactId.toString()
            }
            def primary = orderedRows.first()
            primaryByProject[projectPath] = primary

            // Capture every native coordinate before any publication is changed. This is the mapping
            // Gradle would otherwise emit for project dependencies in the private build.
            publications.each { publication ->
                def nativeKey = "${publication.groupId}:${publication.artifactId}".toString()
                nativeToPublic[nativeKey] = primary
            }

            // The existing publication is the only Gradle publication for this Source project. Additional
            // catalog rows are projected after publication so project-dependency POM generation remains
            // unambiguous for every Consumer.
            publications.each { publication ->
                publication.groupId = primary.publicGroupId.toString()
                publication.artifactId = primary.artifactId.toString()
            }
        }

        // Rewriting is attached after all alias publications exist. It changes only CPF dependency
        // coordinates; external OSS dependencies and source project graphs remain untouched.
        cpfPublicRowsByProject.keySet().each { projectPath ->
            def target = project.findProject(projectPath)
            if (target == null) return
            target.publishing.publications.withType(MavenPublication).configureEach { publication ->
                publication.pom.withXml { xml ->
                    def root = xml.asNode()
                    def containers = []
                    if (root.dependencies) containers.addAll(root.dependencies)
                    if (root.dependencyManagement?.dependencies) containers.addAll(root.dependencyManagement.dependencies)
                    containers.each { container ->
                        container.dependency.each { dep ->
                            def group = dep.groupId?.text()?.trim()
                            def artifact = dep.artifactId?.text()?.trim()
                            def replacement = nativeToPublic["${group}:${artifact}".toString()]
                            if (replacement != null) {
                                dep.groupId[0].value = replacement.publicGroupId.toString()
                                dep.artifactId[0].value = replacement.artifactId.toString()
                            }
                        }
                    }
                }
            }
        }
    }
}

// VS Code Gradle Tasks는 중첩 group과 task 표시명 치환을 지원하지 않는다. 사용자 Golden Path는
// 00~60에만 노출하고, 계약상 이름을 바꿀 수 없는 Gradle/plugin/호환 task는 90~99에서 용도별로
// 분리한다. 99는 사용자가 직접 실행하지 않는 저수준 원시 명령만 수용한다.
// Domain 은 이름을 코드에 박지 않고 `cpf.domain.contractVersion=1` 계약으로 발견한다.
// 생성기로 Domain 을 만들면 자동으로 Task 가 등록되고, 삭제하면 자동으로 사라진다. 0개도 정상이다.
// Generated Domain 은 root build 에 mount 되지 않을 수 있으므로 각 Domain build 를 직접 호출한다.
def cpfDiscoveredDomains = ((rootDir.listFiles() ?: new File[0]) as List).findAll { it.isDirectory() }.findResults { File dir ->
    def propsFile = new File(dir, 'gradle.properties')
    if (!propsFile.isFile()) return null
    def props = new Properties()
    propsFile.withInputStream { props.load(it) }
    if (props.getProperty('cpf.domain.contractVersion') != '1') return null
    def domainName = props.getProperty('cpf.domain.name')
    if (domainName == null || domainName.trim().isEmpty()) return null
    def settingsFile = new File(dir, 'settings.gradle')
    def settingsText = settingsFile.isFile() ? settingsFile.getText('UTF-8') : ''
    def modules = []
    if (settingsText.contains("include 'online'") && new File(dir, 'online').isDirectory()) modules << 'online'
    if (settingsText.contains("include 'batch'") && new File(dir, 'batch').isDirectory()) modules << 'batch'
    if (modules.isEmpty()) return null
    def systemCode = props.getProperty('cpf.domain.systemCode')
    // root build 에 mount 된 Domain online 은 독립 build 를 다시 띄우지 않고 직접 실행한다.
    def mountedOnline = findProject(":apps:${domainName.trim()}")
    [dir: dir, name: domainName.trim(), mounted: (mountedOnline != null), mountedPath: mountedOnline?.path,
     cap: domainName.trim().substring(0, 1).toUpperCase(Locale.ROOT) + domainName.trim().substring(1),
     label: (systemCode == null || systemCode.trim().isEmpty()) ? domainName.trim() : "${domainName.trim()}(${systemCode.trim()})",
     modules: modules]
}.sort { it.name }

// 최상위 cpf-* 디렉터리에 있고 Spring Boot 실행 계약을 가진 project 를 개별 App 으로 발견한다.
// 상위 디렉터리가 rootDir 인 것만 App 이므로 cpf-tools/runtime/** 통합 Runtime 과
// Domain 이 소유한 module(cpf-<domain>/online) 은 구조상 자연히 제외되어 축이 중복되지 않는다.
// 이름을 코드에 박지 않으므로 App 이 추가/삭제되면 Task 도 자동으로 등록/제거된다.
def cpfDiscoveredApps = rootProject.subprojects.findResults { p ->
    def dir = p.projectDir
    if (dir.parentFile != rootDir) return null
    def buildFile = new File(dir, 'build.gradle')
    if (!buildFile.isFile()) return null
    if (!buildFile.getText('UTF-8').contains("id 'org.springframework.boot'")) return null
    def raw = dir.name.startsWith('cpf-') ? dir.name.substring(4) : dir.name
    def cap = raw.split('-').findAll { !it.isEmpty() }
            .collect { it.substring(0, 1).toUpperCase(Locale.ROOT) + it.substring(1) }.join('')
    // 논리 Component role. Local Runtime 의 모듈 스위치 계약과 같은 이름을 쓴다.
    def role = p.path.startsWith(':runtime:') ? p.path.substring(':runtime:'.length())
            : (p.path.startsWith(':apps:') ? p.path.substring(':apps:'.length()) : p.path.tokenize(':').last())
    [path: p.path, cap: cap, label: cap, role: role]
}.sort { it.cap }

// ---- CPF Canonical Target Catalog -------------------------------------------------
// Build/Test/Run 이 같은 정의를 소비한다. runtimeMode 는 Local Runtime 이 이미 소유한
// 모듈 구성(application-local-<mode>.yml)을 그대로 재사용하므로 두 계약이 갈라지지 않는다.
def cpfTargetCatalog = [
        ALL: [
                label: '전체', prefix: '[전체]', runtimeMode: 'full',
                excludedRoles: [] as Set, includeDomains: true, includeBatch: true,
                summary: 'Gateway/ADM/Backoffice/Generated Domain/Batch까지 포함한 전체 통합 대상'
        ],
        DEV: [
                label: '개발', prefix: '[개발]', runtimeMode: 'standard',
                excludedRoles: ['gateway'] as Set, includeDomains: true, includeBatch: false,
                summary: '일상 업무 개발에 필요한 ADM/Backoffice/Generated Domain Online 대상'
        ],
        ONLINE: [
                label: '온라인', prefix: '[온라인]', runtimeMode: 'minimal',
                excludedRoles: ['gateway', 'admin', 'backoffice-web'] as Set,
                includeDomains: true, includeBatch: false,
                summary: '업무 Online 개발만 남긴 최소 대상'
        ]
]

/** 논리 Target 이름으로 실제 App/Domain Component 를 해석한다. */
def cpfResolveTarget = { String targetName ->
    def spec = cpfTargetCatalog[targetName]
    if (spec == null) {
        throw new GradleException("지원하지 않는 CPF Target 입니다: ${targetName} (가능: ${cpfTargetCatalog.keySet().join(', ')})")
    }
    def apps = cpfDiscoveredApps.findAll { !spec.excludedRoles.contains(it.role) }
    def domains = spec.includeDomains ? cpfDiscoveredDomains : []
    def domainModules = domains.collectMany { d ->
        d.modules.findAll { m -> spec.includeBatch || m != 'batch' }.collect { m -> [domain: d, module: m] }
    }
    [name: targetName, spec: spec, apps: apps, domains: domains, domainModules: domainModules]
}

// 발견된 App 마다 빌드/검증/실행/배포 4축을 동일하게 투영한다.
def cpfAppVisibleTaskGroups = [:]
cpfDiscoveredApps.each { a ->
    cpfAppVisibleTaskGroups["cpfBuild${a.cap}".toString()] = '10. CPF 빌드'
    cpfAppVisibleTaskGroups["cpfVerify${a.cap}".toString()] = '20. CPF 검증'
    cpfAppVisibleTaskGroups["cpfRun${a.cap}".toString()] = '30. CPF 실행'
    cpfAppVisibleTaskGroups["cpfDeploy${a.cap}".toString()] = '60. CPF 배포'
}

// 발견된 Domain 마다 빌드/검증/실행/배포 4축을 동일하게 투영해 그룹 간 일관성을 유지한다.
def cpfDomainVisibleTaskGroups = [:]
cpfDiscoveredDomains.each { d ->
