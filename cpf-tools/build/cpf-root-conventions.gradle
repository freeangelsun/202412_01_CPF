def cpfInternalTaskGroups = [
        build:'90. CPF 내부 빌드',
        verify:'91. CPF 내부 검증 Gate',
        test:'92. CPF 내부 테스트',
        run:'93. CPF 내부 실행',
        deploy:'94. CPF 내부 배포',
        ide:'95. CPF 내부 IDE',
        diagnose:'96. CPF 내부 진단',
        compat:'98. CPF 구명령 호환 유지',
        raw:'99. CPF 원시 명령 직접 사용 안 함'
]
def cpfInternalTaskGroupFor = { String taskName ->
    if (cpfLegacyTaskAliases.containsKey(taskName)) {
        return cpfInternalTaskGroups.compat
    }
    def lower = taskName.toLowerCase(Locale.ROOT)
    def ideTask = lower.startsWith('eclipse') || taskName ==~ /.*Ide(?:$|[A-Z0-9]).*/
    if (ideTask) {
        return cpfInternalTaskGroups.ide
    }
    if (lower in ['bootrun', 'boottestrun'] || lower.startsWith('run') || lower.endsWith('run') ||
            (lower.startsWith('resolve') && lower.endsWith('mainclassname'))) {
        return cpfInternalTaskGroups.run
    }
    if (lower.startsWith('compile') || lower.startsWith('process') || lower.endsWith('classes')) {
        return cpfInternalTaskGroups.build
    }
    if (lower == 'generatecpfbusinessoperationmanifest' || lower.endsWith('gate') ||
            lower.contains('verify') || lower.contains('validation') ||
            lower.contains('validate') || lower.contains('check') ||
            lower.contains('quality') || lower.contains('contract') || lower.contains('audit') ||
            lower.contains('lint')) {
        return cpfInternalTaskGroups.verify
    }
    if (lower == 'test' || lower == 'cpftest' || lower.endsWith('test') || lower.contains('testreport')) {
        return cpfInternalTaskGroups.test
    }
    if (lower.contains('publish') || lower.contains('publication') || lower.contains('staging') ||
            lower.contains('generatepom') || lower.contains('modulemetadata') ||
            lower.startsWith('sign') || lower.contains('maven') || lower.contains('ivy')) {
        return cpfInternalTaskGroups.deploy
    }
    if (lower in ['help', 'tasks', 'projects', 'properties', 'dependencies', 'components',
                  'buildenvironment', 'outgoingvariants', 'resolvableconfigurations',
                  'dependencyinsight', 'javatoolchains'] || lower.contains('discovery') ||
            lower.contains('diagnostic') || lower.contains('dependencymanagement') || lower.endsWith('report')) {
        return cpfInternalTaskGroups.diagnose
    }
    if (lower in ['build', 'assemble', 'clean', 'classes', 'testclasses', 'builddependents',
                  'buildneeded', 'bootjar', 'bootwar', 'bootbuildimage'] ||
            lower.startsWith('compile') || lower.startsWith('process') || lower.startsWith('generate') ||
            lower.endsWith('jar') || lower.endsWith('war') || lower.contains('javadoc') ||
            lower.contains('sources') || lower.contains('resource') || lower.contains('build') ||
            lower.contains('install') || lower.startsWith('cyclonedx')) {
        return cpfInternalTaskGroups.build
    }
    return cpfInternalTaskGroups.raw
}
