// 발견된 Domain 마다 동일한 4축 Task 를 등록한다. 독립 build는 root wrapper의 별도 process로 호출한다.
cpfDiscoveredDomains.each { d ->
    def buildTargets = d.modules.collect { ":${it}:build".toString() }
    def testTargets = d.modules.collect { ":${it}:test".toString() }
    def deployTargets = d.modules.collect { ":${it}:bootJar".toString() }
    if (d.mounted) {
        tasks.register("cpfBuild${d.cap}") {
            group = '10. CPF 빌드'
            description = "[개별] ${d.label} Domain을 빌드합니다."
            dependsOn "${d.mountedPath}:build"
        }
        tasks.register("cpfVerify${d.cap}") {
            group = '20. CPF 검증'
            description = "[개별] ${d.label} Domain 테스트/검증을 실행합니다."
            dependsOn "${d.mountedPath}:test"
        }
    } else {
        tasks.register("cpfBuild${d.cap}", Exec) { domainTask ->
            group = '10. CPF 빌드'
            description = "[개별] ${d.label} Domain을 빌드합니다."
            configureCpfStandaloneDomainTask(domainTask, d.dir, buildTargets)
        }
        tasks.register("cpfVerify${d.cap}", Exec) { domainTask ->
            group = '20. CPF 검증'
            description = "[개별] ${d.label} Domain 테스트/검증을 실행합니다."
            configureCpfStandaloneDomainTask(domainTask, d.dir, testTargets)
        }
    }
    d.modules.each { m ->
        def suffix = m.substring(0, 1).toUpperCase(Locale.ROOT) + m.substring(1)
        def kind = (m == 'batch') ? 'Batch' : 'Online'
        if (m == 'online' && d.mounted) {
            tasks.register("cpfRun${d.cap}") {
                group = '30. CPF 실행'
                description = "[개별] ${d.label} Domain ${kind} 애플리케이션을 단독 실행합니다."
                dependsOn "${d.mountedPath}:bootRun"
            }
            return
        }
        tasks.register("cpfRun${d.cap}${suffix}", Exec) { domainTask ->
            group = '30. CPF 실행'
            description = "[개별] ${d.label} Domain ${kind} 애플리케이션을 단독 실행합니다."
            configureCpfStandaloneDomainTask(domainTask, d.dir, [":${m}:bootRun".toString()])
        }
    }
    if (d.mounted) {
        tasks.register("cpfDeploy${d.cap}") {
            group = '60. CPF 배포'
            description = "[개별] ${d.label} Domain 실행 산출물(bootJar)을 생성합니다."
            dependsOn "${d.mountedPath}:bootJar"
        }
    } else {
        tasks.register("cpfDeploy${d.cap}", Exec) { domainTask ->
            group = '60. CPF 배포'
            description = "[개별] ${d.label} Domain 실행 산출물(bootJar)을 생성합니다."
            configureCpfStandaloneDomainTask(domainTask, d.dir, deployTargets)
        }
    }
}

