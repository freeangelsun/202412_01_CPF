plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
}

def platform = new Properties()
file('../../../gradle/cpf-platform.properties').withInputStream { platform.load(it) }

group = 'com.cpf.gradle'
version = platform.getProperty('platformVersion')
description = 'CPF canonical Java build convention plugin'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    // The Final Artifact Catalog classifies this included build as PUBLIC_TOOLING, not a
    // supported compile-time Java API. Keep sources for internal/local publication only.
    if (!providers.gradleProperty('cpfPublicBinaryRepository').isPresent()) {
        withSourcesJar()
    }
}

tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach { options.release = 25 }

gradlePlugin {
    plugins {
        cpfPlatformConventions {
            id = 'com.cpf.platform-conventions'
            implementationClass = 'com.cpf.gradle.CpfPlatformConventionPlugin'
            displayName = 'CPF Platform Conventions'
            description = 'Applies the canonical Java 25 release target, UTF-8 compilation and dependency conflict policy without host JDK patch pinning.'
        }
    }
}

repositories { mavenCentral() }

dependencies {
    implementation localGroovy()
    testImplementation gradleTestKit()
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testImplementation 'org.assertj:assertj-core:3.27.4'
}

test {
    useJUnitPlatform()
    systemProperty 'cpf.plugin.version', project.version
}

publishing {
    publications.withType(MavenPublication).configureEach {
        pom {
            name = 'CPF Gradle Plugin'
            description = 'Canonical CPF Java build convention shared by framework modules and generated consumers.'
        }
    }
    repositories {
        maven {
            name = 'CpfLocal'
            url = uri(providers.gradleProperty('cpfLocalArtifactRepository')
                    .orElse(providers.environmentVariable('CPF_LOCAL_ARTIFACT_REPOSITORY'))
                    .orElse(new File(System.getProperty('user.home'), '.cpf/repository').absolutePath).get())
        }
        maven {
            name = 'CpfStaging'
            url = uri(providers.gradleProperty('cpfArtifactStagingRepository')
                    .orElse(new File(rootDir, '../../../build/cpf-artifact-staging/repository').absolutePath).get())
        }
        maven {
            name = 'CpfInternal'
            url = uri(providers.gradleProperty('cpfArtifactRepositoryUrl')
                    .orElse(providers.environmentVariable('CPF_ARTIFACT_REPOSITORY_URL'))
                    .orElse(new File(buildDir, 'disabled-internal').absolutePath).get())
        }
    }
}

tasks.register('publishCpfPluginToLocal') {
    dependsOn tasks.matching { it.name.startsWith('publish') && it.name.endsWith('ToCpfLocalRepository') }
}
tasks.register('publishCpfPluginToStaging') {
    dependsOn tasks.matching { it.name.startsWith('publish') && it.name.endsWith('ToCpfStagingRepository') }
}
tasks.register('publishCpfPluginToInternal') {
    doFirst {
        if (!providers.gradleProperty('cpfArtifactRepositoryUrl').isPresent() &&
                !providers.environmentVariable('CPF_ARTIFACT_REPOSITORY_URL').isPresent()) {
            throw new GradleException('Internal repository URL is required.')
        }
    }
    dependsOn tasks.matching { it.name.startsWith('publish') && it.name.endsWith('ToCpfInternalRepository') }
}
