plugins { id 'java-platform'; id 'maven-publish' }
group='com.cpf'
def props=new Properties(); file('../../../gradle/cpf-platform.properties').withInputStream { props.load(it) }
version=props.getProperty('platformVersion','1.0.0-SNAPSHOT')
javaPlatform { allowDependencies() }
dependencies {
    constraints {
        api "com.cpf.core:cpf-core:${version}"
        api "com.cpf.common:cpf-common:${version}"
        api "com.cpf.batch:cpf-batch-contract:${version}"
        api "com.cpf.batch:cpf-batch-testkit:${version}"
    }
}
def cpfLocalRepo = providers.gradleProperty('cpfLocalArtifactRepository')
        .orElse(providers.environmentVariable('CPF_LOCAL_ARTIFACT_REPOSITORY'))
        .orElse(new File(System.getProperty('user.home'), '.cpf/repository').absolutePath)
def cpfStagingRepo = file('../../../build/cpf-artifact-staging/repository').absolutePath
def cpfRemoteRepo = providers.gradleProperty('cpfArtifactRepositoryUrl')
        .orElse(providers.environmentVariable('CPF_ARTIFACT_REPOSITORY_URL'))
def cpfArtifactMode = providers.gradleProperty('cpfArtifactMode')
        .orElse(providers.environmentVariable('CPF_ARTIFACT_MODE'))
        .orElse(cpfRemoteRepo.isPresent() ? 'REMOTE' : 'LOCAL_DEV')
        .map { it.toUpperCase(Locale.ROOT) }
publishing {
    publications { cpfBom(MavenPublication) { from components.javaPlatform; artifactId='cpf-bom' } }
    repositories {
        maven { name='cpfLocal'; url=uri(cpfLocalRepo.get()) }
        maven { name='cpfStaging'; url=uri(cpfStagingRepo) }
        maven {
            name='cpfInternal'
            def repo=cpfRemoteRepo.orNull
            url=uri(repo ?: layout.buildDirectory.dir('repository'))
            if(repo) credentials { username=System.getenv('CPF_ARTIFACT_REPOSITORY_USER'); password=System.getenv('CPF_ARTIFACT_REPOSITORY_PASSWORD') }
        }
    }
}

tasks.register('prepareCpfBomStaging') {
    doLast { delete file("${cpfStagingRepo}/com/cpf/cpf-bom/${version}") }
}
tasks.matching { it.name.endsWith('ToCpfStagingRepository') }.configureEach { dependsOn 'prepareCpfBomStaging' }

tasks.matching { it.name.endsWith('ToCpfLocalRepository') }.configureEach {
  doFirst { if (cpfArtifactMode.get() != 'LOCAL_DEV') throw new GradleException('CPF BOM local publication is allowed only in LOCAL_DEV mode.') }
}
tasks.matching { it.name.endsWith('ToCpfStagingRepository') }.configureEach {
  doFirst { if (cpfArtifactMode.get() != 'LOCAL_DEV') throw new GradleException('CPF BOM staging publication is allowed only in LOCAL_DEV mode.') }
}
tasks.matching { it.name.endsWith('ToCpfInternalRepository') }.configureEach {
  doFirst {
    if (cpfArtifactMode.get() != 'REMOTE' || !cpfRemoteRepo.isPresent()) {
      throw new GradleException('Remote CPF BOM publication requires CPF_ARTIFACT_MODE=REMOTE and cpfArtifactRepositoryUrl or CPF_ARTIFACT_REPOSITORY_URL.')
    }
  }
}
tasks.register('publishCpfBomToLocal') { dependsOn 'publishCpfBomPublicationToCpfLocalRepository' }
tasks.register('publishCpfBomToStaging') { dependsOn 'publishCpfBomPublicationToCpfStagingRepository' }
tasks.register('publishCpfBomToInternal') {
    doFirst {
        if (cpfArtifactMode.get() != 'REMOTE' || !cpfRemoteRepo.isPresent()) {
            throw new GradleException('Remote CPF BOM publish requires CPF_ARTIFACT_MODE=REMOTE and cpfArtifactRepositoryUrl or CPF_ARTIFACT_REPOSITORY_URL.')
        }
    }
    dependsOn 'publishCpfBomPublicationToCpfInternalRepository'
}
