plugins { id 'java-platform'; id 'maven-publish' }

def loadProps = { File f, List keys ->
    if (!f.isFile()) throw new GradleException("Missing canonical properties: ${f}")
    def p=new Properties(); f.withInputStream { p.load(it) }
    keys.each { if (!(p.getProperty(it) ?: '').trim()) throw new GradleException("Missing property ${it}: ${f}") }
    p
}
def platformProps=loadProps(file('../../../../gradle/cpf-platform.properties'),['platformVersion'])
def stack=loadProps(file('../../../../gradle/cpf-stack.properties'),['springBootVersion','springCloudVersion','awsSdkVersion'])
def catalogFile=file('../../../generator/contracts/cpf-starter-catalog.json')
def catalog=new groovy.json.JsonSlurper().parse(catalogFile)
def versionValue=platformProps.getProperty('platformVersion').trim()
group='com.cpf'; version=versionValue
javaPlatform { allowDependencies() }
repositories { mavenCentral() }
def publicModules=(catalog.modules ?: []).findAll { it.visibility?.toString()=='public' }
def allowedPublicRoles=['public-base','public-common','public-profile','public-provider'] as Set
def publicRoleViolation=publicModules.findAll { m -> !(m.internalRole?.toString() in allowedPublicRoles) }
if (!publicRoleViolation.isEmpty()) throw new GradleException("Invalid public Starter role in public BOM: ${publicRoleViolation}")
dependencies {
    api platform("org.springframework.boot:spring-boot-dependencies:${stack.getProperty('springBootVersion').trim()}")
    api platform("org.springframework.cloud:spring-cloud-dependencies:${stack.getProperty('springCloudVersion').trim()}")
    api platform("software.amazon.awssdk:bom:${stack.getProperty('awsSdkVersion').trim()}")
    constraints {
        api "com.cpf.core:cpf-core:${versionValue}"
        api "com.cpf.common:cpf-common:${versionValue}"
        api "com.cpf.testkit:cpf-testkit:${versionValue}"
        api "com.cpf.batch:cpf-batch-contract:${versionValue}"
        publicModules.sort { it.artifactId }.each { m -> api "${m.groupId}:${m.artifactId}:${versionValue}" }
    }
}
def localRepo=providers.gradleProperty('cpfLocalArtifactRepository').orElse(providers.environmentVariable('CPF_LOCAL_ARTIFACT_REPOSITORY')).orElse(new File(System.getProperty('user.home'),'.cpf/repository').absolutePath)
def stagingRepo=providers.gradleProperty('cpfArtifactStagingRepository').orElse(new File(rootDir,'../../../../build/cpf-artifact-staging/repository').absolutePath)
def internalRepo=providers.gradleProperty('cpfInternalRepositoryUrl').orElse(providers.gradleProperty('cpfArtifactRepositoryUrl')).orElse(providers.environmentVariable('CPF_ARTIFACT_REPOSITORY_URL')).orElse(layout.buildDirectory.dir('repo').map { it.asFile.absolutePath })
publishing {
 publications { cpfPlatformBom(MavenPublication) { from components.javaPlatform; artifactId='cpf-platform-bom'; pom { name='CPF Public Platform BOM'; description='Public CPF contracts, testkit, canonical starter base/common/providers/profiles.' } } }
 repositories { maven { name='CpfLocal'; url=uri(localRepo.get()) }; maven { name='CpfStaging'; url=uri(stagingRepo.get()) }; maven { name='CpfInternal'; url=uri(internalRepo.get()) } }
}
tasks.register('verifyPublicBom') {
    doLast {
        def expectedPlatforms=[
            "org.springframework.boot:spring-boot-dependencies:${stack.getProperty('springBootVersion').trim()}",
            "org.springframework.cloud:spring-cloud-dependencies:${stack.getProperty('springCloudVersion').trim()}",
            "software.amazon.awssdk:bom:${stack.getProperty('awsSdkVersion').trim()}"
        ] as Set
        def actualPlatforms=configurations.api.dependencies.collect { "${it.group}:${it.name}:${it.version}" }.toSet()
        def allowedContracts=[
            "com.cpf.core:cpf-core:${versionValue}",
            "com.cpf.common:cpf-common:${versionValue}",
            "com.cpf.testkit:cpf-testkit:${versionValue}",
            "com.cpf.batch:cpf-batch-contract:${versionValue}"
        ] as Set
        def expected=publicModules.collect { "${it.groupId}:${it.artifactId}:${versionValue}" }.toSet()+allowedContracts
        def actual=configurations.api.dependencyConstraints.collect { "${it.group}:${it.name}:${it.version}" }
        def duplicateActual=actual.groupBy { it }.findAll { k,v -> v.size()>1 }.keySet()
        def internalCoordinates=(catalog.modules ?: []).findAll { it.visibility?.toString()=='internal' }
                .collect { "${it.groupId}:${it.artifactId}:${versionValue}" }.toSet()
        def internalConstraintLeak=actual.toSet().intersect(internalCoordinates)
        def missing=expected-actual.toSet()
        def extra=actual.toSet()-expected
        if (actualPlatforms != expectedPlatforms || !publicRoleViolation.isEmpty() || !duplicateActual.isEmpty() || !missing.isEmpty() || !extra.isEmpty() || !internalConstraintLeak.isEmpty()) {
            throw new GradleException("Public BOM/catalog mismatch: platforms=${actualPlatforms}, expectedPlatforms=${expectedPlatforms}, missing=${missing}, extra=${extra}, duplicate=${duplicateActual}, internalLeak=${internalConstraintLeak}")
        }
    }
}
check.dependsOn tasks.named('verifyPublicBom')
