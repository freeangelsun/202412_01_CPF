rootProject.name = 'cpf-platform-boms'
def cpfManagedGradleBase = providers.gradleProperty('cpfManagedGradleRoot')
        .orElse(providers.environmentVariable('CPF_MANAGED_GRADLE_ROOT'))
        .orElse(new File(gradle.gradleUserHomeDir, 'cpf-managed-work').absolutePath).get()
gradle.startParameter.projectCacheDir = new File(cpfManagedGradleBase, 'cpf-platform-boms/project-cache')
include 'public-bom', 'internal-bom'
