name: cpf

services:
  mariadb:
    image: mariadb:12.3.2
    container_name: cpf-mariadb
    restart: "no"
    environment:
      MARIADB_ROOT_PASSWORD: ${CPF_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - cpf-mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30

  postgresql:
    image: postgres:18.4-trixie
    container_name: cpf-postgresql
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${CPF_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cpf-postgresql-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 30

  oracle:
    image: container-registry.oracle.com/database/free:26ai-free-23.26.2.0.0
    container_name: cpf-oracle
    restart: "no"
    environment:
      ORACLE_PWD: ${CPF_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:1521:1521"
    volumes:
      - cpf-oracle-data:/opt/oracle/oradata
    # healthcheck를 재정의하지 않는다. 이 이미지의 healthcheck.sh는 PATH가 아닌 $ORACLE_BASE에
    # 있어서 "healthcheck.sh"만 쓰면 exit 127 command not found로 항상 unhealthy가 된다
    # (docker inspect로 확인한 실제 원인). 이미지가 자체 정의한 official Healthcheck
    # (CMD-SHELL "$ORACLE_BASE/$CHECK_DB_FILE"; interval=60s timeout=30s start_period=300s)를
    # 그대로 상속해서 Compose variable escaping 위험 없이 항상 올바른 경로를 쓰게 한다.

volumes:
  cpf-mariadb-data:
    name: cpf-mariadb-data
  cpf-postgresql-data:
    name: cpf-postgresql-data
  cpf-oracle-data:
    name: cpf-oracle-data
