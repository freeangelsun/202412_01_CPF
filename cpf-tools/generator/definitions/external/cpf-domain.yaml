# Generated Customer Domain의 정본 입력입니다. packageName 생략 시 domain.name을 Java package root로 사용하며 Secret/DB Vendor는 저장하지 않습니다.
domain:
  name: external
  systemCode: EXS
database:
  role: CUSTOMER_BUSINESS_DB
  tablePrefix: EXS
preset: standard-enterprise
modules:
  online: true
features:
  persistence: mybatis
  httpClient: true
  resilience: true
  cache: none
  messaging: none
domainDependencies:
  member:
    systemCode: MBR
externalClients:
runtime:
  # local 전용 안정 Port. dev/stg/prod는 환경 Binding을 필수로 합니다.
  localOnlinePort: 18090
generation:
  sampleTransaction: true
