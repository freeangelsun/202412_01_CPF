# Public Developer Workspace의 non-secret 기본값입니다.
# immutable Public Artifact version의 정본입니다. CPF_VERSION은 이 값과의 일치 검증에만
# 허용되며 다른 값으로 override하면 bootstrap이 fail-closed 합니다.
# CPF_MAVEN_REPOSITORY_URL은 bundled repository 대신 사용할 선택 external repository입니다.
cpf.version=1.0.0-SNAPSHOT
cpf.default-db=postgresql
cpf.bootstrap.timeout-seconds=300
cpf.runtime.start=false
# Runtime Lifecycle 의 운영 시간값 정본. 값이 없으면 Launcher 는 기본값으로 대체하지 않고 멈춘다.
cpf.runtime.ready-timeout-seconds=600
cpf.runtime.stop-timeout-seconds=120
cpf.runtime.log-lines=200
cpf.workspace.capabilities=
