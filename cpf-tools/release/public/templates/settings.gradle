pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'cpf-public-developer-workspace'

def definitionRoot = file('domains')
def domainRows = []
def seenNames = new LinkedHashSet<String>()
def seenCodes = new LinkedHashSet<String>()
if (!definitionRoot.isDirectory()) {
    throw new GradleException("CPF public domain catalog is missing: ${definitionRoot}")
}
definitionRoot.eachDir { dir ->
    def definition = new File(dir, 'cpf-domain.yaml')
    if (!definition.isFile()) return
    def text = definition.getText('UTF-8')
    def domainBlock = (text =~ /(?ms)^domain:\s*\n((?:^[ ]{2}.+\n?)*)/)
    if (!domainBlock.find()) throw new GradleException("domain block is missing: ${definition}")
    def block = domainBlock.group(1)
    def nameMatcher = block =~ /(?m)^\s{2}name:\s*([a-z][a-z0-9-]*)\s*$/
    def codeMatcher = block =~ /(?m)^\s{2}systemCode:\s*([A-Z][A-Z0-9]{2})\s*$/
    if (!nameMatcher.find() || !codeMatcher.find()) throw new GradleException("domain name/systemCode is invalid: ${definition}")
    def name = nameMatcher.group(1)
    def systemCode = codeMatcher.group(1)
    if (!seenNames.add(name)) throw new GradleException("duplicate domain name: ${name}")
    if (!seenCodes.add(systemCode)) throw new GradleException("duplicate domain systemCode: ${systemCode}")
    def projectDir = file("cpf-${name}")
    if (!new File(projectDir, 'settings.gradle').isFile()) {
        throw new GradleException("domain definition requires physical project: ${name} -> ${projectDir}")
    }
    domainRows << [name:name, systemCode:systemCode, projectDir:projectDir]
}
domainRows.sort { a,b -> a.name <=> b.name }.each { row ->
    includeBuild(row.projectDir) { name = "cpf-${row.name}" }
}

if (file('cpf-backoffice-web/settings.gradle').isFile()) {
    includeBuild('cpf-backoffice-web') { name = 'cpf-backoffice-web' }
}
