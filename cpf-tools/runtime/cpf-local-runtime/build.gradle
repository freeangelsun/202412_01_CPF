plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'java'
}

group = 'com.cpf.local'

dependencies {
    implementation project(':framework:core')
    implementation project(':starters:common')
    implementation project(':apps:admin')
    // Backoffice is an Optional Prebuilt Business Domain. The local runtime must remain buildable when absent.
    if (rootProject.findProject(':apps:backoffice') != null) {
        implementation project(':apps:backoffice')
    }
    implementation project(':runtime:gateway')

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

springBoot {
    mainClass = 'com.cpf.local.runtime.CpfLocalRuntimeApplication'
}

tasks.named('bootJar') {
    enabled = true
    archiveClassifier = 'local-web'
}

// Generated Customer Domain은 독립 Application/Build입니다.
// Root의 cpfIncludeGeneratedDomains는 discovery/classification만 담당하고, 실제 compile/test는
// 각 Generated Build가 cpfProductCompositeRoot를 지정한 standalone composite consumer로 수행합니다.
// Local Runtime은 MBW 같은 Root-owned optional project만 조립하며 Generated Source를 내부 classpath로 합치지 않습니다.
