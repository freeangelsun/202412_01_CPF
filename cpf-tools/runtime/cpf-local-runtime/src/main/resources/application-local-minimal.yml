# 최소 개발모드도 Generated Domain을 같은 Port에 올릴 수 있으며 ADM/BZA/Gateway만 제외합니다.
cpf:
  local:
    runtime:
      minimum-max-memory-mb: 250
    modules:
      core: true
      common: true
      gateway: false
      admin: false
      biz-admin: false
      domains:
        enabled: true
        auto-discover: true
        base-packages: ${CPF_LOCAL_EXTRA_DOMAIN_PACKAGES:}
