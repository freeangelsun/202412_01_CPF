cpf.log.layout.root=${CPF_LOG_ROOT:/var/log/cpf}
cpf.log.layout.pattern={service}/{instance}/runtime.log
cpf.log.archive.pattern={service}/{instance}/archive/runtime.{yyyy-MM-dd}.{index}.log.gz
cpf.log.max-file-size=100MB
cpf.log.max-history-days=30
cpf.log.total-size-cap=10GB
cpf.log.correlation-keys=environment,cellId,serviceId,instanceId,transactionId,segmentId,executionId,jobId
cpf.log.secret-policy=MASK_OR_REJECT
cpf.log.adm-direct-filesystem-access=false
