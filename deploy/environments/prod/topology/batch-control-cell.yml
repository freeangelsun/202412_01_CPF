cellId: batch-control-cell
environment: prod
runtimeRole: CONTROL_PLANE
serviceId: cpf-batch-control-plane
runtimeMode: embedded-bootjar
artifact:
  coordinate: com.cpf.batch:cpf-batch-control-plane
  version: 1.0.0
  sha256: REPLACE_WITH_64_HEX_SHA256
  signatureBase64: REPLACE_WITH_ED25519_SIGNATURE
  sbomRef: registry://sbom/cpf-batch-control-plane/1.0.0
  provenanceRef: registry://provenance/cpf-batch-control-plane/1.0.0
instances:
  - instanceId: cpf-batch-control-plane-prod-a-01
    wasId: batCTL01
    hostAlias: batch-host-a
    port: ${CPF_CPF_BATCH_CONTROL_PLANE_PROD_A_01_PORT}
    profile: prod
    zone: zone-a
    pool: control
    capability: [CONTROL]
    agentBaseUrl: ${CPF_CPF_BATCH_CONTROL_PLANE_PROD_A_01_AGENT_BASE_URL}
    configRef: vault://cpf/prod/bat/cpf-batch-control-plane/config
  - instanceId: cpf-batch-control-plane-prod-b-01
    wasId: batCTL02
    hostAlias: batch-host-b
    port: ${CPF_CPF_BATCH_CONTROL_PLANE_PROD_B_01_PORT}
    profile: prod
    zone: zone-b
    pool: control
    capability: [CONTROL]
    agentBaseUrl: ${CPF_CPF_BATCH_CONTROL_PLANE_PROD_B_01_AGENT_BASE_URL}
    configRef: vault://cpf/prod/bat/cpf-batch-control-plane/config
desiredState: RUNNING
deployment:
  strategy: ROLLING
  minHealthy: 1
  maxUnavailable: 1
  healthPath: /actuator/health/readiness
  drainTimeoutSeconds: 600
  healthTimeoutSeconds: 120
  rollbackVersion: previous
  functionalSmokeRequired: true
dependencies: [cpfDB, cpf-batch-control-plane]
secretReferences: [vault://cpf/prod/bat/cpf-batch-control-plane]
labels: { owner: BAT }
