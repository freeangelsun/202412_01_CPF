# CPF Full Runtime Validation 효율화 설정입니다.
#
# Full Runtime 은 GRADLE_IDE_CLASSPATH / GRADLE_FULL_BUILD_QUALITY /
# GRADLE_ASSEMBLE_AFTER_FRONTEND / GRADLE_SBOM / GRADLE_PUBLICATION 이 같은 Source 를 반복해서
# 빌드한다. 측정 결과 Gradle 구간이 전체의 39.5%(21분)였고 그 대부분이 중복 재계산이었다.
#
# Build Cache 는 task 입력 해시가 같을 때만 출력을 재사용하므로 검증 범위나 산출물 의미를
# 바꾸지 않는다. 입력이 하나라도 다르면 그대로 다시 실행된다.
org.gradle.caching=true

# Configuration/Execution 은 Harness 가 stage 별로 --no-daemon --no-parallel 을 명시해 통제한다.
# 여기서 병렬을 켜면 그 통제를 우회하므로 두지 않는다.
