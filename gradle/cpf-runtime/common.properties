# CPF JVM/Build 공통 자원 정책
# 우선순위: 모듈 cpf-resource.properties > 실행 시 명시값 > 환경별 파일 > 이 공통 파일
# Heap은 250MB 단위(250/500/750/1000m)로 사용하며 CPF JVM Heap 상한은 1000m입니다.
profile.name=common
heap.step.mb=250
runtime.memory.ceiling.mb=1000
runtime.memory.enforceCeiling=true

gradle.maxWorkers=2
gradle.parallel=false
gradle.jvm.xms=250m
gradle.jvm.xmx=1000m
gradle.jvm.maxMetaspace=256m

test.xms=250m
test.xmx=500m
test.maxParallelForks=1

frontend.node.maxOldSpace.mb=1000

runtime.web.xms=250m
runtime.web.xmx=500m
runtime.batch.xms=250m
runtime.batch.xmx=500m
runtime.jvm.maxMetaspace=128m
runtime.jvm.maxDirectMemory=64m
runtime.jvm.reservedCodeCache=64m
runtime.jvm.threadStack=512k
runtime.batch.enabledByDefault=false
runtime.local.singleWebDefault=true

# Local Runtime Mode별 권장 Heap. start-cpf-local에서 명시값/모듈값이 없을 때 사용합니다.
runtime.web.mode.minimal.xmx=250m
runtime.web.mode.integrated.xmx=500m
runtime.web.mode.standard.xmx=500m
runtime.web.mode.integration.xmx=750m
runtime.web.mode.full.xmx=1000m
