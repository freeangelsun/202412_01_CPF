/*
 * Gradle plugin management는 settings 파일 최상단에 유지합니다.
 * 품질 gate는 offline 실행을 기본으로 보장해야 하므로 외부 Build Scan 플러그인은 필수 경로에서 제외합니다.
 */
pluginManagement {
    // Convention Plugin은 plugin resolution 단계에서 Included Build로 공급한다.
    // 빈 GRADLE_USER_HOME에서도 과거 로컬 Marker 없이 해석되어야 한다.
    includeBuild('cpf-tools/build/gradle-plugin') {
        name = 'cpf-gradle-plugin'
    }
    def cpfStackProperties = new Properties()
    def cpfStackFile = file('gradle/cpf-stack.properties')
    if (!cpfStackFile.isFile()) {
        throw new GradleException("CPF stack properties is missing: ${cpfStackFile}")
    }
    cpfStackFile.withInputStream { cpfStackProperties.load(it) }

    plugins {
        id 'org.springframework.boot' version cpfStackProperties.getProperty('springBootVersion')
        id 'io.spring.dependency-management' version cpfStackProperties.getProperty('springDependencyManagementVersion')
        id 'org.cyclonedx.bom' version cpfStackProperties.getProperty('cycloneDxGradleVersion')
    }

    def cpfArtifactMode = providers.gradleProperty('cpfArtifactMode')
            .orElse(providers.environmentVariable('CPF_ARTIFACT_MODE'))
            .orElse(providers.gradleProperty('cpfArtifactRepositoryUrl').map { 'REMOTE' })
            .orElse(providers.environmentVariable('CPF_ARTIFACT_REPOSITORY_URL').map { 'REMOTE' })
            .orElse('LOCAL_DEV')
            .get()
            .trim()
            .toUpperCase(Locale.ROOT)
    if (!(cpfArtifactMode in ['LOCAL_DEV', 'REMOTE', 'OFFLINE'])) {
        throw new GradleException("Unsupported CPF artifact mode: ${cpfArtifactMode}")
    }
    def cpfRemoteRepo = providers.gradleProperty('cpfArtifactRepositoryUrl')
            .orElse(providers.environmentVariable('CPF_ARTIFACT_REPOSITORY_URL')).orNull
    def cpfLocalRepo = providers.gradleProperty('cpfLocalArtifactRepository')
            .orElse(providers.environmentVariable('CPF_LOCAL_ARTIFACT_REPOSITORY'))
            .orElse(new File(System.getProperty('user.home'), '.cpf/repository').absolutePath)
            .get()
    def cpfOfflineRepo = providers.gradleProperty('cpfOfflineArtifactRepository')
            .orElse(providers.environmentVariable('CPF_OFFLINE_ARTIFACT_REPOSITORY'))
            .orNull
    if (cpfArtifactMode == 'REMOTE' && !cpfRemoteRepo) {
        throw new GradleException('CPF_ARTIFACT_MODE=REMOTE requires cpfArtifactRepositoryUrl or CPF_ARTIFACT_REPOSITORY_URL.')
    }
    if (cpfArtifactMode == 'OFFLINE' && !cpfOfflineRepo) {
        throw new GradleException('CPF_ARTIFACT_MODE=OFFLINE requires cpfOfflineArtifactRepository or CPF_OFFLINE_ARTIFACT_REPOSITORY.')
    }

    repositories {
        if (cpfArtifactMode == 'REMOTE') {
            maven {
                name = 'cpfRemotePlugin'
                url = uri(cpfRemoteRepo)
                content { includeGroupByRegex 'com[.]cpf([.].*)?' }
                def cpfRepoUser = providers.environmentVariable('CPF_ARTIFACT_REPOSITORY_USER').orNull
                if (cpfRepoUser) {
                    credentials {
                        username = cpfRepoUser
                        password = providers.environmentVariable('CPF_ARTIFACT_REPOSITORY_PASSWORD').orNull
                    }
                }
            }
        } else if (cpfArtifactMode == 'OFFLINE') {
            maven {
                name = 'cpfOfflinePlugin'
                url = uri(file(cpfOfflineRepo))
                content { includeGroupByRegex 'com[.]cpf([.].*)?' }
            }
        } else {
            maven {
                name = 'cpfLocalPlugin'
                url = uri(file(cpfLocalRepo))
                content { includeGroupByRegex 'com[.]cpf([.].*)?' }
            }
        }
        if (cpfArtifactMode != 'OFFLINE') {
            gradlePluginPortal {
                content { excludeGroupByRegex 'com[.]cpf([.].*)?' }
            }
            mavenCentral {
                content { excludeGroupByRegex 'com[.]cpf([.].*)?' }
            }
        }
    }
}

rootProject.name = 'cpf-core-platform-framework'

include 'cpf-core', 'cpf-common', 'cpf-admin', 'cpf-biz-admin', 'cpf-gateway', 'cpf-reference', 'cpf-member', 'cpf-local-runtime', 'cpf-local-batch-runtime'
include 'cpf-core-only-consumer'
project(':cpf-core-only-consumer').projectDir = file('cpf-tools/verification/core-only-consumer')
include ':cpf-batch:contract', ':cpf-batch:runtime-common', ':cpf-batch:execution-runtime', ':cpf-batch:control-server', ':cpf-batch:scheduler', ':cpf-batch:worker', ':cpf-batch:center-cut-runner', ':cpf-batch:host-agent', ':cpf-batch:testkit'

project(':cpf-core').projectDir = file('cpf-core')
project(':cpf-common').projectDir = file('cpf-common')
project(':cpf-member').projectDir = file('cpf-member')
project(':cpf-reference').projectDir = file('cpf-reference')
project(':cpf-admin').projectDir = file('cpf-admin')
project(':cpf-biz-admin').projectDir = file('cpf-biz-admin')
project(':cpf-gateway').projectDir = file('cpf-gateway')
project(':cpf-local-runtime').projectDir = file('cpf-tools/runtime/cpf-local-runtime')
project(':cpf-local-batch-runtime').projectDir = file('cpf-tools/runtime/cpf-local-batch-runtime')

// QA39: Starter Build Graph의 단일 정본. 공개 Profile 6개와 내부 Provider를 같은 Catalog에서 등록합니다.
def cpfStarterCatalogFile = file('cpf-tools/generator/contracts/cpf-starter-catalog.json')
if (!cpfStarterCatalogFile.isFile()) {
    throw new GradleException("CPF canonical starter catalog is missing: ${cpfStarterCatalogFile}")
}
def cpfStarterCatalog = new groovy.json.JsonSlurper().parse(cpfStarterCatalogFile)
def cpfPublicProfiles = (cpfStarterCatalog.publicProfiles ?: [])*.toString()
def cpfCapabilityGroups = (cpfStarterCatalog.capabilityGroups ?: []).collect { it.id?.toString() }
if (cpfPublicProfiles != ['minimal-domain', 'web-api', 'secure-api', 'browser-bff', 'event-service', 'batch-service']) {
    throw new GradleException("CPF public profile surface must be the six QA39 profiles: ${cpfPublicProfiles}")
}
if (cpfCapabilityGroups != ['data', 'messaging', 'integration', 'file', 'notification', 'security', 'platform-operations']) {
    throw new GradleException("CPF capability group surface must be the seven QA39 groups: ${cpfCapabilityGroups}")
}
def cpfStarterModules = cpfStarterCatalog.modules ?: []
def cpfProjectPaths = new LinkedHashSet<String>()
def cpfOwnerPaths = new LinkedHashSet<String>()
cpfStarterModules.each { module ->
    def projectPath = module.projectPath?.toString()
    def ownerPath = module.ownerPath?.toString()?.replace('\\', '/')
    if (!projectPath?.startsWith(':cpf-') || !ownerPath?.startsWith('cpf-starters/')) {
        throw new GradleException("Invalid CPF starter catalog entry: ${module}")
    }
    if (!cpfProjectPaths.add(projectPath)) {
        throw new GradleException("Duplicate CPF projectPath in canonical catalog: ${projectPath}")
    }
    if (!cpfOwnerPaths.add(ownerPath)) {
        throw new GradleException("Duplicate CPF ownerPath in canonical catalog: ${ownerPath}")
    }
    include projectPath
    project(projectPath).projectDir = file(ownerPath)
}

def cpfRemovedArtifactIds = (cpfStarterCatalog.removedArtifactIds ?: [])*.toString()
cpfRemovedArtifactIds.each { removedId ->
    if (cpfStarterModules.any { it.artifactId?.toString() == removedId }) {
        throw new GradleException("Removed CPF artifact is still active in canonical catalog: ${removedId}")
    }
}

// CPF BOM과 convention 정책은 cpf-tools 소유의 추적 가능한 isolated build 정본으로 관리합니다.
// Root Build는 아래 Included Build의 check/publication task를 직접 소비합니다.
includeBuild('cpf-tools/build/platform-bom') {
    name = 'cpf-platform-bom'
}

// Additional customer domains are independent repositories. local-domains is development-only composite mounting.
def localDomainsDir = file('local-domains')
if (localDomainsDir.isDirectory()) {
    localDomainsDir.eachDir { candidate ->
        if (new File(candidate, 'settings.gradle').isFile() || new File(candidate, 'settings.gradle.kts').isFile()) {
            includeBuild(candidate)
        }
    }
}
