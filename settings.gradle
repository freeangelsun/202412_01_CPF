// CPF BOM과 convention 정책은 cpf-tools 소유의 추적 가능한 isolated build 정본으로 관리합니다.
// Root Build는 아래 Included Build의 check/publication task를 직접 소비합니다.
includeBuild('cpf-tools/build/platform-bom') {
    name = 'cpf-platform-bom'
    dependencySubstitution {
        substitute module('com.cpf:cpf-platform-bom') using project(':public-bom')
    }
}

// Customer domains are independent repositories and never affect the default build graph.
def includeLocalDomains = providers.gradleProperty('cpfIncludeLocalDomains').map { it.toBoolean() }.orElse(false).get()
def localDomainsDir = file('local-domains')
if (includeLocalDomains) {
    def manifestFile = new File(localDomainsDir, 'manifest.json')
    if (!manifestFile.isFile()) throw new GradleException('cpfIncludeLocalDomains=true requires local-domains/manifest.json')
    def manifest = new groovy.json.JsonSlurper().parse(manifestFile)
    if (!(manifest.builds instanceof List) || manifest.builds.isEmpty())
        throw new GradleException('local-domains manifest must declare non-empty builds')
    manifest.builds.each { entry ->
        if (!(entry.path instanceof String) || !(entry.settingsSha256 instanceof String))
            throw new GradleException('local-domains manifest entry requires path/settingsSha256')
        def candidate = new File(localDomainsDir, entry.path).canonicalFile
        if (!candidate.toPath().startsWith(localDomainsDir.canonicalFile.toPath()))
            throw new GradleException("local-domains path escapes root: ${entry.path}")
        def settingsFile = [new File(candidate,'settings.gradle'),new File(candidate,'settings.gradle.kts')].find { it.isFile() }
        if (settingsFile == null) throw new GradleException("local domain settings missing: ${entry.path}")
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(settingsFile.bytes).encodeHex().toString()
        if (!digest.equalsIgnoreCase(entry.settingsSha256))
            throw new GradleException("local domain settings hash mismatch: ${entry.path}")
        includeBuild(candidate)
    }
} else if (localDomainsDir.isDirectory()) {
    logger.lifecycle('local-domains exists but is not mounted; use -PcpfIncludeLocalDomains=true with a verified manifest')
}

// Repository-tracked Generated Customer Domain은 Product Module/BOM 대상이 아니며 opt-in Composite Build로만 연결합니다.
// Generated Project 내부 metadata를 읽지 않고 Framework canonical definition과 실제 settings.gradle만 사용합니다.
def includeGeneratedDomains = providers.gradleProperty('cpfIncludeGeneratedDomains').map { it.toBoolean() }.orElse(false).get()
def generatedDefinitionRoot = file('cpf-tools/generator/definitions')
def generatedDomainRoots = generatedDefinitionRoot.isDirectory()
        ? (generatedDefinitionRoot.listFiles() ?: [] as File[])
            .findAll { definitionDir -> definitionDir.isDirectory() && new File(definitionDir, 'cpf-domain.yaml').isFile() }
            .collect { definitionDir -> file("cpf-${definitionDir.name}") }
            .findAll { candidate -> candidate.isDirectory() && new File(candidate, 'settings.gradle').isFile() }
            .sort { a, b -> a.name <=> b.name }
        : []
if (includeGeneratedDomains) {
    generatedDomainRoots.each { candidate ->
        def canonical = candidate.canonicalFile
        if (!canonical.toPath().startsWith(rootDir.canonicalFile.toPath())) {
            throw new GradleException("Generated Domain path escapes root: ${candidate}")
        }
        def domainName = candidate.name.substring('cpf-'.length())
        def definition = new File(generatedDefinitionRoot, domainName + '/cpf-domain.yaml')
        def definitionText = definition.getText('UTF-8')
        def packageMatch = (definitionText =~ /(?m)^\s*packageName:\s*([A-Za-z0-9_.-]+)\s*$/)
        def domainMatch = (definitionText =~ /(?m)^\s{2}name:\s*([A-Za-z0-9_-]+)\s*$/)
        def packageName = packageMatch.find() ? packageMatch.group(1) : (domainMatch.find() ? "com.cpf.${domainMatch.group(1).replace('-', '_')}" : null)
        if (packageName == null) throw new GradleException("Generated Domain name/packageName missing: ${definition}")
        includeBuild(canonical) {
            name = "cpf-generated-${candidate.name}"
            dependencySubstitution {
                if (new File(canonical, 'online/build.gradle').isFile()) substitute module("${packageName}:online") using project(':online')
                if (new File(canonical, 'batch/build.gradle').isFile()) substitute module("${packageName}:batch") using project(':batch')
            }
        }
    }
} else if (!generatedDomainRoots.isEmpty()) {
    logger.lifecycle("Generated Customer Domains are retained but not mounted: ${generatedDomainRoots*.name}; use -PcpfIncludeGeneratedDomains=true for regression build")
}
