/*
 * Gradle plugin management는 settings 파일 최상단에 유지합니다.
 * 품질 gate는 offline 실행을 기본으로 보장해야 하므로 외부 Build Scan 플러그인은 필수 경로에서 제외합니다.
 */
pluginManagement {
    // Convention Plugin은 plugin resolution 단계에서 Included Build로 공급한다.
    // 빈 GRADLE_USER_HOME에서도 과거 로컬 Marker 없이 해석되어야 한다.
    includeBuild('cpf-tools/build/gradle-plugin') {
        name = 'cpf-gradle-plugin'
    }
    def cpfStackProperties = new Properties()
    def cpfStackFile = file('gradle/cpf-stack.properties')
    if (!cpfStackFile.isFile()) {
        throw new GradleException("CPF stack properties is missing: ${cpfStackFile}")
    }
    cpfStackFile.withInputStream { cpfStackProperties.load(it) }

    plugins {
        id 'org.springframework.boot' version cpfStackProperties.getProperty('springBootVersion')
        id 'io.spring.dependency-management' version cpfStackProperties.getProperty('springDependencyManagementVersion')
        id 'org.cyclonedx.bom' version cpfStackProperties.getProperty('cycloneDxGradleVersion')
    }

    def cpfArtifactMode = providers.gradleProperty('cpfArtifactMode')
            .orElse(providers.environmentVariable('CPF_ARTIFACT_MODE'))
            .orElse(providers.gradleProperty('cpfArtifactRepositoryUrl').map { 'REMOTE' })
            .orElse(providers.environmentVariable('CPF_ARTIFACT_REPOSITORY_URL').map { 'REMOTE' })
            .orElse('LOCAL_DEV')
            .get()
            .trim()
            .toUpperCase(Locale.ROOT)
    if (!(cpfArtifactMode in ['LOCAL_DEV', 'REMOTE', 'OFFLINE'])) {
        throw new GradleException("Unsupported CPF artifact mode: ${cpfArtifactMode}")
    }
    def cpfRemoteRepo = providers.gradleProperty('cpfArtifactRepositoryUrl')
            .orElse(providers.environmentVariable('CPF_ARTIFACT_REPOSITORY_URL')).orNull
    def cpfLocalRepo = providers.gradleProperty('cpfLocalArtifactRepository')
            .orElse(providers.environmentVariable('CPF_LOCAL_ARTIFACT_REPOSITORY'))
            .orElse(new File(System.getProperty('user.home'), '.cpf/repository').absolutePath)
            .get()
    def cpfOfflineRepo = providers.gradleProperty('cpfOfflineArtifactRepository')
            .orElse(providers.environmentVariable('CPF_OFFLINE_ARTIFACT_REPOSITORY'))
            .orNull
    if (cpfArtifactMode == 'REMOTE' && !cpfRemoteRepo) {
        throw new GradleException('CPF_ARTIFACT_MODE=REMOTE requires cpfArtifactRepositoryUrl or CPF_ARTIFACT_REPOSITORY_URL.')
    }
    if (cpfArtifactMode == 'OFFLINE' && !cpfOfflineRepo) {
        throw new GradleException('CPF_ARTIFACT_MODE=OFFLINE requires cpfOfflineArtifactRepository or CPF_OFFLINE_ARTIFACT_REPOSITORY.')
    }

    repositories {
        if (cpfArtifactMode == 'REMOTE') {
            maven {
                name = 'cpfRemotePlugin'
                url = uri(cpfRemoteRepo)
                content { includeGroupByRegex 'com[.]cpf([.].*)?' }
                def cpfRepoUser = providers.environmentVariable('CPF_ARTIFACT_REPOSITORY_USER').orNull
                if (cpfRepoUser) {
                    credentials {
                        username = cpfRepoUser
                        password = providers.environmentVariable('CPF_ARTIFACT_REPOSITORY_PASSWORD').orNull
                    }
                }
            }
        } else if (cpfArtifactMode == 'OFFLINE') {
            maven {
                name = 'cpfOfflinePlugin'
                url = uri(file(cpfOfflineRepo))
                content { includeGroupByRegex 'com[.]cpf([.].*)?' }
            }
        } else {
            maven {
                name = 'cpfLocalPlugin'
                url = uri(file(cpfLocalRepo))
                content { includeGroupByRegex 'com[.]cpf([.].*)?' }
            }
        }
        if (cpfArtifactMode != 'OFFLINE') {
            gradlePluginPortal {
                content { excludeGroupByRegex 'com[.]cpf([.].*)?' }
            }
            mavenCentral {
                content { excludeGroupByRegex 'com[.]cpf([.].*)?' }
            }
        }
    }
}

rootProject.name = 'cpf-core-platform-framework'

include 'cpf-foundation', 'cpf-core', 'cpf-common', 'cpf-admin', 'cpf-biz-admin', 'cpf-gateway', 'cpf-reference', 'cpf-member', 'cpf-testkit', 'cpf-local-runtime', 'cpf-local-batch-runtime'
include 'cpf-core-only-consumer'
project(':cpf-core-only-consumer').projectDir = file('cpf-tools/verification/core-only-consumer')
include ':cpf-batch:contract', ':cpf-batch:runtime-common', ':cpf-batch:execution-runtime', ':cpf-batch:control-server', ':cpf-batch:scheduler', ':cpf-batch:worker', ':cpf-batch:center-cut-runner', ':cpf-batch:host-agent', ':cpf-batch:testkit'

project(':cpf-foundation').projectDir = file('cpf-foundation')
project(':cpf-core').projectDir = file('cpf-core')
project(':cpf-common').projectDir = file('cpf-common')
project(':cpf-member').projectDir = file('cpf-member')
project(':cpf-reference').projectDir = file('cpf-reference')
project(':cpf-testkit').projectDir = file('cpf-testkit')
project(':cpf-admin').projectDir = file('cpf-admin')
project(':cpf-biz-admin').projectDir = file('cpf-biz-admin')
project(':cpf-gateway').projectDir = file('cpf-gateway')
project(':cpf-local-runtime').projectDir = file('cpf-tools/runtime/cpf-local-runtime')
project(':cpf-local-batch-runtime').projectDir = file('cpf-tools/runtime/cpf-local-batch-runtime')

// QA39/FDEV-025: Starter Build Graph의 단일 정본과 물리 Layout을 exact equality로 검증합니다.
def cpfStarterCatalogFile = file('cpf-tools/generator/contracts/cpf-starter-catalog.json')
if (!cpfStarterCatalogFile.isFile()) throw new GradleException("CPF canonical starter catalog is missing: ${cpfStarterCatalogFile}")
def cpfStarterCatalog = new groovy.json.JsonSlurper().parse(cpfStarterCatalogFile)
def cpfPublicProfiles = (cpfStarterCatalog.publicProfiles ?: [])*.toString()
def cpfCapabilityGroups = (cpfStarterCatalog.capabilityGroups ?: []).collect { it.id?.toString() }
def canonicalProfiles = ['minimal-domain', 'web-api', 'secure-api', 'browser-bff', 'event-service', 'batch-service']
def canonicalGroups = ['data', 'messaging', 'integration', 'file', 'notification', 'security', 'platform-operations']
if (cpfPublicProfiles != canonicalProfiles) throw new GradleException("CPF public profile surface mismatch: ${cpfPublicProfiles}")
if (cpfCapabilityGroups != canonicalGroups) throw new GradleException("CPF capability group surface mismatch: ${cpfCapabilityGroups}")
def cpfStarterModules = cpfStarterCatalog.modules ?: []
def layout = cpfStarterCatalog.targetPhysicalLayout ?: [:]
if ((layout.moduleCount as Integer) != cpfStarterModules.size()) throw new GradleException("Catalog moduleCount mismatch: target=${layout.moduleCount}, actual=${cpfStarterModules.size()}")
if ((layout.profileCount as Integer) != cpfStarterModules.count { it.visibility?.toString() == 'public' }) throw new GradleException("Catalog profile partition mismatch")
if ((layout.capabilityGroupCount as Integer) != cpfCapabilityGroups.size()) throw new GradleException("Catalog capability group count mismatch")
def allowedRoots = (layout.rootDirectories ?: [])*.toString() as Set
def seen = [projectPath:new LinkedHashSet<String>(), ownerPath:new LinkedHashSet<String>(), gav:new LinkedHashSet<String>(), artifactId:new LinkedHashSet<String>(), configPrefix:new LinkedHashSet<String>()]
cpfStarterModules.each { module ->
    def projectPath = module.projectPath?.toString()
    def ownerPath = module.ownerPath?.toString()?.replace('\\', '/')
    def visibility = module.visibility?.toString()
    def kind = module.kind?.toString()
    def ownerGroup = module.ownerGroup?.toString()
    def internalRole = module.internalRole?.toString()
    def gav = "${module.groupId}:${module.artifactId}"
    if (!projectPath?.startsWith(':cpf-') || !ownerPath?.startsWith('cpf-starters/')) throw new GradleException("Invalid CPF starter catalog entry: ${module}")
    [projectPath:projectPath, ownerPath:ownerPath, gav:gav, artifactId:module.artifactId?.toString(), configPrefix:module.configPrefix?.toString()].each { k,v ->
        if (!v || !seen[k].add(v)) throw new GradleException("Duplicate/blank ${k} in canonical catalog: ${v}")
    }
    if (!(visibility in ['public','internal'])) throw new GradleException("Invalid visibility: ${module}")
    if (visibility == 'public' && (kind != 'starter-profile' || ownerGroup != 'profiles' || internalRole != 'public-profile')) throw new GradleException("Invalid public profile partition: ${module}")
    if (visibility == 'internal' && kind != 'internal-starter') throw new GradleException("Invalid internal partition: ${module}")
    def rel = ownerPath.substring('cpf-starters/'.length())
    def root = rel.contains('/') ? rel.substring(0, rel.indexOf('/')) : rel
    if (!allowedRoots.contains(root)) throw new GradleException("Owner path is outside targetPhysicalLayout roots: ${ownerPath}")
    if (!file(ownerPath).isDirectory() || !file("${ownerPath}/build.gradle").isFile()) throw new GradleException("Catalog physical module is missing: ${ownerPath}")
    include projectPath
    project(projectPath).projectDir = file(ownerPath)
}
def activeIds = cpfStarterModules.collect { it.artifactId?.toString() } as Set
def activeOwnerPaths = cpfStarterModules.collect { it.ownerPath?.toString()?.replace('\\', '/')?.replaceAll('/+$', '') } as Set
def removedIds = (cpfStarterCatalog.removedArtifactIds ?: [])*.toString() as Set
def removedPaths = (cpfStarterCatalog.removedRepositoryRoots ?: [])*.toString()*.replace('\\', '/')*.replaceAll('/+$', '') as Set
def retainedRows = (cpfStarterCatalog.retainedInactiveRoots ?: [])
if (!(retainedRows instanceof List)) throw new GradleException('retainedInactiveRoots must be an array')
def retainedPaths = new LinkedHashSet<String>()
def retainedIds = new LinkedHashSet<String>()
retainedRows.each { retained ->
    def path = retained.path?.toString()?.replace('\\', '/')?.replaceAll('/+$', '')
    def artifactId = retained.artifactId?.toString()
    def replacementId = retained.replacementArtifactId?.toString()
    def replacementPath = retained.replacementOwnerPath?.toString()?.replace('\\', '/')?.replaceAll('/+$', '')
    if (!path || !artifactId || !replacementId || !replacementPath) throw new GradleException("Incomplete retained inactive Starter contract: ${retained}")
    if (!retainedPaths.add(path) || !retainedIds.add(artifactId)) throw new GradleException("Duplicate retained inactive Starter: ${retained}")
    if (retained.status?.toString() != 'PENDING_USER_DELETE_APPROVAL' || retained.active != false ||
            retained.includeInSettings != false || retained.publishable != false || retained.consumerAllowed != false || retained.approvalRequired != true) {
        throw new GradleException("Invalid retained inactive Starter transition contract: ${retained}")
    }
    def replacement = cpfStarterModules.find { it.artifactId?.toString() == replacementId }
    if (replacement == null || replacement.ownerPath?.toString()?.replace('\\', '/')?.replaceAll('/+$', '') != replacementPath) {
        throw new GradleException("Retained inactive Starter replacement is not active/canonical: ${retained}")
    }
    if (!file(path).isDirectory() || !file("${path}/build.gradle").isFile()) throw new GradleException("Retained inactive Starter root must exist until approved deletion: ${path}")
}
if (!removedIds.intersect(activeIds).isEmpty()) throw new GradleException("Removed CPF artifact is still active: ${removedIds.intersect(activeIds)}")
if (!activeIds.intersect(retainedIds).isEmpty()) throw new GradleException("Active/retained artifact overlap: ${activeIds.intersect(retainedIds)}")
if (!activeOwnerPaths.intersect(retainedPaths).isEmpty()) throw new GradleException("Active/retained path overlap: ${activeOwnerPaths.intersect(retainedPaths)}")
if (!retainedPaths.intersect(removedPaths).isEmpty()) throw new GradleException("Retained/removed path overlap: ${retainedPaths.intersect(removedPaths)}")
def physicalStarterPaths = fileTree('cpf-starters') { include '**/build.gradle'; exclude 'build/**', '**/build/**' }.files.collect {
    rootDir.toPath().relativize(it.parentFile.toPath()).toString().replace('\\', '/')
} as Set
def expectedPhysicalPaths = activeOwnerPaths + retainedPaths
def missingPhysical = expectedPhysicalPaths - physicalStarterPaths
def extraPhysical = physicalStarterPaths - expectedPhysicalPaths
def removedPhysical = physicalStarterPaths.intersect(removedPaths)
if (!missingPhysical.isEmpty() || !extraPhysical.isEmpty() || !removedPhysical.isEmpty()) {
    throw new GradleException("Starter physical closure mismatch: missing=${missingPhysical.sort()}, extra=${extraPhysical.sort()}, retained=${retainedPaths.sort()}, removedPresent=${removedPhysical.sort()}")
}
cpfStarterModules.each { module ->
    def buildText = file("${module.ownerPath}/build.gradle").getText('UTF-8')
    def leaked = retainedIds.findAll { id -> buildText.contains("project(':${id}')") || buildText.contains(":${id}:") }
    if (!leaked.isEmpty()) throw new GradleException("Active Starter depends on retained inactive coordinates: ${module.artifactId} -> ${leaked}")
}
def removedStillPresent = removedPaths.findAll { file(it).exists() }
if (!removedStillPresent.isEmpty()) throw new GradleException("Removed CPF repository roots still exist: ${removedStillPresent.sort()}")

// CPF BOM과 convention 정책은 cpf-tools 소유의 추적 가능한 isolated build 정본으로 관리합니다.
// Root Build는 아래 Included Build의 check/publication task를 직접 소비합니다.
includeBuild('cpf-tools/build/platform-bom') {
    name = 'cpf-platform-bom'
}

// Customer domains are independent repositories and never affect the default build graph.
def includeLocalDomains = providers.gradleProperty('cpfIncludeLocalDomains').map { it.toBoolean() }.orElse(false).get()
def localDomainsDir = file('local-domains')
if (includeLocalDomains) {
    def manifestFile = new File(localDomainsDir, 'manifest.json')
    if (!manifestFile.isFile()) throw new GradleException('cpfIncludeLocalDomains=true requires local-domains/manifest.json')
    def manifest = new groovy.json.JsonSlurper().parse(manifestFile)
    if (!(manifest.builds instanceof List) || manifest.builds.isEmpty())
        throw new GradleException('local-domains manifest must declare non-empty builds')
    manifest.builds.each { entry ->
        if (!(entry.path instanceof String) || !(entry.settingsSha256 instanceof String))
            throw new GradleException('local-domains manifest entry requires path/settingsSha256')
        def candidate = new File(localDomainsDir, entry.path).canonicalFile
        if (!candidate.toPath().startsWith(localDomainsDir.canonicalFile.toPath()))
            throw new GradleException("local-domains path escapes root: ${entry.path}")
        def settingsFile = [new File(candidate,'settings.gradle'),new File(candidate,'settings.gradle.kts')].find { it.isFile() }
        if (settingsFile == null) throw new GradleException("local domain settings missing: ${entry.path}")
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(settingsFile.bytes).encodeHex().toString()
        if (!digest.equalsIgnoreCase(entry.settingsSha256))
            throw new GradleException("local domain settings hash mismatch: ${entry.path}")
        includeBuild(candidate)
    }
} else if (localDomainsDir.isDirectory()) {
    logger.lifecycle('local-domains exists but is not mounted; use -PcpfIncludeLocalDomains=true with a verified manifest')
}
