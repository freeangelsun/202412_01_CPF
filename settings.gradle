// CPF BOM과 convention 정책은 cpf-tools 소유의 추적 가능한 isolated build 정본으로 관리합니다.
// Root Build는 아래 Included Build의 check/publication task를 직접 소비합니다.
includeBuild('cpf-tools/build/platform-bom') {
    name = 'cpf-platform-bom'
}

// Additional customer domains are independent repositories. local-domains is development-only composite mounting.
def localDomainsDir = file('local-domains')
if (localDomainsDir.isDirectory()) {
    localDomainsDir.eachDir { candidate ->
        if (new File(candidate, 'settings.gradle').isFile() || new File(candidate, 'settings.gradle.kts').isFile()) {
            includeBuild(candidate)
        }
    }
}
